",id:"U10-023"},{unit:10,topic:"u10-duties",type:"mcq",situational:!0,difficulty:2,stem:"A staff nurse serves as clinical instructor for BSN students and also sits on the hospital's nursing service decision-making committee. Which duty is this?",options:["Duty (b): community linkages","Duty (a): nursing care","Duty (c): health education","Duty (d): teach, guide, and supervise students; administer nursing services; consultation and decision-making"],answer:3,aliases:[],rationale:"Teaching students and decision-making fall under duty (d).",whyNot:{0:"There is no community referral.",1:"She is not giving direct care here.",2:"Health education is for clients."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-024"},{unit:10,topic:"u10-duties",type:"mcq",situational:!0,difficulty:2,stem:"A nurse researcher leads a staff training program and conducts a study on pressure injury prevention. She also works as an advanced practice nurse. Which duty fits?",options:["Duty (d): teaching students","Duty (b): community linkages","Duty (c): health education","Duty (e): human resource development training and research, and advanced nursing practice"],answer:3,aliases:[],rationale:"Training, research, and advanced practice are duty (e).",whyNot:{0:"Her learners are staff, and the research and advanced practice point to duty (e).",1:"There is no community referral.",2:"That is teaching clients."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-025"},{unit:10,topic:"u10-duties",type:"id",situational:!1,difficulty:2,stem:"Under duty (a), give one example of essential primary health care the nurse may provide.",answer:"Vaccination",aliases:["immunization","screening","maternal and child care","maternal-child care"],rationale:"The outline lists vaccination, screening, and maternal and child care.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-026"},{unit:10,topic:"u10-duties",type:"mcq",situational:!1,difficulty:2,stem:"Which list gives the steps of the nursing process named in duty (a)?",options:["Latent, perceived, felt, manifest, aftermath","Determine criterion, collect information, take action","Forewarning, immediate consequences, consistency, impartiality","Assessment, diagnosis, planning, implementation, evaluation"],answer:3,aliases:[],rationale:"These are the five steps of the nursing process.",whyNot:{0:"These are the conflict process stages.",1:"These are quality control steps.",2:"These are Hot Stove rules."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-027"},{unit:10,topic:"u10-students",type:"id",situational:!1,difficulty:2,stem:"Nursing students may perform nursing services only under the direct supervision of this person.",answer:"Qualified faculty",aliases:["faculty","clinical instructor","qualified clinical instructor"],rationale:"Students are an exception to the license requirement only under direct supervision of a qualified faculty.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 (exception and duties)",id:"U10-028"},{unit:10,topic:"u10-students",type:"mcq",situational:!0,difficulty:2,stem:"A BSN student in the ward is asked by a staff nurse to give an IM injection alone while the clinical instructor is at the canteen. What does the scope of nursing say?",options:["The student may do it because she has a school ID","The student may perform nursing services only under the direct supervision of a qualified faculty","The student can do any procedure once she passes the board exam review","Any staff nurse can replace the faculty without limits"],answer:1,aliases:[],rationale:"The exception for students requires direct supervision by a qualified faculty.",whyNot:{0:"A school ID does not replace faculty supervision.",2:"She is not yet licensed.",3:"The outline names a qualified faculty."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 (exception and duties)",id:"U10-029"},{unit:10,topic:"u10-students",type:"mcq",situational:!1,difficulty:2,stem:"Who must approve continuing professional education programs for nurses?",options:["The hospital's labor union","DOLE","The PRC Board of Nursing","PhilHealth"],answer:2,aliases:[],rationale:"Programs from accredited or recognized organizations are submitted to and approved by the PRC Board of Nursing.",whyNot:{0:"Unions negotiate work terms.",1:"DOLE oversees labor laws.",3:"PhilHealth is the national health insurer."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 (exception and duties)",id:"U10-030"},{unit:10,topic:"u10-students",type:"id",situational:!1,difficulty:2,stem:"Nurses are duty-bound to observe this document, which sets the ethical standards of the profession.",answer:"Code of Ethics",aliases:["code of ethics for nurses","Code of Ethics for Registered Nurses"],rationale:"Section 28 says nurses must observe the Code of Ethics and safe practice standards.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 (exception and duties)",id:"U10-031"},{unit:10,topic:"u10-ethics",type:"mcq",situational:!1,difficulty:2,stem:"A nurse in a public hospital gives the same respectful, safe care to a homeless patient as to a mayor's relative. Which element of observing ethical standards is shown?",options:["Competing","Benchmarking","Compassionate care regardless of background","Advanced nursing practice"],answer:2,aliases:[],rationale:"Ethical standards require compassionate care for all, regardless of background.",whyNot:{0:"That is a conflict strategy.",1:"That compares performance with best practices.",3:"That is part of duty (e)."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Observance of Ethical Standards / Conclusion",id:"U10-032"},{unit:10,topic:"u10-ethics",type:"id",situational:!1,difficulty:2,stem:"Under observance of ethical standards, the nurse speaks up for the patient and protects him from harm. What is this role called?",answer:"Advocacy",aliases:["advocate","patient advocacy"],rationale:"Advocacy means protecting the patient from harm and speaking up for his rights.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Observance of Ethical Standards / Conclusion",id:"U10-033"},{unit:10,topic:"u10-nnccs",type:"id",situational:!1,difficulty:2,stem:"Year of the National Nursing Core Competency Standards used in this unit.",answer:"2012",aliases:[],rationale:"The outline refers to the 2012 NNCCS.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A 2012 NNCCS",id:"U10-034"},{unit:10,topic:"u10-nnccs",type:"id",situational:!1,difficulty:2,stem:"Abbreviation for the National Nursing Core Competency Standards.",answer:"NNCCS",aliases:[],rationale:"NNCCS = National Nursing Core Competency Standards.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A 2012 NNCCS",id:"U10-035"},{unit:10,topic:"u10-nnccs",type:"mcq",situational:!1,difficulty:2,stem:"Under the 2012 NNCCS, the beginning nurse's roles fall into which three areas?",options:["Promise, momentum, harvest","Client care, leadership and management, research","Planning, organizing, controlling","Novice, competent, expert"],answer:1,aliases:[],rationale:"The outline lists these three roles of the beginning nurse.",whyNot:{0:"These are career stages from Unit 14.",2:"These are management functions.",3:"These are Benner's levels from Unit 14."},mnemonic:"",note:"Source note: the number of responsibilities under each role is shown in a figure in the module and is not in your outline. I don't know the counts. Check Unit 10 (2012 NNCCS figure) and Unit 1.",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A 2012 NNCCS",id:"U10-036"},{unit:10,topic:"u10-nnccs",type:"mcq",situational:!0,difficulty:2,stem:"A new staff nurse leads a small quality project and joins a unit study on fall rates. Under the NNCCS, which role areas is she using besides client care?",options:["Leadership and management, and research","Promise and momentum","Outcome and process","Self-respect and respect from others"],answer:0,aliases:[],rationale:"Leading a project is leadership and management. Joining a study is research.",whyNot:{1:"These are career stages.",2:"These are audit types.",3:"These are self-esteem categories."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A 2012 NNCCS",id:"U10-037"},{unit:10,topic:"u10-accred",type:"id",situational:!1,difficulty:1,stem:"External review process showing that a healthcare organization meets set standards of quality and safety.",answer:"Accreditation",aliases:["accredited"],rationale:"Accreditation shows an organization meets set standards.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-038"},{unit:10,topic:"u10-accred",type:"id",situational:!1,difficulty:2,stem:"Philippine national health insurance program; accredited facilities can claim reimbursement.",answer:"PhilHealth",aliases:["Philippine Health Insurance Corporation"],rationale:"PhilHealth accreditation lets a facility be reimbursed and gives patients affordable care.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-039"},{unit:10,topic:"u10-accred",type:"id",situational:!1,difficulty:2,stem:"Government agency that issues a license to operate to hospitals as a legal requirement.",answer:"DOH",aliases:["Department of Health"],rationale:"DOH licensure is a legal requirement, separate from accreditation.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-040"},{unit:10,topic:"u10-accred",type:"id",situational:!1,difficulty:2,stem:"Agency that accredits academic programs such as nursing, medicine, and allied health.",answer:"CHED",aliases:["Commission on Higher Education"],rationale:"CHED checks facilities, faculty, and curricula of academic programs.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-041"},{unit:10,topic:"u10-accred",type:"mcq",situational:!0,difficulty:2,stem:"A mother delivers by normal spontaneous delivery at an accredited lying-in clinic. Most of her bill is covered through a maternity package. Which accreditation made this possible?",options:["CHED","PhilHealth","DOLE","Joint Commission International"],answer:1,aliases:[],rationale:"PhilHealth accreditation allows reimbursement, such as the NSD maternity package.",whyNot:{0:"CHED accredits schools.",2:"DOLE oversees labor.",3:"JCI accreditation is about international quality, not insurance coverage."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-042"},{unit:10,topic:"u10-accred",type:"mcq",situational:!0,difficulty:2,stem:"A new private hospital in Malolos cannot legally open until it gets this, which checks its infrastructure, staffing, and operations.",options:["DOH license to operate","JCI accreditation","PhilHealth accreditation","CHED accreditation"],answer:0,aliases:[],rationale:"DOH licensure is the legal requirement to operate.",whyNot:{1:"JCI is voluntary international accreditation.",2:"PhilHealth accreditation is for reimbursement. It is not the legal license.",3:"CHED accredits schools."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-043"},{unit:10,topic:"u10-accred",type:"mcq",situational:!1,difficulty:3,stem:"How does DOH licensure differ from accreditation?",options:["Licensure is optional; accreditation is required by law","They are the same process","Licensure is only for schools","Licensure is a legal requirement to operate; accreditation is a separate review of meeting quality standards"],answer:3,aliases:[],rationale:"The outline says DOH licensure is a legal requirement and separate from accreditation.",whyNot:{0:"This is reversed.",1:"The outline separates them.",2:"CHED handles schools."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-044"},{unit:10,topic:"u10-accred",type:"mcq",situational:!0,difficulty:2,stem:"A hospital wants to attract foreign patients for medical tourism. Which accreditation does the outline link to this, with St. Luke's and The Medical City as examples?",options:["CHED accreditation","DOH license","Joint Commission (International) accreditation","PhilHealth accreditation"],answer:2,aliases:[],rationale:"The outline links JC/JCI accreditation to medical tourism, with St. Luke's and The Medical City as examples.",whyNot:{0:"CHED is for academic programs.",1:"That is a legal requirement to operate, not for medical tourism.",3:"That is for national insurance reimbursement."},mnemonic:"",note:'Source note: the outline writes "JCIA" and "Join Commission" in this part. These most likely mean JCI and Joint Commission. Please verify with Unit 10.',sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-045"},{unit:10,topic:"u10-accred",type:"id",situational:!1,difficulty:2,stem:"Name one Philippine hospital given as an example of Joint Commission accreditation.",answer:"St. Luke's Medical Center",aliases:["St Luke's","St. Luke's","The Medical City","Medical City","St Lukes"],rationale:"The outline names St. Luke's Medical Center and The Medical City.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-046"},{unit:10,topic:"u10-accred",type:"mcq",situational:!0,difficulty:2,stem:"A nursing school's program is reviewed for its facilities, faculty, and curriculum. Which body does this?",options:["Joint Commission","PhilHealth","CHED","DOH"],answer:2,aliases:[],rationale:"CHED accredits academic programs by checking facilities, faculty, and curricula.",whyNot:{0:"JC accredits healthcare organizations.",1:"PhilHealth accredits facilities for insurance.",3:"DOH licenses hospitals."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-047"},{unit:10,topic:"u10-accred",type:"mcq",situational:!1,difficulty:2,stem:"Why does accreditation matter, according to the closing statement?",options:["It assures quality, safety, and public trust in healthcare","It replaces the need for a nursing license","It removes the need for audits","It guarantees higher salaries"],answer:0,aliases:[],rationale:"Accreditation shows an organization meets standards of quality and safety.",whyNot:{1:"Individual nurses still need a PRC license.",2:"Accredited organizations still audit care.",3:"Pay is not the purpose of accreditation."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Accreditation in Healthcare",id:"U10-048"},{unit:11,topic:"u11-ethics",type:"id",situational:!1,difficulty:1,stem:"The systematic study of what a person's conduct and action should be with regard to self, other human beings, and the environment.",answer:"Ethics",aliases:[],rationale:"Ethics studies what conduct SHOULD be, not just what it is.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility (definition)",id:"U11-001"},{unit:11,topic:"u11-ethics",type:"id",situational:!1,difficulty:2,stem:"According to the module, the most basic and universal ethical principle.",answer:"Respect for people",aliases:["respect for persons","respect"],rationale:"The module says respect for people is the most basic and universal ethical principle.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility (definition)",id:"U11-002"},{unit:11,topic:"u11-ethics",type:"mcq",situational:!1,difficulty:2,stem:"Which statement matches the module's definition of ethics?",options:["It describes only what people actually do","It is the same as the Labor Code","It studies what a person's life and relationships should be, not necessarily what they are","It applies only to doctors"],answer:2,aliases:[],rationale:"Ethics is about what ought to be.",whyNot:{0:"Ethics looks at what people should do.",1:"The Labor Code is a law, not an ethical study.",3:"Ethics applies to everyone."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility (definition)",id:"U11-003"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:1,stem:"Ethical principle that promotes self-determination and freedom of choice.",answer:"Autonomy",aliases:[],rationale:"Autonomy = the patient decides for himself.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-004"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:1,stem:"Ethical principle: actions are taken in an effort to promote good.",answer:"Beneficence",aliases:[],rationale:"Beneficence = do good.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-005"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:1,stem:"Ethical principle: actions are taken in an effort to avoid harm.",answer:"Nonmaleficence",aliases:["non-maleficence","non maleficence"],rationale:"Nonmaleficence = do no harm.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-006"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:2,stem:"Ethical principle: the good of the many outweighs the wants or needs of the individual.",answer:"Utility",aliases:[],rationale:"Utility = the greatest good for the many.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-007"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:2,stem:"Ethical principle: seek fairness; treat equals equally and give fair treatment according to individual differences.",answer:"Justice",aliases:[],rationale:"Justice = fairness.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-008"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:2,stem:"Ethical principle: the obligation to tell the truth.",answer:"Veracity",aliases:[],rationale:"Veracity = truthfulness. Veritas means truth.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-009"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:2,stem:"Ethical principle: commitment to fulfilling promises.",answer:"Fidelity",aliases:[],rationale:"Fidelity = faithfulness to promises.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-010"},{unit:11,topic:"u11-principles",type:"id",situational:!1,difficulty:2,stem:"Ethical principle: keep privileged information private.",answer:"Confidentiality",aliases:["confidential"],rationale:"Confidentiality = protect private information.",mnemonic:"",note:'Source note: the module lists this principle as "Confidential". The standard term is "Confidentiality". Both are accepted here.',sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-011"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:2,stem:"A patient with cancer understands the risks but refuses chemotherapy. The nurse respects his decision after making sure he is fully informed. Which principle is this?",options:["Autonomy","Beneficence","Fidelity","Utility"],answer:0,aliases:[],rationale:"The nurse supports his right to make an informed choice, even against the recommendation. This is the module's autonomy example.",whyNot:{1:"Beneficence is promoting good. The key here is respecting his choice.",2:"Fidelity is keeping promises.",3:"Utility is about the good of the many."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-012"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:2,stem:"A post-op patient is in pain. The nurse pushes for better pain management, reassesses often, and adjusts interventions for comfort. Which principle is this?",options:["Beneficence","Justice","Nonmaleficence","Veracity"],answer:0,aliases:[],rationale:"The nurse acts to promote good (comfort and recovery). This is the module's beneficence example.",whyNot:{1:"Justice is fair distribution of care.",2:"Nonmaleficence is avoiding harm, such as double-checking a dose.",3:"Veracity is truth-telling."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-013"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:2,stem:"Before giving a new medication, the nurse double-checks the dose and the patient's history to avoid an adverse reaction. Which principle is this?",options:["Fidelity","Nonmaleficence","Beneficence","Autonomy"],answer:1,aliases:[],rationale:"The nurse is acting to avoid harm. This is the module's example.",whyNot:{0:"Fidelity is keeping promises.",2:"Beneficence actively promotes good. The focus here is preventing harm.",3:"Autonomy is about the patient's choice."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-014"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:2,stem:"During a measles outbreak with limited vaccine, the public health nurse vaccinates the elderly and immunocompromised first to protect the whole community. Which principle is this?",options:["Utility","Autonomy","Veracity","Justice"],answer:0,aliases:[],rationale:"The good of the many is placed above individual wants. This is the module's utility example.",whyNot:{1:"Individual choice is not the focus.",2:"This is not about telling the truth.",3:"Justice treats equals equally. The reasoning here is maximum benefit for the community."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-015"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:2,stem:"A nurse makes sure a patient from an informal settlement gets the same quality of care as a paying private patient, and supports policies for health access of marginalized groups. Which principle is this?",options:["Confidentiality","Justice","Beneficence","Utility"],answer:1,aliases:[],rationale:"Fair, equitable care regardless of status is justice. This is the module's example.",whyNot:{0:"This is not about privacy.",2:"Beneficence promotes good. The focus here is fairness.",3:"Utility is the good of the many over the individual."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-016"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:1,stem:"A nurse honestly explains the possible side effects of a new medication so the patient can make an informed decision. Which principle is this?",options:["Autonomy","Nonmaleficence","Veracity","Fidelity"],answer:2,aliases:[],rationale:"Telling the truth clearly and honestly is veracity.",whyNot:{0:"The truth supports autonomy, but the act itself is truth-telling.",1:"Nonmaleficence is avoiding harm.",3:"Fidelity is keeping promises."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-017"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:2,stem:"A nurse promised a discharged patient she would call him in three days about his lab results. She calls him as promised. Which principle is this?",options:["Justice","Fidelity","Utility","Veracity"],answer:1,aliases:[],rationale:"Keeping promises made to patients is fidelity.",whyNot:{0:"Justice is fairness.",2:"Utility is the good of the many.",3:"Veracity is telling the truth."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-018"},{unit:11,topic:"u11-principles",type:"mcq",situational:!0,difficulty:2,stem:"A nurse keeps medical records in a locked cabinet and only shares information with authorized personnel. Which principle is this?",options:["Confidentiality","Veracity","Fidelity","Justice"],answer:0,aliases:[],rationale:"Keeping privileged information private is confidentiality.",whyNot:{1:"Veracity is truth-telling.",2:"Fidelity is keeping promises.",3:"Justice is fairness."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Principles",id:"U11-019"},{unit:11,topic:"u11-code",type:"id",situational:!1,difficulty:2,stem:"BON Resolution that promulgated the Code of Ethics for Registered Nurses (give number and series).",answer:"BON Resolution No. 220 Series of 2004",aliases:["BON 220 s 2004","Resolution 220","220","BON Res 220"],rationale:"BON Resolution No. 220, Series of 2004 promulgated the Code of Ethics for Registered Nurses.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-020"},{unit:11,topic:"u11-code",type:"id",situational:!1,difficulty:1,stem:"Number of articles in the Code of Ethics for Filipino Nurses.",answer:"7",aliases:["seven"],rationale:"The Code is structured around seven articles.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-021"},{unit:11,topic:"u11-code",type:"id",situational:!1,difficulty:2,stem:"Article of the Code of Ethics that says health is a basic human right (give the article name).",answer:"Preamble",aliases:["Article I","Article 1"],rationale:"Article I, the Preamble, recognizes health as a basic human right.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-022"},{unit:11,topic:"u11-code",type:"id",situational:!1,difficulty:2,stem:"Code of Ethics article about Registered Nurses and Co-workers (give the article number).",answer:"Article IV",aliases:["Article 4","IV","4"],rationale:"Article IV covers collaboration, respect, communication, and integrity with co-workers.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-023"},{unit:11,topic:"u11-code",type:"mcq",situational:!1,difficulty:2,stem:"Which Code of Ethics article covers violations leading to suspension or revocation of the license?",options:["Article I: Preamble","Article VI: RNs and the Profession","Article IV: RNs and Co-workers","Article VII: Administrative Penalties, Repealing Clause, and Effectivity"],answer:3,aliases:[],rationale:"Article VII covers penalties determined by the Board of Nursing.",whyNot:{0:"The Preamble states health as a basic right and the nurse's responsibilities.",1:"That covers integrity and lifelong learning.",2:"That covers relationships with colleagues."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-024"},{unit:11,topic:"u11-code",type:"mcq",situational:!0,difficulty:2,stem:"A nurse respects a Muslim patient's prayer schedule and dietary customs and keeps his diagnosis private. Which Code of Ethics article does this best match?",options:["Article V: RNs, Society, and Environment","Article VI: RNs and the Profession","Article VII: Administrative Penalties","Article II: Registered Nurses and People"],answer:3,aliases:[],rationale:"Respecting values, customs, spiritual beliefs, and confidentiality is Article II.",whyNot:{0:"That is about social justice and environmental health.",1:"That is about integrity and lifelong learning.",2:"That is about penalties."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-025"},{unit:11,topic:"u11-code",type:"mcq",situational:!0,difficulty:2,stem:"A nurse documents accurately and truthfully and defends her patient's right to respectful care. Which article fits best?",options:["Article III: Registered Nurses and Practice","Article I: Preamble","Article IV: RNs and Co-workers","Article V: RNs, Society, and Environment"],answer:0,aliases:[],rationale:"Sanctity of life, quality care, advocacy, and accurate documentation are in Article III.",whyNot:{1:"The Preamble states the basic principles.",2:"That covers relationships with colleagues.",3:"That covers community and environment."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-026"},{unit:11,topic:"u11-code",type:"mcq",situational:!0,difficulty:2,stem:"A nurse joins a barangay clean-up drive and promotes proper waste segregation in the clinic. Which article is she following?",options:["Article II: RNs and People","Article V: Registered Nurses, Society, and Environment","Article VI: RNs and the Profession","Article III: RNs and Practice"],answer:1,aliases:[],rationale:"Community health and environmental health and sustainability are in Article V.",whyNot:{0:"That is about individual clients' values and privacy.",2:"That is about the profession's integrity.",3:"That is about clinical practice."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-027"},{unit:11,topic:"u11-code",type:"mcq",situational:!0,difficulty:2,stem:"A nurse attends seminars every year to keep up with best practices and protect the profession's public trust. Which article is this?",options:["Article IV: RNs and Co-workers","Article VII: Administrative Penalties","Article III: RNs and Practice","Article VI: Registered Nurses and the Profession"],answer:3,aliases:[],rationale:"Lifelong learning and upholding the profession's credibility are Article VI.",whyNot:{0:"That is about colleagues.",1:"That is about penalties.",2:"Practice covers direct care."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-028"},{unit:11,topic:"u11-code",type:"mcq",situational:!1,difficulty:3,stem:"What does the repealing clause in Article VII do?",options:["It annuls previous codes so the current Code remains the governing standard","It lists patients' rights","It allows nurses to choose which code to follow","It sets the salary of nurses"],answer:0,aliases:[],rationale:"The repealing clause annuls previous codes.",whyNot:{1:"Patients' rights are in the Magna Carta of Patients' Rights.",2:"Only the current code governs.",3:"Salaries are not part of the Code."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Code of Ethics",id:"U11-029"},{unit:11,topic:"u11-icn",type:"id",situational:!1,difficulty:2,stem:"Abbreviation of the International Council of Nursing.",answer:"ICN",aliases:["International Council of Nursing","International Council of Nurses"],rationale:"The ICN publishes the international Code of Ethics for Nurses.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A ICN Code of Ethics for Nurses",id:"U11-030"},{unit:11,topic:"u11-icn",type:"mcq",situational:!1,difficulty:2,stem:"Which is one of the four elements of the ICN Code of Ethics?",options:["Nurses and labor unions","Nurses and global health","Nurses and medical tourism","Nurses and the Labor Code"],answer:1,aliases:[],rationale:"The four elements are nurses and patients, practice, the profession, and global health.",whyNot:{0:"Not one of the elements.",2:"Not one of the elements.",3:"Not one of the elements."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A ICN Code of Ethics for Nurses",id:"U11-031"},{unit:11,topic:"u11-icn",type:"id",situational:!1,difficulty:2,stem:"How many elements does the ICN Code of Ethics for Nurses have in the module?",answer:"4",aliases:["four"],rationale:"The module lists four elements.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A ICN Code of Ethics for Nurses",id:"U11-032"},{unit:11,topic:"u11-magna",type:"id",situational:!1,difficulty:2,stem:"Senate Bill number of the 2008 Magna Carta of Patient's Rights and Obligations.",answer:"Senate Bill 2371",aliases:["SB 2371","2371"],rationale:"The module cites the 2008 Senate Bill 2371.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",id:"U11-033"},{unit:11,topic:"u11-magna",type:"id",situational:!1,difficulty:2,stem:"How many patient rights are listed in the module's Magna Carta of Patient's Rights?",answer:"15",aliases:["fifteen"],rationale:"The module lists 15 rights.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",id:"U11-034"},{unit:11,topic:"u11-magna",type:"mcq",situational:!0,difficulty:2,stem:"A patient insists on going home even though the doctor advises more days of treatment. Which patient right applies?",options:["Right to medical records","Right to leave against medical advice","Right to choose his physician","Right to express grief"],answer:1,aliases:[],rationale:"The Magna Carta lists the right to leave against medical advice.",whyNot:{0:"That is access to his records.",2:"He is not changing doctors.",3:"That is about mourning."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",id:"U11-035"},{unit:11,topic:"u11-magna",type:"mcq",situational:!0,difficulty:2,stem:"A researcher asks a patient to join a drug trial. The patient says no, and his care continues normally. Which right is being respected?",options:["Right to refuse participation in medical research","Right to health education","Right to correspondence","Right to informed consent"],answer:0,aliases:[],rationale:"The patient may refuse to join research.",whyNot:{1:"That is about teaching.",2:"That is about letters and visitors.",3:"Consent is related, but the specific right is refusing research participation."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",id:"U11-036"},{unit:11,topic:"u11-magna",type:"mcq",situational:!0,difficulty:2,stem:"A family wails loudly after their mother dies. The nurse gives them a private room and time instead of asking them to be quiet. Which right is being respected?",options:["Right to privacy and confidentiality","Right to religious belief","Right to express grief","Right to dignity"],answer:2,aliases:[],rationale:"The Magna Carta includes the right to express grief.",whyNot:{0:"The point is allowing grief.",1:"No religious request is mentioned.",3:"Dignity is related, but grief has its own listed right."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",id:"U11-037"},{unit:11,topic:"u11-magna",type:"mcq",situational:!1,difficulty:2,stem:"Which is NOT among the 15 rights in the module's Magna Carta of Patient's Rights?",options:["Right to health education","Right to choose the nurse's work schedule","Right to religious belief and assistance","Right to correspondence and to receive visitors"],answer:1,aliases:[],rationale:"Scheduling is a staffing matter, not a patient right.",whyNot:{0:"This is right 13.",2:"This is right 8.",3:"This is right 11."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",id:"U11-038"},{unit:11,topic:"u11-magna",type:"id",situational:!1,difficulty:2,stem:"Patient right that lets a patient decline a diagnostic test or medical treatment.",answer:"Right to refuse diagnostic and medical treatment",aliases:["right to refuse treatment","right to refuse"],rationale:"Right 6 is the right to refuse diagnostic and medical treatment.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",id:"U11-039"},{unit:11,topic:"u11-frameworks",type:"id",situational:!1,difficulty:2,stem:"Ethical framework focusing on outcomes: the greatest good for the greatest number. Also called consequentialist theory.",answer:"Utilitarianism",aliases:["utilitarian","teleological theory","consequentialist theory","consequentialism"],rationale:"Utilitarianism judges actions by their results.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-040"},{unit:11,topic:"u11-frameworks",type:"id",situational:!1,difficulty:2,stem:"Ethical framework that judges actions as right or wrong regardless of their consequences, rooted in Kant's philosophy.",answer:"Deontological theory",aliases:["deontology","deontological"],rationale:"Deontology is duty- and rights-based. Some acts are right or wrong in themselves.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-041"},{unit:11,topic:"u11-frameworks",type:"id",situational:!1,difficulty:2,stem:"Philosopher whose ideas are the root of deontological theory.",answer:"Immanuel Kant",aliases:["Kant","Emanuel Kant"],rationale:"Deontological theory is rooted in Kant's philosophy.",mnemonic:"",note:'Source note: the module spells the name "Emanuel Kant". The usual spelling is "Immanuel Kant". Both are accepted here.',sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-042"},{unit:11,topic:"u11-frameworks",type:"id",situational:!1,difficulty:2,stem:"Ethical framework where the decision-maker uses intuition to weigh goals, duties, and rights in each unique case.",answer:"Intuitionism",aliases:["intuition"],rationale:"Intuitionism treats each case as unique. Critics say it can be subjective.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-043"},{unit:11,topic:"u11-frameworks",type:"id",situational:!1,difficulty:2,stem:"Framework saying ethical decisions should align with the decision-maker's cultural values and personal beliefs.",answer:"Ethical relativism",aliases:["relativism"],rationale:"Relativism = right and wrong depend on culture and personal beliefs.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-044"},{unit:11,topic:"u11-frameworks",type:"id",situational:!1,difficulty:2,stem:"Framework holding that ethical principles are absolute and apply regardless of personal or cultural differences.",answer:"Ethical universalism",aliases:["universalism"],rationale:"Universalism = the same rules apply to everyone, everywhere.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-045"},{unit:11,topic:"u11-frameworks",type:"mcq",situational:!0,difficulty:2,stem:"A manager uses the training budget to send 30 nurses to local workshops instead of sending 3 nurses to a national conference. Which framework is this?",options:["Utilitarianism","Deontological theory","Intuitionism","Ethical relativism"],answer:0,aliases:[],rationale:"It aims for the greatest good for the greatest number. This is the module's example.",whyNot:{1:"Deontology judges acts by duty and rights, not by the number who benefit.",2:"The decision is based on maximizing benefit, not intuition.",3:"Culture is not the basis here."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-046"},{unit:11,topic:"u11-frameworks",type:"mcq",situational:!0,difficulty:2,stem:"An administrator refuses a cost-saving plan that would cut nurses' legally required rest breaks, even though it would save money. Which framework is this?",options:["Ethical relativism","Intuitionism","Deontological theory (rights-based reasoning)","Utilitarianism"],answer:2,aliases:[],rationale:"He respects employee rights regardless of the financial benefit. This is the module's example.",whyNot:{0:"Culture is not the basis here.",1:"The decision rests on rights, not intuition.",3:"Utilitarianism might accept the plan for the bigger financial good."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-047"},{unit:11,topic:"u11-frameworks",type:"mcq",situational:!0,difficulty:2,stem:"In a unique situation with no clear rule, a manager relies on her sense of what feels ethically right to balance the needs of a patient and his family. Which framework is this?",options:["Ethical universalism","Deontological theory","Intuitionism","Utilitarianism"],answer:2,aliases:[],rationale:"Relying on intuition to weigh goals, duties, and rights in a unique case is intuitionism.",whyNot:{0:"Universalism applies fixed rules to everyone.",1:"She is not applying a fixed duty or right.",3:"She is not counting the greatest good for the most people."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-048"},{unit:11,topic:"u11-frameworks",type:"mcq",situational:!1,difficulty:3,stem:"What is the main criticism of intuitionism given in the module?",options:["It ignores outcomes completely","It sidelines individual needs for the broader good","It risks subjectivity and bias","It is too rigid across cultures"],answer:2,aliases:[],rationale:"Personal beliefs may cloud judgment.",whyNot:{0:"That criticism fits deontology better.",1:"That fits utilitarianism.",3:"That fits universalism."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-049"},{unit:11,topic:"u11-frameworks",type:"mcq",situational:!1,difficulty:2,stem:"In deontological theory, what are the two key components?",options:["Relativism and universalism","Duty-based reasoning and rights-based reasoning","Self-respect and respect from others","Outcome and process"],answer:1,aliases:[],rationale:"The module lists duty-based and rights-based reasoning.",whyNot:{0:"These are a separate framework pair.",2:"These are self-esteem categories.",3:"These are audit types."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-050"},{unit:11,topic:"u11-frameworks",type:"mcq",situational:!0,difficulty:3,stem:`A nurse says, "Truth-telling is right in every culture, so I must tell this patient his diagnosis even if his family's custom is to hide it." Which framework is she using?`,options:["Utilitarianism","Intuitionism","Ethical relativism","Ethical universalism"],answer:3,aliases:[],rationale:"She treats the principle as absolute regardless of cultural differences.",whyNot:{0:"She is not weighing the greatest good for the most people.",1:"She is applying a fixed principle, not case-by-case intuition.",2:"Relativism would follow the family's cultural values."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Frameworks",id:"U11-051"},{unit:11,topic:"u11-leadership",type:"id",situational:!1,difficulty:2,stem:"Ethical leadership trait: leaders accept uncertainty and potential risks as natural parts of complex decision-making.",answer:"Managing ambiguity",aliases:["ambiguity"],rationale:"Ethical leaders can work with uncertainty.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Leadership in Nursing",id:"U11-052"},{unit:11,topic:"u11-leadership",type:"mcq",situational:!1,difficulty:2,stem:"Which is one of the traits of ethical leadership in nursing listed in the module?",options:["Avoiding uncertain situations","Competing for quick decisions","Self-aware role models","Punishment without explanation"],answer:2,aliases:[],rationale:"The module lists human-centered focus, influence through values, self-aware role models, managing ambiguity, and realistic approach.",whyNot:{0:"Ethical leaders manage ambiguity.",1:"That is a conflict strategy.",3:"That is not in the list."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Leadership in Nursing",id:"U11-053"},{unit:11,topic:"u11-leadership",type:"mcq",situational:!0,difficulty:2,stem:"A chief nurse admits that not every ethical decision will turn out well, so she stays balanced and practical when outcomes are uncertain. Which trait is this?",options:["Human-centered focus","Influence through values","Self-aware role models","Realistic approach"],answer:3,aliases:[],rationale:"Recognizing that outcomes are not always predictable and staying pragmatic is the realistic approach.",whyNot:{0:"That is about prioritizing the human aspect.",1:"That is about shaping the team through values.",2:"That is about modeling integrity."},mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Leadership in Nursing",id:"U11-054"},{unit:11,topic:"u11-leadership",type:"id",situational:!1,difficulty:2,stem:"Ethical leadership trait: decision-making prioritizes the human aspect, addressing complex moral issues with sensitivity.",answer:"Human-centered focus",aliases:["human centered focus","human-centered","human centered"],rationale:"Ethical leaders put people first.",mnemonic:"",note:"",sourceTag:"Unit 11 \u203A Ethico-Moral Responsibility \u203A Ethical Leadership in Nursing",id:"U11-055"},{unit:12,topic:"u12-bonlaws",type:"id",situational:!1,difficulty:2,stem:"BON resolution that is the Implementing Rules and Regulations (IRR) of RA 9173.",answer:"BON 425 s. 2003",aliases:["BON 425","425","BON Resolution 425"],rationale:"BON 425, s. 2003 is the IRR of the Philippine Nursing Act of 2002.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-001"},{unit:12,topic:"u12-bonlaws",type:"id",situational:!1,difficulty:2,stem:"BON resolution (2016) that prescribes new rules for the special training requirement in IV therapy and repeals BON 08 s. 1994.",answer:"BON 38 s. 2016",aliases:["BON 38","38","BON Resolution 38"],rationale:"BON 38, s. 2016 replaced the old IV training rule (BON 08, s. 1994).",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-002"},{unit:12,topic:"u12-bonlaws",type:"id",situational:!1,difficulty:3,stem:"BON resolution (1994) on special training on IV injections for the RN, later repealed.",answer:"BON 08 s. 1994",aliases:["BON 08","BON 8","08","8"],rationale:"BON 08, s. 1994 was repealed by BON 38, s. 2016.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-003"},{unit:12,topic:"u12-bonlaws",type:"id",situational:!1,difficulty:3,stem:"BON resolution (1999) that adopted the Nursing Specialty Certification Program and created the Nurse Specialty Certification Council.",answer:"BON 14 s. 1999",aliases:["BON 14","14"],rationale:"BON 14, s. 1999 created the specialty certification program and council.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-004"},{unit:12,topic:"u12-bonlaws",type:"id",situational:!1,difficulty:3,stem:"BON resolution (1998) adopting a guide to evaluate compliance with standards for safe nursing practice.",answer:"BON 110 s. 1998",aliases:["BON 110","110"],rationale:"BON 110, s. 1998 is the guide for evaluating compliance with safe nursing practice standards.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-005"},{unit:12,topic:"u12-bonlaws",type:"id",situational:!1,difficulty:2,stem:"CHED memorandum order (2009) on policies and standards for the BSN program.",answer:"CHED Memo 14 s. 2009",aliases:["CMO 14","CHED Memo 14","CHED Memorandum Order 14","14"],rationale:"CHED Memo 14, s. 2009 sets the policies and standards for the BSN program.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-006"},{unit:12,topic:"u12-bonlaws",type:"mcq",situational:!0,difficulty:2,stem:"A hospital's IV therapy training program for newly hired nurses must follow the current BON rules. Which issuance should it follow?",options:["BON 110 s. 1998","BON 14 s. 1999","BON 38 s. 2016","BON 08 s. 1994"],answer:2,aliases:[],rationale:"BON 38, s. 2016 is the current rule. It repealed BON 08, s. 1994.",whyNot:{0:"That is a guide for evaluating safe practice compliance.",1:"That is about specialty certification.",3:"This was repealed by BON 38, s. 2016."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-007"},{unit:12,topic:"u12-bonlaws",type:"mcq",situational:!1,difficulty:2,stem:"Which issuance is the Implementing Rules and Regulations of the Philippine Nursing Act of 2002?",options:["BON 110 s. 1998","BON 425 s. 2003","RA 8981","CHED Memo 14 s. 2009"],answer:1,aliases:[],rationale:"BON 425, s. 2003 is the IRR of RA 9173.",whyNot:{0:"That is the compliance guide for safe nursing practice.",2:"That is the PRC Modernization Act.",3:"That is for the BSN program."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-008"},{unit:12,topic:"u12-bonlaws",type:"mcq",situational:!0,difficulty:3,stem:"A nurse wants to become a certified oncology nurse specialist through the national certification program. Which BON issuance created this program and its council?",options:["BON 14 s. 1999","CHED Memo 14 s. 2009","BON 38 s. 2016","BON 425 s. 2003"],answer:0,aliases:[],rationale:"BON 14, s. 1999 adopted the Nursing Specialty Certification Program and created the Nurse Specialty Certification Council.",whyNot:{1:"That is for the BSN program.",2:"That is about IV therapy training.",3:"That is the IRR of RA 9173."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-009"},{unit:12,topic:"u12-bonlaws",type:"mcq",situational:!1,difficulty:2,stem:"A nursing school revises its BSN curriculum. Which issuance sets the policies and standards it must follow?",options:["RA 7305","RA 4226","BON 110 s. 1998","CHED Memo 14 s. 2009"],answer:3,aliases:[],rationale:"CHED Memo 14, s. 2009 covers the BSN program's policies and standards.",whyNot:{0:"That is the Magna Carta of Public Health Workers.",1:"That is the Hospital Licensure Act.",2:"That is for evaluating safe nursing practice."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",id:"U12-010"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:1,stem:"Data Privacy Act of 2012.",answer:"RA 10173",aliases:["10173","republic act 10173"],rationale:"RA 10173 protects personal information, including patient health data.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-011"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"PRC Modernization Act of 2000.",answer:"RA 8981",aliases:["8981"],rationale:"RA 8981 modernized the Professional Regulation Commission.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-012"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Mental Health Act of 2018.",answer:"RA 11036",aliases:["11036"],rationale:"RA 11036 is the Mental Health Act of 2018.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-013"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"The Magna Carta of Public Health Workers.",answer:"RA 7305",aliases:["7305"],rationale:"RA 7305 covers the rights and benefits of public health workers.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-014"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"The Generics Act of 1988.",answer:"RA 6675",aliases:["6675"],rationale:"RA 6675 promotes the use of generic drug names.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-015"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Comprehensive Dangerous Drugs Act of 2002.",answer:"RA 9165",aliases:["9165"],rationale:"RA 9165 regulates dangerous drugs.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-016"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:3,stem:"Traditional and Alternative Medicine Act of 1997.",answer:"RA 8423",aliases:["8423"],rationale:"RA 8423 covers traditional and alternative medicine.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-017"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Anti-Sexual Harassment Act of 1995.",answer:"RA 7877",aliases:["7877"],rationale:"RA 7877 penalizes sexual harassment in work and education settings.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-018"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:3,stem:"Local Government Code of 1991.",answer:"RA 7160",aliases:["7160"],rationale:"RA 7160 is the Local Government Code, which devolved health services to LGUs.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-019"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Newborn Screening Act of 2004.",answer:"RA 9288",aliases:["9288"],rationale:"RA 9288 requires newborn screening.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-020"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Expanded Breastfeeding Promotion Act of 2009.",answer:"RA 10028",aliases:["10028"],rationale:"RA 10028 expanded breastfeeding promotion (2009).",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-021"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Rooming-In and Breastfeeding Act of 1992.",answer:"RA 7600",aliases:["7600"],rationale:"RA 7600 is the original Rooming-In and Breastfeeding Act (1992).",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-022"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Philippine AIDS Prevention and Control Act of 1998.",answer:"RA 8504",aliases:["8504"],rationale:"RA 8504 is the AIDS Prevention and Control Act of 1998.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-023"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:3,stem:"Mandatory Reporting of Notifiable Diseases and Health Events of Public Health Concern Act.",answer:"RA 11332",aliases:["11332"],rationale:"RA 11332 requires reporting of notifiable diseases.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-024"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:3,stem:"Philippine Pharmacy Act.",answer:"RA 10918",aliases:["10918"],rationale:"RA 10918 is the Philippine Pharmacy Act.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-025"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Expanded Senior Citizens Act (as listed in the module, 2003).",answer:"RA 8257",aliases:["8257"],rationale:"The module lists RA 8257 as the Expanded Senior Citizens Act of 2003.",mnemonic:"",note:'Source note: the module lists "RA 8257, Expanded Senior Citizens Act of 2003". The commonly cited Expanded Senior Citizens Act of 2003 is RA 9257. This item follows the module as written. Please verify the number with your professor.',sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-026"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Anti-Violence Against Women and Their Children Act of 2004.",answer:"RA 9262",aliases:["9262","VAWC"],rationale:"RA 9262 protects women and their children from violence.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-027"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Special Protection of Children Against Abuse, Exploitation and Discrimination Act.",answer:"RA 7610",aliases:["7610"],rationale:"RA 7610 protects children from abuse.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-028"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"National Health Insurance Act of 2013.",answer:"RA 10606",aliases:["10606"],rationale:"RA 10606 is the National Health Insurance Act of 2013 (PhilHealth).",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-029"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Hospital Licensure Act.",answer:"RA 4226",aliases:["4226"],rationale:"RA 4226 requires hospitals to be licensed.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-030"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Ecological Solid Waste Management Act of 2000.",answer:"RA 9003",aliases:["9003"],rationale:"RA 9003 covers solid waste management.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-031"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Presidential Decree (1976) providing compulsory basic immunization for infants and children below 8 years of age.",answer:"PD 996",aliases:["996","PD 996 s. 1976"],rationale:"PD 996, s. 1976 made basic immunization compulsory for children below 8.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-032"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Executive Order (1986), the National Code of Marketing of Breastmilk Substitutes, Breastmilk Supplements and Related Products.",answer:"EO 51",aliases:["51","EO 51 s. 1986","Milk Code"],rationale:"EO 51, s. 1986 is the Milk Code.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-033"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Responsible Parenthood and Reproductive Health Act of 2012.",answer:"RA 10354",aliases:["10354","RH Law"],rationale:"RA 10354 is the RH Law.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-034"},{unit:12,topic:"u12-ralaws",type:"id",situational:!1,difficulty:2,stem:"Universal Health Care Act of 2019.",answer:"RA 11223",aliases:["11223","UHC Act"],rationale:"RA 11223 is the Universal Health Care Act.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-035"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A nurse posts a patient's lab results and full name in a group chat without consent. Which law is most directly violated?",options:["RA 8981 (PRC Modernization Act)","RA 7877 (Anti-Sexual Harassment Act)","RA 9003 (Solid Waste Management Act)","RA 10173 (Data Privacy Act of 2012)"],answer:3,aliases:[],rationale:"RA 10173 penalizes unauthorized disclosure of personal and health information.",whyNot:{0:"That modernized the PRC.",1:"There is no harassment here.",2:"That covers waste."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-036"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A newborn is 48 hours old. The nurse collects a heel-prick blood sample before discharge to detect congenital metabolic disorders. Which law requires this?",options:["RA 10354 (RH Law)","RA 7600 (Rooming-In and Breastfeeding Act)","PD 996 (compulsory immunization)","RA 9288 (Newborn Screening Act of 2004)"],answer:3,aliases:[],rationale:"RA 9288 is the Newborn Screening Act.",whyNot:{0:"That is about reproductive health and family planning.",1:"That is about rooming-in and breastfeeding.",2:"That is about vaccines."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-037"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A hospital keeps the newborn in the same room as the mother and supports exclusive breastfeeding right after delivery. Which 1992 law is the original basis?",options:["EO 51 (Milk Code)","RA 7600 (Rooming-In and Breastfeeding Act of 1992)","RA 10028 (Expanded Breastfeeding Promotion Act of 2009)","RA 9288 (Newborn Screening Act)"],answer:1,aliases:[],rationale:"RA 7600 is the 1992 rooming-in law.",whyNot:{0:"That regulates marketing of breastmilk substitutes.",2:"That is the 2009 expanded law, not the 1992 one.",3:"That is about screening."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-038"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A milk formula sales agent gives free formula samples and posters to mothers in the postpartum ward. Which issuance regulates this?",options:["EO 51 s. 1986 (Milk Code)","RA 7600","RA 9165","RA 6675"],answer:0,aliases:[],rationale:"The Milk Code regulates marketing of breastmilk substitutes and supplements.",whyNot:{1:"That is about rooming-in.",2:"That is about dangerous drugs.",3:"That is the Generics Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-039"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A company sets up lactation stations and gives breaks to working mothers to express milk. Which 2009 law expanded breastfeeding promotion?",options:["RA 7305","RA 10028 (Expanded Breastfeeding Promotion Act of 2009)","RA 10354","RA 7600"],answer:1,aliases:[],rationale:"RA 10028 is the 2009 expanded breastfeeding law.",whyNot:{0:"That is the Magna Carta of Public Health Workers.",2:"That is the RH Law.",3:"That is the 1992 original law."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-040"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:'A doctor writes "paracetamol 500 mg" using the generic name on every prescription. Which law requires this?',options:["RA 8423 (Traditional and Alternative Medicine Act)","RA 9165 (Dangerous Drugs Act)","RA 6675 (Generics Act of 1988)","RA 10918 (Pharmacy Act)"],answer:2,aliases:[],rationale:"RA 6675 promotes the use of generic names.",whyNot:{0:"That is about traditional medicine.",1:"That is about dangerous drugs.",3:"That regulates pharmacy practice."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-041"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A nurse keeps morphine in a double-locked cabinet and counts it at every shift. Which law regulates these controlled drugs?",options:["RA 4226","RA 11332","RA 6675","RA 9165 (Comprehensive Dangerous Drugs Act of 2002)"],answer:3,aliases:[],rationale:"RA 9165 regulates dangerous drugs like opioids.",whyNot:{0:"That is about hospital licensing.",1:"That is about notifiable diseases.",2:"That is the Generics Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-042"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A nurse in the RHU reports a confirmed dengue death to the epidemiology surveillance unit as required. Which law makes this reporting mandatory?",options:["RA 11332 (Mandatory Reporting of Notifiable Diseases and Health Events of Public Health Concern Act)","RA 10173","RA 7160","RA 8504"],answer:0,aliases:[],rationale:"RA 11332 requires reporting of notifiable diseases.",whyNot:{1:"The Data Privacy Act protects data. Disease reporting is required by RA 11332.",2:"That is the Local Government Code.",3:"That is the AIDS Prevention and Control Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-043"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"An HIV counseling nurse keeps test results confidential and follows rules on HIV prevention education. Which 1998 law covers this?",options:["RA 8504 (Philippine AIDS Prevention and Control Act of 1998)","RA 9262","RA 11036","RA 11332"],answer:0,aliases:[],rationale:"RA 8504 is the 1998 AIDS law in the module.",whyNot:{1:"That is the anti-VAWC law.",2:"That is the Mental Health Act.",3:"That is the notifiable disease reporting law."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-044"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A psychiatric nurse explains to a patient his rights in mental health care. Which law sets these rights?",options:["RA 7305","RA 8504","RA 7610","RA 11036 (Mental Health Act of 2018)"],answer:3,aliases:[],rationale:"RA 11036 is the Mental Health Act.",whyNot:{0:"That is for public health workers.",1:"That is the AIDS law.",2:"That protects children from abuse."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-045"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A public health nurse in a rural health unit asks about her hazard pay and benefits as a government health worker. Which law covers this?",options:["RA 7305 (Magna Carta of Public Health Workers)","RA 11223","RA 8981","RA 10606"],answer:0,aliases:[],rationale:"RA 7305 covers benefits of public health workers.",whyNot:{1:"That is the UHC Act.",2:"That is the PRC Modernization Act.",3:"That is the National Health Insurance Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-046"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A woman comes to the ER with bruises and says her husband beats her and their child. Which law specifically protects her and her child?",options:["RA 7877","RA 8257","RA 7600","RA 9262 (Anti-Violence Against Women and Their Children Act of 2004)"],answer:3,aliases:[],rationale:"RA 9262 protects women and their children from violence.",whyNot:{0:"That is about sexual harassment.",1:"That is about senior citizens (as listed in the module).",2:"That is about rooming-in."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-047"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A school nurse discovers that a 10-year-old is being forced to work and is being abused. Which law gives special protection to children against abuse and exploitation?",options:["PD 996","RA 9262","RA 7610","RA 9288"],answer:2,aliases:[],rationale:"RA 7610 is the Special Protection of Children Against Abuse, Exploitation and Discrimination Act.",whyNot:{0:"That is about immunization.",1:"That protects women and their children from violence by an intimate partner.",3:"That is about newborn screening."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-048"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A supervisor makes repeated sexual remarks to a nurse and asks for favors in exchange for a good evaluation. Which law covers this?",options:["RA 10173","RA 9262","RA 7877 (Anti-Sexual Harassment Act of 1995)","RA 7305"],answer:2,aliases:[],rationale:"RA 7877 penalizes sexual harassment at work.",whyNot:{0:"That is the Data Privacy Act.",1:"That is about violence against women by a partner.",3:"That is the Magna Carta of Public Health Workers."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-049"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A mother asks why her 6-year-old must complete his basic vaccines. Which issuance makes basic immunization compulsory for children below 8 years?",options:["EO 51","PD 996 s. 1976","RA 11223","RA 9288"],answer:1,aliases:[],rationale:"PD 996 provides compulsory basic immunization for infants and children below 8.",whyNot:{0:"That is the Milk Code.",2:"That is the UHC Act.",3:"That is about newborn screening."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-050"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A hospital segregates infectious waste, recyclables, and biodegradables in color-coded bins. Which law on solid waste is the basis?",options:["RA 7160","RA 4226","RA 8423","RA 9003 (Ecological Solid Waste Management Act of 2000)"],answer:3,aliases:[],rationale:"RA 9003 covers solid waste management.",whyNot:{0:"That is the Local Government Code.",1:"That is about hospital licensing.",2:"That is about traditional and alternative medicine."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-051"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A new hospital cannot operate until it is licensed. Which law requires hospital licensure?",options:["RA 10606","RA 9003","RA 4226 (Hospital Licensure Act)","RA 8981"],answer:2,aliases:[],rationale:"RA 4226 is the Hospital Licensure Act.",whyNot:{0:"That is the National Health Insurance Act.",1:"That is about waste.",3:"That is the PRC Modernization Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-052"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"Every Filipino is automatically enrolled in the national health insurance program and gets better access to care. Which 2019 law is this?",options:["RA 7305","RA 11223 (Universal Health Care Act of 2019)","RA 10354","RA 10606"],answer:1,aliases:[],rationale:"RA 11223 is the UHC Act.",whyNot:{0:"That is for public health workers.",2:"That is the RH Law.",3:"That is the National Health Insurance Act of 2013."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-053"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!1,difficulty:3,stem:"Which pair is correctly matched?",options:["RA 10606: National Health Insurance Act of 2013","RA 10173: Mental Health Act","RA 10606: Universal Health Care Act of 2019","RA 11223: Data Privacy Act"],answer:0,aliases:[],rationale:"RA 10606 is the National Health Insurance Act of 2013.",whyNot:{1:"The Mental Health Act is RA 11036.",2:"The UHC Act is RA 11223.",3:"The Data Privacy Act is RA 10173."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-054"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A couple in a barangay health center receives free family planning counseling and contraceptives. Which law supports this?",options:["PD 996","RA 9288","RA 7600","RA 10354 (Responsible Parenthood and Reproductive Health Act of 2012)"],answer:3,aliases:[],rationale:"RA 10354 is the RH Law.",whyNot:{0:"That is about immunization.",1:"That is about newborn screening.",2:"That is about rooming-in."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-055"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A patient uses herbal medicine and acupuncture from a licensed practitioner. Which law regulates traditional and alternative medicine?",options:["RA 10918","RA 9165","RA 6675","RA 8423 (Traditional and Alternative Medicine Act of 1997)"],answer:3,aliases:[],rationale:"RA 8423 is the TAMA law.",whyNot:{0:"That is the Pharmacy Act.",1:"That is the Dangerous Drugs Act.",2:"That is the Generics Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-056"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:3,stem:"Health services such as rural health units were devolved to local governments. Which 1991 law made this happen?",options:["RA 7160 (Local Government Code of 1991)","RA 11223","RA 7305","RA 4226"],answer:0,aliases:[],rationale:"RA 7160 is the Local Government Code.",whyNot:{1:"That is the UHC Act.",2:"That is the Magna Carta of Public Health Workers.",3:"That is the Hospital Licensure Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-057"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!1,difficulty:2,stem:"A pharmacist's practice and the dispensing of medicines are regulated by which law?",options:["RA 10918 (Philippine Pharmacy Act)","RA 6675","RA 8981","RA 9165"],answer:0,aliases:[],rationale:"RA 10918 is the Philippine Pharmacy Act.",whyNot:{1:"That is the Generics Act.",2:"That is the PRC Modernization Act.",3:"That is the Dangerous Drugs Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-058"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!1,difficulty:2,stem:"Which law modernized the Professional Regulation Commission?",options:["RA 8981","RA 9173","RA 7160","RA 10918"],answer:0,aliases:[],rationale:"RA 8981 is the PRC Modernization Act of 2000.",whyNot:{1:"That is the Philippine Nursing Act of 2002.",2:"That is the Local Government Code.",3:"That is the Pharmacy Act."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-059"},{unit:12,topic:"u12-ralaws",type:"mcq",situational:!0,difficulty:2,stem:"A 70-year-old patient asks for his discount on medicines. Which law in the module covers senior citizens' benefits?",options:["RA 9262","RA 7305","RA 8257 (Expanded Senior Citizens Act of 2003, as listed)","RA 7610"],answer:2,aliases:[],rationale:"The module lists RA 8257 as the Expanded Senior Citizens Act of 2003.",whyNot:{0:"That protects women and children from violence.",1:"That is for public health workers.",3:"That protects children."},mnemonic:"",note:"Source note: the module lists RA 8257 for the Expanded Senior Citizens Act of 2003. The commonly cited number is RA 9257. Follow the number your professor uses.",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Other Health-related Laws (table)",id:"U12-060"},{unit:12,topic:"u12-laborcode",type:"id",situational:!1,difficulty:1,stem:"Presidential Decree known as the Labor Code of the Philippines.",answer:"PD 442",aliases:["442","Presidential Decree 442"],rationale:"PD 442 is the Labor Code of the Philippines.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Presidential Decree No. 442",id:"U12-061"},{unit:12,topic:"u12-laborcode",type:"id",situational:!1,difficulty:2,stem:"Department established by the Labor Code to oversee labor laws (abbreviation).",answer:"DOLE",aliases:["Department of Labor and Employment"],rationale:"DOLE oversees labor laws.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Presidential Decree No. 442",id:"U12-062"},{unit:12,topic:"u12-laborcode",type:"mcq",situational:!1,difficulty:2,stem:"Which is one of the three purposes of PD 442?",options:["To regulate dangerous drugs","To encourage productive labor relations","To set nursing curricula","To license hospitals"],answer:1,aliases:[],rationale:"The three purposes: promote workers' rights, ensure fair labor standards, encourage productive labor relations.",whyNot:{0:"That is RA 9165.",2:"That is CHED.",3:"That is RA 4226."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Presidential Decree No. 442",id:"U12-063"},{unit:12,topic:"u12-laborcode",type:"mcq",situational:!1,difficulty:2,stem:"Under the Labor Code, discrimination is prohibited on which grounds?",options:["Race, color, sex, religion, political opinion","Only age and height","Number of children only","Board rating and school"],answer:0,aliases:[],rationale:"The module lists these grounds.",whyNot:{1:"These are not the listed grounds.",2:"This is not a listed ground.",3:"These are not the listed grounds."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Presidential Decree No. 442",id:"U12-064"},{unit:12,topic:"u12-laborcode",type:"mcq",situational:!0,difficulty:2,stem:"A hospital refuses to hire a qualified nurse because of her religion. Which part of PD 442 is violated?",options:["Undertime not offset by overtime","Night shift differential","Prohibition of discrimination based on race, color, sex, religion, political opinion","Service incentive leave"],answer:2,aliases:[],rationale:"Religion is one of the listed grounds.",whyNot:{0:"That is about hours.",1:"That is about pay for night work.",3:"That is about leave."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Presidential Decree No. 442",id:"U12-065"},{unit:12,topic:"u12-laborcode",type:"mcq",situational:!1,difficulty:2,stem:"Which is NOT among the key concepts of PD 442 in the module?",options:["Compensation for work-related injuries and illnesses","Licensing of nursing schools","Vocational training and skills development","Employment of women and minors"],answer:1,aliases:[],rationale:"CHED handles nursing schools. This is not in the Labor Code list.",whyNot:{0:"This is listed.",2:"This is listed.",3:"This is listed."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Presidential Decree No. 442",id:"U12-066"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:1,stem:"Normal hours of work per day under Article 83.",answer:"8",aliases:["eight","8 hours","eight hours"],rationale:"Article 83 sets 8 hours per day.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-067"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Labor Code article on normal hours of work.",answer:"Article 83",aliases:["Art 83","83"],rationale:"Article 83 = normal hours of work.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-068"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Labor Code article on night shift differential.",answer:"Article 86",aliases:["Art 86","86"],rationale:"Article 86 = night shift differential.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-069"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Labor Code article on overtime work.",answer:"Article 87",aliases:["Art 87","87"],rationale:"Article 87 = overtime work.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilit
