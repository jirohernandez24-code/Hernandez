!1,difficulty:2,stem:"Audit that evaluates the end results of patient care.",answer:"Outcome audit",aliases:["outcome"],rationale:"Outcome audits look at results, like fall rates and infection rates.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-048"},{unit:9,topic:"u9-audittypes",type:"id",situational:!1,difficulty:2,stem:"Audit that examines how nursing care is provided, ensuring adherence to policies, protocols, or guidelines.",answer:"Process audit",aliases:["process"],rationale:"Process audits look at how care is done, step by step.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-049"},{unit:9,topic:"u9-audittypes",type:"id",situational:!1,difficulty:2,stem:"Audit that evaluates the environment and resources available for delivering care.",answer:"Structure audit",aliases:["structural audit","structure"],rationale:"Structure audits check staffing, equipment, and environment.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-050"},{unit:9,topic:"u9-audittypes",type:"mcq",situational:!0,difficulty:2,stem:"The QA committee counts how many patients developed hospital-acquired infections on Ward 3 last quarter. Which audit type is this?",options:["Process audit","Structure audit","Prospective audit","Outcome audit"],answer:3,aliases:[],rationale:"Nosocomial infection rates are end results of care. This matches the module's outcome audit example.",whyNot:{0:"A process audit would check if nurses followed infection control steps.",1:"A structure audit would check resources such as hand-wash sinks.",2:"Prospective is about timing, not focus."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-051"},{unit:9,topic:"u9-audittypes",type:"mcq",situational:!0,difficulty:2,stem:"An auditor watches whether nurses monitor fetal heart tone and maternal vital signs at the required intervals during labor. Which audit type is this?",options:["Outcome audit","Sentinel event review","Structure audit","Process audit"],answer:3,aliases:[],rationale:"Checking whether protocols were followed during care is a process audit. This is the module's example.",whyNot:{0:"Outcome audits look at end results, such as complications.",1:"Nothing serious happened. This is a routine check.",2:"Structure audits check resources, not how care is done."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-052"},{unit:9,topic:"u9-audittypes",type:"mcq",situational:!0,difficulty:2,stem:"The auditor checks whether the crash cart is complete, the nurse-patient ratio is 1:8, and all call lights work. Which audit type is this?",options:["Concurrent audit","Process audit","Outcome audit","Structure audit"],answer:3,aliases:[],rationale:"Staffing ratios, emergency equipment, and call lights are resources and environment. These are the module's examples.",whyNot:{0:"Concurrent is timing, not focus.",1:"Nobody's care actions are being checked.",2:"No patient results are measured."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-053"},{unit:9,topic:"u9-audittypes",type:"mcq",situational:!1,difficulty:3,stem:"Why does the module say a structure audit does not fully tell you the quality of care?",options:["It is task-oriented and checks protocol steps","It is only done after a sentinel event","It checks if inputs (resources, infrastructure) are adequate but does not directly evaluate the care itself","It only looks at end results"],answer:2,aliases:[],rationale:"Having a full crash cart does not show the care was good. Structure audits check the inputs only.",whyNot:{0:"That describes process audits.",1:"Structure audits are routine.",3:"That describes outcome audits."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-054"},{unit:9,topic:"u9-audittypes",type:"mcq",situational:!1,difficulty:2,stem:"Which audit type is considered a strong indicator of care quality and holds nurses accountable through nursing-sensitive outcomes?",options:["Outcome audit","Process audit","Retrospective audit","Structure audit"],answer:0,aliases:[],rationale:"The module says outcome audits are strong indicators of care quality.",whyNot:{1:"Process audits are task-oriented and check adherence to standards.",2:"Retrospective is timing, not focus.",3:"Structure audits do not directly evaluate care quality."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-055"},{unit:9,topic:"u9-audittypes",type:"id",situational:!1,difficulty:2,stem:"Give one nursing-sensitive outcome measured in outcome audits (module examples).",answer:"Patient fall rates",aliases:["falls","fall rates","pressure sores","patient satisfaction","pressure ulcers"],rationale:"The module lists patient fall rates, pressure sores, and patient satisfaction.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-056"},{unit:9,topic:"u9-audittypes",type:"mcq",situational:!1,difficulty:2,stem:'Which audit type does the module describe as "task-oriented"?',options:["Outcome audit","Prospective audit","Structure audit","Process audit"],answer:3,aliases:[],rationale:"The module says process audits are task-oriented and check practices against best practice standards.",whyNot:{0:"Outcome audits measure results.",1:"Prospective audit is about timing.",2:"Structure audits check inputs."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-057"},{unit:9,topic:"u9-audittypes",type:"mcq",situational:!0,difficulty:3,stem:"A postpartum audit checks whether nurses gave newborn care instructions during home visits. A second audit counts how many newborns were readmitted for jaundice. What are these two audits?",options:["First is a process audit, second is an outcome audit","First is an outcome audit, second is a process audit","First is a structure audit, second is a process audit","Both are structure audits"],answer:0,aliases:[],rationale:"Giving instructions is how care is done (process). Readmissions are results (outcome).",whyNot:{1:"These are reversed.",2:"Giving instructions is not a resource.",3:"Neither checks resources or environment."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Types of Audits Used in Healthcare",id:"U9-058"},{unit:9,topic:"u9-problem",type:"id",situational:!1,difficulty:2,stem:"Type of problem behavior that includes refusal to follow instructions, attendance issues, or disrespecting others.",answer:"Blatant insubordination",aliases:["insubordination"],rationale:"Blatant means open and obvious.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-059"},{unit:9,topic:"u9-problem",type:"id",situational:!1,difficulty:2,stem:"Type of problem behavior such as undermining team members or creating a hostile workplace.",answer:"Subtle but serious behaviors",aliases:["subtle but serious","subtle behaviors"],rationale:"These are less obvious but still serious.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-060"},{unit:9,topic:"u9-problem",type:"id",situational:!1,difficulty:2,stem:"Employees who meet only minimal standards and consistently disrupt unit functioning through poor performance.",answer:"Marginal employees",aliases:["marginal employee","marginal"],rationale:"Marginal employees do just enough to stay, but their poor performance disrupts the unit.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-061"},{unit:9,topic:"u9-problem",type:"id",situational:!1,difficulty:2,stem:"Type of impairment resulting from drug or alcohol addiction.",answer:"Chemical impairment",aliases:["chemical"],rationale:"Chemical impairment comes from substance use.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-062"},{unit:9,topic:"u9-problem",type:"id",situational:!1,difficulty:2,stem:"Type of impairment increasingly recognized as significant, covering issues like depression or anxiety.",answer:"Psychological impairment",aliases:["psychological"],rationale:"Psychological impairment is increasingly recognized in the workplace.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-063"},{unit:9,topic:"u9-problem",type:"mcq",situational:!0,difficulty:2,stem:"Nurse Gio openly refuses the charge nurse's assignment and is often absent without notice. Which problem behavior is this?",options:["Subtle but serious behavior","Marginal employee behavior","Psychological impairment","Blatant insubordination"],answer:3,aliases:[],rationale:"Refusing instructions and attendance issues are blatant insubordination.",whyNot:{0:"His behavior is open, not subtle.",1:"Marginal employees meet minimal standards. Open refusal is insubordination.",2:"Nothing suggests depression or anxiety."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-064"},{unit:9,topic:"u9-problem",type:"mcq",situational:!0,difficulty:2,stem:"Nurse Hana never refuses orders, but she quietly spreads negativity and undermines her teammates, creating a hostile mood. Which problem behavior is this?",options:["Constructive discipline","Blatant insubordination","Chemical impairment","Subtle but serious behavior"],answer:3,aliases:[],rationale:"Undermining team members and creating a hostile workplace is subtle but serious.",whyNot:{0:"That is a manager's approach, not a problem behavior.",1:"She does not openly refuse instructions.",2:"There is no sign of substance use."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-065"},{unit:9,topic:"u9-problem",type:"mcq",situational:!0,difficulty:2,stem:"A nurse does only the minimum: vital signs recorded, but no assessments, and other staff often must redo or finish her work. Which type of special-needs employee is she?",options:["Impaired employee","Blatant insubordination","Expert nurse","Marginal employee"],answer:3,aliases:[],rationale:"She meets only minimal standards and consistently disrupts the unit with poor performance.",whyNot:{0:"Nothing suggests drug, alcohol, or psychological impairment.",1:"She does not refuse instructions.",2:"An expert works with deep understanding. This is the opposite."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-066"},{unit:9,topic:"u9-problem",type:"mcq",situational:!0,difficulty:2,stem:"A nurse often smells of alcohol at the start of night duty, and his medication errors are increasing. Which type of employee with special needs is this?",options:["Marginal employee","Impaired employee (chemical impairment)","Subtle but serious behavior","Psychological impairment"],answer:1,aliases:[],rationale:"Alcohol use points to chemical impairment.",whyNot:{0:"Marginal is about low performance without impairment.",2:"The issue here is impairment, not undermining coworkers.",3:"Alcohol points to chemical impairment."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline",id:"U9-067"},{unit:9,topic:"u9-discipline",type:"id",situational:!1,difficulty:1,stem:"Training or molding character to bring about desired behaviors; both corrective and educational.",answer:"Discipline",aliases:[],rationale:"Discipline helps employees grow. It is not only about consequences.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-068"},{unit:9,topic:"u9-discipline",type:"id",situational:!1,difficulty:2,stem:"An undesirable consequence that follows unacceptable behavior and lacks the developmental aspect of discipline.",answer:"Punishment",aliases:[],rationale:"Punishment may stop the behavior but does not develop the person.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-069"},{unit:9,topic:"u9-discipline",type:"id",situational:!1,difficulty:2,stem:'Latin term that "discipline" comes from, meaning teaching, learning, and growing.',answer:"Disciplina",aliases:[],rationale:"Disciplina = teaching, learning, and growing.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-070"},{unit:9,topic:"u9-discipline",type:"id",situational:!1,difficulty:2,stem:"Discipline carried out in a supportive and corrective manner, helping employees see it is about their actions, not their identity.",answer:"Constructive discipline",aliases:["constructive"],rationale:"Constructive discipline separates the behavior from the person's worth.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-071"},{unit:9,topic:"u9-discipline",type:"id",situational:!1,difficulty:2,stem:"The highest and most effective form of discipline, where employees govern themselves.",answer:"Self-discipline",aliases:["self discipline"],rationale:"Self-discipline is internal control. It grows when employees feel secure, validated, and affirmed.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-072"},{unit:9,topic:"u9-discipline",type:"mcq",situational:!1,difficulty:2,stem:"What is the main difference between discipline and punishment in the module?",options:["Discipline is only for marginal employees","Discipline is corrective and educational, while punishment lacks the developmental aspect","Punishment helps employees grow, discipline does not","They mean the same thing"],answer:1,aliases:[],rationale:"Both may correct behavior, but only discipline develops the employee.",whyNot:{0:"Discipline applies to everyone.",2:"This is reversed.",3:"The module separates them clearly."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-073"},{unit:9,topic:"u9-discipline",type:"mcq",situational:!0,difficulty:2,stem:`After a late medication, the head nurse privately tells the nurse, "The delay is the problem, not you. Let's look at how to organize your rounds." What approach is this?`,options:["Constructive discipline","Avoiding","Mobbing","Punishment"],answer:0,aliases:[],rationale:"She is supportive and corrective and makes clear it is about the action, not the person.",whyNot:{1:"She addressed the issue.",2:"Mobbing is a group targeting a person.",3:"She gave guidance, not just an undesirable consequence."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-074"},{unit:9,topic:"u9-discipline",type:"mcq",situational:!1,difficulty:3,stem:"According to the module, when does self-discipline emerge?",options:["When employees are threatened with termination","When group norms conflict with organizational goals","When managers punish immediately","When employees feel secure, validated, and affirmed in their value within the organization"],answer:3,aliases:[],rationale:"The module links self-discipline to feeling secure, validated, and affirmed.",whyNot:{0:"Threats do not build internal control.",1:"That makes self-discipline harder.",2:"Immediate consequences are a Hot Stove rule, not the source of self-discipline."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-075"},{unit:9,topic:"u9-discipline",type:"mcq",situational:!0,difficulty:2,stem:'On a ward, the "unwritten rule" is to chart vital signs in advance to leave on time. A new nurse wants to chart correctly but feels pressured to follow the group. What concept explains this?',options:["Benchmarking","Self-discipline","Group norms","Competence assessment"],answer:2,aliases:[],rationale:"Group-established standards and social pressure can make self-discipline hard when they conflict with organizational goals.",whyNot:{0:"Benchmarking compares with best practices.",1:"Self-discipline is what is being blocked here.",3:"That checks qualifications."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-076"},{unit:9,topic:"u9-discipline",type:"mcq",situational:!1,difficulty:2,stem:"When applied correctly, what should discipline NOT do, according to the module?",options:["Promote growth","Help employees understand their mistakes","Permanently alienate or demoralize employees","Help employees correct their behavior"],answer:2,aliases:[],rationale:"The module says correct discipline should not permanently alienate or demoralize employees.",whyNot:{0:"That is what it should do.",1:"That is what it should do.",3:"That is what it should do."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Employee Discipline (cont.)",id:"U9-077"},{unit:9,topic:"u9-hotstove",type:"id",situational:!1,difficulty:1,stem:'Author of the "Hot Stove" rules of discipline (1967).',answer:"Douglas McGregor",aliases:["McGregor"],rationale:"Douglas McGregor outlined the four Hot Stove rules in 1967.",mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-078"},{unit:9,topic:"u9-hotstove",type:"id",situational:!1,difficulty:2,stem:"Year Douglas McGregor outlined the Hot Stove rules.",answer:"1967",aliases:[],rationale:"The module dates the Hot Stove rules to 1967.",mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-079"},{unit:9,topic:"u9-hotstove",type:"id",situational:!1,difficulty:1,stem:"Hot Stove rule: employees must be aware of the rules and consequences BEFORE breaking them; there should be no surprises.",answer:"Forewarning",aliases:["forewarn","first rule"],rationale:"You know the stove is hot before you touch it.",mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-080"},{unit:9,topic:"u9-hotstove",type:"id",situational:!1,difficulty:2,stem:"Hot Stove rule: discipline must be applied right after the rule is broken, like the instant burn from a hot stove.",answer:"Immediate consequences",aliases:["immediate consequence","immediacy","immediate"],rationale:"The burn comes instantly. Delayed discipline loses its link to the behavior.",mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-081"},{unit:9,topic:"u9-hotstove",type:"id",situational:!1,difficulty:2,stem:"Hot Stove rule: every time a rule is broken, the same consequence follows, so rules are firm and predictable.",answer:"Consistency",aliases:["consistent"],rationale:"The stove burns every time.",mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-082"},{unit:9,topic:"u9-hotstove",type:"id",situational:!1,difficulty:2,stem:"Hot Stove rule: everyone who breaks the rule faces the same consequence regardless of position.",answer:"Impartiality",aliases:["impartial"],rationale:"The stove burns anyone who touches it, the chief nurse included.",mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-083"},{unit:9,topic:"u9-hotstove",type:"mcq",situational:!0,difficulty:2,stem:'A nurse is suspended for a policy she never heard of. She says, "Nobody told us this was a rule!" Which Hot Stove rule was violated?',options:["Consistency","Forewarning","Immediate consequences","Impartiality"],answer:1,aliases:[],rationale:"Employees must know the rules and consequences beforehand. There should be no surprises.",whyNot:{0:"Consistency is about the same consequence every time.",2:"The problem is that she did not know the rule, not the timing.",3:"Impartiality is about equal treatment regardless of position."},mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-084"},{unit:9,topic:"u9-hotstove",type:"mcq",situational:!0,difficulty:2,stem:"A nurse came to duty late in January. The manager only talks to her about it in June. Which Hot Stove rule was violated?",options:["Impartiality","Consistency","Forewarning","Immediate consequences"],answer:3,aliases:[],rationale:"Discipline should follow right after the rule is broken.",whyNot:{0:"Nothing suggests unequal treatment by position.",1:"Consistency is about the same consequence each time.",2:"The issue is timing, not lack of warning."},mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-085"},{unit:9,topic:"u9-hotstove",type:"mcq",situational:!0,difficulty:2,stem:"When a staff nurse is late, she gets a written warning. When the same nurse is late again, the manager just laughs it off. Which Hot Stove rule is broken?",options:["Forewarning","Immediate consequences","Impartiality","Consistency"],answer:3,aliases:[],rationale:"The same rule violation got different consequences at different times.",whyNot:{0:"She already knew the rule.",1:"Timing is not the problem.",2:"Impartiality compares different people. Here it is the same nurse at different times."},mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-086"},{unit:9,topic:"u9-hotstove",type:"mcq",situational:!0,difficulty:3,stem:"A staff nurse gets a memo for not wearing her ID, but the supervisor who also forgets her ID gets nothing. Which Hot Stove rule is violated?",options:["Impartiality","Immediate consequences","Consistency","Forewarning"],answer:0,aliases:[],rationale:"Everyone who breaks the rule should face the same consequence regardless of position.",whyNot:{1:"Timing is not the issue.",2:"Consistency is about the same rule and person over time. This compares two people of different rank.",3:"Both knew the rule."},mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-087"},{unit:9,topic:"u9-hotstove",type:"mcq",situational:!1,difficulty:2,stem:'Why does Hot Stove rule 2 stress "immediate" consequences?',options:["So the employee has time to forget the rule","So the consequence is clearly linked to the behavior, like the instant burn from a stove","So the manager can collect evidence for months","So only senior staff are disciplined"],answer:1,aliases:[],rationale:"An instant consequence makes the connection between action and result clear.",whyNot:{0:"The opposite is the point.",2:"Long delays weaken the link to the behavior.",3:"That would violate impartiality."},mnemonic:"",note:"",sourceTag:`Unit 9 \u203A Controlling \u203A McGregor's "Hot Stove" Rules`,id:"U9-088"},{unit:9,topic:"u9-coaching",type:"id",situational:!1,difficulty:2,stem:"Managerial strategy to address and correct poor performance through constructive guidance, rather than merely enforcing discipline.",answer:"Performance deficiency coaching",aliases:["performance coaching","coaching"],rationale:"Coaching guides improvement instead of only punishing.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Deficiency Coaching",id:"U9-089"},{unit:9,topic:"u9-coaching",type:"id",situational:!1,difficulty:2,stem:"Type of coaching that is continuous and spontaneous, built into the daily work routine.",answer:"Ongoing coaching",aliases:["ongoing"],rationale:"Ongoing coaching happens every day, informally.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Deficiency Coaching",id:"U9-090"},{unit:9,topic:"u9-coaching",type:"id",situational:!1,difficulty:2,stem:"Type of coaching that is structured and planned, focusing on a specific performance issue that needs immediate correction.",answer:"Problem-centered coaching",aliases:["problem centered coaching","problem-centered","problem centered"],rationale:"Problem-centered coaching targets one specific issue and needs preparation.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Deficiency Coaching",id:"U9-091"},{unit:9,topic:"u9-coaching",type:"mcq",situational:!0,difficulty:2,stem:'While rounding, the head nurse casually tells a new nurse, "Nice catch on that BP. Next time, recheck after 15 minutes." Which coaching type is this?',options:["Self-appraisal","Problem-centered coaching","Punishment","Ongoing coaching"],answer:3,aliases:[],rationale:"The feedback is spontaneous and part of the daily routine.",whyNot:{0:"The nurse is not evaluating herself.",1:"That is a planned meeting about a specific deficiency.",2:"No undesirable consequence was given."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Deficiency Coaching",id:"U9-092"},{unit:9,topic:"u9-coaching",type:"mcq",situational:!0,difficulty:2,stem:"A nurse has made three documentation errors this month. The manager schedules a private meeting, prepares the records, and plans specific steps for improvement. Which coaching type is this?",options:["Ongoing coaching","Weighted checklist","Smoothing","Problem-centered coaching"],answer:3,aliases:[],rationale:"It is structured, planned, and focused on one specific performance issue.",whyNot:{0:"Ongoing coaching is spontaneous, not prepared in advance.",1:"That is an appraisal tool.",2:"Smoothing avoids the issue."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Deficiency Coaching",id:"U9-093"},{unit:9,topic:"u9-perfeval",type:"id",situational:!1,difficulty:2,stem:"Process in which work performance is reviewed to determine how well employees carry out the duties of their jobs.",answer:"Performance appraisal",aliases:["performance evaluation"],rationale:"Performance appraisal is an important controlling responsibility.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Evaluation",id:"U9-094"},{unit:9,topic:"u9-perfeval",type:"id",situational:!1,difficulty:2,stem:"Document that The Joint Commission (early 1990s) advocated using as the standard for performance appraisal.",answer:"Job description",aliases:["the job description","employee's job description"],rationale:"The JC advocated using the employee's job description as the appraisal standard.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Evaluation",id:"U9-095"},{unit:9,topic:"u9-perfeval",type:"mcq",situational:!1,difficulty:2,stem:"When did The Joint Commission begin advocating the use of the job description as the standard for performance appraisal?",options:["Early 1990s","2002","2012","1967"],answer:0,aliases:[],rationale:"The module says early 1990s.",whyNot:{1:"2002 is the year of the Philippine Nursing Act (RA 9173).",2:"2012 is the year of the NNCCS and the Data Privacy Act.",3:"1967 is the year of McGregor's Hot Stove rules."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Evaluation",id:"U9-096"},{unit:9,topic:"u9-perfeval",type:"id",situational:!1,difficulty:2,stem:"Evaluation of an employee's knowledge, education, skills, or experience required to perform specific tasks; asks whether the employee is qualified.",answer:"Competence assessment",aliases:["competency assessment"],rationale:'Competence assessment asks, "Is this person qualified?"',mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Evaluation",id:"U9-097"},{unit:9,topic:"u9-perfeval",type:"mcq",situational:!0,difficulty:3,stem:"Before allowing a nurse to float to the ICU, the manager checks her ACLS certificate, ICU training, and ventilator experience. What is the manager doing?",options:["Outcome audit","Performance evaluation","Competence assessment","Problem-centered coaching"],answer:2,aliases:[],rationale:"She is checking qualifications (education, skills, experience) for specific tasks.",whyNot:{0:"An outcome audit measures patient results.",1:"Performance evaluation would check how well she already performs her ICU tasks.",3:"There is no performance problem to correct."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Evaluation",id:"U9-098"},{unit:9,topic:"u9-perfeval",type:"mcq",situational:!0,difficulty:3,stem:"After six months in the ICU, the manager rates how well the nurse actually carries out her assigned tasks with real patients. What is this?",options:["Structure audit","Performance evaluation","Competence assessment","Self-appraisal"],answer:1,aliases:[],rationale:"It assesses how well she executes tasks in real-world situations.",whyNot:{0:"That checks resources.",2:"Competence assessment checks if she is qualified before or for the tasks.",3:"The manager, not the nurse, does the rating."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Performance Evaluation",id:"U9-099"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Appraisal tool that focuses on personal characteristics like attitude, teamwork, or punctuality rather than the quality or quantity of work.",answer:"Trait rating scale",aliases:["trait rating","trait scale"],rationale:"The trait rating scale rates who you are, not directly how much or how well you work.",mnemonic:"",note:'Source note: the module says "trade rating scale" once. It most likely means "trait rating scale". Please verify.',sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-100"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Appraisal tool where a rating scale is made for each job classification, with rating factors taken directly from the written job description.",answer:"Job dimension scales",aliases:["job dimension scale","job dimension"],rationale:"Job dimension scales align the appraisal with the employee's actual duties.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-101"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Appraisal tool that rates specific, observable behaviors ranked typically 1 to 9, with a separate form for each job classification. Give the abbreviation.",answer:"BARS",aliases:["behaviorally anchored rating scales","behaviorally anchored rating scale","behavioral expectation scales"],rationale:"BARS = behaviorally anchored rating scales, also called behavioral expectation scales.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-102"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Another name for behaviorally anchored rating scales.",answer:"Behavioral expectation scales",aliases:["behavioral expectation scale"],rationale:"The module says BARS are also known as behavioral expectation scales.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-103"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:3,stem:"In BARS, behaviors are typically ranked on this numerical range to show their importance.",answer:"1 to 9",aliases:["1-9","one to nine"],rationale:"BARS ranks behaviors typically from 1 to 9.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-104"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Type of checklist where each behavior has a weighted score, and merit raises are often tied to the overall score.",answer:"Weighted checklist",aliases:["weighted"],rationale:"Weighted = each behavior carries a weight. Scores often affect merit raises.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-105"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Type of checklist where the evaluator selects both desirable and undesirable behaviors for the employee.",answer:"Forced checklist",aliases:["forced"],rationale:"Forced = the rater is forced to choose both good and bad behaviors.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-106"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Type of checklist with descriptors of behavior, traits, or skills where the rater checks those that apply.",answer:"Simple checklist",aliases:["simple"],rationale:"Simple = just tick what applies.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-107"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Appraisal method of writing a narrative description of the employee's performance, strengths, and areas for improvement.",answer:"Essays",aliases:["essay","essay appraisal"],rationale:"Essay appraisals are written narratives.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-108"},{unit:9,topic:"u9-tools",type:"id",situational:!1,difficulty:2,stem:"Appraisal method where employees reflect on and summarize their own work accomplishments, encouraging reflective practice.",answer:"Self-appraisals",aliases:["self-appraisal","self appraisal","self appraisals"],rationale:"Self-appraisal builds reflective practice.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-109"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:2,stem:"A rating form asks the manager to score a nurse's attitude, teamwork, and punctuality from 1 to 5. Which tool is this?",options:["Essay","BARS","Trait rating scale","Job dimension scale"],answer:2,aliases:[],rationale:"It rates personal characteristics rather than work quality or quantity.",whyNot:{0:"An essay is a narrative, not a rating form.",1:"BARS uses specific observable behaviors tied to job responsibilities.",3:"That uses factors from the job description."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-110"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:3,stem:'The hospital makes a separate rating form for staff nurses, listing observable behaviors such as "verifies two patient identifiers before every medication", each ranked from 1 to 9. Which tool reduces subjectivity this way?',options:["Behaviorally anchored rating scale (BARS)","Trait rating scale","Simple checklist","Self-appraisal"],answer:0,aliases:[],rationale:"Observable behaviors, a separate form per job classification, and ranking 1 to 9 describe BARS.",whyNot:{1:"Trait scales rate personal characteristics, which are more subjective.",2:"A simple checklist only ticks descriptors that apply. It does not rank 1 to 9.",3:"The nurse does not rate herself here."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-111"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:2,stem:"The appraisal form for clinical instructors lists rating factors copied straight from the clinical instructor's written job description. Which tool is this?",options:["Job dimension scales","Forced checklist","Essay","Trait rating scale"],answer:0,aliases:[],rationale:"Rating factors taken directly from the written job description define job dimension scales.",whyNot:{1:"A forced checklist makes the evaluator choose desirable and undesirable behaviors.",2:"An essay is a written narrative.",3:"Trait scales rate personal characteristics."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-112"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:2,stem:"The hospital uses an appraisal where each behavior statement has a score, and the total score decides the nurse's merit increase. Which tool is this?",options:["Weighted checklist","Forced checklist","Simple checklist","BARS"],answer:0,aliases:[],rationale:"Weighted scores with merit raises tied to them describe a weighted checklist.",whyNot:{1:"A forced checklist requires choosing both desirable and undesirable behaviors.",2:"A simple checklist has no weights.",3:"BARS ranks observable behaviors 1 to 9 but the merit-raise link is described for weighted checklists."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-113"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:2,stem:"The evaluator must pick both good and bad behaviors from a list for each nurse. Each has a value and a total is computed. Which tool is this?",options:["Trait rating scale","Weighted checklist","Forced checklist","Simple checklist"],answer:2,aliases:[],rationale:"The evaluator selects both desirable and undesirable behaviors. This is the forced checklist.",whyNot:{0:"That rates personal characteristics.",1:"Weighted checklists assign weights to behaviors but do not force both kinds.",3:"The rater only checks what applies."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-114"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:1,stem:'The supervisor ticks off descriptors like "punctual," "neat," and "skilled in IV insertion" that apply to the nurse. Which tool is this?',options:["Simple checklist","Weighted checklist","Forced checklist","Essay"],answer:0,aliases:[],rationale:"Checking descriptors that apply is a simple checklist.",whyNot:{1:"No weights or scores are mentioned.",2:"She is not forced to pick both desirable and undesirable behaviors.",3:"She is not writing a narrative."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-115"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:1,stem:"At year end, each nurse writes a reflection on her own accomplishments and areas to grow. Which tool is this?",options:["BARS","Job dimension scales","Essay","Self-appraisal"],answer:3,aliases:[],rationale:"Employees reflecting on their own work is self-appraisal.",whyNot:{0:"BARS uses observable behaviors rated by an evaluator.",1:"These are rating scales from the job description.",2:"In the essay method the evaluator writes about the employee."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-116"},{unit:9,topic:"u9-tools",type:"mcq",situational:!0,difficulty:2,stem:"The head nurse writes three paragraphs about a nurse's strengths and the areas she needs to improve. Which appraisal tool is this?",options:["Trait rating scale","Simple checklist","Self-appraisal","Essay"],answer:3,aliases:[],rationale:"A written narrative of strengths and areas for improvement is the essay method.",whyNot:{0:"There is no rating scale.",1:"There is no checklist.",2:"The head nurse, not the employee, wrote it."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-117"},{unit:9,topic:"u9-tools",type:"mcq",situational:!1,difficulty:3,stem:"Which appraisal tool is described as specifically reducing subjectivity by focusing on physically observable behaviors?",options:["Trait rating scale","BARS","Self-appraisals","Essays"],answer:1,aliases:[],rationale:"The module says BARS focuses on observable behaviors, which helps reduce subjectivity.",whyNot:{0:"Trait ratings are about personality characteristics, which can be subjective.",2:"Self-ratings are subjective by nature.",3:"Narratives depend on the writer."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Appraisal Tools",id:"U9-118"},{unit:9,topic:"u9-jc",type:"id",situational:!1,difficulty:2,stem:"Original name (abbreviation) of The Joint Commission.",answer:"JCAHO",aliases:["Joint Commission for Accreditation of Healthcare Organizations","Joint Commission on Accreditation of Healthcare Organizations"],rationale:"The JC was originally the Joint Commission for Accreditation of Healthcare Organizations (JCAHO).",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Creating a Patient's Safety Culture",id:"U9-119"},{unit:9,topic:"u9-jc",type:"id",situational:!1,difficulty:2,stem:"The international arm of The Joint Commission (abbreviation).",answer:"JCI",aliases:["Joint Commission International"],rationale:"JCI = Joint Commission International.",mnemonic:"",note:'Source note: the module writes "GCI" once in this section. It most likely means "JCI". Please verify.',sourceTag:"Unit 9 \u203A Controlling \u203A Creating a Patient's Safety Culture",id:"U9-120"},{unit:9,topic:"u9-jc",type:"mcq",situational:!1,difficulty:2,stem:"How many healthcare organizations and programs does The Joint Commission accredit in the U.S., according to the module?",options:["Over 2,100","Over 210,000","Exactly 6","Over 21,000"],answer:3,aliases:[],rationale:"The module says over 21,000.",whyNot:{0:"The module says over 21,000.",1:"The module says over 21,000.",2:"Six is the number of IPSGs."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Creating a Patient's Safety Culture",id:"U9-121"},{unit:9,topic:"u9-jc",type:"mcq",situational:!1,difficulty:2,stem:"What program did The Joint Commission mandate all hospitals to establish?",options:["A Quality Assurance (QA) program","A nursing school","A labor union","A collective bargaining agreement"],answer:0,aliases:[],rationale:"The module says the JC mandated that all hospitals establish a QA program.",whyNot:{1:"Schools are regulated by CHED.",2:"Unions are formed by employees.",3:"That is between unions and employers."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Creating a Patient's Safety Culture",id:"U9-122"},{unit:9,topic:"u9-jc",type:"mcq",situational:!0,difficulty:2,stem:"A Philippine hospital wants to be accredited internationally and also get consulting and education on patient safety. Which organization fits best?",options:["Joint Commission International (JCI)","Board of Nursing","DOLE","AHRQ"],answer:0,aliases:[],rationale:"JCI offers accreditation, certification, education, consulting, and more worldwide.",whyNot:{1:"The BON regulates nursing standards, not international hospital accreditation.",2:"DOLE oversees labor laws.",3:"AHRQ develops clinical guidelines in the US."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Creating a Patient's Safety Culture",id:"U9-123"},{unit:9,topic:"u9-jc",type:"mcq",situational:!1,difficulty:2,stem:"Which organization developed the International Patient Safety Goals (IPSGs)?",options:["WHO","PhilHealth","PRC","JCI"],answer:3,aliases:[],rationale:"The module says the IPSGs were developed by the JCI.",whyNot:{0:"WHO is mentioned for the 5 moments of hand hygiene, not as the IPSG author.",1:"PhilHealth is the national health insurer.",2:"The PRC regulates professionals in the Philippines."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Creating a Patient's Safety Culture",id:"U9-124"},{unit:9,topic:"u9-sentinel",type:"id",situational:!1,difficulty:1,stem:"Patient safety event, not primarily related to the natural course of the illness, that reaches a patient and results in death, permanent harm, or severe temporary harm.",answer:"Sentinel event",aliases:["sentinel events"],rationale:'A sentinel event "sends a signal" that immediate investigation is needed.',mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Sentinel Events",id:"U9-125"},{unit:9,topic:"u9-sentinel",type:"id",situational:!1,difficulty:2,stem:"A systematic process for identifying the root causes of an error and addressing them to prevent recurrence. Give the abbreviation.",answer:"RCA",aliases:["root cause analysis","root causes analysis"],rationale:"RCA digs past the surface error to the system causes.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Sentinel Events",id:"U9-126"},{unit:9,topic:"u9-sentinel",type:"mcq",situational:!0,difficulty:2,stem:"A patient receives the wrong blood type, develops a severe reaction, and needs ICU transfer for a life-threatening condition. What is this and what is needed?",options:["A sentinel event that needs immediate investigation and a root cause analysis","A near miss that only needs a verbal reminder","A process audit that can wait until next quarter","The natural course of the illness, so no report is needed"],answer:0,aliases:[],rationale:"It reached the patient and caused severe temporary harm needing a higher level of care.",whyNot:{1:"A near miss does not reach the patient. This one did.",2:"Sentinel events need immediate investigation.",3:"The harm came from a safety event, not the illness."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Sentinel Events",id:"U9-127"},{unit:9,topic:"u9-sentinel",type:"mcq",situational:!0,difficulty:3,stem:"A terminally ill cancer patient dies peacefully from the expected progression of his disease. Is this a sentinel event?",options:["Yes, because every death is a sentinel event","No, because sentinel events only involve permanent harm","Yes, because he was in a hospital","No, because the death is related to the natural course of the illness"],answer:3,aliases:[],rationale:"Sentinel events are NOT primarily related to the natural course of the illness.",whyNot:{0:"The definition excludes deaths from the natural course of illness.",1:"Death is one of the sentinel event outcomes.",2:"Location does not make it a sentinel event."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Sentinel Events",id:"U9-128"},{unit:9,topic:"u9-sentinel",type:"mcq",situational:!1,difficulty:3,stem:`Which situation meets the module's description of "severe temporary harm"?`,options:["Critical harm of limited duration that requires additional major surgery to resolve","A minor bruise that heals in two days","A wrong drug caught before it was given","Permanent loss of a limb"],answer:0,aliases:[],rationale:"Severe temporary harm includes harm needing additional major surgery, procedure, or treatment.",whyNot:{1:"This is not critical or potentially life-threatening.",2:"It never reached the patient.",3:"That is permanent harm, a separate category."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Sentinel Events",id:"U9-129"},{unit:9,topic:"u9-sentinel",type:"mcq",situational:!1,difficulty:2,stem:"Why does The Joint Commission collect and share sentinel event data with accredited organizations?",options:["To decide nurses' salaries","To help prevent future medical errors and reduce recurrence","To revoke all licenses involved","To publicly shame the nurses involved"],answer:1,aliases:[],rationale:"The module says sharing data helps organizations build better safety protocols.",whyNot:{0:"Data is used for safety, not pay.",2:"That is not the purpose stated.",3:"A safety culture focuses on systems, not shaming."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Sentinel Events",id:"U9-130"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:1,stem:"IPSG 1: identify patients correctly. How many identifiers should be used?",answer:"Two",aliases:["2","two identifiers"],rationale:"Use two identifiers, such as name + date of birth or name + hospital ID band.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-131"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!1,difficulty:1,stem:"Under IPSG 1, which should NEVER be used as a patient identifier?",options:["Date of birth","The patient's room number","Full name","Hospital ID band number"],answer:1,aliases:[],rationale:"The module says never use the room number. Patients change rooms and beds.",whyNot:{0:"Date of birth is a valid second identifier.",2:"Name is a valid identifier when paired with another.",3:"The ID band is a valid identifier."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-132"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!0,difficulty:2,stem:"Before hanging a unit of blood, Nurse Ivy asks the patient to state his full name and birthday and checks them against the wristband and the blood tag. Which IPSG is she meeting?",options:["IPSG 3: high-alert medications","IPSG 5: reduce HAIs","IPSG 1: identify patients correctly","IPSG 4: correct surgery site"],answer:2,aliases:[],rationale:"Using two identifiers and double-checking before transfusion is IPSG 1.",whyNot:{0:"Blood checks here are about patient identity.",1:"This is not about infection.",3:"No surgery is involved."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-133"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:"Technique under IPSG 2 where the nurse repeats a verbal order back to confirm it.",answer:"Read-back",aliases:["read back","readback"],rationale:"Read-back catches mistakes before they reach the patient.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-134"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:"Standardized handoff format under IPSG 2. Give the abbreviation.",answer:"SBAR",aliases:[],rationale:"SBAR = Situation, Background, Assessment, Recommendation.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-135"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:'In SBAR, what does the "B" stand for?',answer:"Background",aliases:[],rationale:"SBAR = Situation, Background, Assessment, Recommendation.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-136"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:'In SBAR, what does the "R" stand for?',answer:"Recommendation",aliases:["recommendations"],rationale:"SBAR = Situation, Background, Assessment, Recommendation.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-137"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!0,difficulty:2,stem:"A doctor gives a verbal order over the phone for furosemide 40 mg IV now. What should the nurse do according to IPSG 2?",options:["Wait for the doctor to come and write it","Give the drug right away and chart later","Ask another nurse to remember it","Write it down and read it back to the doctor to confirm"],answer:3,aliases:[],rationale:"Read-back is the IPSG 2 method for verbal orders.",whyNot:{0:"Read-back allows safe verbal orders.",1:"The order must be confirmed first.",2:"That increases the risk of miscommunication."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-138"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!0,difficulty:2,stem:"The lab calls a critical potassium of 6.8 mEq/L. Under IPSG 2, what should the nurse do first?",options:["Wait for the printed result","Tell the relative first","Report it at the end of the shift","Write down the critical result immediately and verify it"],answer:3,aliases:[],rationale:"IPSG 2 says write down critical test results immediately and verify.",whyNot:{0:"Critical values need immediate action.",1:"The result must be documented and verified, then reported to the physician.",2:"Delay could harm the patient."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-139"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:"Under IPSG 3, lettering style used for look-alike drug names such as hydrOXYzine vs hydrALAzine.",answer:"Tall-man lettering",aliases:["tall man lettering","tall-man","tall man"],rationale:"Capital letters highlight the part of the name that differs.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-140"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!1,difficulty:2,stem:"Which three drugs does the module give as examples of high-alert medications?",options:["Paracetamol, vitamins, saline","Oxygen, blood, and IV fluids","Insulin, anticoagulants, chemotherapy","Antacids, laxatives, lotions"],answer:2,aliases:[],rationale:"The module lists insulin, anticoagulants, and chemotherapy.",whyNot:{0:"These are not the module's high-alert examples.",1:"These are not the examples given.",3:"These are not the module's high-alert examples."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-141"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!0,difficulty:2,stem:"The pharmacy stores heparin and insulin in a separate bin with red warning labels, and two nurses independently check every dose. Which IPSG is this?",options:["IPSG 6: reduce falls","IPSG 3: improve the safety of high-alert medications","IPSG 2: improve communication","IPSG 1: identify patients correctly"],answer:1,aliases:[],rationale:"Separate storage with warning labels and independent double-checks are IPSG 3 methods.",whyNot:{0:"This is not about falls.",2:"Read-back and SBAR are IPSG 2.",3:"The focus is the medicine, not patient identity."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-142"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:"Under IPSG 4, the pause done before surgery to verify the patient, site, and procedure.",answer:"Time out",aliases:["time-out","timeout"],rationale:"The time out is the last check before the incision.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-143"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!0,difficulty:2,stem:"Before a right knee arthroscopy, the surgeon marks the right knee while the awake patient confirms it. The team then stops to verify patient, site, and procedure. Which IPSG is this?",options:["IPSG 5: reduce HAIs","IPSG 1: identify patients correctly","IPSG 4: ensure correct surgery at the correct site with the correct procedure","IPSG 3: high-alert medications"],answer:2,aliases:[],rationale:"Site marking with patient involvement and a time out are IPSG 4.",whyNot:{0:"Infection control is not the focus.",1:"Identity is part of it, but site marking and time out belong to IPSG 4.",3:"No medications are involved."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-144"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:`IPSG 5 uses WHO's "5 ___ of hand hygiene."`,answer:"Moments",aliases:["5 moments","five moments"],rationale:"WHO's 5 moments of hand hygiene are the IPSG 5 standard.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-145"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!0,difficulty:2,stem:"A nurse performs hand hygiene before and after touching each patient, wears PPE correctly, and uses sterile technique for catheter insertion. Which IPSG is this?",options:["IPSG 2: improve communication","IPSG 6: reduce harm from falls","IPSG 5: reduce the risk of healthcare-associated infections","IPSG 4: correct surgery"],answer:2,aliases:[],rationale:"Hand hygiene, PPE, and sterile technique prevent HAIs.",whyNot:{0:"This is not about communication.",1:"These actions prevent infection, not falls.",3:"This is not about surgery site."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-146"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:"Abbreviation for infections like pneumonia, sepsis, and UTIs acquired during care (IPSG 5).",answer:"HAIs",aliases:["HAI","healthcare-associated infections","healthcare associated infections","nosocomial infections"],rationale:"HAIs = healthcare-associated infections.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-147"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!0,difficulty:2,stem:"An 82-year-old is admitted. The nurse assesses fall risk on admission, puts on a bed alarm, raises the side rails, gives non-slip socks, and teaches the family. Which IPSG is this?",options:["IPSG 5: reduce HAIs","IPSG 1: identify patients correctly","IPSG 6: reduce the risk of patient harm from falls","IPSG 3: high-alert medications"],answer:2,aliases:[],rationale:"All these are IPSG 6 fall-prevention steps.",whyNot:{0:"Nothing here is about infection.",1:"Nothing here is about identity.",3:"No medications are involved."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-148"},{unit:9,topic:"u9-ipsg",type:"id",situational:!1,difficulty:2,stem:"Under IPSG 6, fall risk should be assessed for every patient at this time.",answer:"On admission",aliases:["admission","upon admission"],rationale:"Fall risk assessment starts on admission for every patient.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-149"},{unit:9,topic:"u9-ipsg",type:"mcq",situational:!1,difficulty:2,stem:"Which statement explains WHY IPSG 2 exists?",options:["High-risk medications cause severe harm","Wrong-site surgery is catastrophic","Falls cause serious injury in the elderly","Miscommunication is a major cause of errors"],answer:3,aliases:[],rationale:"The module gives this as the reason for IPSG 2.",whyNot:{0:"That is the reason for IPSG 3.",1:"That is the reason for IPSG 4.",2:"That is the reason for IPSG 6."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A International Patient Safety Goals",id:"U9-150"},{unit:9,topic:"u9-medrec",type:"id",situational:!1,difficulty:2,stem:"Process of systematically comparing a patient's current medication regimen with newly prescribed medications, especially at transition points.",answer:"Medication reconciliation",aliases:["med reconciliation","med rec"],rationale:"Medication reconciliation catches errors when the patient moves between settings.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Medication Reconciliation",id:"U9-151"},{unit:9,topic:"u9-medrec",type:"id",situational:!1,difficulty:2,stem:"Medication reconciliation error type: failing to prescribe a necessary medication.",answer:"Omissions",aliases:["omission"],rationale:"An omission is a needed drug that was left out.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Medication Reconciliation",id:"U9-152"},{unit:9,topic:"u9-medrec",type:"id",situational:!1,difficulty:2,stem:"Medication reconciliation error type: prescribing two medications with the same purpose.",answer:"Duplications",aliases:["duplication"],rationale:"Duplication is two drugs doing the same job.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Medication Reconciliation",id:"U9-153"},{unit:9,topic:"u9-medrec",type:"mcq",situational:!0,difficulty:2,stem:"A patient on home losartan is admitted, and the doctor also orders valsartan. During medication reconciliation the nurse notices two drugs with the same purpose. Which error was caught?",options:["Omission","Duplication","Dosing error","Drug interaction"],answer:1,aliases:[],rationale:"Two medications with the same purpose is a duplication.",whyNot:{0:"Nothing needed was left out.",2:"The issue is not the dose but two drugs with the same purpose.",3:"The problem described is the same purpose, which is duplication."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Medication Reconciliation",id:"U9-154"},{unit:9,topic:"u9-medrec",type:"mcq",situational:!0,difficulty:2,stem:"On transfer from ICU to the ward, the nurse compares the ICU orders with the patient's home meds and finds his maintenance antiepileptic was never ordered. Which error was caught?",options:["Omission","Dosing error","Duplication","Tall-man lettering error"],answer:0,aliases:[],rationale:"A necessary medication was not prescribed.",whyNot:{1:"The drug is missing, not wrongly dosed.",2:"Nothing is doubled.",3:"That is a look-alike name issue."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Medication Reconciliation",id:"U9-155"},{unit:9,topic:"u9-medrec",type:"mcq",situational:!1,difficulty:2,stem:"When is medication reconciliation especially important, according to the module?",options:["At patient transition points","Only during surgery","Only after a sentinel event","Only once a year"],answer:0,aliases:[],rationale:"The module stresses transition points such as admission, transfer, and discharge.",whyNot:{1:"The module says transition points.",2:"It is a preventive process.",3:"It happens at each transition."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Medication Reconciliation",id:"U9-156"},{unit:9,topic:"u9-reporting",type:"id",situational:!1,difficulty:2,stem:"The two kinds of error reporting the module says must both increase: mandatory and ____.",answer:"Voluntary",aliases:["voluntary reporting"],rationale:"Both mandatory and voluntary reporting help organizations learn from errors.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-157"},{unit:9,topic:"u9-reporting",type:"id",situational:!1,difficulty:2,stem:"Culture at the unit level that shifts away from blaming individuals and focuses on finding and improving system failures.",answer:"Blame-free reporting",aliases:["blame free reporting","blame-free","blame free culture","blame-free culture"],rationale:"When people are not blamed, they report more errors and near misses.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-158"},{unit:9,topic:"u9-reporting",type:"id",situational:!1,difficulty:2,stem:"Culture that balances a blame-free environment with holding individuals accountable, separating human error, at-risk behavior, and reckless behavior.",answer:"Just culture",aliases:["just"],rationale:"Just culture = fair. It learns from errors but still holds reckless behavior accountable.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-159"},{unit:9,topic:"u9-reporting",type:"id",situational:!1,difficulty:2,stem:"In Just Culture, an unintentional error that is part of the learning process.",answer:"Human error",aliases:["human"],rationale:"Human error is unintentional. The fix is usually the system.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-160"},{unit:9,topic:"u9-reporting",type:"id",situational:!1,difficulty:2,stem:"In Just Culture, decisions that increase risk but are not intentionally harmful.",answer:"At-risk behavior",aliases:["at risk behavior","at-risk","at risk"],rationale:"At-risk behavior is a risky shortcut, not intentional harm. The fix is coaching.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-161"},{unit:9,topic:"u9-reporting",type:"id",situational:!1,difficulty:2,stem:"In Just Culture, actions that disregard safety protocols and need corrective action.",answer:"Reckless behavior",aliases:["reckless"],rationale:"Reckless behavior knowingly ignores safety. It needs corrective action.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-162"},{unit:9,topic:"u9-reporting",type:"id",situational:!1,difficulty:2,stem:"Errors caught before they reach the patient, which staff should feel safe to report in a blame-free culture.",answer:"Near misses",aliases:["near miss"],rationale:"Reporting near misses helps fix the system before harm happens.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-163"},{unit:9,topic:"u9-reporting",type:"mcq",situational:!0,difficulty:2,stem:"A nurse gives the wrong medication because two drugs have very similar packaging. She reports it immediately. Under Just Culture, what is this and what is the right response?",options:["At-risk behavior; coaching","Human error; improve the system (e.g., change storage or packaging)","Reckless behavior; immediate corrective action","No action is needed because it was reported"],answer:1,aliases:[],rationale:"It was unintentional. The module says system improvements prevent recurrence.",whyNot:{0:"She made no risky choice. The packaging caused the slip.",2:"She did not knowingly ignore safety.",3:"The system should still be improved."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-164"},{unit:9,topic:"u9-reporting",type:"mcq",situational:!0,difficulty:2,stem:`A nurse skips checking the wristband because "I've cared for him for three days, I know him." Under Just Culture, what is this and the right response?`,options:["Human error; system redesign","No action because no harm occurred","At-risk behavior; coaching to reinforce protocols","Reckless behavior; termination"],answer:2,aliases:[],rationale:"Skipping a check by choice raises risk but is not meant to harm. This is the module's at-risk example.",whyNot:{0:"This was a choice, not an accidental slip.",1:"At-risk behavior still needs coaching.",3:"Reckless behavior knowingly disregards safety protocols with conscious risk. The module classifies this example as at-risk."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-165"},{unit:9,topic:"u9-reporting",type:"mcq",situational:!0,difficulty:2,stem:"A doctor in a rush knowingly skips sterile procedure during a central line insertion, risking infection. Under Just Culture, what is this?",options:["Reckless behavior that needs immediate corrective action","A near miss","At-risk behavior that needs coaching only","Human error that needs system improvement"],answer:0,aliases:[],rationale:"Knowingly disregarding safety protocols is reckless. This is the module's example.",whyNot:{1:"The risk was knowingly taken during an actual procedure.",2:"Knowingly risking harm goes beyond at-risk behavior.",3:"It was a conscious choice, not an accident."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-166"},{unit:9,topic:"u9-reporting",type:"mcq",situational:!1,difficulty:3,stem:"What is the goal of a just culture according to the module?",options:["Nobody is ever held accountable for anything","Staff feel safe to report errors and near misses without unjust punishment, while reckless behavior is still held accountable","Only mandatory reports are accepted","Every error leads to suspension"],answer:1,aliases:[],rationale:"Just culture balances learning with accountability.",whyNot:{0:"Reckless behavior is still held accountable.",2:"Voluntary reporting is also needed.",3:"That is a blame culture."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Reporting and Analyzing Errors",id:"U9-167"},{unit:10,topic:"u10-standard",type:"id",situational:!1,difficulty:1,stem:"A predetermined level of excellence that guides practice.",answer:"Standard",aliases:["standards"],rationale:"A standard is set in advance and guides practice.",mnemonic:"",note:"Source note: the Unit 10 PDF was not attached. This wording comes from the standard definition in Unit 9. Verify with the Unit 10 module.",sourceTag:"Unit 10 \u203A Standards of Nursing (definition, QA vs QI)",id:"U10-001"},{unit:10,topic:"u10-standard",type:"id",situational:!1,difficulty:2,stem:"Quality approach that monitors and evaluates compliance with standards. Give the abbreviation.",answer:"QA",aliases:["quality assurance"],rationale:"QA checks if care complies with existing standards.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing (definition, QA vs QI)",id:"U10-002"},{unit:10,topic:"u10-standard",type:"id",situational:!1,difficulty:2,stem:"Quality approach that is proactive, continuous, and data-driven, aiming to change and improve processes. Give the abbreviation.",answer:"QI",aliases:["quality improvement","CQI","continuous quality improvement"],rationale:"QI improves the system itself, not only checks compliance.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing (definition, QA vs QI)",id:"U10-003"},{unit:10,topic:"u10-standard",type:"mcq",situational:!0,difficulty:2,stem:"Every month the QA nurse audits the Medication Administration Records to check if the five rights were followed. Is this QA or QI?",options:["Quality improvement (QI)","Quality assurance (QA)","Benchmarking","Structure audit"],answer:1,aliases:[],rationale:"It monitors and evaluates compliance with an existing standard (the five rights). This is the outline's QA example.",whyNot:{0:"QI would change the process, for example by introducing an eMAR.",2:"Benchmarking compares with best practices of others.",3:"A structure audit checks resources, not records of medication rights."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing (definition, QA vs QI)",id:"U10-004"},{unit:10,topic:"u10-standard",type:"mcq",situational:!0,difficulty:2,stem:"After repeated medication errors, the hospital introduces an electronic MAR (eMAR), trains the staff on it, and reviews the medication protocol. Is this QA or QI?",options:["Quality assurance (QA)","Retrospective audit","Constructive discipline","Quality improvement (QI)"],answer:3,aliases:[],rationale:"It is a proactive, data-driven change to the process. This is the outline's QI example.",whyNot:{0:"QA only monitors compliance. Here the process itself was changed.",1:"An audit checks past care. Here a new system was introduced.",2:"Discipline addresses employee behavior, not system redesign."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing (definition, QA vs QI)",id:"U10-005"},{unit:10,topic:"u10-standard",type:"mcq",situational:!1,difficulty:2,stem:"Which statement correctly compares QA and QI?",options:["QA and QI are exactly the same","QA monitors compliance with standards; QI makes proactive, continuous, data-driven changes","QI only punishes employees who fail standards","QA is always done by the patient"],answer:1,aliases:[],rationale:"QA checks, QI improves.",whyNot:{0:"They have different focus.",2:"QI changes processes.",3:"QA is done by the organization."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing (definition, QA vs QI)",id:"U10-006"},{unit:10,topic:"u10-char",type:"id",situational:!1,difficulty:2,stem:"Characteristic of a standard: it must be set by a recognized body or institution.",answer:"Established by an authority",aliases:["established by authority","authority"],rationale:"Standards come from a recognized body, such as the Board of Nursing.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Characteristics",id:"U10-007"},{unit:10,topic:"u10-char",type:"mcq",situational:!1,difficulty:2,stem:"Which list gives the three characteristics of a standard?",options:["Self-determination, meaning, impact","Forewarning, consistency, impartiality","Predetermined, established by an authority, communicated and accepted","Optional, secret, and flexible"],answer:2,aliases:[],rationale:"These are the three characteristics.",whyNot:{0:"These are empowerment components.",1:"These are Hot Stove rules.",3:"Standards must be known and accepted."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Characteristics",id:"U10-008"},{unit:10,topic:"u10-practice",type:"id",situational:!1,difficulty:1,stem:"Republic Act known as the Philippine Nursing Act of 2002.",answer:"RA 9173",aliases:["9173","republic act 9173"],rationale:"RA 9173 is the Philippine Nursing Act of 2002.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Standards for Practice",id:"U10-009"},{unit:10,topic:"u10-practice",type:"mcq",situational:!1,difficulty:2,stem:"Which two serve as standards for nursing practice in the Philippines?",options:["The Labor Code and the Civil Code","The IPSGs and BARS","RA 9173 and the National Nursing Core Competency Standards","RA 9288 and RA 7600"],answer:2,aliases:[],rationale:"The outline names RA 9173 and the NNCCS.",whyNot:{0:"These govern employment and contracts.",1:"IPSGs are safety goals. BARS is an appraisal tool.",3:"These are the Newborn Screening Act and the Rooming-In Act."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Standards for Practice",id:"U10-010"},{unit:10,topic:"u10-scope",type:"id",situational:!1,difficulty:1,stem:"Article and section of RA 9173 that defines the scope of nursing.",answer:"Article IV Section 28",aliases:["Section 28","Art IV Sec 28","Sec 28","Art. IV, Sec. 28"],rationale:"The scope of nursing is in Article IV, Section 28 of RA 9173.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A RA 9173 Article IV Section 28",id:"U10-011"},{unit:10,topic:"u10-scope",type:"id",situational:!1,difficulty:2,stem:"Under Section 28, as INDEPENDENT practitioners, nurses are primarily responsible for promotion of health and prevention of ____.",answer:"Illness",aliases:["illness prevention","disease"],rationale:"Independent role: health promotion and illness prevention.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A RA 9173 Article IV Section 28",id:"U10-012"},{unit:10,topic:"u10-scope",type:"mcq",situational:!1,difficulty:2,stem:"According to Section 28, nurses render services to whom?",options:["Only hospitalized adults","Only private-sector clients","Individuals, families, and communities, in any health care setting","Only patients with a doctor's order"],answer:2,aliases:[],rationale:"The scope covers individuals, families, and communities in any setting.",whyNot:{0:"The scope covers all life stages and settings.",1:"Any health care setting is included.",3:"Nurses also act independently in health promotion."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A RA 9173 Article IV Section 28",id:"U10-013"},{unit:10,topic:"u10-scope",type:"mcq",situational:!0,difficulty:2,stem:"A community nurse in a barangay runs a nutrition class for mothers on her own initiative. Under Section 28, which role is she performing?",options:["Expert witness role","Medical coding role","Health team member role: curative care only","Independent practitioner role: health promotion and illness prevention"],answer:3,aliases:[],rationale:"As an independent practitioner, the nurse is primarily responsible for promoting health and preventing illness.",whyNot:{0:"That is a legal role in court.",1:"That is a BPO-related field.",2:"Curative care is done in collaboration. This is health promotion."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A RA 9173 Article IV Section 28",id:"U10-014"},{unit:10,topic:"u10-scope",type:"mcq",situational:!0,difficulty:2,stem:"A terminally ill patient will not recover. The nurse works with the team to relieve pain and support the family toward a peaceful death. Is this within the scope of nursing?",options:["No. End-of-life care belongs only to doctors.","Yes. Section 28 includes relief of suffering and a peaceful death when recovery is not possible.","Only if the family files a court order","No. Nursing only covers patients who can recover."],answer:1,aliases:[],rationale:"The scope includes alleviation of suffering and, when recovery is not possible, toward a peaceful death.",whyNot:{0:"Nurses collaborate in this care.",2:"No court order is needed for nursing care.",3:"Section 28 includes end-of-life care."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A RA 9173 Article IV Section 28",id:"U10-015"},{unit:10,topic:"u10-scope",type:"id",situational:!1,difficulty:2,stem:"As members of the health team, nurses collaborate for curative, preventive, and ____ aspects of care.",answer:"Rehabilitative",aliases:["rehabilitation"],rationale:"Health team role: curative, preventive, and rehabilitative care.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A RA 9173 Article IV Section 28",id:"U10-016"},{unit:10,topic:"u10-duties",type:"id",situational:!1,difficulty:2,stem:"Under duty (a), the nurse's use of her own personality and relationship as a tool for healing.",answer:"Therapeutic use of self",aliases:["therapeutic self"],rationale:"Therapeutic use of self is listed in duty (a) as part of nursing care.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-017"},{unit:10,topic:"u10-duties",type:"id",situational:!1,difficulty:2,stem:"Duty (a) lets nurses do internal examination during labor only in the absence of this condition.",answer:"Antenatal bleeding",aliases:["bleeding"],rationale:"Internal examination during labor is allowed when there is no antenatal bleeding.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-018"},{unit:10,topic:"u10-duties",type:"id",situational:!1,difficulty:3,stem:"Under duty (a), what does the nurse need before suturing a perineal laceration?",answer:"Special training",aliases:["training"],rationale:"Suturing perineal laceration requires special training.",mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-019"},{unit:10,topic:"u10-duties",type:"mcq",situational:!1,difficulty:2,stem:"Which is part of duty (a) of Section 28?",options:["Establishing linkages with community resources","Providing health education","Providing nursing care through the nursing process, including written prescriptions (oral, topical, parenteral)","Undertaking human resource development training and research"],answer:2,aliases:[],rationale:"Duty (a) covers nursing care via the nursing process, including administering written prescriptions.",whyNot:{0:"That is duty (b).",1:"That is duty (c).",3:"That is duty (e)."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-020"},{unit:10,topic:"u10-duties",type:"mcq",situational:!0,difficulty:3,stem:"A nurse in a lying-in clinic wants to do an internal exam on a laboring mother who has vaginal bleeding before delivery. Under duty (a), what should she do?",options:["Not perform it, because internal examination is allowed only in the absence of antenatal bleeding","Suture the cervix first","Perform it only with a relative's permission","Perform it, because nurses can always do internal exams"],answer:0,aliases:[],rationale:"The scope allows internal examination during labor only when there is no antenatal bleeding.",whyNot:{1:"Suturing is for perineal laceration with special training.",2:"Permission does not change the scope limit.",3:"The condition (no antenatal bleeding) must be met."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-021"},{unit:10,topic:"u10-duties",type:"mcq",situational:!0,difficulty:2,stem:"A public health nurse connects a TB patient with the barangay health center and a local NGO that provides free transport for check-ups. Which duty is this?",options:["Duty (a): nursing care","Duty (b): establish linkages with community resources and coordinate with the health team","Duty (d): teaching students","Duty (e): research"],answer:1,aliases:[],rationale:"Linking with community resources is duty (b).",whyNot:{0:"The main action is linking to resources, not direct care.",2:"No students are involved.",3:"This is not research."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties",id:"U10-022"},{unit:10,topic:"u10-duties",type:"mcq",situational:!0,difficulty:1,stem:"A nurse teaches a newly diagnosed diabetic how to check his blood sugar and plan meals. Which duty is this?",options:["Duty (c): provide health education","Duty (d): teach and supervise students","Duty (b): linkages with community resources","Duty (e): human resource development"],answer:0,aliases:[],rationale:"Teaching patients about their health is duty (c).",whyNot:{1:"The learner is a patient, not a nursing student.",2:"No referral is made.",3:"That is staff training and research."},mnemonic:"",note:"",sourceTag:"Unit 10 \u203A Standards of Nursing \u203A Section 28 Duties
