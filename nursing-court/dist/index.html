ies \u203A Articles 83 to 95",id:"U12-070"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Labor Code article saying undertime cannot be offset by overtime.",answer:"Article 88",aliases:["Art 88","88"],rationale:"Article 88 = undertime not offset by overtime.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-071"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Labor Code article on holiday pay.",answer:"Article 94",aliases:["Art 94","94"],rationale:"Article 94 = holiday pay.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-072"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Labor Code article on service incentive leave.",answer:"Article 95",aliases:["Art 95","95"],rationale:"Article 95 = service incentive leave.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-073"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:3,stem:"Labor Code article that defines what counts as hours worked.",answer:"Article 84",aliases:["Art 84","84"],rationale:"Article 84 = hours worked.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-074"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Minimum additional pay for every hour of night work under Article 86 (percent).",answer:"10%",aliases:["10","ten percent","10 percent"],rationale:"Night shift differential is at least 10% more per hour.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-075"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Minimum overtime premium on the hourly rate under Article 87 (percent).",answer:"25%",aliases:["25","twenty-five percent","25 percent"],rationale:"Overtime is at least 25% more than the hourly rate.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-076"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Number of days of service incentive leave with pay per year under Article 95.",answer:"5",aliases:["five","5 days","five days"],rationale:"After at least one year of service, the employee gets 5 days SIL with pay.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-077"},{unit:12,topic:"u12-articles",type:"mcq",situational:!1,difficulty:2,stem:"Under Article 86, night shift differential covers work between which hours?",options:["10:00 PM and 6:00 AM","11:00 PM and 7:00 AM","6:00 PM and 6:00 AM","12:00 AM and 8:00 AM"],answer:0,aliases:[],rationale:"Article 86 covers 10 PM to 6 AM.",whyNot:{1:"The module says 10 PM to 6 AM.",2:"The module says 10 PM to 6 AM.",3:"The module says 10 PM to 6 AM."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-078"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:2,stem:"Public health nurses in a city of 1.5 million people ask about their work hours. Under Article 83, what applies?",options:["8 hours a day, 7 days a week","No fixed hours, because health work is an emergency service","12 hours a day for 3 days a week only","8 hours a day for 5 days a week, or 40 hours a week, with additional pay beyond that"],answer:3,aliases:[],rationale:"Article 83 sets this for health personnel in cities or municipalities with 1 million+ population.",whyNot:{0:"Article 83 limits them to 5 days or 40 hours.",1:"Article 83 sets fixed hours.",2:"Not in Article 83."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-079"},{unit:12,topic:"u12-articles",type:"mcq",situational:!1,difficulty:3,stem:"Under Article 83, the 40-hour/5-day rule applies to health personnel in cities or municipalities with a population of at least:",options:["10 million","500,000","1 million","100,000"],answer:2,aliases:[],rationale:"The module says 1 million or more.",whyNot:{0:"The module says 1 million.",1:"The module says 1 million.",3:"The module says 1 million."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-080"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:2,stem:"During her 8-hour shift, a nurse takes a 10-minute coffee break, but the head nurse requires her to stay on the floor and answer call lights. Under Article 84, does the break count as hours worked?",options:["Yes. Short rest breaks controlled by the employer count as hours worked.","No. Breaks never count as hours worked.","Only if she was eating.","Only if the break is longer than 1 hour."],answer:0,aliases:[],rationale:"Article 84 includes short employer-controlled breaks.",whyNot:{1:"Article 84 says short breaks controlled by the employer do count.",2:"Eating is not the test. Employer control is.",3:"Article 84 talks about short breaks."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-081"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:2,stem:"A nurse's hourly rate is \u20B1200. She works 2 hours of ordinary-day overtime. Under Article 87, what is the MINIMUM she should be paid for those 2 hours?",options:["\u20B1400 (no premium)","\u20B1440 (10% premium)","\u20B1800 (100% premium)","\u20B1500 (\u20B1250 per hour, a 25% premium)"],answer:3,aliases:[],rationale:"At least 25% premium: \u20B1200 x 1.25 = \u20B1250 per hour, so \u20B1500 for 2 hours.",whyNot:{0:"Overtime must have at least 25% premium.",1:"10% is the night shift differential.",2:"The minimum ordinary-day premium is 25%."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-082"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:2,stem:`A nurse left 2 hours early on Monday. On Tuesday, she worked 2 hours overtime. The hospital says the overtime "cancels out" Monday's undertime, so no overtime pay. What does the Labor Code say?`,options:["This is allowed only for night shift.","This is not allowed. Under Article 88, undertime cannot be offset by overtime.","This is allowed under Article 87.","This is allowed if the nurse agrees verbally."],answer:1,aliases:[],rationale:"She must still get overtime pay for Tuesday.",whyNot:{0:"Article 88 applies to all shifts.",2:"Article 87 sets the overtime premium. It does not allow offsetting.",3:"Article 88 does not allow offsetting."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-083"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:2,stem:"It is a regular holiday and the nurse is NOT scheduled to work. Under Article 94, how much does she get?",options:["200% of her daily wage","100% of her daily wage","260% of her daily wage","Nothing, because she did not work"],answer:1,aliases:[],rationale:"On regular holidays, employees get 100% even if not working.",whyNot:{0:"200% is for working on the holiday.",2:"260% is for working on a holiday that falls on a rest day.",3:"Article 94 gives 100% even without work."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-084"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:2,stem:"A nurse works on Independence Day (June 12), a regular holiday that is NOT her rest day. Under Article 94, how much does she get for that day?",options:["200% of her daily wage","125% of her daily wage","260% of her daily wage","100% of her daily wage"],answer:0,aliases:[],rationale:"Working on a regular holiday = 200%.",whyNot:{1:"That is not the holiday rate in the module.",2:"260% is when the holiday also falls on her rest day.",3:"100% is for not working on the holiday."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-085"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:3,stem:"A nurse's rest day is Sunday. Rizal Day (December 30) falls on Sunday, and she is called in to work. Under Article 94, how much does she get?",options:["260% of her daily wage","130% of her daily wage","200% of her daily wage","100% of her daily wage"],answer:0,aliases:[],rationale:"Working on a regular holiday that falls on the rest day = 260%.",whyNot:{1:"Not the rate given in the module for this case.",2:"200% is for a holiday that is not her rest day.",3:"100% is for not working."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-086"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:2,stem:"Under Article 94, pay rate if the employee works on a regular holiday that falls on her rest day (percent).",answer:"260%",aliases:["260","260 percent"],rationale:"Holiday + rest day + worked = 260%.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-087"},{unit:12,topic:"u12-articles",type:"mcq",situational:!1,difficulty:2,stem:"Which of these is listed as a regular holiday in the module's Article 94?",options:["The first of September","The fourteenth of February","The twelfth of June","The twenty-fourth of December"],answer:2,aliases:[],rationale:"June 12 is in the list.",whyNot:{0:"Not in the list.",1:"Not in the list.",3:"Not in the list. December 25, 30, and 31 are listed."},mnemonic:"",note:"Source note: the module's holiday list reads: New Year's Day, Maundy Thursday, Good Friday, the ninth of April, the first of May, the twelfth of June, last Sunday of August, first of November, the thirtieth of November, the twenty-fifth and the thirtieth of December, thirty-first of December, and the day designated by law for a general election. Questions use this list as written.",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-088"},{unit:12,topic:"u12-articles",type:"id",situational:!1,difficulty:3,stem:"Under the module's Article 94 list, which day in August is a regular holiday?",answer:"Last Sunday of August",aliases:["last Sunday","National Heroes Day"],rationale:"The module lists the last Sunday of August.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-089"},{unit:12,topic:"u12-articles",type:"mcq",situational:!0,difficulty:2,stem:"A nurse has worked at a private hospital for 14 months. She has not used any leave this year. Under Article 95, what is she entitled to?",options:["5 days of service incentive leave with pay; unused leave is converted to cash","5 days leave that are forfeited if unused","15 days of vacation leave by law","Nothing until she has worked 5 years"],answer:0,aliases:[],rationale:"After at least 1 year: 5 days SIL; unused SIL must be converted to cash.",whyNot:{1:"Unused SIL must be converted to cash.",2:"The Labor Code SIL in the module is 5 days.",3:"The requirement is at least 1 year."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-090"},{unit:12,topic:"u12-articles",type:"mcq",situational:!1,difficulty:2,stem:"Under Article 95, how may service incentive leave be used?",options:["Only for maternity leave","Only after retirement","Only for union activities","For vacation or sick leave"],answer:3,aliases:[],rationale:"The module says SIL may be used for vacation or sick leave.",whyNot:{0:"Not stated.",1:"Not stated.",2:"Not stated."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-091"},{unit:12,topic:"u12-articles",type:"mcq",situational:!1,difficulty:2,stem:"Under Article 87, if overtime is done on a rest day or holiday, what is the premium?",options:["No premium at all","Higher, usually 30% or more depending on the day","Exactly 10%","Lower than on an ordinary day"],answer:1,aliases:[],rationale:"The module says the premium is higher, usually 30%+.",whyNot:{0:"Overtime always has a premium.",2:"10% is the night shift differential.",3:"It is higher."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Articles 83 to 95",id:"U12-092"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Law that governs work contracts in the Philippines (give the RA number of the Civil Code).",answer:"RA 386",aliases:["386","Civil Code","Civil Code of the Philippines"],rationale:"The Civil Code of the Philippines is RA 386.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-093"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Civil Code article defining a contract as a meeting of the minds between two or more persons.",answer:"Article 1305",aliases:["Art 1305","1305"],rationale:"Article 1305 defines a contract.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-094"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:'A contract is a "meeting of the ____" between two or more persons.',answer:"Minds",aliases:["the minds"],rationale:"A contract is a meeting of the minds.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-095"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Civil Code article listing the key elements of a contract: consent, object, and cause.",answer:"Article 1318",aliases:["Art 1318","1318"],rationale:"Article 1318 lists consent, object, and cause.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-096"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Civil Code article on freedom to contract.",answer:"Article 1306",aliases:["Art 1306","1306"],rationale:"Article 1306 = freedom to contract within law, morals, and public policy.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-097"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Element of a contract: both parties must voluntarily agree to the terms.",answer:"Consent",aliases:[],rationale:"Consent = voluntary agreement.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-098"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Element of a contract: it must have a legal reason, like employment compensation.",answer:"Cause",aliases:[],rationale:"Cause = the legal reason for the contract.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-099"},{unit:12,topic:"u12-contract",type:"mcq",situational:!1,difficulty:2,stem:"Under Article 1318, which element means the contract must specify lawful work or duties?",options:["Consent","Damages","Object","Cause"],answer:2,aliases:[],rationale:"Object = lawful work or duties.",whyNot:{0:"Consent = voluntary agreement.",1:"Damages are a remedy for breach.",3:"Cause = the legal reason, such as compensation."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-100"},{unit:12,topic:"u12-contract",type:"mcq",situational:!0,difficulty:2,stem:"A hospital's contract says nurses will be paid below the minimum wage, and the nurse signs it. Is this term valid?",options:["Yes, under Article 1318","No. Under Article 1306, terms cannot conflict with law, so wages below minimum are not allowed.","Yes, if the hospital is private","Yes, because the nurse signed it"],answer:1,aliases:[],rationale:"Freedom to contract has limits: law, morals, and public policy.",whyNot:{0:"Article 1318 lists elements. It does not allow illegal terms.",2:"Private hospitals must also follow the law.",3:"Signing does not make an illegal term valid."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-101"},{unit:12,topic:"u12-contract",type:"mcq",situational:!0,difficulty:2,stem:"A hospital stops paying a nurse's salary for two months. What is this?",options:["Force majeure","An authorized cause for termination","Employee breach of contract","Employer breach of contract"],answer:3,aliases:[],rationale:"Failure to pay salary is the module's example of employer breach.",whyNot:{0:"Not paying salary is not an act of God.",1:"Authorized causes are economic reasons, downsizing, or redundancy.",2:"The nurse did nothing wrong."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-102"},{unit:12,topic:"u12-contract",type:"mcq",situational:!0,difficulty:2,stem:"A nurse stops coming to work without any valid reason and leaves her patients unattended. What is this?",options:["Completion of employment period","Employee breach of contract","Employer breach","Mutual consent termination"],answer:1,aliases:[],rationale:"Failing to fulfill duties without valid reason is employee breach.",whyNot:{0:"Her contract did not end.",2:"The hospital did nothing wrong.",3:"There was no agreement."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-103"},{unit:12,topic:"u12-contract",type:"mcq",situational:!0,difficulty:2,stem:"A nurse is fired without valid cause. What remedy does the module mention?",options:["She can only file a complaint with the BON","She has no remedy if the hospital is private","She may claim back pay or reinstatement","She must pay the hospital damages"],answer:2,aliases:[],rationale:"The module's example: back pay or reinstatement.",whyNot:{0:"The remedy is through the Civil Code and labor laws.",1:"The Civil Code and labor laws give remedies.",3:"She is the injured party."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-104"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Grounds for termination such as economic reasons, downsizing, and redundancy.",answer:"Authorized causes",aliases:["authorized cause","authorized"],rationale:"Authorized causes are business reasons, not the employee's fault.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-105"},{unit:12,topic:"u12-contract",type:"id",situational:!1,difficulty:2,stem:"Grounds for termination such as misconduct, neglect of duty, and dishonesty.",answer:"Just causes",aliases:["just cause","just"],rationale:"Just causes come from the employee's own wrongdoing.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-106"},{unit:12,topic:"u12-contract",type:"mcq",situational:!0,difficulty:3,stem:"A private hospital closes its pediatric ward due to financial losses and lays off the pedia nurses. What ground for termination is this?",options:["Just cause","Employee breach","Authorized cause","Mutual consent"],answer:2,aliases:[],rationale:"Economic reasons and downsizing are authorized causes.",whyNot:{0:"Just causes are the employee's misconduct, neglect, or dishonesty.",1:"The nurses did nothing wrong.",3:"The nurses did not agree to leave."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-107"},{unit:12,topic:"u12-contract",type:"mcq",situational:!0,difficulty:2,stem:"A nurse is caught falsifying her time records repeatedly. The hospital terminates her. What ground is this?",options:["Authorized cause","Just cause (dishonesty)","Force majeure","Completion of contract"],answer:1,aliases:[],rationale:"Dishonesty is a just cause.",whyNot:{0:"Authorized causes are economic reasons, downsizing, redundancy.",2:"This is not an act of God.",3:"Her contract did not end."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-108"},{unit:12,topic:"u12-contract",type:"mcq",situational:!1,difficulty:2,stem:"Which is NOT one of the ways a contract may be terminated, according to the module?",options:["Mutual consent","Completion of the employment period","Breach of contract","Verbal order of a co-worker"],answer:3,aliases:[],rationale:"The module lists mutual consent, completion of the employment period, or breach.",whyNot:{0:"Listed.",1:"Listed.",2:"Listed."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-109"},{unit:12,topic:"u12-contract",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, what are the employer's obligations in an employment contract?",options:["Pay salary, ensure safe working conditions, respect employee rights under labor laws","Choose the employee's religion","Train employees to become doctors","Perform duties with diligence and integrity"],answer:0,aliases:[],rationale:"These are the employer's listed obligations.",whyNot:{1:"Discrimination is prohibited.",2:"Not an obligation.",3:"That is the employee's obligation."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Contract",id:"U12-110"},{unit:12,topic:"u12-union",type:"id",situational:!1,difficulty:2,stem:"Process of negotiation between employers and a group of employees (usually a union) to set conditions, wages, benefits, and other terms.",answer:"Collective bargaining",aliases:[],rationale:"Collective bargaining gives employees a voice in their workplace.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-111"},{unit:12,topic:"u12-union",type:"id",situational:!1,difficulty:2,stem:"Organization formed by employees in an industry or sector to collectively negotiate with the employer.",answer:"Labor union",aliases:["union","labor unions"],rationale:"A labor union gives employees a unified voice.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-112"},{unit:12,topic:"u12-union",type:"id",situational:!1,difficulty:2,stem:"Labor Code article granting the right to self-organization.",answer:"Article 243",aliases:["Art 243","243"],rationale:"Article 243 = right to form, join, or assist unions.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-113"},{unit:12,topic:"u12-union",type:"id",situational:!1,difficulty:2,stem:"Labor Code article on the duty to bargain in good faith.",answer:"Article 252",aliases:["Art 252","252"],rationale:"Article 252 = duty to bargain in good faith.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-114"},{unit:12,topic:"u12-union",type:"id",situational:!1,difficulty:3,stem:"Labor Code articles on forming and registering labor unions with DOLE.",answer:"Articles 234 and 235",aliases:["234 and 235","Art 234 and 235","234-235"],rationale:"Articles 234 and 235 cover forming and registering unions.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-115"},{unit:12,topic:"u12-union",type:"id",situational:!1,difficulty:2,stem:"Labor Code article listing unfair labor practices of EMPLOYERS.",answer:"Article 248",aliases:["Art 248","248"],rationale:"Article 248 = employer unfair labor practices.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-116"},{unit:12,topic:"u12-union",type:"id",situational:!1,difficulty:2,stem:"Labor Code article listing unfair labor practices of UNIONS.",answer:"Article 249",aliases:["Art 249","249"],rationale:"Article 249 = union unfair labor practices.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-117"},{unit:12,topic:"u12-union",type:"mcq",situational:!0,difficulty:2,stem:"Hospital management threatens to fire nurses who join the new union and refuses to meet the recognized union. Which article lists these as unfair labor practices?",options:["Article 249","Article 248 (unfair labor practices of employers)","Article 243","Article 95"],answer:1,aliases:[],rationale:"Interfering with union activities, discrimination, and refusing to bargain are employer ULPs.",whyNot:{0:"That is for union ULPs.",2:"That grants the right to self-organize.",3:"That is service incentive leave."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-118"},{unit:12,topic:"u12-union",type:"mcq",situational:!0,difficulty:2,stem:"A nurses' union pressures and insults nurses who refuse to join, and blocks them from shift swaps. What is this?",options:["The right to self-organization (Article 243)","An unfair labor practice by the employer (Article 248)","Mobbing only, with no labor law issue","An unfair labor practice by the union (Article 249)"],answer:3,aliases:[],rationale:"Coercion or discrimination against non-union members is a union ULP.",whyNot:{0:"Self-organization does not allow coercion.",1:"The union, not the employer, did this.",2:"The module classifies this as a union unfair labor practice."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-119"},{unit:12,topic:"u12-union",type:"mcq",situational:!0,difficulty:2,stem:"A group of staff nurses wants their union to be legally recognized so it can represent them in bargaining. What must they do?",options:["Register it with the PRC","Register it with PhilHealth","Get approval from the hospital owner","Meet the requirements and register the union with DOLE (Articles 234 and 235)"],answer:3,aliases:[],rationale:"Registration with DOLE gives legal standing.",whyNot:{0:"The PRC regulates professions, not unions.",1:"PhilHealth is the national insurer.",2:"Recognition comes from DOLE registration."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-120"},{unit:12,topic:"u12-union",type:"mcq",situational:!1,difficulty:2,stem:"Under Article 252, what must both the employer and the recognized bargaining representative do?",options:["Let the employer decide everything alone","Meet and negotiate in good faith to reach an agreement on wages, hours, and working conditions","Submit all disputes to the BON","Avoid meeting until a strike happens"],answer:1,aliases:[],rationale:"This is the duty to bargain in good faith.",whyNot:{0:"Bargaining is mutual.",2:"The BON regulates nursing practice.",3:"Good faith requires meeting."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-121"},{unit:12,topic:"u12-union",type:"mcq",situational:!1,difficulty:2,stem:"Under PD 442, collective bargaining in the Philippines is:",options:["Illegal for nurses","Protected and regulated under the Labor Code","Allowed only in government hospitals","Regulated only by the Civil Code"],answer:1,aliases:[],rationale:"The module says collective bargaining is protected and regulated under PD 442.",whyNot:{0:"Healthcare workers have the right to organize (Art. 243).",2:"The module does not say this.",3:"The module says the Labor Code."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Collective Bargaining / Labor Union",id:"U12-122"},{unit:12,topic:"u12-negligence",type:"id",situational:!1,difficulty:1,stem:"Commission or omission of an act, pursuant to a duty, that a reasonably prudent person would or would not do, which is the proximate cause of injury to another.",answer:"Negligence",aliases:["professional negligence"],rationale:"Negligence = failing to act as a reasonable person would, causing injury.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-123"},{unit:12,topic:"u12-negligence",type:"id",situational:!1,difficulty:2,stem:"Element of negligence: harm resulting from failure to meet the standard could have been predicted.",answer:"Foreseeability",aliases:["foreseeability of harm"],rationale:"Foreseeability means a reasonable nurse could predict the harm.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-124"},{unit:12,topic:"u12-negligence",type:"id",situational:!1,difficulty:2,stem:"Element of negligence: the person charged had this, requiring due care under the circumstances.",answer:"Duty",aliases:["existence of a duty"],rationale:"Element 1 is the existence of a duty.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-125"},{unit:12,topic:"u12-negligence",type:"mcq",situational:!1,difficulty:2,stem:"Which list gives the four elements of professional negligence in the module?",options:["Duty, failure to meet the standard of due care, foreseeability of harm, injury resulting from the breach","Criminal act, criminal intent, conspiracy, motive","Consent, object, cause, damages","Forewarning, immediacy, consistency, impartiality"],answer:0,aliases:[],rationale:"These are the four elements.",whyNot:{1:"These relate to crime.",2:"Consent, object, and cause are contract elements.",3:"These are Hot Stove rules."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-126"},{unit:12,topic:"u12-negligence",type:"mcq",situational:!0,difficulty:2,stem:"A nurse applies a hot water bag to an unconscious patient without checking the temperature, and the patient gets a burn. What is this?",options:["Defamation","Professional negligence","Battery","Force majeure"],answer:1,aliases:[],rationale:"Burns from hot water bags are a common act of negligence listed in the module.",whyNot:{0:"Defamation is false statements.",2:"Battery is intentional unconsented touching. This was a failure of due care.",3:"The burn was preventable."},mnemonic:"",note:'Source note: the module says "hot water bugs". It most likely means "hot water bags".',sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-127"},{unit:12,topic:"u12-negligence",type:"mcq",situational:!0,difficulty:2,stem:"A nurse notices that the toes of a patient in a leg cast are cyanotic and cold, but she does not report it. The leg becomes gangrenous and is amputated below the knee. What did the court find?",options:["Only the physician was liable","The nurse was negligent for failing to report to the physician and hospital authorities","No one was liable because gangrene is natural","It was force majeure"],answer:1,aliases:[],rationale:"This is the module's example of failure to report observations.",whyNot:{0:"The nurse failed in her duty to report.",2:"The court found the nurse negligent.",3:"It was preventable."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-128"},{unit:12,topic:"u12-negligence",type:"mcq",situational:!0,difficulty:2,stem:"After surgery, a sponge is found inside a patient's abdomen. Which common act of negligence is this?",options:["Falls","Failure to report observations","Burns from heat lamps","Objects left inside the patient's body"],answer:3,aliases:[],rationale:"The module lists sponges, suction tips, and loose dentures in the trachea.",whyNot:{0:"No fall happened.",1:"The issue is a retained object.",2:"No burn is involved."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-129"},{unit:12,topic:"u12-negligence",type:"mcq",situational:!0,difficulty:2,stem:"A sedated elderly patient falls from bed because the side rails were left down. Is the nurse liable?",options:["No. Only the doctor is responsible for falls.","Yes. Falls of sedated or elderly patients when side rails are not raised are a common act of negligence.","No. It is force majeure.","No. Falls are always accidents."],answer:1,aliases:[],rationale:"The module lists falls of elderly, confused, unconscious, and sedated patients.",whyNot:{0:"Nurses are responsible for fall prevention.",2:"A fall from unrailed bed is not an act of God.",3:"Preventable falls are negligence."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-130"},{unit:12,topic:"u12-negligence",type:"mcq",situational:!1,difficulty:3,stem:'Which element of negligence is the "proximate cause" link?',options:["Foreseeability of harm","The existence of a duty","Failure to meet the standard","The breach of the standard resulted in injury to the plaintiff"],answer:3,aliases:[],rationale:"The fourth element links the breach to the injury.",whyNot:{0:"Foreseeability is about predicting harm.",1:"Duty is element 1.",2:"That is the breach itself."},mnemonic:"",note:`Source note: the module's malpractice section says "The chorus showing a breach of professional duty". It most likely means "the element showing a breach". Please verify.`,sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Professional Negligence",id:"U12-131"},{unit:12,topic:"u12-doctrines",type:"id",situational:!1,difficulty:2,stem:'Legal doctrine meaning "the thing speaks for itself."',answer:"Res ipsa loquitur",aliases:[],rationale:"The injury itself shows negligence, so no further proof is needed.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Legal Terminologies",id:"U12-132"},{unit:12,topic:"u12-doctrines",type:"id",situational:!1,difficulty:2,stem:'Legal doctrine meaning "let the master answer."',answer:"Respondeat superior",aliases:[],rationale:"The employer answers for the employee's negligent acts within the scope of employment.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Legal Terminologies",id:"U12-133"},{unit:12,topic:"u12-doctrines",type:"id",situational:!1,difficulty:2,stem:'Legal doctrine meaning "an act of God."',answer:"Force majeure",aliases:[],rationale:"Force majeure = an unavoidable event like a disaster or pandemic.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Legal Terminologies",id:"U12-134"},{unit:12,topic:"u12-doctrines",type:"mcq",situational:!0,difficulty:2,stem:"A patient walks into the OPD for an injection. After the nurse injects his buttock, he has extreme pain, his leg weakens, and he becomes paralyzed from sciatic nerve injury. Which doctrine lets the court presume negligence?",options:["Privileged communication","Res ipsa loquitur","Respondeat superior","Force majeure"],answer:1,aliases:[],rationale:`"The thing speaks for itself": this injury normally does not happen without negligence. This is the module's example.`,whyNot:{0:"That is about confidentiality.",2:"That makes the employer answer for the employee.",3:"That is an unavoidable act of God."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Legal Terminologies",id:"U12-135"},{unit:12,topic:"u12-doctrines",type:"mcq",situational:!0,difficulty:2,stem:"A staff nurse is sued for a medication error made during her shift. The patient also sues the hospital, as her employer. Which doctrine allows suing the hospital?",options:["Res ipsa loquitur","Force majeure","Respondeat superior","Moral turpitude"],answer:2,aliases:[],rationale:"The employer answers for negligent acts of employees within the scope of employment.",whyNot:{0:"That is about the injury proving negligence.",1:"There is no act of God.",3:"That is about base, vile acts."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Legal Terminologies",id:"U12-136"},{unit:12,topic:"u12-doctrines",type:"mcq",situational:!0,difficulty:2,stem:"A strong typhoon floods the hospital and cuts power. The nurse cannot give scheduled nebulizations because all machines are down. Which doctrine may excuse her?",options:["Respondeat superior","Res ipsa loquitur","Assault","Force majeure"],answer:3,aliases:[],rationale:"An unavoidable event like a natural disaster prevented her from fulfilling the duty.",whyNot:{0:"That puts liability on the employer.",1:"That presumes negligence.",2:"Assault is causing fear of harm."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Legal Terminologies",id:"U12-137"},{unit:12,topic:"u12-doctrines",type:"mcq",situational:!1,difficulty:3,stem:"For respondeat superior to apply, the employee's negligent act must occur:",options:["Only if the employee is a student","Outside working hours","Only during a natural disaster","Within the scope of employment"],answer:3,aliases:[],rationale:"The module says the doctrine applies when acts occur within the scope of employment.",whyNot:{0:"Not a condition in the module.",1:"Acts outside employment are not covered.",2:"That relates to force majeure."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Legal Terminologies",id:"U12-138"},{unit:12,topic:"u12-incompetence",type:"id",situational:!1,difficulty:2,stem:"Lack of ability or legal qualifications, being unfit to discharge the required duty.",answer:"Incompetence",aliases:["incompetency"],rationale:"Incompetence can lead to revocation or suspension of the certificate of registration.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Incompetence / Malpractice",id:"U12-139"},{unit:12,topic:"u12-incompetence",type:"id",situational:!1,difficulty:2,stem:"Specific type of professional negligence where a licensed professional knew or should have known their actions would likely harm the patient.",answer:"Malpractice",aliases:[],rationale:'Malpractice adds the "knew or should have known" element and often recklessness.',mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Incompetence / Malpractice",id:"U12-140"},{unit:12,topic:"u12-incompetence",type:"mcq",situational:!0,difficulty:2,stem:"A surgeon operates while drunk, makes a surgical error, and harms the patient. What is this?",options:["Force majeure","Simple incivility","Assault","Malpractice"],answer:3,aliases:[],rationale:"This is the module's malpractice example: a licensed professional who knew or should have known the risk, with recklessness.",whyNot:{0:"It was not unavoidable.",1:"This is a legal wrong, not just rudeness.",2:"Assault is fear of harm without contact."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Incompetence / Malpractice",id:"U12-141"},{unit:12,topic:"u12-incompetence",type:"mcq",situational:!1,difficulty:2,stem:"What can happen to a registered nurse who manifests incompetence in her duties?",options:["She automatically becomes a nurse educator","Her certificate of registration may be revoked or suspended","Nothing, because she is already registered","Her employer must give her a promotion"],answer:1,aliases:[],rationale:"The module says incompetence is ground for revocation or suspension.",whyNot:{0:"Not a consequence.",2:"Registration does not protect incompetence.",3:"Not a consequence."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Incompetence / Malpractice",id:"U12-142"},{unit:12,topic:"u12-incompetence",type:"mcq",situational:!1,difficulty:3,stem:"How does malpractice differ from ordinary negligence in the module?",options:["Negligence only applies to doctors","Malpractice involves a licensed professional who knew or should have known the action would likely harm, often with recklessness","They are identical terms","Malpractice never causes harm"],answer:1,aliases:[],rationale:"The added knowledge and recklessness separate malpractice.",whyNot:{0:"Negligence applies to anyone with a duty.",2:"The module treats malpractice as a specific type of negligence.",3:"Malpractice results in harm."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Incompetence / Malpractice",id:"U12-143"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:1,stem:"A legal wrong against a person or property, independent of a contract, making the wrongdoer liable for damages in a civil action.",answer:"Tort",aliases:["torts"],rationale:"A tort leads to civil liability for damages.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-144"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:2,stem:"Deliberate acts that violate an individual's rights, leading to civil liability.",answer:"Intentional torts",aliases:["intentional tort"],rationale:"Intentional torts are deliberate, unlike negligence.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-145"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:1,stem:"Conduct that creates fear or reasonable apprehension of harm without actual physical contact.",answer:"Assault",aliases:[],rationale:"Assault = threat, no touch.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-146"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:1,stem:"Intentional, unconsented touching of another person.",answer:"Battery",aliases:[],rationale:"Battery = actual touching without consent.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-147"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:2,stem:"Restricting a person's freedom to move without legal justification. Also called illegal detention.",answer:"False imprisonment",aliases:["illegal detention"],rationale:"Holding a patient against his will or using unauthorized restraints is false imprisonment.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-148"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:2,stem:"Communicating false information about someone to a third party, damaging their reputation.",answer:"Defamation",aliases:[],rationale:"Defamation needs a third person.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-149"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:2,stem:"Written, printed, or broadcast defamation.",answer:"Libel",aliases:[],rationale:"Libel = written or broadcast.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-150"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:2,stem:"Spoken defamation.",answer:"Slander",aliases:[],rationale:"Slander = spoken.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-151"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:"An irritated nurse raises her hand at a confused patient, and the patient believes he will be hit. No contact is made. What is this?",options:["False imprisonment","Slander","Assault","Battery"],answer:2,aliases:[],rationale:"Creating fear of harm without contact is assault. This is the module's example.",whyNot:{0:"The patient was not restrained.",1:"Nothing false was said about him.",3:"Battery needs actual touching."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-152"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:"A patient clearly refuses an IM injection, but the nurse gives it anyway. What is this?",options:["Assault","Battery","Defamation","Force majeure"],answer:1,aliases:[],rationale:"Giving treatment despite refusal is battery.",whyNot:{0:"There was actual touching, so it goes beyond assault.",2:"No false statement was made.",3:"There is no act of God."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-153"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:"A nurse inserts an indwelling catheter without explaining or getting the patient's consent. What legal wrong is this?",options:["Assault","Battery","Libel","Respondeat superior"],answer:1,aliases:[],rationale:"Performing a procedure without consent makes one liable for battery.",whyNot:{0:"There was actual contact.",2:"Nothing was written.",3:"That is a doctrine about employer liability."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-154"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:"A patient wants to go home against medical advice. The nurse locks the door and says he cannot leave until the doctor arrives. What legal wrong is this?",options:["Battery","Assault","Invasion of privacy","False imprisonment"],answer:3,aliases:[],rationale:"Keeping a patient who wants to leave AMA restricts his movement without legal justification.",whyNot:{0:"No unconsented touching is described.",1:"The issue is restricting movement.",2:"No private information was disclosed."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-155"},{unit:12,topic:"u12-torts",type:"mcq",situational:!1,difficulty:2,stem:"A patient insists on leaving against medical advice. What protects the staff from legal liability, according to the module?",options:["Restraining the patient until he changes his mind","Calling the police to detain him","Hiding his clothes","Explaining the risks, documenting, and having the patient sign a release form"],answer:3,aliases:[],rationale:"The module says to explain risks, document, and get a signed release.",whyNot:{0:"That is false imprisonment.",1:"That is not what the module advises.",2:"That restricts movement unlawfully."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-156"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:"A nurse posts a photo of a newborn with a congenital malformation on social media without the parents' consent. What legal wrong is this?",options:["Malpractice","Invasion of the right to privacy","Battery","Slander"],answer:1,aliases:[],rationale:"Publishing a picture of a malformed baby without parental consent is a module example.",whyNot:{0:"The wrong is about privacy, not standard of care.",2:"No touching is involved.",3:"Nothing was spoken."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-157"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:"In the hospital elevator, two nurses loudly discuss a VIP patient's HIV status while visitors listen. What is this?",options:["Libel","Force majeure","Assault","Breach of confidentiality / invasion of privacy"],answer:3,aliases:[],rationale:"Discussing a patient's condition in a public space is a module example.",whyNot:{0:"Nothing was written.",1:"Not an act of God.",2:"No threat of harm."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-158"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:"A nurse writes a false post on Facebook claiming a colleague steals hospital supplies. What is this?",options:["Assault","Battery","Slander","Libel"],answer:3,aliases:[],rationale:"False, damaging statements that are written or published are libel.",whyNot:{0:"No threat of harm.",1:"No touching.",2:"Slander is spoken."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-159"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:2,stem:`At the nurses' station, a nurse tells three co-workers that a patient "has syphilis" with no factual basis. What is this?`,options:["False imprisonment","Battery","Libel","Slander"],answer:3,aliases:[],rationale:"False, damaging statements that are spoken to third persons are slander.",whyNot:{0:"No restriction of movement.",1:"No touching.",2:"Nothing was written."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-160"},{unit:12,topic:"u12-torts",type:"mcq",situational:!0,difficulty:3,stem:"In a private conversation with ONLY Nurse Joy, Nurse Kim insults her with false accusations. No one else hears it. Is this defamation?",options:["Yes, it is libel.","Yes, it is battery.","No. Defamation needs a third person who hears or reads the statement.","Yes, it is slander."],answer:2,aliases:[],rationale:"The module says an exchange between two persons is not defamation.",whyNot:{0:"Nothing was written, and there was no third person.",1:"No touching occurred.",3:"Slander needs a third person."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-161"},{unit:12,topic:"u12-torts",type:"id",situational:!1,difficulty:2,stem:"Law named in the module that penalizes unauthorized disclosure of sensitive patient data (give the RA number).",answer:"RA 10173",aliases:["10173","Data Privacy Act"],rationale:"RA 10173, the Data Privacy Act of 2012.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crimes Related to Nursing Practice",id:"U12-162"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:1,stem:"An act committed or omitted in violation of the law.",answer:"Crime",aliases:[],rationale:"A crime violates the law.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-163"},{unit:12,topic:"u12-crime",type:"mcq",situational:!1,difficulty:2,stem:"What are the two elements of a criminal offense?",options:["Consent and cause","Assault and battery","Duty and breach","Criminal act and evil or criminal intent"],answer:3,aliases:[],rationale:"The module lists these two elements.",whyNot:{0:"These are contract elements.",1:"These are torts.",2:"These are negligence elements."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-164"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"Exists when two or more persons agree to commit a felony and decide to do it.",answer:"Conspiracy",aliases:[],rationale:"Conspiracy = agreement plus decision to commit a felony.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-165"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"Persons who take a direct part in the execution of a crime or directly force or induce others to commit it.",answer:"Principals",aliases:["principal"],rationale:"Principals are directly involved.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-166"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"Persons who, not being principals, cooperate in the execution of the offense by previous or simultaneous acts.",answer:"Accomplices",aliases:["accomplice"],rationale:"Accomplices help before or during.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-167"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"Persons who assist the crime by concealing evidence, helping the offender escape, or benefiting from it.",answer:"Accessories",aliases:["accessory"],rationale:"Accessories help after the crime.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-168"},{unit:12,topic:"u12-crime",type:"mcq",situational:!0,difficulty:2,stem:"After a patient dies from a wrong drug, Nurse Lyn helps her colleague hide the empty vial and change the chart. Under the law, what is Nurse Lyn?",options:["Accomplice","Principal","Accessory","Plaintiff"],answer:2,aliases:[],rationale:"Concealing evidence after the crime makes her an accessory.",whyNot:{0:"Accomplices cooperate by previous or simultaneous acts.",1:"She did not take a direct part in the act itself.",3:"The plaintiff files the case."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-169"},{unit:12,topic:"u12-crime",type:"mcq",situational:!0,difficulty:3,stem:"Nurse Mae holds the patient still while Nurse Neri injects a lethal dose, knowing what Neri intends. Nurse Mae is not the one who injects. What is Nurse Mae?",options:["Accomplice","Principal","Expert witness","Accessory"],answer:0,aliases:[],rationale:"She cooperated with a simultaneous act but did not directly execute the act.",whyNot:{1:"The principal took the direct part (the injection).",2:"That is a court role.",3:"Accessories help after the crime."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-170"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"An act of baseness, vileness, or depravity in social or private duties, contrary to accepted rules of right and duty.",answer:"Moral turpitude",aliases:[],rationale:"Falsification of a public document is the module's example.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-171"},{unit:12,topic:"u12-crime",type:"mcq",situational:!0,difficulty:2,stem:"A nurse is convicted of falsifying a public document. How does the module classify this crime?",options:["A crime involving moral turpitude","Force majeure","Simple negligence","An intentional tort only"],answer:0,aliases:[],rationale:"The module says falsification of a public document is contrary to justice, honesty, and good morals.",whyNot:{1:"Not an act of God.",2:"It was deliberate.",3:"It is a crime of moral turpitude."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-172"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"The unlawful killing of a human being with intent to kill.",answer:"Murder",aliases:[],rationale:"Murder requires intent to kill.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-173"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"Unlawful killing without the qualifying circumstances of murder; may occur without intent.",answer:"Homicide",aliases:[],rationale:"Homicide lacks murder's qualifying circumstances.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-174"},{unit:12,topic:"u12-crime",type:"id",situational:!1,difficulty:2,stem:"Expulsion of the product of conception before the age of viability.",answer:"Abortion",aliases:[],rationale:"Abortion is illegal in the Philippines.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-175"},{unit:12,topic:"u12-crime",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, how are euthanasia and death from criminal abortion classified?",options:["Both are considered murder","Both are force majeure","Both are legal with family consent","Both are homicide"],answer:0,aliases:[],rationale:"The module says death from criminal abortion is murder, and euthanasia is also considered murder.",whyNot:{1:"They are not acts of God.",2:"Both are crimes.",3:"The module says murder."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-176"},{unit:12,topic:"u12-crime",type:"mcq",situational:!1,difficulty:2,stem:"What does the Philippine Constitution protect, according to the module?",options:["The right to euthanasia","Abortion with a doctor's order","Abortion in the first trimester","Unborn life from conception"],answer:3,aliases:[],rationale:"The Constitution protects unborn life from conception. Abortion remains illegal.",whyNot:{0:"Euthanasia is considered murder.",1:"Abortion is illegal.",2:"Abortion is illegal."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",id:"U12-177"},{unit:12,topic:"u12-will",type:"id",situational:!1,difficulty:2,stem:"Legal declaration of a person's intentions upon death, taking effect only after death.",answer:"Will",aliases:["testament","last will"],rationale:"A will is a testamentary document.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Will",id:"U12-178"},{unit:12,topic:"u12-will",type:"id",situational:!1,difficulty:2,stem:"Person whose property is transmitted through succession, whether or not a will exists.",answer:"Decedent",aliases:[],rationale:"The decedent is the person who died.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Will",id:"U12-179"},{unit:12,topic:"u12-will",type:"id",situational:!1,difficulty:2,stem:"Person entitled to inherit, either through a will or by law.",answer:"Heir",aliases:[],rationale:"An heir inherits.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Will",id:"U12-180"},{unit:12,topic:"u12-will",type:"mcq",situational:!1,difficulty:2,stem:"Why is a will called a testamentary document?",options:["It takes effect only after death","It is the same as an advance directive","It is signed in court","It is used as evidence in negligence cases"],answer:0,aliases:[],rationale:"The module says a will is testamentary because it takes effect only after death.",whyNot:{1:"An advance directive is about medical treatment while alive.",2:"Not the reason given.",3:"Not the reason given."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Will",id:"U12-181"},{unit:12,topic:"u12-will",type:"mcq",situational:!0,difficulty:2,stem:"A dying patient's son asks if he will receive his father's land even though there is no will. What term describes the father and the son?",options:["The father is the heir; the son is the decedent","The father is the plaintiff; the son is the defendant","The father is the decedent; the son is an heir","The father is the principal; the son is the accessory"],answer:2,aliases:[],rationale:"A decedent's property passes by succession with or without a will. An heir inherits by will or by law.",whyNot:{0:"This is reversed.",1:"These are court terms.",3:"These are crime terms."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Will",id:"U12-182"},{unit:12,topic:"u12-privileged",type:"id",situational:!1,difficulty:2,stem:"Legal and ethical principle that information shared by a patient with healthcare providers remains confidential.",answer:"Privileged communication",aliases:[],rationale:"Privileged communication preserves trust between patients and providers.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Privileged Communication",id:"U12-183"},{unit:12,topic:"u12-privileged",type:"mcq",situational:!0,difficulty:2,stem:"A nurse finds signs of child abuse during an assessment. The parents ask her to keep it secret. What should she do?",options:["Report it, because abuse is an exception to privileged communication","Post it online to warn others","Tell only the neighbors","Keep it secret because of privileged communication"],answer:0,aliases:[],rationale:"The module says nurses must disclose when required by law, such as abuse.",whyNot:{1:"That is a privacy breach.",2:"That is not a lawful disclosure.",3:"Abuse is a legal exception."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Privileged Communication",id:"U12-184"},{unit:12,topic:"u12-privileged",type:"mcq",situational:!1,difficulty:2,stem:"Which is given in the module as an exception where a nurse may disclose patient information?",options:["A relative's curiosity","A co-worker not involved in care","A request from a reporter","Infectious disease reporting required by law"],answer:3,aliases:[],rationale:"The module names abuse and infectious disease reporting.",whyNot:{0:"Not an exception.",1:"Not an exception.",2:"Not an exception."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Privileged Communication",id:"U12-185"},{unit:12,topic:"u12-witness",type:"id",situational:!1,difficulty:2,stem:"A court summons directing a witness to appear and give testimony on the date and time ordered.",answer:"Subpoena",aliases:[],rationale:"A subpoena orders a witness to appear.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-186"},{unit:12,topic:"u12-witness",type:"id",situational:!1,difficulty:2,stem:"Subpoena requiring a witness to bring records, papers, and the like.",answer:"Subpoena duces tecum",aliases:["duces tecum"],rationale:'Duces tecum = "bring with you".',mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-187"},{unit:12,topic:"u12-witness",type:"id",situational:!1,difficulty:2,stem:"Subpoena requiring a person to appear and testify in court as a witness.",answer:"Subpoena ad testificandum",aliases:["ad testificandum"],rationale:'Ad testificandum = "to testify".',mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-188"},{unit:12,topic:"u12-witness",type:"id",situational:!1,difficulty:2,stem:"Witness who gives informed opinions on nursing standards in malpractice or negligence cases.",answer:"Expert witness",aliases:[],rationale:"Expert witnesses explain the standard of care to the court.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-189"},{unit:12,topic:"u12-witness",type:"id",situational:!1,difficulty:2,stem:"Witness who testifies only on direct observations and patient interactions, without personal opinions.",answer:"Fact witness",aliases:[],rationale:"Fact witnesses state only what they saw and documented.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-190"},{unit:12,topic:"u12-witness",type:"id",situational:!1,difficulty:2,stem:"Lying while testifying under oath.",answer:"Perjury",aliases:["false swearing"],rationale:"Testimony is under oath, so lying is perjury.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-191"},{unit:12,topic:"u12-witness",type:"id",situational:!1,difficulty:2,stem:"The right of a witness not to answer questions that might incriminate her.",answer:"Privilege against self-incrimination",aliases:["self-incrimination","right against self-incrimination"],rationale:"A witness need not answer questions that incriminate her.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-192"},{unit:12,topic:"u12-witness",type:"mcq",situational:!0,difficulty:2,stem:"A nurse receives a court order to bring the patient's chart and medication records to court. Which subpoena is this?",options:["Subpoena ad testificandum","Informed consent","Subpoena duces tecum","Advance directive"],answer:2,aliases:[],rationale:"It requires bringing records and papers.",whyNot:{0:"That requires appearing to testify orally.",1:"That is the patient's agreement to treatment.",3:"That is a patient's treatment preferences."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-193"},{unit:12,topic:"u12-witness",type:"mcq",situational:!0,difficulty:2,stem:"A nurse is ordered to appear in court and orally testify about what she personally saw during a code. Which subpoena is this?",options:["Force majeure","Subpoena ad testificandum","Subpoena duces tecum","Respondeat superior"],answer:1,aliases:[],rationale:"It compels oral testimony about what she personally knows.",whyNot:{0:"That is an act of God.",2:"That requires bringing records.",3:"That is an employer liability doctrine."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-194"},{unit:12,topic:"u12-witness",type:"mcq",situational:!0,difficulty:2,stem:"In a malpractice case, a nurse with 20 years of ICU experience explains to the court what the standard of care for ventilator patients is. What is her role?",options:["Defendant","Plaintiff","Expert witness","Fact witness"],answer:2,aliases:[],rationale:"She gives informed opinions on nursing standards.",whyNot:{0:"She is not being sued.",1:"She did not file the case.",3:"A fact witness only states what she observed in the case."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-195"},{unit:12,topic:"u12-witness",type:"mcq",situational:!0,difficulty:2,stem:"A nurse who cared for the patient testifies only about the vital signs she took and what she saw, without giving opinions. What is her role?",options:["Plaintiff","Accessory","Fact witness","Expert witness"],answer:2,aliases:[],rationale:"She shares only factual, objective details from her care.",whyNot:{0:"She did not file the case.",1:"That is a crime term.",3:"Expert witnesses give opinions on standards."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-196"},{unit:12,topic:"u12-witness",type:"mcq",situational:!0,difficulty:2,stem:"On the witness stand, the nurse is asked about a detail she truly cannot remember. What should she do?",options:["Guess an answer so she sounds competent","Change her chart to match","Say she does not know","Refuse to answer every question"],answer:2,aliases:[],rationale:"The module says she should not hesitate to say she does not know.",whyNot:{0:"A false answer under oath risks perjury.",1:"That is falsification.",3:"She should aid the search for truth."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-197"},{unit:12,topic:"u12-witness",type:"mcq",situational:!1,difficulty:2,stem:"When invited to be a witness, what should the nurse also do according to the module?",options:["Refuse to appear","Talk to the media first","Seek the aid or counsel of a lawyer","Destroy her notes"],answer:2,aliases:[],rationale:"The module says she should seek a lawyer's counsel so she is guided.",whyNot:{0:"A subpoena must be obeyed.",1:"Not advised.",3:"That is a crime."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Nurses as Witnesses",id:"U12-198"},{unit:12,topic:"u12-consent",type:"id",situational:!1,difficulty:2,stem:"Process through which a patient voluntarily confirms willingness to undergo an intervention after being told the risks, benefits, and alternatives.",answer:"Informed consent",aliases:["consent"],rationale:"Informed consent needs full information and a voluntary decision.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-199"},{unit:12,topic:"u12-consent",type:"id",situational:!1,difficulty:2,stem:"Legal documents that let patients state their treatment preferences in case they cannot communicate their wishes.",answer:"Advance directives",aliases:["advance directive","advanced directives","advanced directive"],rationale:"Advance directives guide care when the patient cannot speak for himself.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-200"},{unit:12,topic:"u12-consent",type:"id",situational:!1,difficulty:2,stem:"The individual or party who initiates a lawsuit by filing a complaint.",answer:"Plaintiff",aliases:[],rationale:"The plaintiff files the case.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-201"},{unit:12,topic:"u12-consent",type:"id",situational:!1,difficulty:2,stem:"The individual or party being accused or sued in court.",answer:"Defendant",aliases:[],rationale:"The defendant answers the case.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-202"},{unit:12,topic:"u12-consent",type:"id",situational:!1,difficulty:2,stem:"The obligation to prove one's claim in a legal proceeding.",answer:"Burden of proof",aliases:[],rationale:"The one who claims must prove it.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-203"},{unit:12,topic:"u12-consent",type:"mcq",situational:!0,difficulty:2,stem:"A patient signed a general consent on admission. On day 3, the doctor plans a cholecystectomy. What is needed?",options:["Only a verbal agreement from a roommate","Nothing, the admission consent covers all operations","A separate, individual informed consent for the operation","Only the nurse's signature"],answer:2,aliases:[],rationale:"The admission consent covers only initial diagnosis and treatment.",whyNot:{0:"A roommate is not a legal representative.",1:"Subsequent operations need individual consent.",3:"The patient or legal representative consents."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-204"},{unit:12,topic:"u12-consent",type:"mcq",situational:!1,difficulty:2,stem:"Who must provide full information so the patient can make an informed decision, according to the module?",options:["The hospital cashier","The physician","The nursing student","The patient's neighbor"],answer:1,aliases:[],rationale:"The module says physicians must provide full information.",whyNot:{0:"Not responsible.",2:"Not responsible.",3:"Not responsible."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-205"},{unit:12,topic:"u12-consent",type:"mcq",situational:!0,difficulty:2,stem:"A patient with terminal cancer signs a document stating he does not want intubation if he can no longer speak for himself. What is this document?",options:["Informed consent for surgery","Advance directive","Will","Subpoena"],answer:1,aliases:[],rationale:"It states treatment preferences for when he cannot communicate.",whyNot:{0:"It is a future treatment preference, not consent for a procedure now.",2:"A will is about distributing property after death.",3:"A subpoena orders a witness to court."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-206"},{unit:12,topic:"u12-consent",type:"mcq",situational:!0,difficulty:2,stem:"A patient files a negligence case against a nurse. Who is the plaintiff, and who has the burden of proof?",options:["The patient is the plaintiff and must prove the claim","The judge is the plaintiff","The nurse is the plaintiff and must prove her innocence","The hospital is the plaintiff"],answer:0,aliases:[],rationale:"The plaintiff files the case and has the obligation to prove it.",whyNot:{1:"The judge decides the case.",2:"The nurse is the defendant.",3:"The patient filed the case."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",id:"U12-207"},{unit:12,topic:"u12-pointers",type:"id",situational:!1,difficulty:1,stem:"Pointer: on the first day of employment, the nurse should get a copy of this document, plus the agency's rules, regulations, and policies.",answer:"Job description",aliases:["her job description"],rationale:"Knowing your job description protects you from acting outside your role.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-208"},{unit:12,topic:"u12-pointers",type:"id",situational:!1,difficulty:2,stem:"Pointer: what should the nurse do with orders that are not clear or seem erroneous?",answer:"Verify them",aliases:["verify","verify the order","clarify"],rationale:"Pointer 10: verify unclear or erroneous orders.",mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-209"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:'A doctor writes "digoxin 2.5 mg IV now" for an adult. The usual dose is much lower. What should the nurse do?',options:["Give it because the doctor wrote it","Ignore it without telling anyone","Give half and chart the full dose","Verify the order with the doctor before giving it"],answer:3,aliases:[],rationale:"Pointer 10: verify orders that are unclear or seem erroneous.",whyNot:{0:"Giving an erroneous order makes the nurse liable too.",1:"She must verify and communicate.",2:"That is falsification and unsafe."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-210"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:"A head nurse asks a new nursing attendant to insert an NGT. She has not checked if he is trained. Which pointer is she ignoring?",options:["Determine whether your subordinates are competent in the work you assign them","Keep accurate records","Inform the doctor of the patient's condition","Upgrade your skills"],answer:0,aliases:[],rationale:"Pointer 7 requires checking competence before assigning.",whyNot:{1:"Records are not the issue.",2:"Not the issue.",3:"The issue is the subordinate's competence."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-211"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:"A staff nurse is asked by a doctor to adjust a ventilator setting, which is outside her job description and training. What should she do?",options:["Ask a nursing student to do it","Do it and not chart it","Decline, because she should accept only responsibility within the scope of her employment and job description","Do it because a doctor asked"],answer:2,aliases:[],rationale:"Pointer 5.",whyNot:{0:"That is improper delegation.",1:"That adds a documentation problem.",3:"Acting outside her scope makes her liable."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-212"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:"A patient's blood pressure has stayed high for two days despite medication. What should the nurse do according to the pointers?",options:["Wait until the patient complains","Inform the doctor about the patient's lack of progress","Double the dose on her own","Record it only in her personal notebook"],answer:1,aliases:[],rationale:"Pointer 11: inform the doctor of the condition, effects of medications, or lack of progress.",whyNot:{0:"Delay risks harm.",2:"That is outside her scope.",3:"Records must be accurate and in the chart."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-213"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:"A nurse faces a family threatening to sue over a complex billing and care dispute that she cannot resolve. What does the pointer advise?",options:["Post about it online","Consult your superiors for problems that may be too big for you to handle","Handle it alone to avoid looking weak","Ignore the family"],answer:1,aliases:[],rationale:"Pointer 9.",whyNot:{0:"That risks a privacy breach.",2:"The pointer says consult superiors.",3:"Avoiding can make it worse."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-214"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:1,stem:"Which pointer protects the nurse most in a court case years later, because the chart shows exactly what was done?",options:["Upgrade skills","Delegate properly","Keep accurate and adequate records","Develop good interpersonal relationships"],answer:2,aliases:[],rationale:"Pointer 12: records are the nurse's best legal evidence.",whyNot:{0:"Helpful, but not evidence.",1:"Helpful, but not evidence.",3:"Helpful, but records are the evidence."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-215"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:"A new graduate attends an IV therapy and ECG reading seminar to stay competent. Which pointer is she following?",options:["Delegate properly","Upgrade your skills and competence","Verify unclear orders","Know the Philippine Nursing Law"],answer:1,aliases:[],rationale:"Pointer 4.",whyNot:{0:"Not related.",2:"Not related.",3:"That is about knowing RA 9173."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-216"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:"A nurse reviews RA 9173 and also studies RA 10173 and the Labor Code to protect her practice. Which pointers is she following?",options:["Be familiar with the Philippine Nursing Law and be aware of laws that affect nursing practice","Keep records and inform the doctor","Delegate properly and check subordinates' competence","Consult superiors and verify orders"],answer:0,aliases:[],rationale:"Pointers 1 and 2.",whyNot:{1:"Pointers 11 and 12.",2:"Pointers 6 and 7.",3:"Pointers 9 and 10."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-217"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:2,stem:"A charge nurse gives a nursing assistant only tasks that fit his role, like bed baths and vital signs, and keeps IV meds for RNs. Which pointer is this?",options:["Accept only responsibility within your scope","Delegate properly","Keep accurate records","Inform the doctor"],answer:1,aliases:[],rationale:"Pointer 6.",whyNot:{0:"That is about the nurse's own tasks.",2:"Not the focus.",3:"Not the focus."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-218"},{unit:12,topic:"u12-pointers",type:"mcq",situational:!0,difficulty:1,stem:"A nurse works on being respectful and cooperative with her supervisors, peers, and subordinates so the team communicates well. Which pointer is this?",options:["Consult superiors","Upgrade skills","Verify orders","Develop good interpersonal relationships"],answer:3,aliases:[],rationale:"Pointer 8.",whyNot:{0:"That is for problems too big to handle.",1:"That is about competence.",2:"That is about unclear orders."},mnemonic:"",note:"",sourceTag:"Unit 12 \u203A Legal Responsibilities \u203A Pointers",id:"U12-219"},{unit:14,topic:"u14-decorum",type:"id",situational:!1,difficulty:1,stem:"The behavior, attitude, and conduct that align with the standards, ethics, and expectations of a given profession.",answer:"Professional decorum",aliases:["decorum"],rationale:"Professional decorum is how a professional presents and conducts herself.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-001"},{unit:14,topic:"u14-decorum",type:"mcq",situational:!1,difficulty:2,stem:"What is the purpose of professional decorum, according to the module?",options:["To replace the Code of Ethics","To maintain a respectful, ethical, and trustworthy environment","To decide hospital salaries","To allow nurses to skip CPD"],answer:1,aliases:[],rationale:"Decorum cover
