h stage can a conflict sometimes still be resolved through open communication and mutual support, before it becomes emotional?",options:["Perceived conflict","Conflict aftermath","Felt conflict","Manifest conflict"],answer:0,aliases:[],rationale:"The module says perceived conflict can sometimes be resolved at that stage with open communication and mutual support, because it is not yet emotional.",whyNot:{1:"The aftermath is the result after resolution, not a chance to resolve early.",2:"By the felt stage, emotions such as anger and mistrust are already present.",3:"Manifest conflict is when action is already being taken."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-026"},{unit:8,topic:"u8-process",type:"id",situational:!1,difficulty:2,stem:"Stage of the conflict process where the conflict becomes emotional, with hostility, fear, mistrust, or anger. Also called affective conflict.",answer:"Felt conflict",aliases:["felt","affective conflict","affective"],rationale:'At the felt stage the conflict is now "felt" in emotions.',mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-027"},{unit:8,topic:"u8-process",type:"mcq",situational:!0,difficulty:2,stem:"The relative's frustration turns into anger. She believes her father's care is being neglected and no longer trusts the staff. Which stage is this?",options:["Manifest conflict","Latent conflict","Felt (affective) conflict","Perceived conflict"],answer:2,aliases:[],rationale:"Anger and mistrust show the conflict has become emotional. That is felt conflict.",whyNot:{0:"Manifest conflict is when she takes action, such as confronting someone.",1:"Latent conflict has not happened yet.",3:"Perceived conflict is logical and not yet emotional."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-028"},{unit:8,topic:"u8-process",type:"id",situational:!1,difficulty:2,stem:"Stage of the conflict process where action is taken, such as withdrawing, competing, debating, or resolving. Also called overt conflict.",answer:"Manifest conflict",aliases:["manifest","overt conflict","overt"],rationale:'"Manifest" means it now shows in behavior.',mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-029"},{unit:8,topic:"u8-process",type:"mcq",situational:!0,difficulty:2,stem:"The relative confronts a nurse at the station and raises her voice. The head nurse steps in, listens, and offers a calm discussion and a detailed review of the care plan. Which stage is happening?",options:["Manifest (overt) conflict","Conflict aftermath","Felt conflict","Perceived conflict"],answer:0,aliases:[],rationale:"Action is being taken: the confrontation and the head nurse's response. This is the module's example of manifest conflict.",whyNot:{1:"The aftermath is the result after the response, such as trust being restored.",2:"Felt conflict is the emotion only. Here there is open action.",3:"Perceived conflict is calm and logical. This is open confrontation."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-030"},{unit:8,topic:"u8-process",type:"mcq",situational:!1,difficulty:3,stem:"In the manifest stage, which of these does the module give as a reason people avoid addressing conflict?",options:["Fear of retaliation, ridicule, or alienation","Lack of antecedent conditions","Too much empowerment","The need for a win-win solution"],answer:0,aliases:[],rationale:"The module lists fear of retaliation, ridicule, alienation, or past negative experiences.",whyNot:{1:"Antecedent conditions belong to latent conflict, not to the reasons for avoiding action.",2:"The module does not list empowerment as a reason to avoid conflict.",3:"Win-win is the goal of resolution, not a reason to avoid the conflict."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-031"},{unit:8,topic:"u8-process",type:"mcq",situational:!1,difficulty:3,stem:"According to the module, what may influence how individuals respond to conflict in the manifest stage (e.g., men may respond more aggressively while women might avoid conflict)?",options:["Socialization and gender roles","Antecedent conditions","Benchmarking and quality gaps","Informational deficiencies"],answer:0,aliases:[],rationale:"The module says socialization and gender roles influence responses to conflict.",whyNot:{1:"Those cause latent conflict. They do not explain response styles.",2:"Those are quality-control terms from Unit 9.",3:"That is a source of interpersonal conflict, not what shapes the response style."},mnemonic:"",note:'Source note: the module text reads "gender trolls". From the example (men respond aggressively, women avoid), it most likely means "gender roles". Please verify with your professor.',sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-032"},{unit:8,topic:"u8-process",type:"id",situational:!1,difficulty:2,stem:"Final stage of the conflict process, where resolution leads to either positive or negative outcomes.",answer:"Conflict aftermath",aliases:["aftermath"],rationale:"Aftermath means what comes after. It can be positive (trust restored) or negative (the issue comes back).",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-033"},{unit:8,topic:"u8-process",type:"mcq",situational:!0,difficulty:2,stem:"After the head nurse's talk, the relative feels heard and trust is restored through regular patient updates. What is this?",options:["A positive conflict aftermath","Latent conflict","Smoothing","A negative conflict aftermath"],answer:0,aliases:[],rationale:"This is the module's positive aftermath example.",whyNot:{1:"Latent conflict is the start of the process, not the result.",2:"Smoothing calms people but does not solve the issue. Here the concern was truly addressed.",3:"A negative aftermath leaves the relative frustrated and the issue may escalate."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-034"},{unit:8,topic:"u8-process",type:"mcq",situational:!1,difficulty:2,stem:"What does the module say about poorly managed conflict?",options:["It always ends in a lose-lose compromise","It may leave unresolved issues that could re-emerge later","It becomes latent conflict permanently","It leaves participants feeling fairly treated"],answer:1,aliases:[],rationale:"The module says poorly managed conflict can come back later.",whyNot:{0:"Lose-lose is a risk of compromising, not the module's statement about poorly managed conflict.",2:"The module does not say this.",3:"Fair treatment is a sign of well-managed conflict."},mnemonic:"",note:'Source note: the module says well-managed conflict leaves participants feeling "hurt and fairly treated". It most likely means "NOT hurt and fairly treated". Please verify with your professor.',sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-035"},{unit:8,topic:"u8-process",type:"mcq",situational:!1,difficulty:2,stem:"Arrange the conflict process correctly.",options:["Latent, perceived, manifest, felt, aftermath","Latent, felt, perceived, manifest, aftermath","Latent, perceived, felt, manifest, aftermath","Perceived, latent, felt, manifest, aftermath"],answer:2,aliases:[],rationale:"Conditions first (latent), then recognition (perceived), then emotion (felt), then action (manifest), then the result (aftermath).",whyNot:{0:"Emotions (felt) come before action (manifest).",1:"Perceived (logical) comes before felt (emotional).",3:"Latent comes first. Conditions exist before anyone perceives the conflict."},mnemonic:"Lazy Penguins Feel Mad After",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-036"},{unit:8,topic:"u8-winwin",type:"id",situational:!1,difficulty:1,stem:"The optimal outcome when resolving conflict, where all parties involved benefit.",answer:"Win-win",aliases:["win win","win-win solution"],rationale:"The module says the optimal goal is a win-win solution for all involved.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-037"},{unit:8,topic:"u8-winwin",type:"mcq",situational:!1,difficulty:2,stem:"When a win-win solution is not possible, what is often the manager's goal?",options:["Impose a policy without consulting anyone","Manage the conflict so it lessens the perceptual differences between the parties","Avoid the conflict until it disappears","Choose the party with more seniority"],answer:1,aliases:[],rationale:"The module says the manager often aims to lessen the perceptual differences between the parties.",whyNot:{0:"That is competing (win-lose), not the stated goal.",2:"Avoiding can make issues bigger later.",3:"The module does not support deciding by seniority."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-038"},{unit:8,topic:"u8-strategies",type:"id",situational:!1,difficulty:1,stem:"Conflict resolution strategy where each party gives up something to reach a mutually acceptable solution.",answer:"Compromising",aliases:["compromise"],rationale:"In compromising, both sides give something up.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-039"},{unit:8,topic:"u8-strategies",type:"id",situational:!1,difficulty:2,stem:"In compromising, to avoid a lose-lose situation, both parties should give up something of this.",answer:"Equal value",aliases:["something of equal value","equal"],rationale:"If one side feels it gave up more, compromising can turn lose-lose. Equal value keeps it fair.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-040"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:1,stem:"Two nurses disagree on their shift schedules. They agree to swap shifts for next week, so both get time off and the unit stays fully staffed. Which strategy did they use?",options:["Compromising","Collaborating","Avoiding","Accommodating"],answer:0,aliases:[],rationale:"Each gave up something (a shift) of equal value to reach a mutually acceptable solution. This is the module's compromising example.",whyNot:{1:"Collaborating means building a new shared solution together toward a common goal. Here they simply traded equal things.",2:"They did not ignore the problem. They solved it.",3:"In accommodating only one party sacrifices. Here both gave something."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-041"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:2,stem:"Compromising can be seen as optimal. When can it become a lose-lose situation?",options:["When one party feels they sacrificed more than the other","When a quick decision is needed","When the issue is trivial","When both parties give up something of equal value"],answer:0,aliases:[],rationale:"The module warns that compromising becomes lose-lose if one party feels they gave up more.",whyNot:{1:"Quick decisions are linked to competing.",2:"Trivial issues are linked to avoiding.",3:"Equal value is exactly how to avoid lose-lose."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-042"},{unit:8,topic:"u8-strategies",type:"id",situational:!1,difficulty:1,stem:"Conflict resolution strategy where one party pursues its goals at the expense of others, resulting in a win-lose situation.",answer:"Competing",aliases:["competition","compete"],rationale:"Competing has one winner and one loser.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-043"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, when is competing often used?",options:["When both parties want to build a shared solution","When quick decisions are needed or one party has more knowledge about the situation","When the cost of resolution is greater than the benefit","When one party wants a future favor"],answer:1,aliases:[],rationale:"The module gives these two uses of competing.",whyNot:{0:"That describes collaborating.",2:"That is when avoiding may be suitable.",3:"That describes accommodating."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-044"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:2,stem:"A manager implements a new policy that benefits the administration but adds burden to the nursing staff, without consulting them first. Which strategy is this?",options:["Smoothing","Collaborating","Compromising","Competing"],answer:3,aliases:[],rationale:"The manager pursues the administration's goal at the staff's expense (win-lose). This is the module's competing example.",whyNot:{0:"Smoothing tries to calm people by stressing agreement. This manager did not try to calm anyone.",1:"Collaborating would involve the staff in building the solution.",2:"In compromising, both sides give something up. Only the staff gave something up here."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-045"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:2,stem:'A patient in the ER suddenly goes into cardiac arrest. Two nurses disagree on who will do compressions. The charge nurse immediately orders, "You compress, you bag." Which strategy fits, and why is it acceptable here?',options:["Smoothing, because it focuses on agreements","Avoiding, because the issue is trivial","Collaborating, because both nurses get what they want","Competing, because a quick decision is needed"],answer:3,aliases:[],rationale:"The module says competing is often used when quick decisions are needed. An arrest cannot wait for a discussion.",whyNot:{0:"The charge nurse gave an order. She did not try to soothe anyone.",1:"The issue was not ignored, and it is not trivial.",2:"There was no shared decision-making. The charge nurse decided alone."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-046"},{unit:8,topic:"u8-strategies",type:"id",situational:!1,difficulty:1,stem:"Conflict resolution strategy where one party sacrifices their own needs or desires so the other party can win. Also called accommodating.",answer:"Cooperating",aliases:["accommodating","cooperation","accommodation"],rationale:"The module calls this cooperating or accommodating. One side gives in so the other wins.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-047"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:2,stem:"What is the common downside of cooperating/accommodating, according to the module?",options:["The accommodating party often feels resentful","It never resolves anything because it only stresses agreements","It needs a quick decision by the more knowledgeable party","It always produces a lose-lose result"],answer:0,aliases:[],rationale:"The module says accommodating can be politically useful but often leaves the accommodating party resentful.",whyNot:{1:"That describes smoothing.",2:"That describes competing.",3:"Lose-lose is the risk of compromising."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-048"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:2,stem:"Nurse Dina agrees to take two more patients from a colleague, hoping for a favor in the future, even though her own workload suffers. Which strategy is this?",options:["Cooperating / accommodating","Competing","Compromising","Collaborating"],answer:0,aliases:[],rationale:"Dina sacrifices her own needs so her colleague wins. This is the module's example of accommodating.",whyNot:{1:"In competing, one party pursues its own goals. Dina gave up hers.",2:"In compromising, both parties give up something. Here only Dina gave.",3:"Collaborating creates a win-win. Dina's workload suffered."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-049"},{unit:8,topic:"u8-strategies",type:"id",situational:!1,difficulty:2,stem:"Conflict resolution strategy where one party tries to pacify the other and focuses on agreements rather than differences.",answer:"Smoothing",aliases:["smooth"],rationale:"Smoothing calms emotions but may leave the real issue unsolved.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-050"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:2,stem:"A manager acknowledges a nurse's frustration about a decision and stresses the team's shared goals, but does not address the specific issues raised. Tension remains. Which strategy is this?",options:["Avoiding","Collaborating","Smoothing","Competing"],answer:2,aliases:[],rationale:"The manager pacifies and focuses on shared goals but does not resolve the issue. This is the module's smoothing example.",whyNot:{0:"In avoiding, the conflict is ignored completely. This manager did respond.",1:"Collaborating would solve the issue together, leaving no tension.",3:"The manager did not push a goal at the nurse's expense."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-051"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:2,stem:"What is the main limitation of smoothing?",options:["It is only suitable for trivial disagreements","It always creates a win-lose situation","It minimizes emotional tension but may not resolve the underlying conflict","It makes the accommodating party resentful"],answer:2,aliases:[],rationale:"Smoothing makes people feel calmer, but the root issue may remain.",whyNot:{0:"That is the module's guideline for avoiding.",1:"Win-lose is competing.",3:"Resentment is the downside of accommodating."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-052"},{unit:8,topic:"u8-strategies",type:"id",situational:!1,difficulty:1,stem:"Conflict resolution strategy that involves ignoring the conflict or not addressing it.",answer:"Avoiding",aliases:["avoidance","avoid"],rationale:"Avoiding means not dealing with the conflict at all.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-053"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:2,stem:"When may avoiding be a suitable strategy?",options:["For trivial disagreements, or when the cost of resolution exceeds the benefit","When the issue is serious and keeps coming back","When both parties need a win-win","When a quick decision is needed"],answer:0,aliases:[],rationale:"The module gives these two situations.",whyNot:{1:"A serious, repeated issue will fester if avoided, as in the module's example.",2:"That needs collaborating.",3:"That is when competing is used."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-054"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:2,stem:`A nurse notices a colleague's persistent problem behavior but decides not to confront it because "it's not worth the trouble." Months later, team morale drops. Which strategy was used, and what went wrong?`,options:["Smoothing. The nurse stressed agreements too much.","Compromising. Both sides gave up too much.","Avoiding. The issue festered and hurt team morale.","Accommodating. The nurse sacrificed her needs for a favor."],answer:2,aliases:[],rationale:"This is the module's avoiding example. Ignoring a persistent issue lets it grow.",whyNot:{0:"The nurse did not engage at all, so it is not smoothing.",1:"Nobody negotiated or gave anything up.",3:"There was no sacrifice for a favor. The nurse just ignored it."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-055"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:1,stem:"Two nurses disagree on whether the pen at the nurses' station should be blue or black. The head nurse lets it go. Which strategy is this and is it appropriate?",options:["Collaborating, and it is not appropriate","Competing, and it is appropriate because it is quick","Avoiding, and it is appropriate because the issue is trivial","Smoothing, and it is never appropriate"],answer:2,aliases:[],rationale:"The module says avoiding may suit trivial disagreements.",whyNot:{0:"Nothing was built together. The issue was simply left alone.",1:"Letting it go is not pursuing one side's goal.",3:"The head nurse did not pacify anyone or stress agreement."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-056"},{unit:8,topic:"u8-strategies",type:"id",situational:!1,difficulty:2,stem:"Conflict resolution strategy that is both assertive and cooperative, aiming for a win-win solution where all parties work toward a common goal.",answer:"Collaborating",aliases:["collaboration","collaborate"],rationale:"Collaborating is the only strategy that is both assertive and cooperative.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-057"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, collaboration requires which two things?",options:["A quick decision and more knowledge","Mutual respect and open communication","Equal sacrifice and a deadline","Silence and patience"],answer:1,aliases:[],rationale:"The module states collaboration requires mutual respect and open communication.",whyNot:{0:"Those are linked to competing.",2:"Equal sacrifice is linked to compromising.",3:"Silence fits avoiding, not collaborating."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-058"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!0,difficulty:2,stem:"A nurse and her supervisor discuss staffing problems and together develop a schedule that keeps patient care safe and still grants the nurse's time-off request. Which strategy is this?",options:["Collaborating","Accommodating","Compromising","Smoothing"],answer:0,aliases:[],rationale:"They worked together toward a common goal, and both needs were met (win-win). This is the module's collaborating example.",whyNot:{1:"Nobody sacrificed their needs.",2:"In compromising each gives up something of equal value. Here they built a new solution that meets everyone's needs.",3:"The issue was actually solved, not just calmed."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-059"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:3,stem:"Which strategy is described as BOTH assertive AND cooperative?",options:["Accommodating","Competing","Collaborating","Avoiding"],answer:2,aliases:[],rationale:"The module describes collaborating as assertive and cooperative.",whyNot:{0:"Accommodating is cooperative but gives up one's own needs (not assertive).",1:"Competing is assertive but not cooperative.",3:"Avoiding is neither assertive nor cooperative."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-060"},{unit:8,topic:"u8-strategies",type:"mcq",situational:!1,difficulty:3,stem:'Match the outcome: which strategy is linked to "win-lose"?',options:["Collaborating","Smoothing","Competing","Compromising"],answer:2,aliases:[],rationale:"Competing pursues one party's goals at others' expense, so one wins and the other loses.",whyNot:{0:"Collaborating is win-win.",1:"Smoothing minimizes tension. The module does not call it win-lose.",3:"Compromising aims for a mutually acceptable result. Its risk is lose-lose."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Conflict Resolution Strategies",id:"U8-061"},{unit:8,topic:"u8-stress",type:"id",situational:!1,difficulty:1,stem:"Repeated, health-harming mistreatment of one or more individuals (targets) by one or more perpetrators. It is abusive, threatening, humiliating, or intimidating.",answer:"Bullying",aliases:["workplace bullying"],rationale:"The key word is repeated. Bullying is a pattern, not a one-time incident.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-062"},{unit:8,topic:"u8-stress",type:"mcq",situational:!0,difficulty:2,stem:"A senior nurse keeps criticizing a junior nurse in staff meetings week after week, mocking her decisions in front of peers. What is this?",options:["Smoothing","Incivility","Mobbing","Bullying"],answer:3,aliases:[],rationale:"It is a repeated pattern of humiliating mistreatment by one perpetrator. This is the module's bullying example.",whyNot:{0:"Smoothing is a conflict resolution strategy.",1:"Incivility covers rude acts, but this repeated, humiliating pattern matches the module's definition of bullying.",2:"Mobbing is done by a group. Here one senior nurse is the perpetrator."},mnemonic:"",note:'Source note: the module example says "mocking hermit decisions". It most likely means "mocking her decisions". Please verify with your professor.',sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-063"},{unit:8,topic:"u8-stress",type:"mcq",situational:!1,difficulty:2,stem:"What separates bullying from a single rude remark, according to the module?",options:["Bullying is always done by a group","Bullying always involves physical contact","Bullying is only done by patients","Bullying is a pattern of behavior, not a one-time incident"],answer:3,aliases:[],rationale:"The module stresses that bullying is repeated, not a one-time event.",whyNot:{0:"Group targeting is mobbing.",1:"Bullying can be verbal or emotional. No contact is needed.",2:"The module describes bullying between staff."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-064"},{unit:8,topic:"u8-stress",type:"id",situational:!1,difficulty:2,stem:"Rude or disrespectful behavior that ranges on a continuum from subtle acts like eye rolling or sarcasm to overt intimidation or violence.",answer:"Incivility",aliases:["workplace incivility"],rationale:"Incivility is a continuum of disruptive behavior that can escalate.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-065"},{unit:8,topic:"u8-stress",type:"mcq",situational:!0,difficulty:1,stem:"During a meeting, a nurse rolls her eyes whenever a colleague speaks. She says nothing, but the colleague loses confidence. What is this?",options:["Incivility","Workplace violence through physical harm","Mobbing","Assault"],answer:0,aliases:[],rationale:"Eye rolling is the module's example of subtle incivility.",whyNot:{1:"There was no physical harm. This is a subtle disrespectful act.",2:"Mobbing needs a group targeting one person.",3:"Assault is a legal term (fear of harm without contact). Eye rolling does not threaten harm."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-066"},{unit:8,topic:"u8-stress",type:"mcq",situational:!0,difficulty:2,stem:"A nurse gives valid feedback but in a sarcastic tone, so the colleague feels belittled. Which work-related stressor does this match?",options:["Bullying","Defamation","Mobbing","Incivility"],answer:3,aliases:[],rationale:"Sarcastic comments are subtle disrespectful behavior, which is incivility. The module uses this exact example.",whyNot:{0:"Bullying is a repeated pattern of health-harming mistreatment. One sarcastic remark is not described that way.",1:"Defamation is false information told to a third person. The feedback here was valid.",2:"Only one person is involved."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-067"},{unit:8,topic:"u8-stress",type:"id",situational:!1,difficulty:2,stem:"Occurs when a group of employees collectively targets one individual with harassment, bullying, or isolation.",answer:"Mobbing",aliases:["workplace mobbing"],rationale:"Mobbing = a mob (group) against one person.",mnemonic:"MOBbing = a MOB against one.",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-068"},{unit:8,topic:"u8-stress",type:"mcq",situational:!0,difficulty:2,stem:"Several staff members spread rumors about a nurse, damaging her reputation and making her feel unwelcome at work. What is this?",options:["Mobbing","Incivility","Collective bargaining","Bullying"],answer:0,aliases:[],rationale:"A group collectively targets one person. This is one of the module's mobbing examples.",whyNot:{1:"Incivility is rude behavior. Organized group rumor-spreading matches mobbing.",2:"Collective bargaining is a group negotiating with management, not targeting a colleague.",3:"Bullying can be by one or more people, but a group collectively targeting one person is the module's definition of mobbing."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-069"},{unit:8,topic:"u8-stress",type:"mcq",situational:!0,difficulty:2,stem:"A group of nurses keeps excluding one colleague from team discussions and social activities. She feels isolated and unsupported. What is this?",options:["Incivility","Intergroup conflict","Mobbing","Avoiding"],answer:2,aliases:[],rationale:"Group isolation of one person is the module's mobbing example.",whyNot:{0:"The group targeting is what makes it mobbing.",1:"Intergroup conflict is between groups, not a group against one person.",3:"Avoiding is a conflict strategy of ignoring the conflict, not targeting a person."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-070"},{unit:8,topic:"u8-stress",type:"id",situational:!1,difficulty:2,stem:"A range of behaviors that result in physical harm or psychological distress to people in the workplace, including bullying, incivility, and mobbing.",answer:"Workplace violence",aliases:["violence"],rationale:"Workplace violence is the umbrella. It covers physical violence and anti-social behaviors like bullying, incivility, and mobbing.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-071"},{unit:8,topic:"u8-stress",type:"mcq",situational:!0,difficulty:2,stem:"A patient's family member, angry about the care, physically threatens a nurse. The staff become fearful and anxious. What is this?",options:["Incivility","Workplace violence","Mobbing","Felt conflict"],answer:1,aliases:[],rationale:"Threats that cause fear and distress at work are workplace violence. This is the module's example.",whyNot:{0:"A physical threat is beyond subtle rudeness and matches the module's workplace violence example.",2:"Mobbing is a group of employees targeting a colleague.",3:"Felt conflict is a stage of conflict, not a type of workplace stressor."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-072"},{unit:8,topic:"u8-stress",type:"mcq",situational:!1,difficulty:3,stem:"Which statement about workplace violence is correct according to the module?",options:["It only refers to violence by patients","It is the same as incivility","It only counts if someone is physically injured","It includes bullying, incivility, and mobbing, not only physical violence"],answer:3,aliases:[],rationale:"The module says workplace violence includes anti-social behaviors like bullying, incivility, and mobbing.",whyNot:{0:"The module includes behavior among staff too.",1:"Incivility is only one part of workplace violence.",2:"Psychological distress also counts."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Work-related Stress",id:"U8-073"},{unit:8,topic:"u8-esteem",type:"id",situational:!1,difficulty:1,stem:"The perception of one's own worth and abilities.",answer:"Self-esteem",aliases:["self esteem"],rationale:"Self-esteem is how you see your own worth and abilities.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-074"},{unit:8,topic:"u8-esteem",type:"id",situational:!1,difficulty:2,stem:"Psychologist who divided self-esteem into self-respect and respect from others.",answer:"Maslow",aliases:["Abraham Maslow"],rationale:"Maslow split self-esteem into an internal part (self-respect) and an external part (respect from others).",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-075"},{unit:8,topic:"u8-esteem",type:"id",situational:!1,difficulty:2,stem:"Maslow's category of self-esteem that covers the internal feeling of confidence, achievement, independence, and competence.",answer:"Self-respect",aliases:["self respect"],rationale:"Self-respect is internal: how you feel about yourself.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-076"},{unit:8,topic:"u8-esteem",type:"id",situational:!1,difficulty:2,stem:"Maslow's category of self-esteem that focuses on external validation, such as recognition, status, prestige, and appreciation.",answer:"Respect from others",aliases:["respect from other"],rationale:"This is external: what others give you.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-077"},{unit:8,topic:"u8-esteem",type:"mcq",situational:!0,difficulty:2,stem:"Nurse Elle feels proud after she independently handles a difficult IV insertion. Nobody saw it, but she feels competent. Which category of self-esteem is this?",options:["Respect from others","Empowerment","Self-respect","Self-discipline"],answer:2,aliases:[],rationale:"It is an internal feeling of competence and independence. No one else validated it.",whyNot:{0:"Nobody recognized her. The feeling came from within.",1:"Empowerment is a psychological state about control over practice. The question asks about Maslow's self-esteem categories.",3:"Self-discipline (Unit 9) is employees governing their own behavior."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-078"},{unit:8,topic:"u8-esteem",type:"mcq",situational:!0,difficulty:2,stem:'A nurse is named "Employee of the Month" and her photo is posted in the lobby. Which category of self-esteem does this feed?',options:["Impact","Meaning","Self-respect","Respect from others"],answer:3,aliases:[],rationale:"Recognition and status come from others. That is external validation.",whyNot:{0:"Impact is a component of empowerment, not a category of self-esteem.",1:"Meaning is also an empowerment component.",2:"Self-respect is an internal feeling, not an award from others."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-079"},{unit:8,topic:"u8-esteem",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, how does LOW self-esteem affect conflict?",options:["It leads to avoidance or passive behavior, which may worsen disputes","It has no effect on patient care","It makes nurses more assertive and confident","It prevents conflicts from escalating"],answer:0,aliases:[],rationale:"The module says low self-esteem leads to avoidance or passivity that can make disputes worse.",whyNot:{1:"The module says low self-esteem can impact patient care and team dynamics.",2:"That is high self-esteem.",3:"High self-esteem prevents escalation."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-080"},{unit:8,topic:"u8-esteem",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, nurses with HIGH self-esteem are:",options:["More confident, assertive, and better equipped to handle conflict","More likely to avoid conflict","More likely to feel powerless","More likely to become bullies"],answer:0,aliases:[],rationale:"The module's table lists these traits for high self-esteem.",whyNot:{1:"Avoidance is linked to low self-esteem.",2:"Powerlessness is linked to low self-esteem.",3:"The module does not say this."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-081"},{unit:8,topic:"u8-esteem",type:"id",situational:!1,difficulty:2,stem:"Give one of the three strategies to enhance self-esteem in nurses that uses guidance from experienced nurses.",answer:"Mentorship programs",aliases:["mentorship","mentoring","mentorship program"],rationale:"Mentorship gives guidance that helps less experienced nurses build confidence.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-082"},{unit:8,topic:"u8-esteem",type:"mcq",situational:!0,difficulty:2,stem:'A chief nurse wants to raise staff self-esteem. She starts a monthly "thank-you board" where good work is acknowledged. Which strategy is she using?',options:["Mentorship programs","Collective bargaining","Positive feedback and recognition","Opportunities for skill development"],answer:2,aliases:[],rationale:"Regular acknowledgment of contributions boosts morale. This is strategy 1 in the module.",whyNot:{0:"That would pair new nurses with experienced ones.",1:"That is negotiation through unions.",3:"That would be training on technical or interpersonal skills."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-083"},{unit:8,topic:"u8-esteem",type:"mcq",situational:!0,difficulty:2,stem:"The training office offers free IV therapy and communication workshops so nurses feel more capable. Which self-esteem strategy is this?",options:["Opportunities for skill development","Performance deficiency coaching","Mentorship programs","Positive feedback and recognition"],answer:0,aliases:[],rationale:"Building technical and interpersonal skills boosts confidence. This is strategy 2.",whyNot:{1:"That is a Unit 9 controlling strategy for poor performance.",2:"Mentorship is guidance from an experienced nurse.",3:"Recognition acknowledges work already done. This builds new skills."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Enhancing Self-Esteem",id:"U8-084"},{unit:8,topic:"u8-supervision",type:"id",situational:!1,difficulty:1,stem:"Actively overseeing the work of others, which requires ongoing checking of progress.",answer:"Supervision",aliases:["supervising"],rationale:"Supervision is active and ongoing, not a one-time check.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Supervision",id:"U8-085"},{unit:8,topic:"u8-supervision",type:"id",situational:!1,difficulty:2,stem:"Element of supervision where supervising personnel periodically check in with staff.",answer:"Direct oversight",aliases:["direct supervision","oversight"],rationale:"Direct oversight means regular check-ins.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Supervision",id:"U8-086"},{unit:8,topic:"u8-supervision",type:"mcq",situational:!1,difficulty:2,stem:"In which relationship is supervision MORE critical, according to the module?",options:["Nursing student to patient","RN to nursing assistant (hierarchical)","Nurse to patient's relative","RN to RN (collaborative)"],answer:1,aliases:[],rationale:"The module says supervision is more critical in hierarchical relationships.",whyNot:{0:"The module's example is RN to nursing assistant.",2:"This is not a supervisory relationship.",3:"Collaborative relationships usually involve consulting and advice, not direct supervision."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Supervision",id:"U8-087"},{unit:8,topic:"u8-supervision",type:"mcq",situational:!0,difficulty:2,stem:"Three hours into the shift, the nursing assistant assigned to vital signs and bed baths is far behind. What should the supervising RN do first?",options:["Write an incident report for poor performance","Do nothing because nursing assistants are not her responsibility","Assess the situation, then re-evaluate and redistribute the tasks so care is completed","Wait until end of shift to see if the work is finished"],answer:2,aliases:[],rationale:"The module says the RN must assess the cause (complication or external errand) and may redistribute tasks.",whyNot:{0:"Assessment comes first. The cause may be a patient complication, not poor performance.",1:"The RN supervises the nursing assistant.",3:"Supervision requires ongoing checking. Waiting risks incomplete care."},mnemonic:"",note:'Source note: the module says the RN might "restrict redistribute" tasks. It most likely means "redistribute". It also says "the cost could be" a complication, which most likely means "the cause could be". Please verify.',sourceTag:"Unit 8 \u203A Conflict Management \u203A Supervision",id:"U8-088"},{unit:8,topic:"u8-supervision",type:"mcq",situational:!0,difficulty:2,stem:"Two RNs on the same shift disagree on wound care. One asks the other for advice. What kind of relationship is this?",options:["Collaborative, involving consulting and advice rather than direct supervision","Hierarchical, requiring direct oversight","Mobbing","Competing, requiring a quick decision"],answer:0,aliases:[],rationale:"The module says RN to RN relationships are collaborative and use consulting and advice.",whyNot:{1:"Hierarchical is RN to nursing assistant.",2:"Mobbing is a group targeting one person.",3:"Competing is a conflict strategy."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Supervision",id:"U8-089"},{unit:8,topic:"u8-empower",type:"id",situational:!1,difficulty:1,stem:"The ability to influence others, even against resistance.",answer:"Power",aliases:[],rationale:"Power is about influencing others. Empowerment is an internal state.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-090"},{unit:8,topic:"u8-empower",type:"id",situational:!1,difficulty:1,stem:"A psychological state where nurses feel competent, in control, and entitled to make decisions about their practice.",answer:"Empowerment",aliases:["psychological empowerment"],rationale:"Empowerment is a feeling inside the nurse: competent, in control, and entitled to decide.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-091"},{unit:8,topic:"u8-empower",type:"mcq",situational:!0,difficulty:3,stem:"A newly promoted head nurse can assign staff and approve leaves, but she feels unsure, unheard by administration, and powerless to change anything. Which statement best explains this?",options:["She is experiencing mobbing","It is possible to have power but not feel empowered","She is empowered because she has authority","She is in the latent stage of conflict"],answer:1,aliases:[],rationale:"She has power (ability to influence staff) but lacks the psychological state of empowerment. The module says these can be separate.",whyNot:{0:"Nobody is targeting her as a group.",2:"Authority is not the same as feeling empowered.",3:"That is a conflict stage, not the power vs empowerment idea."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-092"},{unit:8,topic:"u8-empower",type:"id",situational:!1,difficulty:2,stem:"Component of empowerment where nurses feel free to decide how to perform their tasks.",answer:"Self-determination",aliases:["self determination"],rationale:"Self-determination = freedom to decide how to do your work.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-093"},{unit:8,topic:"u8-empower",type:"id",situational:!1,difficulty:2,stem:"Component of empowerment where nurses believe their contributions are valuable and make a difference in patient outcomes.",answer:"Impact",aliases:[],rationale:'Impact = "my work makes a difference."',mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-094"},{unit:8,topic:"u8-empower",type:"id",situational:!1,difficulty:2,stem:"Component of empowerment where nurses care deeply about their work and find it fulfilling.",answer:"Meaning",aliases:[],rationale:"Meaning = the work matters to you personally.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-095"},{unit:8,topic:"u8-empower",type:"id",situational:!1,difficulty:2,stem:"Component of empowerment where nurses feel confident in their ability to perform tasks effectively.",answer:"Competence",aliases:[],rationale:'Competence = "I can do this well."',mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-096"},{unit:8,topic:"u8-empower",type:"mcq",situational:!0,difficulty:2,stem:'Nurse Fe says, "Because I taught my patient about foot care, he avoided amputation. My work really changes outcomes." Which empowerment component is she showing?',options:["Meaning","Competence","Self-determination","Impact"],answer:3,aliases:[],rationale:"She believes her contribution made a difference in patient outcomes.",whyNot:{0:"Meaning is finding the work fulfilling. Her focus is on the difference she made.",1:"That is confidence in one's abilities.",2:"That is freedom to decide how to do tasks."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-097"},{unit:8,topic:"u8-empower",type:"mcq",situational:!0,difficulty:2,stem:"The unit lets each nurse choose the order in which she does her morning care, as long as it is safe. Which empowerment component does this support?",options:["Self-determination","Competence","Impact","Meaning"],answer:0,aliases:[],rationale:"Nurses are free to decide how to perform their tasks.",whyNot:{1:"Competence is confidence in abilities.",2:"Impact is about outcomes, not choice of method.",3:"Meaning is fulfillment in the work."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-098"},{unit:8,topic:"u8-empower",type:"mcq",situational:!1,difficulty:2,stem:"Which is NOT one of the four components of empowerment in the module?",options:["Competence","Meaning","Authority","Impact"],answer:2,aliases:[],rationale:"The four are self-determination, meaning, competence, and impact. Authority is not listed.",whyNot:{0:"Competence is component 3.",1:"Meaning is component 2.",3:"Impact is component 4."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-099"},{unit:8,topic:"u8-empower",type:"id",situational:!1,difficulty:2,stem:"The opposite of empowerment, when nurses lose control over their practice, leading to frustration, emotional exhaustion, and burnout.",answer:"Disempowerment",aliases:["disempowered"],rationale:"Disempowerment is losing control over practice.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-100"},{unit:8,topic:"u8-empower",type:"mcq",situational:!0,difficulty:2,stem:"A nurse has 15 patients each shift, is never thanked, and has no say in unit decisions. She feels emotionally exhausted and is close to burnout. What does this describe?",options:["Self-respect","Intergroup conflict","Disempowerment","Empowerment"],answer:2,aliases:[],rationale:"Workload overload, lack of recognition, and no decision-making authority are the module's causes of disempowerment.",whyNot:{0:"Self-respect is an internal sense of competence. She is losing that.",1:"There are no two groups in conflict here.",3:"She feels the opposite of competent and in control."},mnemonic:"",note:'Source note: the module says these factors "contribute to this empowerment". From context it most likely means "disempowerment". Please verify.',sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-101"},{unit:8,topic:"u8-empower",type:"mcq",situational:!1,difficulty:2,stem:"Which three factors does the module list as causes of disempowerment?",options:["Forewarning, consistency, impartiality","Self-determination, meaning, impact","Workload overload, lack of recognition, insufficient decision-making authority","Mentorship, recognition, skill development"],answer:2,aliases:[],rationale:"These three are listed in the module.",whyNot:{0:"These are Hot Stove rules from Unit 9.",1:"These are components of empowerment.",3:"These are strategies to ENHANCE self-esteem."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Psychological / Structural Empowerment",id:"U8-102"},{unit:8,topic:"u8-orgs",type:"id",situational:!1,difficulty:1,stem:"According to the module, nurses can gain empowerment by joining these, which provide a platform for collective advocacy and a voice to influence healthcare policy.",answer:"Professional organizations",aliases:["professional organization","nursing organizations","professional associations"],rationale:"Professional organizations give nurses a collective voice in healthcare policy.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Professional Organizations / Collective Bargaining",id:"U8-103"},{unit:8,topic:"u8-orgs",type:"id",situational:!1,difficulty:2,stem:"Involves unions that aim to equalize power between employees and employers.",answer:"Collective bargaining",aliases:[],rationale:"Through a union, employees bargain as a group, which balances power with the employer.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Professional Organizations / Collective Bargaining",id:"U8-104"},{unit:8,topic:"u8-orgs",type:"mcq",situational:!1,difficulty:2,stem:"According to Unit 8, what is a downside of collective bargaining?",options:["It always ends in a lose-lose compromise","It removes nurses' right to join professional organizations","It may create staff-management conflict and can put patient care at risk during strikes","It reduces job security"],answer:2,aliases:[],rationale:"The module lists both downsides.",whyNot:{0:"The module does not say this.",1:"The module does not say this.",3:"The module says it can IMPROVE job security."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Professional Organizations / Collective Bargaining",id:"U8-105"},{unit:8,topic:"u8-orgs",type:"mcq",situational:!0,difficulty:2,stem:"Nurses at a private hospital want a stronger voice in changing national staffing ratios. Which option in Unit 8 best gives them collective advocacy and influence on healthcare policy?",options:["Joining professional organizations","Avoiding the conflict","Smoothing","Self-appraisal"],answer:0,aliases:[],rationale:"The module says professional organizations provide collective advocacy and a powerful voice to influence healthcare policy.",whyNot:{1:"Avoiding does nothing to change policy.",2:"Smoothing calms tension. It does not influence policy.",3:"Self-appraisal is a Unit 9 performance tool."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Professional Organizations / Collective Bargaining",id:"U8-106"},{unit:9,topic:"u9-control",type:"id",situational:!1,difficulty:1,stem:"Assessing the progress of work from time to time so that actual progress matches expected progress, and taking corrective action when it does not.",answer:"Control",aliases:["controlling"],rationale:"Control checks actual vs expected progress, finds deviations, and corrects them so mistakes are not repeated.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling (definition and controlling phase)",id:"U9-001"},{unit:9,topic:"u9-control",type:"id",situational:!1,difficulty:2,stem:"In control, when actual progress does not match expected progress, these are found out and corrective action is taken.",answer:"Deviations",aliases:["deviation"],rationale:"Deviations are the gaps between actual and expected progress.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling (definition and controlling phase)",id:"U9-002"},{unit:9,topic:"u9-control",type:"mcq",situational:!1,difficulty:2,stem:"Which statement about the controlling phase is correct according to the module?",options:["It replaces planning, organizing, and directing","It is cyclic and ongoing throughout the management phases","It is done only after a sentinel event","It happens only once, at the end of the fiscal year"],answer:1,aliases:[],rationale:"The module says controlling is cyclic and ongoing, not a one-time final step.",whyNot:{0:"Controlling works with the other phases. It does not replace them.",2:"Sentinel events trigger investigation, but controlling happens all the time.",3:"Controlling is continuous, not once a year."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling (definition and controlling phase)",id:"U9-003"},{unit:9,topic:"u9-control",type:"mcq",situational:!0,difficulty:2,stem:"A head nurse checks at mid-shift that only 60% of scheduled medications have been given, when 80% was expected. She reassigns a nurse to help. Which management function is she doing?",options:["Supervision of collaborative peers only","Smoothing","Controlling","Planning"],answer:2,aliases:[],rationale:"She compared actual with expected progress, found the deviation, and took corrective action.",whyNot:{0:"The core action is comparing performance to a standard and correcting it, which is controlling.",1:"Smoothing is a conflict strategy.",3:"Planning sets goals in advance. She is checking progress against them."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling (definition and controlling phase)",id:"U9-004"},{unit:9,topic:"u9-control",type:"mcq",situational:!1,difficulty:2,stem:"According to the controlling phase, how do employees who influence outcomes feel?",options:["More motivated and satisfied","Disempowered","More resentful","Indifferent"],answer:0,aliases:[],rationale:"The module states employees who influence outcomes feel more motivated and satisfied.",whyNot:{1:"Influencing outcomes is the opposite of disempowerment.",2:"Resentment is linked to accommodating in Unit 8.",3:"The module says the opposite."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling (definition and controlling phase)",id:"U9-005"},{unit:9,topic:"u9-control",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, organizations need control over which three areas?",options:["Salaries, holidays, and leaves","Forewarning, consistency, and impartiality","Productivity, innovation, and quality","Meaning, impact, and competence"],answer:2,aliases:[],rationale:"The controlling phase lists productivity, innovation, and quality.",whyNot:{0:"Those are Labor Code topics in Unit 12.",1:"Those are Hot Stove rules.",3:"Those are empowerment components."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling (definition and controlling phase)",id:"U9-006"},{unit:9,topic:"u9-qc",type:"id",situational:!1,difficulty:1,stem:"Activities used to evaluate, monitor, or regulate services rendered to consumers or clients.",answer:"Quality control",aliases:["QC"],rationale:"Quality control evaluates, monitors, or regulates the services clients receive.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control as a Process",id:"U9-007"},{unit:9,topic:"u9-qc",type:"mcq",situational:!1,difficulty:2,stem:"Why is defining and measuring healthcare quality difficult, according to the module?",options:["Healthcare has no standards","It involves both quantitative and qualitative data collection","It only uses patient satisfaction surveys","It can only be measured by the DOH"],answer:1,aliases:[],rationale:"The module says quality needs both numbers and descriptions, which makes it hard to define and measure.",whyNot:{0:"Healthcare has many standards. The challenge is measuring quality.",2:"Surveys are only one source of data.",3:"The module does not say this."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control as a Process",id:"U9-008"},{unit:9,topic:"u9-qc",type:"id",situational:!1,difficulty:2,stem:"In the 3 BASIC steps of quality control, this is step 1.",answer:"Determine the criterion or standard",aliases:["determine the criterion","determine the standard","set the standard","criterion"],rationale:"You cannot measure performance without first deciding what the standard is.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control as a Process",id:"U9-009"},{unit:9,topic:"u9-qc",type:"mcq",situational:!1,difficulty:2,stem:"Using the module's 3 BASIC steps of quality control, what is step 3?",options:["Benchmarking","Analyze information","Take educational or corrective action if the criterion is unmet","Reevaluation"],answer:2,aliases:[],rationale:"The three basic steps are: determine the standard, collect information, then take educational or corrective action.",whyNot:{0:"Benchmarking is part of determining the standard.",1:"In the 3-step version, analysis is not a separate step. It appears as step 4 of the detailed 5-step process.",3:"Reevaluation is step 5 of the detailed process."},mnemonic:"",note:"Source note: the module first lists quality control as 3 basic steps, then details it as a 5-step process. This question uses the 3-step version.",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control as a Process",id:"U9-010"},{unit:9,topic:"u9-qc",type:"mcq",situational:!0,difficulty:2,stem:"A unit wants to check if nurses do safe insulin administration. In order, what are the 3 BASIC quality control steps?",options:["Punish, retrain, reevaluate","Collect information, set the standard, reevaluate","Benchmark, sue, retrain","Set the standard, collect information on whether it is met, take educational or corrective action"],answer:3,aliases:[],rationale:"These are the module's 3 basic steps.",whyNot:{0:"Quality control is not punishment first.",1:"The standard must come first. You cannot judge data without a standard.",2:"Suing is not a quality control step."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control as a Process",id:"U9-011"},{unit:9,topic:"u9-qcprocess",type:"id",situational:!1,difficulty:2,stem:"Comparing performance against best practices when determining the standard.",answer:"Benchmarking",aliases:["benchmark"],rationale:"Benchmarking compares your performance with the best practices of others.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-012"},{unit:9,topic:"u9-qcprocess",type:"id",situational:!1,difficulty:2,stem:"The difference between top-performing organizations and the national average.",answer:"Quality gap",aliases:["the quality gap"],rationale:"The quality gap shows how far the average is from the best performers.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-013"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!0,difficulty:2,stem:"A Bulacan hospital compares its surgical-site infection rate with that of the top-performing hospitals in the country to set its target. What is this practice called?",options:["Root cause analysis","Quality gap","Concurrent audit","Benchmarking"],answer:3,aliases:[],rationale:"Comparing performance against best practices is benchmarking.",whyNot:{0:"RCA investigates why an error happened.",1:"The quality gap is the difference itself, not the act of comparing.",2:"An audit while the patient receives care is a different activity."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-014"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!0,difficulty:3,stem:"Top-performing hospitals have a 1% fall rate. The national average is 4%. What does the 3% difference represent?",options:["Benchmark","Sentinel event","Quality gap","Deviation from Hot Stove rules"],answer:2,aliases:[],rationale:"The quality gap is the difference between top-performing organizations and the national average.",whyNot:{0:"The benchmark is the best-practice level itself (1%), not the difference.",1:"A sentinel event is one serious patient safety event.",3:"Hot Stove rules are about discipline."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-015"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!1,difficulty:2,stem:"In the detailed QC process, step 1 says performance measurement is impossible without what?",options:["A labor union","A sentinel event","Clear standards that employees understand","A self-appraisal"],answer:2,aliases:[],rationale:"The module says measurement is impossible without clear standards, and employees must understand them.",whyNot:{0:"Unions are unrelated to step 1.",1:"You do not need an adverse event to measure performance.",3:"Self-appraisal is a performance evaluation tool."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-016"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!0,difficulty:2,stem:"For post-operative care, the QC team lists vital signs, dressing checks, and sensory checks as the data needed. Which detailed QC step is this?",options:["Step 2: collect information to determine if the standard is met","Step 4: analyze information","Step 1: determine the criterion","Step 5: reevaluation"],answer:0,aliases:[],rationale:"The module's step 2 example is exactly post-op vital signs, dressing checks, and sensory checks.",whyNot:{1:"Analysis compares the data with the standard.",2:"Step 1 sets the standard itself.",3:"Reevaluation repeats the check later."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-017"},{unit:9,topic:"u9-qcprocess",type:"id",situational:!1,difficulty:2,stem:"Name the detailed QC step where the manager gathers data from patient charts, flow sheets, and nurse's notes and compares performance with standards.",answer:"Take educational or corrective action",aliases:["educational or corrective action","corrective action","step 3"],rationale:"In the module's detailed list, step 3 includes gathering data from charts, flow sheets, and nurse's notes and comparing them with standards.",mnemonic:"",note:`Source note: in the detailed 5-step list, step 3 is titled "take educational or corrective action" but its bullets describe gathering data from charts and comparing it with standards. The answer follows the module's layout as written.`,sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-018"},{unit:9,topic:"u9-qcprocess",type:"id",situational:!1,difficulty:2,stem:"Detailed QC step where actual performance (e.g., frequency of post-op vital sign checks) is compared with the standard and the reasons for discrepancies are found.",answer:"Analyze information",aliases:["analyzing information","analysis","step 4"],rationale:"Step 4 compares actual with standard and finds why the standard was not met.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-019"},{unit:9,topic:"u9-qcprocess",type:"id",situational:!1,difficulty:2,stem:"Error investigation tool named in QC step 4, abbreviated CEA.",answer:"Computer-aided error analysis",aliases:["computer aided error analysis","CEA"],rationale:"The module names computer-aided error analysis (CEA) and root cause analysis (RCA) as tools to investigate errors.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-020"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!0,difficulty:2,stem:"The QC nurse finds that post-op vital signs were checked only every 4 hours instead of every hour. She uses RCA to find out why. Which QC step is she in?",options:["Reevaluation","Analyze information","Collect information","Determine the criterion"],answer:1,aliases:[],rationale:"Comparing actual with standard, identifying the discrepancy, and using RCA or CEA to find why is step 4.",whyNot:{0:"Reevaluation comes after the analysis and correction.",2:"Data were already collected. She is now analyzing them.",3:"The criterion (every hour) was already set."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-021"},{unit:9,topic:"u9-qcprocess",type:"id",situational:!1,difficulty:2,stem:"Final step of the detailed QC process, done infrequently if standards are consistently met and frequently if not.",answer:"Reevaluation",aliases:["re-evaluation","reevaluate"],rationale:"Reevaluation frequency depends on performance: met often means check less often.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-022"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!0,difficulty:2,stem:"For six months, every audit shows 100% compliance with the hand hygiene standard. What does the module say about reevaluation?",options:["Reevaluation should stop forever","Reevaluation must become more frequent","A root cause analysis is required","Reevaluation can be infrequent because the standard is consistently met"],answer:3,aliases:[],rationale:"The module says reevaluation can be infrequent when standards are consistently met.",whyNot:{0:"QC is ongoing. It becomes less frequent, not stopped.",1:"Frequent reevaluation is for standards that are NOT met.",2:"RCA is for errors, not for consistent compliance."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-023"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!1,difficulty:3,stem:"According to QC step 5, what do leaders push for?",options:["Punishment for every unmet standard","Maximal standards and proactive quality control","Annual quality checks only","Minimal standards to make goals easy to reach"],answer:1,aliases:[],rationale:"The module says leaders push for maximal standards and proactive quality control.",whyNot:{0:"QC focuses on educational and corrective action.",2:"Ongoing QC prevents problems before they affect productivity or quality.",3:"The module says maximal, not minimal."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-024"},{unit:9,topic:"u9-qcprocess",type:"mcq",situational:!1,difficulty:2,stem:"Which is the correct order of the detailed 5-step QC process?",options:["Determine criterion, analyze, collect information, reevaluate, take action","Determine criterion, collect information, take corrective action, analyze information, reevaluate","Reevaluate, determine criterion, collect, analyze, take action","Collect information, determine criterion, analyze, take action, reevaluate"],answer:1,aliases:[],rationale:"This is the order as written in the module's detailed process.",whyNot:{0:"Data must be collected before analysis.",2:"Reevaluation is the last step.",3:"The criterion must come first."},mnemonic:"",note:`Source note: the module's 5-step order places "take educational or corrective action" (3) before "analyze information" (4). This question uses the order exactly as written.`,sourceTag:"Unit 9 \u203A Controlling \u203A Quality Control Process",id:"U9-025"},{unit:9,topic:"u9-standards",type:"id",situational:!1,difficulty:1,stem:"A predetermined level of excellence that guides practice.",answer:"Standard",aliases:["standards"],rationale:"A standard is set in advance and guides practice.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards",id:"U9-026"},{unit:9,topic:"u9-standards",type:"id",situational:!1,difficulty:2,stem:"Characteristic of a standard meaning it is established before evaluation.",answer:"Predetermined",aliases:["pre-determined"],rationale:"Standards must exist before you evaluate anyone.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards",id:"U9-027"},{unit:9,topic:"u9-standards",type:"mcq",situational:!1,difficulty:2,stem:"Which is NOT one of the three characteristics of a standard?",options:["Predetermined","Kept confidential from staff","Communicated and accepted by those affected","Established by an authority"],answer:1,aliases:[],rationale:"A standard must be communicated to and accepted by those affected, so it cannot be kept secret.",whyNot:{0:"This is a characteristic.",2:"This is a characteristic.",3:"This is a characteristic."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards",id:"U9-028"},{unit:9,topic:"u9-standards",type:"mcq",situational:!0,difficulty:2,stem:"A new policy on fall prevention was written by the head nurse alone and never announced. Staff are now graded on it. Which characteristic of a standard is missing?",options:["Measurable","Communicated and accepted by those affected","Achievable","Predetermined"],answer:1,aliases:[],rationale:"Staff never heard of it, so it was not communicated or accepted.",whyNot:{0:"Being measurable is a quality of standards, but the clear problem here is lack of communication.",2:"The case does not say it is impossible to achieve.",3:"It was set before grading, so it is predetermined."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards",id:"U9-029"},{unit:9,topic:"u9-standards",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, standards should be:",options:["Set only by the patient","Objective, measurable, and achievable","Identical in every organization","Subjective, flexible, and secret"],answer:1,aliases:[],rationale:"The module states standards are objective, measurable, and achievable.",whyNot:{0:"Standards are established by an authority.",2:"Each organization and profession defines its own standards.",3:"Standards must be objective and communicated."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards",id:"U9-030"},{unit:9,topic:"u9-orgstd",type:"id",situational:!1,difficulty:2,stem:"Document that usually outlines an organization's standards.",answer:"Policy and procedures manual",aliases:["policy and procedure manual","policies and procedures manual","P&P manual"],rationale:"Organizations write their standards in a policy and procedures manual.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Organizational Standards",id:"U9-031"},{unit:9,topic:"u9-orgstd",type:"mcq",situational:!0,difficulty:2,stem:"A new nurse asks how her hospital expects an NGT to be inserted and checked. Where should she look for the organizational standard?",options:["Her self-appraisal","The hospital's policy and procedures manual","The Labor Code","RA 9288"],answer:1,aliases:[],rationale:"Organizational standards are usually outlined in the policy and procedures manual.",whyNot:{0:"Self-appraisal is a reflection on her own work, not a standard.",2:"The Labor Code covers employment, not clinical procedures.",3:"RA 9288 is the Newborn Screening Act."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Organizational Standards",id:"U9-032"},{unit:9,topic:"u9-orgstd",type:"mcq",situational:!1,difficulty:2,stem:"What do organizational standards allow, according to the module?",options:["Legal immunity from negligence","Objective measurement of both unit and individual performance","Avoiding all audits","Automatic salary increases"],answer:1,aliases:[],rationale:"The module says organizational standards allow objective measurement of unit and individual performance.",whyNot:{0:"Standards do not give immunity.",2:"Standards are what audits measure against.",3:"The module does not link standards to raises (weighted checklists are linked to merit raises)."},mnemonic:"",note:'Source note: the module says standards are developed by "regularizations". It most likely means "organizations". Please verify.',sourceTag:"Unit 9 \u203A Controlling \u203A Organizational Standards",id:"U9-033"},{unit:9,topic:"u9-cpg",type:"id",situational:!1,difficulty:2,stem:"Standardized guidelines that give step-by-step interventions based on diagnosis to promote high-quality care while controlling costs. Abbreviated CPGs.",answer:"Clinical practice guidelines",aliases:["clinical practice guideline","CPG","CPGs"],rationale:"CPGs are diagnosis-based, step-by-step, and evidence-based.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Clinical Practice Guidelines (CPGs)",id:"U9-034"},{unit:9,topic:"u9-cpg",type:"id",situational:!1,difficulty:3,stem:"Agency given in the module as an example source of clinical practice guidelines (AHRQ).",answer:"Agency for Healthcare Research and Quality",aliases:["AHRQ"],rationale:"The module names the Agency for Healthcare Research and Quality (AHRQ).",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Clinical Practice Guidelines (CPGs)",id:"U9-035"},{unit:9,topic:"u9-cpg",type:"mcq",situational:!1,difficulty:2,stem:"How are clinical practice guidelines developed, according to the module?",options:["By a vote of the labor union","From one patient's complaint","From the opinion of the most senior nurse","After an extensive literature review"],answer:3,aliases:[],rationale:"CPGs are developed after an extensive literature review.",whyNot:{0:"Unions negotiate work terms, not clinical guidelines.",1:"One complaint is not a literature review.",2:"CPGs are evidence-based, not based on one person's opinion."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Clinical Practice Guidelines (CPGs)",id:"U9-036"},{unit:9,topic:"u9-cpg",type:"mcq",situational:!0,difficulty:2,stem:"A hospital adopts a step-by-step pneumonia care guide that tells nurses which interventions to do for that diagnosis, aiming for high-quality care while reducing unnecessary costs. What is this?",options:["A structure audit","A clinical practice guideline","A job dimension scale","A Hot Stove rule"],answer:1,aliases:[],rationale:"Step-by-step, diagnosis-based care that controls resources and costs is a CPG.",whyNot:{0:"A structure audit checks resources and environment.",2:"That is a performance appraisal tool.",3:"Hot Stove rules are for discipline."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Clinical Practice Guidelines (CPGs)",id:"U9-037"},{unit:9,topic:"u9-bon",type:"id",situational:!1,difficulty:1,stem:"In the Philippines, the body responsible for developing and regulating nursing professional standards, under the authority of the PRC.",answer:"Board of Nursing",aliases:["BON","PRC Board of Nursing"],rationale:"The BON, under the PRC, sets standards for nursing practice, education, and licensure.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards (Philippines)",id:"U9-038"},{unit:9,topic:"u9-bon",type:"mcq",situational:!1,difficulty:2,stem:"The BON establishes and upholds standards for which three areas?",options:["Salaries, overtime, and holidays","Hospital buildings, equipment, and parking","Union registration, strikes, and bargaining","Nursing practice, education, and licensure"],answer:3,aliases:[],rationale:"The module lists practice, education, and licensure.",whyNot:{0:"Those are Labor Code topics.",1:"DOH licensing covers facilities.",2:"DOLE oversees labor matters."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards (Philippines)",id:"U9-039"},{unit:9,topic:"u9-bon",type:"mcq",situational:!0,difficulty:2,stem:"A nursing graduate wants to know who regulates the standards for the licensure exam she will take. Which body is it?",options:["DOLE","The Joint Commission","The Board of Nursing under the PRC","AHRQ"],answer:2,aliases:[],rationale:"The BON under the PRC establishes standards for licensure.",whyNot:{0:"DOLE oversees labor laws.",1:"The JC accredits US healthcare organizations.",3:"AHRQ develops clinical guidelines in the US."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Development of Standards (Philippines)",id:"U9-040"},{unit:9,topic:"u9-audit",type:"id",situational:!1,difficulty:1,stem:"A systematic and official examination of a record, process, structure, environment, or account to evaluate performance.",answer:"Audit",aliases:["auditing"],rationale:"An audit is the formal way managers check quality of services.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Audit",id:"U9-041"},{unit:9,topic:"u9-audit",type:"id",situational:!1,difficulty:2,stem:"Audit performed AFTER the patient receives the service.",answer:"Retrospective audit",aliases:["retrospective"],rationale:"Retro = looking back.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Audit",id:"U9-042"},{unit:9,topic:"u9-audit",type:"id",situational:!1,difficulty:2,stem:"Audit performed WHILE the patient is receiving the service.",answer:"Concurrent audit",aliases:["concurrent"],rationale:"Concurrent = at the same time.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Audit",id:"U9-043"},{unit:9,topic:"u9-audit",type:"id",situational:!1,difficulty:2,stem:"Audit that tries to identify how future performance will be affected by current interventions.",answer:"Prospective audit",aliases:["prospective"],rationale:"Prospective = looking forward.",mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Audit",id:"U9-044"},{unit:9,topic:"u9-audit",type:"mcq",situational:!0,difficulty:2,stem:"The QA nurse reviews the charts of patients discharged last month to check if discharge teaching was documented. Which audit timing is this?",options:["Concurrent","Structure","Retrospective","Prospective"],answer:2,aliases:[],rationale:"The patients already received the service, so the audit looks back.",whyNot:{0:"Concurrent audits happen while care is ongoing.",1:"Structure is a type of audit by focus, not by timing.",3:"Prospective audits predict future performance."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Audit",id:"U9-045"},{unit:9,topic:"u9-audit",type:"mcq",situational:!0,difficulty:2,stem:"While patients are still admitted, the QA nurse observes nurses on the ward to see if they check two identifiers before giving meds. Which audit timing is this?",options:["Prospective","Concurrent","Retrospective","Outcome"],answer:1,aliases:[],rationale:"The audit happens while patients are receiving the service.",whyNot:{0:"Prospective audits look at future performance.",2:"Retrospective audits are done after discharge or after the service.",3:"Outcome is a type of audit by focus."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Audit",id:"U9-046"},{unit:9,topic:"u9-audit",type:"mcq",situational:!0,difficulty:3,stem:"The QA team studies how the new bedside handoff system started this month will affect next year's error rates. Which audit timing is this?",options:["Concurrent","Retrospective","Prospective","Root cause analysis"],answer:2,aliases:[],rationale:"It looks at how future performance will be affected by current interventions.",whyNot:{0:"Concurrent audits check care as it happens.",1:"Retrospective audits look back at completed care.",3:"RCA investigates errors after they happen."},mnemonic:"",note:"",sourceTag:"Unit 9 \u203A Controlling \u203A Audit",id:"U9-047"},{unit:9,topic:"u9-audittypes",type:"id",situational:
