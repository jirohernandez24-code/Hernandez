(function(){
  if (window.storage && typeof window.storage.get === "function") return;
  var handle = null;
  function getHandle(){
    if (!handle) handle = (async function(){
      try {
        if (!window.claude || typeof window.claude.use !== "function") return null;
        var parts = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        var db = parts[0], user = parts[1];
        if (!db || !user) return null;
        var id = await user.id();
        return id ? { db: db, id: id } : null;
      } catch (e) { return null; }
    })();
    return handle;
  }
  function ref(h, key){ return h.db.doc("data/users/" + h.id + "/" + key); }
  window.storage = {
    get: async function(key){
      var h = await getHandle();
      if (!h) throw new Error("storage unavailable");
      var snap = await ref(h, key).get();
      var d = snap.exists ? snap.data() : null;
      return d ? { key: key, value: d.value } : null;
    },
    set: async function(key, value){
      var h = await getHandle();
      if (!h) throw new Error("storage unavailable");
      await ref(h, key).set({ value: value, savedAt: Date.now() });
      return { key: key, value: value };
    }
  };
})();</script>

nemonic:""},{id:"u8-inter",unit:8,title:"Interpersonal conflict",section:"Conflict Management \u203A Types of Conflict",summary:"Interpersonal conflict happens BETWEEN two or more people with differing values, goals, or beliefs. People-focused = based on emotions and feelings, often seen as personal attacks. Issue-focused = centered on specific issues or events, usually handled by calm negotiation. Sources: informational deficiencies (miscommunication or differing interpretations) and role incompatibility (assigned responsibilities vs personal preferences).",mnemonic:""},{id:"u8-intergroup",unit:8,title:"Intergroup conflict",section:"Conflict Management \u203A Types of Conflict",summary:"Intergroup conflict happens between two or more groups, departments, or organizations. Module examples: conflicting beliefs between political affiliations, or nurses balancing work and family issues.",mnemonic:""},{id:"u8-process",unit:8,title:"The conflict process (5 stages)",section:"Conflict Management \u203A The Conflict Process",summary:"1 Latent: conditions are ripe because of antecedent factors; conflict has not happened yet (hospital is short staffed). 2 Perceived: recognized logically and impersonally as an issue of rules or resources; not yet emotional; may be solved here by open communication and mutual support (relative notices delays). 3 Felt (affective): emotional, with hostility, fear, mistrust, or anger (relative believes care is neglected). 4 Manifest (overt): action is taken: withdrawing, competing, debating, or resolving; fear of retaliation, ridicule, alienation, or past experiences can stop people from acting; socialization and gender roles affect responses (relative raises voice; head nurse listens and reviews the care plan). 5 Aftermath: positive or negative outcome; poorly managed conflict re-emerges.",mnemonic:"Lazy Penguins Feel Mad After = Latent, Perceived, Felt, Manifest, Aftermath"},{id:"u8-winwin",unit:8,title:"Goal of conflict resolution",section:"Conflict Management \u203A Conflict Resolution Strategies",summary:"The optimal goal is a win-win solution for everyone. It is not always possible. Often the manager's goal is to manage the conflict in a way that lessens the perceptual differences between the parties.",mnemonic:""},{id:"u8-strategies",unit:8,title:"Conflict resolution strategies",section:"Conflict Management \u203A Conflict Resolution Strategies",summary:"Compromising: each party gives up something; best when each gives up something of EQUAL value, otherwise it can become lose-lose (shift swap). Competing: one party pursues its goals at others' expense = win-lose; used when quick decisions are needed or one party has more knowledge (manager imposes policy without consulting). Cooperating/Accommodating: one party sacrifices its needs so the other wins; politically useful but leaves resentment (nurse takes extra patients hoping for a future favor). Smoothing: pacifies the other party and focuses on agreements over differences; reduces emotion but may not resolve the issue. Avoiding: ignoring the conflict; fine for trivial issues or when cost of resolution exceeds benefit; the issue may fester (nurse ignores colleague's behavior, morale drops). Collaborating: assertive AND cooperative, win-win; needs mutual respect and open communication (nurse and supervisor build a schedule together).",mnemonic:""},{id:"u8-stress",unit:8,title:"Work-related stress: bullying, incivility, mobbing, workplace violence",section:"Conflict Management \u203A Work-related Stress",summary:"Bullying: REPEATED, health-harming mistreatment of one or more targets by one or more perpetrators; abusive, threatening, humiliating, or intimidating; a pattern, not a one-time incident. Incivility: rude or disrespectful behavior on a continuum from subtle acts (eye rolling, sarcastic comments) to overt intimidation or violence. Mobbing: a GROUP of employees collectively targets one individual with harassment, bullying, or isolation (excluding, spreading rumors). Workplace violence: behaviors that cause physical harm or psychological distress; includes physical violence plus bullying, incivility, and mobbing (family member threatens a nurse).",mnemonic:""},{id:"u8-esteem",unit:8,title:"Self-esteem",section:"Conflict Management \u203A Enhancing Self-Esteem",summary:"Self-esteem = the perception of one's own worth and abilities. Maslow's two categories: Self-respect (internal: confidence, achievement, independence, competence) and Respect from others (external: recognition, status, prestige, appreciation). High self-esteem: confident, assertive, better at handling conflict, positive communication, prevents escalation. Low self-esteem: avoidance or passive behavior that may worsen disputes; may feel powerless or disengaged, affecting patient care and team dynamics. Strategies: 1 positive feedback and recognition, 2 opportunities for skill development, 3 mentorship programs.",mnemonic:""},{id:"u8-supervision",unit:8,title:"Supervision",section:"Conflict Management \u203A Supervision",summary:"Supervision = actively overseeing the work of others with ongoing checking of progress. Direct oversight: the supervisor periodically checks in with staff. Supervision is more critical in hierarchical relationships (RN to nursing assistant). Collaborative relationships (RN to RN) usually involve consulting and advice, not direct supervision. Example: a nursing assistant is behind schedule 3 hours into the shift; the supervising RN assesses the situation (a patient complication or being called away), re-evaluates the assignment, and redistributes tasks so patient care is completed.",mnemonic:""},{id:"u8-empower",unit:8,title:"Power, empowerment, and disempowerment",section:"Conflict Management \u203A Psychological / Structural Empowerment",summary:"Empowerment in nursing = enabling nurses to take control of their professional practice, improve working conditions, and grow professionally; it has psychological and practical elements. Power = the ability to influence others, even against resistance. Empowerment = a psychological state where nurses feel competent, in control, and entitled to make decisions about their practice. You can have power and not feel empowered. 4 components: Self-determination (free to decide how to do tasks), Meaning (care deeply, find work fulfilling), Competence (confident in abilities), Impact (believe contributions make a difference in patient outcomes). Disempowerment = the opposite: nurses lose control over their practice, leading to frustration, emotional exhaustion, and burnout; caused by workload overload, lack of recognition, and insufficient decision-making authority.",mnemonic:'Empowerment = "S-M-C-I": Self-determination, Meaning, Competence, Impact'},{id:"u8-orgs",unit:8,title:"Professional organizations and collective bargaining",section:"Conflict Management \u203A Professional Organizations / Collective Bargaining",summary:"Nurses gain empowerment by joining professional organizations, which offer a platform for collective advocacy and a powerful voice to influence healthcare policy. Collective bargaining involves unions that aim to equalize power between employees and employers; it can improve working conditions, job security, and empowerment. Downsides: it may create conflict between staff and management and can put patient care at risk during strikes.",mnemonic:""},{id:"u9-control",unit:9,title:"Control and the controlling phase",section:"Controlling (definition and controlling phase)",summary:"Control = assessing the progress of work from time to time so actual progress matches expected progress; if not, deviations are found and corrective action is taken so mistakes are not repeated. Controlling phase: performance is measured against standards; actions correct discrepancies between standards and actual performance; employees who influence outcomes feel more motivated and satisfied; organizations need control over productivity, innovation, and quality; controlling is cyclic and ongoing throughout the management phases.",mnemonic:""},{id:"u9-qc",unit:9,title:"Quality control (definition and 3 basic steps)",section:"Controlling \u203A Quality Control as a Process",summary:"Defining and measuring healthcare quality is difficult; it needs both quantitative and qualitative data. Quality control = activities used to evaluate, monitor, or regulate services rendered to consumers or clients. The module first breaks it into 3 basic steps: 1 determine the criterion or standard; 2 collect information to determine if the standard is met; 3 take educational or corrective action if the criterion is unmet. (The module then details the process in 5 steps; see the next topic.)",mnemonic:""},{id:"u9-qcprocess",unit:9,title:"Quality control process (detailed 5 steps)",section:"Controlling \u203A Quality Control Process",summary:"1 Determine the criterion or standard: measurement is impossible without clear standards; employees must understand them; benchmarking compares performance with best practices; the quality gap is the difference between top-performing organizations and the national average. 2 Collect information to determine if the standard is met: identify the information needed for performance measurement (post-op: vital signs, dressing checks, sensory checks). 3 Take educational or corrective action if the criterion is unmet: gather data from charts, flow sheets, nurse's notes; the manager compares performance with standards. 4 Analyze information: compare actual performance (e.g., frequency of post-op vital signs) with standards; find discrepancies and why; computer-aided error analysis (CEA) or root cause analysis (RCA) may be used. 5 Reevaluation: infrequent if standards are consistently met, frequent if not; ongoing QC prevents problems; leaders push for maximal standards and proactive quality control.",mnemonic:""},{id:"u9-standards",unit:9,title:"Development of standards",section:"Controlling \u203A Development of Standards",summary:"Standard = a predetermined level of excellence that guides practice. Characteristics: predetermined (set before evaluation), established by an authority (a recognized body or institution), communicated to and accepted by those affected. Standards are objective, measurable, and achievable. Each organization and profession defines its own standards for safe and effective care.",mnemonic:'Standards are "P-E-C": Predetermined, Established by authority, Communicated and accepted'},{id:"u9-orgstd",unit:9,title:"Organizational standards",section:"Controlling \u203A Organizational Standards",summary:"Organizational standards are developed by organizations to define acceptable practice. Each organization usually has a policy and procedures manual outlining them. They allow objective measurement of both unit and individual performance.",mnemonic:""},{id:"u9-cpg",unit:9,title:"Clinical practice guidelines",section:"Controlling \u203A Clinical Practice Guidelines (CPGs)",summary:"CPGs (standardized clinical guidelines) give step-by-step interventions based on diagnosis, to promote high-quality care while controlling resource use and costs. They are developed after an extensive literature review and recommend interventions for the best patient outcomes. Example: guidelines from the Agency for Healthcare Research and Quality (AHRQ).",mnemonic:""},{id:"u9-bon",unit:9,title:"Board of Nursing as standard-setter",section:"Controlling \u203A Development of Standards (Philippines)",summary:"In the Philippines, the Board of Nursing (BON), under the authority of the PRC, develops and regulates nursing professional standards. It establishes and upholds standards for nursing practice, education, and licensure.",mnemonic:""},{id:"u9-audit",unit:9,title:"Audit and audit timing",section:"Controlling \u203A Audit",summary:"Audit = a systematic and official examination of a record, process, structure, environment, or account to evaluate performance. It lets managers apply the control process to determine the quality of services. Timing: retrospective (after the patient receives the service), concurrent (while the patient is receiving the service), prospective (identifies how future performance will be affected by current interventions).",mnemonic:""},{id:"u9-audittypes",unit:9,title:"Outcome, process, and structure audits",section:"Controlling \u203A Types of Audits Used in Healthcare",summary:"Outcome audit: focus = END RESULTS of patient care; purpose = were the desired outcomes achieved; example = fall rates, nosocomial infection rates; strong indicators of care quality; nursing-sensitive outcomes = fall rates, pressure sores, patient satisfaction. Process audit: focus = HOW care is provided; purpose = adherence to policies, protocols, guidelines; example = following vital-sign protocols during labor, giving newborn care instructions at postpartum visits; task-oriented. Structure audit: focus = ENVIRONMENT and RESOURCES; purpose = right structure and resources are in place; example = nurse-patient staffing ratios, emergency equipment, call light access; does NOT directly evaluate the quality of care.",mnemonic:"S-P-O = Setting (structure), Performing (process), Outcome (results)"},{id:"u9-problem",unit:9,title:"Problem employees and special-needs employees",section:"Controlling \u203A Employee Discipline",summary:"Managing behavior is complex; problem employees exist everywhere. Problem behaviors: Blatant insubordination (refusal to follow instructions, attendance issues, disrespecting others) vs Subtle but serious behaviors (undermining team members, creating a hostile workplace). Employees with special needs: Marginal employees meet only minimal standards and consistently disrupt unit functioning through poor performance. Impaired employees: chemical impairment (drug or alcohol addiction) or psychological impairment (increasingly recognized; depression, anxiety).",mnemonic:""},{id:"u9-discipline",unit:9,title:"Discipline, punishment, constructive discipline, self-discipline, group norms",section:"Controlling \u203A Employee Discipline (cont.)",summary:`Discipline = training or molding character to bring about desired behaviors; corrective AND educational; helps employees grow. Punishment = an undesirable consequence after unacceptable behavior; may correct behavior but lacks the developmental part. Constructive discipline: supportive and corrective; from Latin "disciplina" (teaching, learning, growing); focuses on improving performance and growth; employees learn discipline is about their ACTIONS, not their identity; punishment may still be part of it but must not attack the person's worth; it should not permanently alienate or demoralize. Self-discipline: the highest and most effective form; employees govern themselves; it grows when employees feel secure, validated, and affirmed. Group norms: group-established standards; social pressure can make self-discipline hard when group expectations conflict with organizational goals.`,mnemonic:""},{id:"u9-hotstove",unit:9,title:"McGregor's Hot Stove rules",section:`Controlling \u203A McGregor's "Hot Stove" Rules`,summary:"Douglas McGregor (1967) gave four rules for fair and constructive discipline. 1 Forewarning: employees know the rules and consequences beforehand (no surprises, like knowing the stove is hot). 2 Immediate consequences: discipline right after the rule is broken (like the instant burn). 3 Consistency: every time the rule is broken, the same consequence follows (rules are firm and predictable). 4 Impartiality: everyone who breaks the rule gets the same consequence regardless of position (fairness and morale).",mnemonic:'"FICI": Forewarning, Immediate, Consistency, Impartiality. Warned, Now, Always, Everyone.'},{id:"u9-coaching",unit:9,title:"Performance deficiency coaching",section:"Controlling \u203A Performance Deficiency Coaching",summary:"Performance deficiency coaching = a managerial strategy to address and correct poor performance or behavior through constructive guidance rather than merely enforcing discipline. Ongoing coaching: continuous and spontaneous, part of the daily work routine; managers regularly give feedback. Problem-centered coaching: more structured and planned, focuses on specific performance issues needing immediate correction; needs careful preparation by the manager.",mnemonic:""},{id:"u9-perfeval",unit:9,title:"Performance evaluation and competence assessment",section:"Controlling \u203A Performance Evaluation",summary:"Performance appraisal = a key controlling responsibility: determining how well employees carry out the duties of their jobs. Early 1990s: The Joint Commission advocated using the job description as the standard for performance appraisal. Competence assessment: evaluates knowledge, education, skills, or experience required for specific tasks; asks whether the employee is QUALIFIED for the position. Performance evaluation: assesses how WELL the employee executes assigned tasks; focuses on the quality of performance in real-world scenarios.",mnemonic:""},{id:"u9-tools",unit:9,title:"Performance appraisal tools",section:"Controlling \u203A Appraisal Tools",summary:"1 Trait rating scale: rates based on standards, but focuses on PERSONAL CHARACTERISTICS (attitude, teamwork, punctuality), not directly the quality or quantity of work. 2 Job dimension scales: a rating scale for each job classification; rating factors come directly from the written JOB DESCRIPTION. 3 BARS (behaviorally anchored rating scales, also called behavioral expectation scales): specific, OBSERVABLE behaviors; a separate form per job classification; behaviors ranked typically 1 to 9 by importance; reduces subjectivity. 4 Checklists: weighted (weighted score per behavior; merit raises often tied to scores), forced (evaluator selects both desirable AND undesirable behaviors; each has a value; total score computed), simple (descriptors; the rater checks those that apply). 5 Essays: narrative description of strengths and areas for improvement. 6 Self-appraisals: employees reflect on and summarize their own accomplishments; reflective practice.",mnemonic:""},{id:"u9-jc",unit:9,title:"The Joint Commission and JCI",section:"Controlling \u203A Creating a Patient's Safety Culture",summary:"The Joint Commission (JC), originally the Joint Commission for Accreditation of Healthcare Organizations (JCAHO), shapes quality control. It accredits over 21,000 healthcare organizations and programs in the U.S. Accreditation means the organization meets performance standards and provides quality care. The JC mandated that all hospitals establish a Quality Assurance (QA) program. The JC keeps one of the most comprehensive databases of sentinel events. Joint Commission International (JCI) = the international arm of the JC; offers accreditation, certification, education, consulting, software solutions, publications, and patient safety pathways; vision: all people always experience the safest, highest quality, best value healthcare worldwide. The JCI developed the IPSGs.",mnemonic:""},{id:"u9-sentinel",unit:9,title:"Sentinel events and root cause analysis",section:"Controlling \u203A Sentinel Events",summary:"Sentinel events = patient safety events (not primarily related to the natural course of the illness or underlying condition) that reach a patient and result in death, permanent harm, or severe temporary harm. Severe temporary harm = critical, potentially life-threatening harm of limited duration with no permanent residual, but requiring transfer to a higher level of care or monitoring for a prolonged period, transfer to a higher level of care for a life-threatening condition, or additional major surgery, procedure, or treatment. A sentinel event signals the need for IMMEDIATE investigation and response. The JC collects and shares sentinel event data with accredited organizations to prevent future errors. Root cause analysis (RCA) and corrective action plans are done when sentinel events occur; RCA = a systematic process to identify the root causes of an error and address them to prevent recurrence.",mnemonic:""},{id:"u9-ipsg",unit:9,title:"International Patient Safety Goals (IPSGs)",section:"Controlling \u203A International Patient Safety Goals",summary:"Developed by JCI so accredited organizations focus on areas that greatly affect patient safety. 1 Identify patients correctly: why = avoid treating the wrong patient; how = two identifiers (name + birth date, name + hospital ID band), NEVER the room number, double-check before procedures, blood transfusion, or meds. 2 Improve effective communication: why = miscommunication is a major cause of errors; how = read-back for verbal orders, write down critical test results immediately and verify, standardized handoff with SBAR (Situation, Background, Assessment, Recommendation). 3 Improve the safety of high-alert medications: why = insulin, anticoagulants, chemotherapy cause severe harm if misused; how = store separately with warning labels, independent double-checks, tall-man lettering (hydrOXYzine vs hydrALAzine). 4 Ensure correct surgery at the correct site with the correct procedure: why = wrong-site or wrong-patient surgery is catastrophic; how = time out before surgery (verify patient, site, procedure), mark the site with patient involvement, standardized checklists. 5 Reduce the risk of healthcare-associated infections (HAIs): why = pneumonia, sepsis, UTIs increase harm; how = WHO's 5 moments of hand hygiene, correct PPE, sterile technique (e.g., catheter insertion). 6 Reduce the risk of patient harm from falls: why = serious injuries especially in elderly; how = assess fall risk on admission, bed alarms, side rails, non-slip footwear, educate patients and families.",mnemonic:'"I Can Have Safe Infection-free Falls-free care": Identify, Communicate, High-alert, Surgery, Infection, Falls'},{id:"u9-medrec",unit:9,title:"Medication reconciliation",section:"Controlling \u203A Medication Reconciliation",summary:"The JC stresses medication reconciliation to prevent medication errors, especially at patient TRANSITION POINTS. It systematically compares the patient's current medication regimen with newly prescribed medications to prevent: omissions (failing to prescribe a needed medication), duplications (two medications with the same purpose), dosing errors, and drug interactions.",mnemonic:""},{id:"u9-reporting",unit:9,title:"Reporting errors, blame-free reporting, and Just Culture",section:"Controlling \u203A Reporting and Analyzing Errors",summary:'Reducing errors requires increasing both MANDATORY and VOLUNTARY reporting. This is proactive and helps find causes and corrective actions, but it requires a just culture that balances accountability with a system-focused view. Blame-free reporting: shift away from blaming individuals toward fixing system failures; staff feel safe to report errors and NEAR MISSES. Just Culture: blame-free but still holds people accountable; separates three behaviors: Human error (unintentional; part of learning; e.g., wrong med from similar packaging, reported at once; fix = system improvements), At-risk behavior (decisions that raise risk but are not intentionally harmful; e.g., skipping the wristband check because "I know the patient"; fix = coaching), Reckless behavior (disregards safety protocols; e.g., a doctor skips sterile procedure in a rush knowingly risking infection; fix = immediate corrective action).',mnemonic:"Just Culture: Console (human error), Coach (at-risk), Correct/Punish (reckless)"},{id:"u10-standard",unit:10,title:"Standard; QA vs QI",section:"Standards of Nursing (definition, QA vs QI)",summary:"A standard is a predetermined level of excellence that guides practice. Quality Assurance (QA) = monitoring and evaluating COMPLIANCE with standards (example: a monthly audit of the MAR to check the five rights). Quality Improvement (QI) = PROACTIVE, CONTINUOUS, DATA-DRIVEN change to improve processes (example: introducing an eMAR with staff training and a protocol review).",mnemonic:'QA = "Are we following the rule?" QI = "How can we make it better?"'},{id:"u10-char",unit:10,title:"Characteristics of a standard",section:"Standards of Nursing \u203A Characteristics",summary:"A standard is (1) predetermined, (2) established by an authority, and (3) communicated to and accepted by those affected.",mnemonic:"P-E-C: Predetermined, Established by authority, Communicated and accepted"},{id:"u10-practice",unit:10,title:"Standards for practice",section:"Standards of Nursing \u203A Standards for Practice",summary:"The standards for nursing practice in the Philippines are RA 9173 (Philippine Nursing Act of 2002) and the National Nursing Core Competency Standards (NNCCS).",mnemonic:""},{id:"u10-scope",unit:10,title:"Scope of nursing (RA 9173, Art. IV, Sec. 28)",section:"Standards of Nursing \u203A RA 9173 Article IV Section 28",summary:"A person practices nursing when, singly or in collaboration with another, they initiate and perform nursing services to individuals, families, and communities in any health care setting, across life stages from conception to old age (outline wording). As independent practitioners, nurses are primarily responsible for health promotion and illness prevention. As members of the health team, nurses collaborate with other professionals for curative, preventive, and rehabilitative aspects of care, restoration of health, alleviation of suffering, and, when recovery is not possible, toward a peaceful death.",mnemonic:""},{id:"u10-duties",unit:10,title:"Duties of nurses, Section 28 (a) to (e)",section:"Standards of Nursing \u203A Section 28 Duties",summary:"(a) Provide nursing care through the nursing process (assessment, diagnosis, planning, implementation, evaluation) using traditional and innovative approaches, therapeutic use of self, techniques and procedures (wound care, catheterization, vital signs), essential primary health care (vaccination, screening, maternal and child care), administer written prescriptions (oral, topical, parenteral meds), internal examination during labor in the absence of antenatal bleeding, and suturing of perineal laceration with special training. (b) Establish linkages with community resources and coordinate with the health team. (c) Provide health education. (d) Teach, guide, and supervise students in nursing education programs; administer nursing services; undertake consultation and decision-making. (e) Undertake human resource development training and research, and engage in advanced nursing practice.",mnemonic:""},{id:"u10-students",unit:10,title:"Exception for students, Code of Ethics duty, and continuing education",section:"Standards of Nursing \u203A Section 28 (exception and duties)",summary:"Exception: nursing students may perform nursing services under the direct supervision of a qualified faculty. Nurses have the duty to observe the Code of Ethics for nurses and uphold the standards of safe nursing practice. Continuing professional education: nurses must keep up with it, through programs from accredited or recognized organizations, submitted to and approved by the PRC Board of Nursing.",mnemonic:""},{id:"u10-ethics",unit:10,title:"Observance of ethical standards and what the scope covers",section:"Standards of Nursing \u203A Observance of Ethical Standards / Conclusion",summary:"Observing ethical standards means safe practice, compassionate care for every client regardless of background, and advocacy that protects clients from harm. The scope of nursing covers independent and collaborative care for individuals, families, and communities in all settings and life stages, health promotion, illness prevention, curative and rehabilitative care, health education, community linkages, teaching and supervision, research, and continuing professional education.",mnemonic:""},{id:"u10-nnccs",unit:10,title:"2012 National Nursing Core Competency Standards",section:"Standards of Nursing \u203A 2012 NNCCS",summary:"The 2012 NNCCS framework places core competencies and performance indicators around care of individuals, families, population groups, and communities in varied settings. It describes the beginning nurse's roles in three areas: client care, leadership and management, and research. (The figure shows how many responsibilities each role has; those counts are not in the outline. The responsibilities are detailed in Unit 1.)",mnemonic:""},{id:"u10-accred",unit:10,title:"Accreditation in healthcare",section:"Standards of Nursing \u203A Accreditation in Healthcare",summary:"Accreditation = an external review that checks whether an organization meets set standards, to show and improve quality and safety. 1 Joint Commission (JCI): improves safety and quality; supports medical tourism; Philippine examples: St. Luke's Medical Center and The Medical City. 2 PhilHealth: the national health insurance program; accredited facilities meet national standards and can get reimbursement; gives patients access to affordable care (e.g., the NSD (normal spontaneous delivery) maternity package). 3 DOH licensure: a license to operate; a LEGAL REQUIREMENT, separate from accreditation; checks infrastructure, staffing, and operations; protects the public. 4 CHED: accredits academic programs (nursing, medicine, allied health), checking facilities, faculty, and curricula. Accreditation matters because it assures quality, safety, and public trust.",mnemonic:""},{id:"u11-ethics",unit:11,title:"Ethics",section:"Ethico-Moral Responsibility (definition)",summary:"Ethics = the systematic study of what a person's conduct and action SHOULD be with regard to self, other human beings, and the environment; the justification of what is right or good, and the study of what a person's life and relationships should be, not necessarily what they are. Respect for people is the most basic and universal ethical principle.",mnemonic:""},{id:"u11-principles",unit:11,title:"Ethical principles",section:"Ethico-Moral Responsibility \u203A Ethical Principles",summary:"1 Autonomy: self-determination and freedom of choice, accepting responsibility for one's decisions; supported by the legal right of self-determination (nurse supports the patient's informed choice even if he declines the recommended treatment). 2 Beneficence: actions to PROMOTE GOOD (advocating pain relief after surgery). 3 Nonmaleficence: actions to AVOID HARM (double-checking dose and history before giving meds). 4 Utility: the good of the many outweighs the wants or needs of the individual (prioritizing vaccination of high-risk groups in an outbreak). 5 Justice: fairness; treat equals equally and give fair treatment according to individual differences (equitable care regardless of status; advocating access for marginalized groups). 6 Veracity: obligation to tell the truth; honesty and transparency (telling the patient about side effects). 7 Fidelity: commitment to fulfilling promises (following protocols; keeping follow-up promises). 8 Confidentiality: keep privileged information private (secure records, share only with authorized personnel).",mnemonic:'"A Big Nurse Uses Just Very Fine Care": Autonomy, Beneficence, Nonmaleficence, Utility, Justice, Veracity, Fidelity, Confidentiality'},{id:"u11-code",unit:11,title:"Code of Ethics for Filipino Nurses (BON Res. 220, s. 2004)",section:"Ethico-Moral Responsibility \u203A Code of Ethics",summary:"BON Resolution No. 220, Series of 2004 promulgated the Code of Ethics for Registered Nurses. The 2004 Code guides Filipino nurses in competent, compassionate, ethical care and has 7 articles. I Preamble: health is a basic human right; nurses promote health and prevent illness, alleviate suffering, and support a peaceful death. II RNs and People: respect values, customs, and spiritual beliefs; confidentiality; empower informed decisions. III RNs and Practice: sanctity of human life; safe, effective, compassionate care; advocacy; accurate and truthful documentation. IV RNs and Co-workers: collaboration, respect, communication, integrity, honesty. V RNs, Society, and Environment: social justice, health equity, community health, environmental health and sustainability. VI RNs and the Profession: uphold integrity and standards; lifelong learning; credibility and public trust. VII Administrative Penalties, Repealing Clause, and Effectivity: violations may lead to suspension or revocation by the BON; the repealing clause annuls previous codes.",mnemonic:""},{id:"u11-icn",unit:11,title:"ICN Code of Ethics",section:"Ethico-Moral Responsibility \u203A ICN Code of Ethics for Nurses",summary:"The International Council of Nursing (ICN) Code of Ethics for Nurses has four elements: 1 Nurses and patients or other people requiring care or services. 2 Nurses and practice. 3 Nurses and the profession. 4 Nurses and global health.",mnemonic:""},{id:"u11-magna",unit:11,title:"Magna Carta of Patients' Rights (2008 Senate Bill 2371)",section:"Ethico-Moral Responsibility \u203A Magna Carta of Patient's Rights",summary:"15 rights: 1 good quality health care and humane treatment; 2 dignity; 3 to be informed of rights and obligations; 4 choose physician or institution; 5 informed consent; 6 refuse diagnostic and medical treatment; 7 refuse participation in medical research; 8 religious belief and assistance; 9 privacy and confidentiality; 10 disclosure of and access to information; 11 correspondence and to receive visitors; 12 medical records; 13 health education; 14 leave against medical advice; 15 express grief.",mnemonic:""},{id:"u11-frameworks",unit:11,title:"Ethical frameworks",section:"Ethico-Moral Responsibility \u203A Ethical Frameworks",summary:`Frameworks do not give direct solutions; they help clarify the values and beliefs behind decisions. 1 Utilitarianism (teleological or consequentialist): focuses on OUTCOMES; the greatest good for the greatest number; the end justifies the means (fund local workshops for many staff instead of a national conference for a few). 2 Deontological theory (from Immanuel Kant): rightness or wrongness of actions regardless of consequences; some actions are inherently right or wrong; duty-based reasoning (actions obligatory because they fulfill a duty) and rights-based reasoning (people have rights or "just due" that must be respected) (administrator refuses a cost-cutting step that violates employee rights). 3 Intuitionism: individual judgment; intuition weighs goals, duties, and rights case by case; criticized as subjective and biased. 4 Ethical relativism: decisions align with the decision-maker's cultural values and personal beliefs. Ethical universalism: principles are absolute and apply regardless of personal or cultural differences.`,mnemonic:""},{id:"u11-leadership",unit:11,title:"Ethical leadership in nursing",section:"Ethico-Moral Responsibility \u203A Ethical Leadership in Nursing",summary:"Human-centered focus: decision-making prioritizes the human aspect with sensitivity. Influence through values: leaders shape team actions by embodying strong values. Self-aware role models: leaders who know their ethical standards model integrity and confidence. Managing ambiguity: ethical leaders accept uncertainty and risk as part of complex decisions. Realistic approach: not all outcomes are predictable; keep a balanced, pragmatic view.",mnemonic:""},{id:"u12-bonlaws",unit:12,title:"BON resolutions and CHED memo",section:"Legal Responsibilities \u203A Other Health-related Laws (BON and CHED)",summary:"BON 425 s.2003 = Implementing Rules and Regulations (IRR) of the Philippine Nursing Act of 2002 (RA 9173). BON 110 s.1998 = adoption of a guide to evaluate compliance with standards for safe nursing practice. BON 14 s.1999 = adoption of the Nursing Specialty Certification Program and creation of the Nurse Specialty Certification Council. BON 08 s.1994 = special training on IV injections for the RN. BON 38 s.2016 = new rules on the special training requirement in IV therapy for nurses, REPEALING BON 08 s.1994. CHED Memo 14 s.2009 = policies and standards for the BSN program.",mnemonic:""},{id:"u12-ralaws",unit:12,title:"Republic Acts and other health laws",section:"Legal Responsibilities \u203A Other Health-related Laws (table)",summary:"RA 8981 PRC Modernization Act of 2000. RA 11036 Mental Health Act of 2018. RA 7305 Magna Carta of Public Health Workers. RA 6675 Generics Act of 1988. RA 9165 Comprehensive Dangerous Drugs Act of 2002. RA 8423 Traditional and Alternative Medicine Act of 1997. RA 10173 Data Privacy Act of 2012. RA 7877 Anti-Sexual Harassment Act of 1995. RA 7160 Local Government Code of 1991. RA 9288 Newborn Screening Act of 2004. RA 10028 Expanded Breastfeeding Promotion Act of 2009. RA 7600 Rooming-In and Breastfeeding Act of 1992. RA 8504 Philippine AIDS Prevention and Control Act of 1998. RA 11332 Mandatory Reporting of Notifiable Diseases and Health Events of Public Health Concern Act. RA 10918 Philippine Pharmacy Act. RA 8257 Expanded Senior Citizens Act of 2003 (as written). RA 9262 Anti-Violence Against Women and Their Children Act of 2004. RA 7610 Special Protection of Children Against Abuse, Exploitation and Discrimination Act. RA 10606 National Health Insurance Act of 2013. RA 4226 Hospital Licensure Act. RA 9003 Ecological Solid Waste Management Act of 2000. PD 996 s.1976 compulsory basic immunization for infants and children below 8 years of age. EO 51 s.1986 National Code of Marketing of Breastmilk Substitutes, Breastmilk Supplements and Related Products (Milk Code). RA 10354 Responsible Parenthood and Reproductive Health Act of 2012. RA 11223 Universal Health Care Act of 2019.",mnemonic:""},{id:"u12-laborcode",unit:12,title:"PD 442 Labor Code: purposes and key concepts",section:"Legal Responsibilities \u203A Presidential Decree No. 442",summary:"Purposes: promote the rights of workers, ensure fair labor standards, encourage productive labor relations. Key concepts: recruitment and placement; prohibits discrimination based on race, color, sex, religion, political opinion; minimum wage, hours of work, overtime pay; health, safety, welfare standards; rest days, holidays, leaves; compensation for work-related injuries and illnesses; rights of employees and employers; collective bargaining and labor unions; labor disputes and strikes; establishes DOLE to oversee labor laws; powers and duties of labor officers; employment of women and minors; vocational training and skills development. For nurses, PD 442 supports fair working conditions, professional growth, and well-being, which improves healthcare quality.",mnemonic:""},{id:"u12-articles",unit:12,title:"Labor Code articles on hours, pay, holidays, leave",section:"Legal Responsibilities \u203A Articles 83 to 95",summary:"Art. 83 Normal hours of work: 8 hours/day; health personnel in cities/municipalities with 1 million+ population: 8 hours/day, 5 days/week OR 40 hours/week, with extra pay beyond; includes public health nurses, government hospital doctors, clinic personnel. Art. 84 Hours worked: time required on duty, time permitted or suffered to work, and short rest breaks controlled by the employer. Art. 86 Night shift differential: 10 PM to 6 AM, at least 10% additional pay per hour. Art. 87 Overtime: beyond 8 hours/day, at least 25% premium on the hourly rate; higher on rest day or holiday (usually 30%+). Art. 88 Undertime cannot be offset by overtime (leaving early today cannot be paid back by overtime tomorrow). Art. 94 Holiday pay: 100% of daily wage even if not working; worked on a regular holiday = 200%; holiday that falls on a rest day and worked = 260%. Art. 95 Service incentive leave: at least 1 year of service = 5 days with pay per year; vacation or sick; unused SIL converted to cash.",mnemonic:"83 hours, 84 what counts, 86 night, 87 overtime, 88 no offset, 94 holiday, 95 leave"},{id:"u12-contract",unit:12,title:"Employment contracts",section:"Legal Responsibilities \u203A Contract",summary:"Contracts define the rights, duties, and obligations of employer and employee. Work contracts are governed by the Civil Code of the Philippines (RA 386). Art. 1305: a contract is a meeting of the minds between two or more persons, where one agrees to perform an act in exchange for the other's promise or compensation. Art. 1318 key elements: consent (both agree voluntarily), object (lawful work or duties), cause (legal reason, like compensation). Art. 1306 freedom to contract: terms must not conflict with law, morals, or public policy; employers cannot impose illegal or exploitative terms (wages below minimum, hazardous conditions). Employer obligations: pay salary, safe working conditions, respect labor rights. Employee obligations: perform duties with diligence and integrity. Example: a nurse's contract requires 40 hours/week and care for assigned patients; the hospital provides fair pay and a safe environment. Breach: employer breach (fails to pay salary or provide a safe environment), employee breach (fails to fulfill duties without valid reason). Remedies: damages or reinstatement (a nurse terminated without valid cause may claim back pay or reinstatement). Termination: mutual consent, completion of employment period, or breach. Grounds: authorized causes (economic reasons, downsizing, redundancy) vs just causes (misconduct, neglect of duty, dishonesty).",mnemonic:""},{id:"u12-union",unit:12,title:"Collective bargaining and labor unions",section:"Legal Responsibilities \u203A Collective Bargaining / Labor Union",summary:"Collective bargaining = negotiation between employers and a group of employees (usually a union) to set conditions, wages, benefits, and other terms; protected and regulated under PD 442. Labor union = an organization of employees in an industry or sector that collectively negotiates with the employer; a unified voice with more leverage. Art. 243: right to self-organization (form, join, or assist unions). Art. 252: duty of employer and the recognized representative to bargain in good faith. Arts. 234 and 235: forming and registering unions with DOLE; registration gives legal standing to represent members. Art. 248 (employers) and Art. 249 (unions): unfair labor practices. Employers: interfering with union activities, discriminating for union involvement, refusing to bargain with the recognized union. Unions: coercion or discrimination against non-union members. For nurses: unions can advocate safer working conditions, staffing levels, fair wages, and job security.",mnemonic:""},{id:"u12-negligence",unit:12,title:"Professional negligence",section:"Legal Responsibilities \u203A Professional Negligence",summary:"Negligence = the commission or omission of an act, pursuant to a duty, that a reasonably prudent person in the same or similar circumstance would or would not do, which is the proximate cause of injury to another person or property. Elements: (1) existence of a duty to use due care, (2) failure to meet the standard of due care, (3) foreseeability of harm from that failure, (4) the breach resulted in injury to the plaintiff. Professional negligence = failure to give the standard of care that a reasonably prudent professional would under similar circumstances. Common acts: burns (hot water bags, heat lamps, vaporizers, sitz bath); objects left inside the patient (sponges, suction tips, loose dentures in the trachea); falls of the elderly, confused, unconscious, sedated, or not-yet-recovered-from-anesthesia patients, and children whose side rails were not raised and locked; failure to observe and act; failure to report observations to physicians (cyanotic, cold toes in a leg cast not reported, leading to gangrene and below-knee amputation; the court found the nurse negligent).",mnemonic:"4 Ds: Duty, Dereliction (breach), Direct cause/foreseeability, Damage"},{id:"u12-doctrines",unit:12,title:"Legal doctrines: res ipsa loquitur, respondeat superior, force majeure",section:"Legal Responsibilities \u203A Legal Terminologies",summary:'Res ipsa loquitur = "the thing speaks for itself": the injury could not have happened without negligence, so no further proof is required (patient walks in for a buttock injection, then has extreme pain, leg weakness, and paralysis from sciatic nerve injury). Respondeat superior = "let the master answer": employers or superiors are legally responsible for the negligent acts of employees or subordinates done within the scope of employment. Force majeure = "an act of God": an unavoidable event (natural disasters, pandemics) that prevents a person from fulfilling a duty.',mnemonic:""},{id:"u12-incompetence",unit:12,title:"Incompetence and malpractice",section:"Legal Responsibilities \u203A Incompetence / Malpractice",summary:"Incompetence = lack of ability or legal qualifications; unfit to discharge the required duty. A registered nurse who shows incompetence may have her certificate of registration revoked or suspended. Malpractice = a specific type of professional negligence where a licensed professional fails to meet the standard of care, causing harm; in addition, the professional knew or should have known the actions were likely to cause harm; it implies some recklessness or gross deviation (surgeon operating while under the influence of alcohol).",mnemonic:""},{id:"u12-torts",unit:12,title:"Torts and crimes related to nursing practice",section:"Legal Responsibilities \u203A Crimes Related to Nursing Practice",summary:"Tort = a legal wrong against a person or property, independent of a contract, making the wrongdoer liable for damages in a civil action. Intentional torts = deliberate acts violating a person's rights. Assault = conduct that creates fear or reasonable apprehension of harm WITHOUT physical contact (nurse raises a hand in anger). Battery = intentional, UNCONSENTED TOUCHING (procedure without consent; treatment despite refusal). False imprisonment / illegal detention = restricting freedom to move without legal justification (holding a patient against his will, unauthorized restraints, keeping an AMA patient); staff should explain risks to patients who insist on leaving; documentation and a signed release protect staff. Invasion of right to privacy and breach of confidentiality = intruding on private affairs or disclosing private information without consent (discussing a condition in public, sharing information without permission, publishing a picture of a patient or a malformed baby without parental consent); RA 10173 protects personal information. Defamation = false information told to a THIRD PARTY that damages reputation: libel (written, printed, broadcast) and slander (spoken); a two-person exchange is not defamation; a third person must hear or read it.",mnemonic:"Assault = Air (no touch); Battery = Body touched. Libel = Literature (written); Slander = Spoken."},{id:"u12-crime",unit:12,title:"Crime, persons liable, moral turpitude, murder, homicide, abortion",section:"Legal Responsibilities \u203A Crime / Moral Turpitude / Murder",summary:"Crime = an act committed or omitted in violation of the law; two elements: (1) criminal act and (2) evil or criminal intent. Conspiracy = two or more persons agree to commit a felony and decide to do it. Persons who commit felonies: principals (take a direct part, or directly force or induce others), accomplices (not principals, cooperate by previous or simultaneous acts), accessories (assist by concealing evidence, helping escape, or benefiting from the crime, often with abuse of authority). Moral turpitude = an act of baseness, vileness, or depravity, contrary to accepted rules of right and duty (falsification of a public document). Murder = unlawful killing with intent to kill; death from criminal abortion is murder; euthanasia is also considered murder. Homicide = unlawful killing without the qualifying circumstances of murder; may occur without intent. Abortion = expulsion of the product of conception before viability; anyone who intentionally and unlawfully does an act to end a pregnancy is guilty of procuring abortion. The Constitution protects unborn life from conception; abortion is illegal in the Philippines.",mnemonic:""},{id:"u12-will",unit:12,title:"Will, decedent, heir",section:"Legal Responsibilities \u203A Will",summary:"Will = a legal declaration of a person's intentions upon death; a testamentary document that takes effect only after death; following legal formalities, it determines how the estate will be distributed. Decedent = a person whose property is transmitted through succession, with or without a will. Heir = a person entitled to inherit, through a will or by law.",mnemonic:""},{id:"u12-privileged",unit:12,title:"Privileged communication",section:"Legal Responsibilities \u203A Privileged Communication",summary:"Privileged communication = information a patient shares with healthcare providers remains confidential; protects against unauthorized disclosure and preserves trust. Legal basis: Data Privacy Act of 2012 (RA 10173). Nurses protect information unless the law requires disclosure, such as abuse or infectious disease reporting. Talk about patients in private settings, not public areas.",mnemonic:""},{id:"u12-witness",unit:12,title:"Nurses as witnesses",section:"Legal Responsibilities \u203A Nurses as Witnesses",summary:"The attorneys determine whose testimony is needed. Subpoena = a court summons ordering a witness to appear and testify on a set date and time. Subpoena duces tecum = bring records, papers, and the like. Subpoena ad testificandum = appear and give oral testimony about what one personally knows. Fact witness = testifies on direct observations and patient interactions; only factual, objective details; no personal opinions. Expert witness = gives informed opinions on nursing standards in malpractice or negligence cases; helps the court know if care met standards. A trial is a search for truth; the nurse should seek a lawyer's counsel; testimony is under oath, so lying is perjury (false swearing under oath); she may say she does not know, and need not answer questions that might incriminate her (privilege against self-incrimination).",mnemonic:""},{id:"u12-consent",unit:12,title:"Informed consent, advance directives, and court parties",section:"Legal Responsibilities \u203A Informed Consent / Plaintiff / Defendant / Burden of Proof",summary:"Informed consent = a process where a patient voluntarily confirms willingness to undergo an intervention after being told the risks, benefits, and alternatives. The consent signed on admission covers the initial diagnosis and treatment only; later treatments or operations need individual informed consent. Consent must come from the patient or a legal representative before any procedure. Physicians must give full information. Treatment without consent can be assault or battery. Advance directives = legal documents stating treatment preferences in case the patient cannot communicate. Plaintiff = the party who files the lawsuit. Defendant = the party accused or sued. Burden of proof = the obligation to prove one's claim.",mnemonic:""},{id:"u12-pointers",unit:12,title:"12 pointers to avoid legal liability",section:"Legal Responsibilities \u203A Pointers",summary:"1 Know the Philippine Nursing Law well. 2 Be aware of laws that affect nursing practice. 3 At the start of employment, get a copy of your job description and the agency's rules, regulations, and policies. 4 Upgrade your skills and competence. 5 Accept only responsibility within the scope of your employment and job description. 6 Delegate properly. 7 Determine whether subordinates are competent in the work you assign. 8 Develop good interpersonal relationships with co-workers, supervisors, peers, and subordinates. 9 Consult superiors for problems too big to handle. 10 Verify orders that are unclear or seem erroneous. 11 Inform the doctor about the patient's condition, effects of medications and treatments, or lack of progress. 12 Keep accurate and adequate records.",mnemonic:""},{id:"u14-decorum",unit:14,title:"Professional decorum",section:"Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",summary:"Professional decorum = the behavior, attitude, and conduct that align with the standards, ethics, and expectations of a profession. It covers presenting oneself, interacting with others, and fulfilling responsibilities to keep a respectful, ethical, trustworthy environment. 11 ways to practice it: 1 appearance; 2 ethical practice; 3 communication; 4 team collaboration; 5 punctuality and accountability; 6 professional development; 7 workplace conduct; 8 adhering to ethical principles (Code of Ethics for Nurses in the Philippines); 9 demonstrating respect (RA 10173, Data Privacy Act); 10 maintaining competence (standard of nursing); 11 upholding the dignity and integrity of the nursing profession.",mnemonic:""},{id:"u14-career",unit:14,title:"Career development and Benner's levels",section:"Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",summary:"Career development = a purposeful, deliberate process involving active planning by BOTH individuals and employers; it lets individuals control their career paths through exploration, opportunities, and adaptability. Benner's levels: Novice = relies on rules and abstract principles. Advanced beginner = starts applying past experiences. Competent = gains efficiency and organization. Proficient = sees the situation as a whole. Expert = operates with deep understanding and intuition.",mnemonic:'"Nurses Always Climb Past Expectations": Novice, Advanced beginner, Competent, Proficient, Expert'},{id:"u14-stages",unit:14,title:"Career stages in nursing",section:"Personal and Professional Responsibilities \u203A Career Stages in Nursing",summary:"Promise phase (first 10 years): early career, limited experience; focus = building skills, gaining knowledge, positioning for the future. Momentum phase (11 to 29 years): mid-career, expertise and accomplishments; focus = mastery, professional growth, avoiding stagnation. Harvest phase (30+ years): late career, prime or legacy experience; focus = reinventing value, advancing the profession, leaving a legacy. Reentry phase (optional): returning to nursing after a break; needs adaptation and retraining.",mnemonic:"Promise, Momentum, Harvest (and optional Reentry): plant, grow, harvest"},{id:"u14-jobsearch",unit:14,title:"Job search and job leads",section:"Personal and Professional Responsibilities \u203A Job Search / Job Leads",summary:"Job search = a systematic approach to finding the right job; increases success and aligns career goals with available opportunities; a critical part of career development. Platforms: hospital and healthcare institution websites (Philippine General Hospital, St. Luke's Medical Center, regional and provincial hospitals); nursing association websites (Philippine Nurses Association and specialty groups like the Oncology Nursing Association of the Philippines and Emergency Nurses Association of the Philippines) for job listings, networking events, and career resources; job boards (Jobstreet, Indeed, LinkedIn); recruitment agencies (local and international roles); networking (word-of-mouth referrals through colleagues, mentors, professional organizations uncover hidden opportunities).",mnemonic:""},{id:"u14-portfolio",unit:14,title:"Professional portfolio",section:"Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",summary:"A professional portfolio documents a nurse's career journey, competencies, and accomplishments; a comprehensive record of professional development showing qualifications and commitment to continuous learning; keeping it updated helps with career advancement, new jobs, and performance evaluations. Components: resume (concise career summary); education credentials (diploma, transcript of records); licensure credentials (PRC ID, Certificate of Registration, board rating); employment history (work experience, COE = Certificate of Employment); certifications achieved (seminars, BLS, ACLS); government-mandated credentials (GSIS, SSS, PhilHealth, PAG-IBIG, BIR TIN).",mnemonic:""},{id:"u14-resume",unit:14,title:"CV vs resume and resume writing",section:"Personal and Professional Responsibilities \u203A Resume Format",summary:`CV = a detailed document of one's entire career, education, achievements, and experiences. Resume = a concise document summarizing skills, work experience, and qualifications TAILORED to a specific job. A resume should be professional (neat, organized, error-free), quickly capture attention (concise, highlights the most relevant), and tailored to the role. 9 key components: contact information (full name, phone, professional email, LinkedIn); objective or summary statement; education; work experience (bullet points); skills and competencies (including software like EHR); certifications and licensure (ACLS, PALS, specialty); awards and recognitions; professional development (workshops, conferences, CE); references (optional; or "References available upon request"). Guidelines: length 1 to 2 pages; clarity (direct, no jargon, bullets). Formatting: professional readable font (Arial, Times New Roman) 12-point or larger; single font style, clean layout; high-quality white or off-white paper; black with a single accent color. Exclude: marital status, age, children, ethnicity, religious affiliation; exaggerated claims. Proofread grammar and punctuation. References: only people who know you well (ideally 3+ years); inform them in advance; make sure they agree to be contacted.`,mnemonic:""},{id:"u14-fields",unit:14,title:"Fields of specialization in nursing",section:"Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",summary:"APRNs (Advanced Practice Registered Nurses) give primary and specialized care in collaboration: NPs (nurse practitioners: diagnose, treat, prescribe, do procedures; specialize in pediatrics, geriatrics, oncology), CNSs (clinical nurse specialists: experts in an area like oncology, pediatrics, critical care; improve care, educate staff, apply evidence-based practice), CRNAs (nurse anesthetists: anesthesia for surgery), CNMs (nurse midwives: prenatal, labor, postpartum care, deliveries, family planning). Nurse educators: nursing faculty (teach undergraduate or graduate) and clinical educators (teach staff best practices in healthcare settings). Nurse administrators: nurse managers (day-to-day unit operations, staffing, compliance) and nurse executives such as CNOs (hospital- or system-wide policies). Clinical research nurses (conduct research studies with pharma, universities, institutions). Nurse scientists (advance knowledge through research). Forensic nursing (care for crime victims, collect evidence, work with law enforcement). Public health nursing (community health promotion, disease prevention, public health crises). Palliative care nursing (comfort and support for serious, life-limiting illness). Telehealth nursing (BPO: answer health inquiries, triage, basic advice, schedule appointments). Health insurance and case management (help patients with benefits and claims). Medical coding (ICD-10 = International Classification of Diseases; CPT = Current Procedural Terminology; accurate claims for reimbursement). Medical transcription (transcribe audio records; needs medical terminology and accuracy). Livescribe nursing (emerging BPO role: document patient encounters, histories, and treatment plans during live consultations).",mnemonic:""},{id:"u14-assoc",unit:14,title:"Nursing associations",section:"Personal and Professional Responsibilities \u203A Nursing Associations",summary:"1 PNA (Philippine Nurses Association): national, premier and largest organization of RNs; welfare of nurses and advancement of practice. 2 ANSAP (Association of Nursing Service Administrators of the Philippines): nurse leaders and administrators; improves nursing management and administration. 3 ADPCN, Inc. (Association of Deans of Philippine Colleges of Nursing): deans of nursing colleges; improves nursing education and curriculum standards. 4 Association of Private Duty Nurse Practitioners Philippines, Inc.: private-duty nurses giving one-on-one care, usually at home or private settings. 5 PONA (Philippine Oncology Nurses Association, Inc.): oncology nursing; holistic care of cancer patients. 6 ORNAP (periOperative Registered Nurses Association of the Philippines): premier organization for OR nurses; perioperative practice. 7 CCNAPI (Critical Care Nurses Association of the Philippines, Inc.): critical care nurses; intensive care excellence through education, collaboration, research. 8 ANG NARS, Inc.: non-stock, non-profit, SEC No. CN 200900208, founded 2009; promotes the socio-economic-political-professional RIGHTS of nurses, with the responsibility to give safe quality care to Filipinos. 9 GSPNRI (Global Society for Philippine Nurse Researchers, Inc.), formerly PNRSI (Philippine Nursing Research Society, Inc.): promotes nursing research.",mnemonic:""},{id:"u14-trends",unit:14,title:"Issues and trends in nursing",section:"Personal and Professional Responsibilities \u203A Issues and Trends in Nursing",summary:`The module's table lists: shortage of nurses; advocacy for safe staffing levels; integration of technology in nursing; rise of telehealth and remote nursing; expanding roles in primary healthcare; continuing professional development (CPD) compliance; globalization and nurse migration. (The table lists "advocacy for safe staffing levels" twice, so there are 7 unique items.)`,mnemonic:""}],questions:[{unit:8,topic:"u8-def",type:"id",situational:!1,difficulty:1,stem:"Internal discord that results from differences in ideas, values, or feelings of two or more people.",answer:"Conflict",aliases:[],rationale:"The module defines conflict as internal discord caused by differences in ideas, values, or feelings between two or more people.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management (definitions)",id:"U8-001"},{unit:8,topic:"u8-def",type:"id",situational:!1,difficulty:1,stem:"The process by which a leader or manager identifies, addresses, and appropriately handles conflict to keep an optimal balance that promotes growth, productivity, and creativity.",answer:"Conflict management",aliases:["conflict managing"],rationale:"Conflict management is not about removing all conflict. It keeps conflict at a balance that still helps growth, productivity, and creativity.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management (definitions)",id:"U8-002"},{unit:8,topic:"u8-def",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, what is the goal of conflict management?",options:["Report all conflicts to the human resource office","Keep an optimal balance of conflict that promotes growth, productivity, and creativity","Decide which party is right so the manager can punish the other","Remove every source of conflict from the organization"],answer:1,aliases:[],rationale:'The definition says "optimal balance". Some conflict is healthy because it can drive growth and creativity.',whyNot:{0:"Reporting is not the goal. The leader identifies, addresses, and handles the conflict.",2:"Managing conflict is about handling it well, not choosing a side to punish.",3:"The module never says to remove all conflict. It says to keep an optimal balance."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management (definitions)",id:"U8-003"},{unit:8,topic:"u8-def",type:"mcq",situational:!0,difficulty:2,stem:"Two staff nurses disagree about how to divide patient loads. The head nurse notices the disagreement early, talks to both, and keeps the unit productive. Which process is the head nurse doing?",options:["Supervision","Collective bargaining","Conflict management","Controlling"],answer:2,aliases:[],rationale:"She identifies, addresses, and handles the conflict to keep the unit productive. That is conflict management.",whyNot:{0:"Supervision is overseeing others' work and checking progress. The task here is resolving a disagreement.",1:"Collective bargaining is negotiation between employees (through a union) and employers.",3:"Controlling compares performance with standards and corrects deviations. It is not about handling disagreements."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management (definitions)",id:"U8-004"},{unit:8,topic:"u8-intra",type:"id",situational:!1,difficulty:1,stem:"Type of conflict that occurs within an individual, involving an internal struggle to clarify contradictory values or desires.",answer:"Intrapersonal conflict",aliases:["intrapersonal"],rationale:'"Intra" means within. The struggle happens inside one person.',mnemonic:"INTRA = INside one person; INTER = between people.",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-005"},{unit:8,topic:"u8-intra",type:"mcq",situational:!0,difficulty:2,stem:"A nurse manager is torn. Administration wants lower overtime costs, but her staff need more help, and she also wants to go home to her sick child. What type of conflict is she mainly experiencing?",options:["Intrapersonal","Interpersonal","Intergroup","Perceived conflict"],answer:0,aliases:[],rationale:"The struggle is inside her, between conflicting responsibilities to the organization, subordinates, and herself.",whyNot:{1:"Interpersonal conflict is between two or more people. Here the struggle is within one person.",2:"Intergroup conflict is between groups, departments, or organizations.",3:"Perceived conflict is a stage of the conflict process, not a type of conflict."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-006"},{unit:8,topic:"u8-intra",type:"mcq",situational:!1,difficulty:2,stem:"Why does the module say self-awareness and prompt resolution of intrapersonal conflict are crucial for leaders?",options:["They remove the need for performance appraisal","They prevent the need for collective bargaining","They guarantee a win-win outcome for the staff","They maintain the leader's physical and mental well-being"],answer:3,aliases:[],rationale:"The module links resolving intrapersonal conflict to the leader's own physical and mental well-being.",whyNot:{0:"Appraisal is a controlling function and is unrelated.",1:"Collective bargaining involves unions and employers, not a leader's inner conflict.",2:"Win-win is a goal of resolving conflict between parties, not a stated reason here."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-007"},{unit:8,topic:"u8-intra",type:"id",situational:!1,difficulty:2,stem:"Name the five groups a manager may have conflicting responsibilities to (intrapersonal conflict). Give the group that refers to the manager's own self.",answer:"Themselves",aliases:["self","oneself","herself","himself"],rationale:"The five are the organization, subordinates, consumers, the profession, and themselves. The last one is the manager's own self.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-008"},{unit:8,topic:"u8-inter",type:"id",situational:!1,difficulty:1,stem:"Type of conflict between two or more people with differing values, goals, or beliefs.",answer:"Interpersonal conflict",aliases:["interpersonal"],rationale:'"Inter" means between. Interpersonal conflict is between people.',mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-009"},{unit:8,topic:"u8-inter",type:"id",situational:!1,difficulty:2,stem:"Interpersonal conflict based on emotions and feelings, often perceived as a personal attack.",answer:"People-focused conflict",aliases:["people focused","people-focused"],rationale:"People-focused conflict centers on feelings, so people take it personally.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-010"},{unit:8,topic:"u8-inter",type:"id",situational:!1,difficulty:2,stem:"Interpersonal conflict centered on specific issues or events, usually approached through calm negotiation.",answer:"Issue-focused conflict",aliases:["issue focused","issue-focused"],rationale:"Issue-focused conflict stays on the problem itself, so calm negotiation is possible.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-011"},{unit:8,topic:"u8-inter",type:"mcq",situational:!0,difficulty:2,stem:'Nurse Ana says, "You always do this to me! You never respect me!" while arguing with Nurse Ben about a turnover. What kind of interpersonal conflict is this?',options:["Role incompatibility","Issue-focused conflict","People-focused conflict","Intergroup conflict"],answer:2,aliases:[],rationale:'The words are emotional and personal ("you never respect me"), so it is felt as a personal attack.',whyNot:{0:"Role incompatibility is a source of conflict (duties vs preferences), not the kind described here.",1:"Issue-focused conflict stays on a specific event and is calm. This one is emotional and personal.",3:"Intergroup conflict is between groups or departments, not two individual nurses."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-012"},{unit:8,topic:"u8-inter",type:"mcq",situational:!0,difficulty:2,stem:"Two nurses calmly discuss whether the 2 PM vital signs should be done before or after the doctors' rounds. They look at the unit routine and agree. What kind of conflict did they have?",options:["Issue-focused conflict","People-focused conflict","Felt conflict","Intrapersonal conflict"],answer:0,aliases:[],rationale:"The talk stayed on one specific issue and was solved through calm negotiation.",whyNot:{1:"There were no personal attacks or strong emotions.",2:"Felt conflict is the emotional stage. These nurses stayed calm.",3:"The disagreement was between two people, not within one."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-013"},{unit:8,topic:"u8-inter",type:"id",situational:!1,difficulty:2,stem:"Source of interpersonal conflict caused by miscommunication or differing interpretations of information.",answer:"Informational deficiencies",aliases:["informational deficiency","information deficiency"],rationale:"When information is missing or understood differently, people clash. The module calls this informational deficiencies.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-014"},{unit:8,topic:"u8-inter",type:"id",situational:!1,difficulty:2,stem:"Source of interpersonal conflict caused by differences between assigned responsibilities and personal preferences.",answer:"Role incompatibility",aliases:["role incompatibilities"],rationale:"The role you are assigned does not match what you prefer to do.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-015"},{unit:8,topic:"u8-inter",type:"mcq",situational:!0,difficulty:2,stem:'The night nurse endorsed "NPO post-midnight" but the day nurse heard "NPO until midnight" and fed the patient. The two nurses now blame each other. What is the source of this conflict?',options:["Role incompatibility","Informational deficiencies","Intergroup conflict","Latent conflict"],answer:1,aliases:[],rationale:"The conflict came from miscommunication and a different understanding of the endorsement.",whyNot:{0:"Role incompatibility is about assigned duties vs personal preferences. This came from a misunderstanding.",2:"This is a type of conflict between groups, not a source of conflict between two nurses.",3:"Latent conflict is a stage where conflict has not happened yet. Here it already has."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-016"},{unit:8,topic:"u8-inter",type:"mcq",situational:!0,difficulty:3,stem:"Nurse Carla was assigned to the isolation room all week, but she prefers to work with post-op patients. She clashes with her charge nurse. Which source of interpersonal conflict is this?",options:["People-focused conflict","Intrapersonal conflict","Informational deficiencies","Role incompatibility"],answer:3,aliases:[],rationale:"Her assigned responsibility (isolation) does not match her personal preference (post-op).",whyNot:{0:"This is a kind of interpersonal conflict, not one of the two sources listed in the module.",1:"She is clashing with another person, so this is interpersonal.",2:"Nobody misunderstood information. Everyone knows the assignment."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-017"},{unit:8,topic:"u8-intergroup",type:"id",situational:!1,difficulty:1,stem:"Type of conflict that occurs between two or more groups, departments, or organizations.",answer:"Intergroup conflict",aliases:["intergroup"],rationale:"Intergroup conflict involves groups, not just individuals.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-018"},{unit:8,topic:"u8-intergroup",type:"mcq",situational:!0,difficulty:2,stem:"The Emergency Department and the Medical Ward argue every night about how fast admitted patients should be transferred upstairs. What type of conflict is this?",options:["Intergroup conflict","Role incompatibility","Interpersonal conflict","Intrapersonal conflict"],answer:0,aliases:[],rationale:"Two departments are in conflict, so it is intergroup.",whyNot:{1:"That is a source of interpersonal conflict, not a conflict between departments.",2:"Interpersonal conflict is between individual people. Here two departments are involved.",3:"Intrapersonal conflict happens inside one person."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-019"},{unit:8,topic:"u8-intergroup",type:"mcq",situational:!1,difficulty:2,stem:"Which of these is given in the module as an example of intergroup conflict?",options:["Two nurses arguing about a shift swap","A nurse struggling with her own values about overtime","A relative noticing delays in care","Conflicting beliefs between political affiliations"],answer:3,aliases:[],rationale:"The module lists conflicting political affiliations, and nurses balancing work and family issues, as intergroup examples.",whyNot:{0:"That is interpersonal conflict (between two people).",1:"That is intrapersonal conflict (within one person).",2:"That is the module's example for perceived conflict, a stage of the process."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A Types of Conflict",id:"U8-020"},{unit:8,topic:"u8-process",type:"id",situational:!1,difficulty:1,stem:"First stage of the conflict process, where conditions are ripe for conflict because of antecedent factors, but conflict has not occurred yet.",answer:"Latent conflict",aliases:["latent","latent stage"],rationale:'"Latent" means hidden or not yet active. The conditions exist, but the conflict has not started.',mnemonic:"Lazy Penguins Feel Mad After",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-021"},{unit:8,topic:"u8-process",type:"id",situational:!1,difficulty:2,stem:"In latent conflict, managers can prevent or reduce conflict by identifying and addressing these conditions.",answer:"Antecedent conditions",aliases:["antecedent factors","antecedents"],rationale:'Antecedent means "coming before". Fixing these early conditions prevents the conflict.',mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-022"},{unit:8,topic:"u8-process",type:"mcq",situational:!0,difficulty:2,stem:"A hospital is short staffed, so patient care delays are likely, but no one has complained yet. Which stage of the conflict process is this?",options:["Manifest conflict","Latent conflict","Perceived conflict","Felt conflict"],answer:1,aliases:[],rationale:"This is the module's example of latent conflict. The conditions are ripe, but conflict has not happened yet.",whyNot:{0:"Manifest conflict involves action, such as confronting someone. Nothing has happened yet.",2:"In perceived conflict someone already recognizes the issue. Here nobody has noticed it yet.",3:"Felt conflict is emotional. No emotions are involved yet."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-023"},{unit:8,topic:"u8-process",type:"id",situational:!1,difficulty:2,stem:"Stage of the conflict process where the conflict is recognized logically and impersonally as an issue involving rules or resources.",answer:"Perceived conflict",aliases:["perceived","perceived stage"],rationale:"In perceived conflict people see the problem with their minds, not yet with strong emotions.",mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-024"},{unit:8,topic:"u8-process",type:"mcq",situational:!0,difficulty:2,stem:"A patient's relative notices that her father's medicines are being given late. She is bothered but calm and does not show strong emotions. Which stage is this?",options:["Latent conflict","Conflict aftermath","Perceived conflict","Felt conflict"],answer:2,aliases:[],rationale:"She recognizes the issue logically without strong emotions. This matches the module's perceived conflict example.",whyNot:{0:"In latent conflict nobody has noticed anything yet. The relative has noticed.",1:"The aftermath comes after the conflict is resolved, well or poorly.",3:"Felt conflict has hostility, fear, mistrust, or anger. She is still calm."},mnemonic:"",note:"",sourceTag:"Unit 8 \u203A Conflict Management \u203A The Conflict Process",id:"U8-025"},{unit:8,topic:"u8-process",type:"mcq",situational:!1,difficulty:2,stem:"At whic
