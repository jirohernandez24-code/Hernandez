s presenting oneself, interacting, and fulfilling responsibilities to maintain this environment.",whyNot:{0:"Adhering to the Code is one way to practice decorum.",2:"Not the purpose.",3:"Professional development is part of decorum."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-002"},{unit:14,topic:"u14-decorum",type:"mcq",situational:!0,difficulty:2,stem:"A nurse arrives on time, owns up when she makes a mistake, and follows through on her tasks. Which way of practicing professional decorum is this?",options:["Punctuality and accountability","Appearance","Professional development","Team collaboration"],answer:0,aliases:[],rationale:"Being on time and owning one's actions is punctuality and accountability.",whyNot:{1:"Appearance is about grooming and uniform.",2:"That is about learning and growth.",3:"Collaboration is about working with others."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-003"},{unit:14,topic:"u14-decorum",type:"mcq",situational:!0,difficulty:2,stem:"A nurse protects patient data and avoids discussing patient details on social media. Which way of practicing decorum (with its law) does this show?",options:["Demonstrating respect (RA 10173, Data Privacy Act)","Punctuality and accountability","Maintaining competence (Standard of Nursing)","Appearance"],answer:0,aliases:[],rationale:"The module links demonstrating respect to RA 10173.",whyNot:{1:"Not related.",2:"That is about skills and standards.",3:"Not related."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-004"},{unit:14,topic:"u14-decorum",type:"id",situational:!1,difficulty:2,stem:"Way of practicing decorum that refers to adhering to ethical principles. Name the document it is linked to.",answer:"Code of Ethics for Nurses in the Philippines",aliases:["Code of Ethics","Code of Ethics for Nurses"],rationale:"Item 8: adhering to ethical principles (Code of Ethics for Nurses in the Philippines).",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-005"},{unit:14,topic:"u14-decorum",type:"id",situational:!1,difficulty:2,stem:'Way of practicing decorum linked to the "Standard of Nursing".',answer:"Maintaining competence",aliases:["competence"],rationale:"Item 10: maintaining competence (Standard of Nursing).",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-006"},{unit:14,topic:"u14-decorum",type:"mcq",situational:!0,difficulty:1,stem:"A nurse wears a clean, complete uniform with her ID and keeps her hair neat on duty. Which way of practicing decorum is this?",options:["Ethical practice","Communication","Workplace conduct","Appearance"],answer:3,aliases:[],rationale:"Proper grooming and uniform fall under appearance.",whyNot:{0:"Not related.",1:"Not related.",2:"Conduct is about behavior at work."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-007"},{unit:14,topic:"u14-decorum",type:"mcq",situational:!1,difficulty:2,stem:"How many ways of practicing professional decorum does the module list?",options:["5","11","9","12"],answer:1,aliases:[],rationale:"The module lists 11 ways.",whyNot:{0:"The module lists 11.",2:"Nine is the number of nursing associations and resume components.",3:"Twelve is the number of legal pointers in Unit 12."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing as a Professional Decorum",id:"U14-008"},{unit:14,topic:"u14-career",type:"id",situational:!1,difficulty:1,stem:"A purposeful and deliberate process involving active planning by both individuals and employers.",answer:"Career development",aliases:[],rationale:"Career development is planned by both the nurse and the employer.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-009"},{unit:14,topic:"u14-career",type:"id",situational:!1,difficulty:2,stem:"Theorist who described five levels of nursing experience from novice to expert.",answer:"Benner",aliases:["Patricia Benner"],rationale:"Benner's levels: novice, advanced beginner, competent, proficient, expert.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-010"},{unit:14,topic:"u14-career",type:"id",situational:!1,difficulty:1,stem:"Benner's level that relies on rules and abstract principles.",answer:"Novice",aliases:[],rationale:"The novice follows rules because she has no experience yet.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-011"},{unit:14,topic:"u14-career",type:"id",situational:!1,difficulty:2,stem:"Benner's level that starts applying past experiences.",answer:"Advanced beginner",aliases:["advanced beginners"],rationale:"The advanced beginner starts to use experience.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-012"},{unit:14,topic:"u14-career",type:"id",situational:!1,difficulty:2,stem:"Benner's level that gains efficiency and organization.",answer:"Competent",aliases:[],rationale:"The competent nurse is organized and efficient.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-013"},{unit:14,topic:"u14-career",type:"id",situational:!1,difficulty:2,stem:"Benner's level that sees the situation as a whole.",answer:"Proficient",aliases:[],rationale:"The proficient nurse sees the whole picture.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-014"},{unit:14,topic:"u14-career",type:"id",situational:!1,difficulty:2,stem:"Benner's level that operates with deep understanding and intuition.",answer:"Expert",aliases:[],rationale:"The expert works by deep understanding and intuition.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-015"},{unit:14,topic:"u14-career",type:"mcq",situational:!0,difficulty:2,stem:"A newly hired nurse follows the procedure manual step by step and cannot yet adapt when something unusual happens. Which Benner level is she?",options:["Expert","Advanced beginner","Novice","Competent"],answer:2,aliases:[],rationale:"Relying on rules and abstract principles describes a novice.",whyNot:{0:"An expert works by intuition.",1:"An advanced beginner starts applying past experience.",3:"A competent nurse is efficient and organized."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-016"},{unit:14,topic:"u14-career",type:"mcq",situational:!0,difficulty:2,stem:"After a few months, a nurse remembers a past patient with similar symptoms and uses that to guide her care. Which Benner level fits?",options:["Advanced beginner","Proficient","Novice","Expert"],answer:0,aliases:[],rationale:"Starting to apply past experiences is the advanced beginner.",whyNot:{1:"A proficient nurse sees the whole situation.",2:"A novice relies on rules only.",3:"An expert works by intuition."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-017"},{unit:14,topic:"u14-career",type:"mcq",situational:!0,difficulty:2,stem:"A nurse now plans her shift well, prioritizes efficiently, and finishes tasks in an organized way. Which Benner level?",options:["Competent","Novice","Advanced beginner","Proficient"],answer:0,aliases:[],rationale:"Gaining efficiency and organization describes the competent nurse.",whyNot:{1:"A novice relies on rules.",2:"An advanced beginner applies past experiences.",3:"Proficient sees the situation as a whole."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-018"},{unit:14,topic:"u14-career",type:"mcq",situational:!0,difficulty:3,stem:`A nurse looks at a post-op patient and says, "Something's off," and calls the rapid response team before the vital signs change. Her intuition is right. Which Benner level?`,options:["Novice","Competent","Expert","Proficient"],answer:2,aliases:[],rationale:"Deep understanding and intuition describe the expert.",whyNot:{0:"A novice relies on rules.",1:"Competent is about efficiency and organization.",3:"Proficient sees the whole situation. Intuition is the expert's mark."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-019"},{unit:14,topic:"u14-career",type:"mcq",situational:!0,difficulty:2,stem:"A nurse understands how her patient's labs, meds, family situation, and discharge plan fit together as one whole picture. Which Benner level?",options:["Novice","Competent","Advanced beginner","Proficient"],answer:3,aliases:[],rationale:"Seeing the situation as a whole describes the proficient nurse.",whyNot:{0:"Novice relies on rules.",1:"Competent is efficient and organized.",2:"Advanced beginner applies past experiences."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-020"},{unit:14,topic:"u14-career",type:"mcq",situational:!1,difficulty:2,stem:"Which is the correct order of Benner's levels?",options:["Novice, advanced beginner, competent, proficient, expert","Novice, proficient, competent, advanced beginner, expert","Advanced beginner, novice, competent, expert, proficient","Novice, competent, advanced beginner, proficient, expert"],answer:0,aliases:[],rationale:"This is the correct order.",whyNot:{1:"Proficient comes after competent.",2:"Novice is first and expert is last.",3:"Advanced beginner comes before competent."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-021"},{unit:14,topic:"u14-career",type:"mcq",situational:!1,difficulty:2,stem:"According to the module, who does active planning in career development?",options:["Only the employer","Only the PRC","Both individuals and employers","Only the nurse's family"],answer:2,aliases:[],rationale:"The module says career development involves active planning by both.",whyNot:{0:"Both plan.",1:"Not stated.",3:"Not stated."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Development / Benner's Level of Nursing Experience",id:"U14-022"},{unit:14,topic:"u14-stages",type:"id",situational:!1,difficulty:2,stem:"Career stage covering the first 10 years, focused on building skills, gaining knowledge, and positioning for the future.",answer:"Promise phase",aliases:["promise"],rationale:"The promise phase is early career.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-023"},{unit:14,topic:"u14-stages",type:"id",situational:!1,difficulty:2,stem:"Career stage covering 11 to 29 years, focused on mastery, professional growth, and avoiding stagnation.",answer:"Momentum phase",aliases:["momentum"],rationale:"The momentum phase is mid-career.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-024"},{unit:14,topic:"u14-stages",type:"id",situational:!1,difficulty:2,stem:"Career stage of 30+ years, focused on reinventing value, advancing the profession, and leaving a legacy.",answer:"Harvest phase",aliases:["harvest"],rationale:"The harvest phase is late career.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-025"},{unit:14,topic:"u14-stages",type:"id",situational:!1,difficulty:2,stem:"Optional career stage of returning to nursing after a break, needing adaptation and retraining.",answer:"Reentry phase",aliases:["reentry","re-entry"],rationale:"Reentry is optional and needs retraining.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-026"},{unit:14,topic:"u14-stages",type:"mcq",situational:!0,difficulty:2,stem:"A nurse with 18 years of experience is a respected clinical expert. She works hard to keep learning so she does not stagnate. Which career stage is she in?",options:["Reentry phase","Momentum phase","Harvest phase","Promise phase"],answer:1,aliases:[],rationale:"11 to 29 years, with a focus on mastery and avoiding stagnation.",whyNot:{0:"She did not leave nursing.",2:"Harvest is 30+ years.",3:"Promise is the first 10 years."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-027"},{unit:14,topic:"u14-stages",type:"mcq",situational:!0,difficulty:2,stem:"A nurse with 32 years of service mentors young nurses and writes a book to leave a legacy for the profession. Which stage?",options:["Promise phase","Reentry phase","Harvest phase","Momentum phase"],answer:2,aliases:[],rationale:"30+ years, focused on advancing the profession and leaving a legacy.",whyNot:{0:"Promise is the first 10 years.",1:"She has not returned from a break.",3:"Momentum is 11 to 29 years."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-028"},{unit:14,topic:"u14-stages",type:"mcq",situational:!0,difficulty:2,stem:"A nurse left practice for 8 years to raise her children. She now takes a refresher course before going back to hospital work. Which stage?",options:["Reentry phase","Promise phase","Momentum phase","Harvest phase"],answer:0,aliases:[],rationale:"Returning after a break with adaptation and retraining is reentry.",whyNot:{1:"Promise is the first 10 years of a continuous career.",2:"Momentum is mid-career.",3:"Harvest is 30+ years."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-029"},{unit:14,topic:"u14-stages",type:"mcq",situational:!0,difficulty:1,stem:"A 2-year staff nurse attends trainings to build her skills and position herself for future roles. Which stage?",options:["Harvest phase","Reentry phase","Promise phase","Momentum phase"],answer:2,aliases:[],rationale:"The first 10 years focus on building skills and positioning for the future.",whyNot:{0:"Harvest is 30+ years.",1:"She has not left practice.",3:"Momentum starts at 11 years."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-030"},{unit:14,topic:"u14-stages",type:"id",situational:!1,difficulty:2,stem:"Range of years of the momentum phase.",answer:"11 to 29 years",aliases:["11-29","11 to 29","11-29 years"],rationale:"Momentum: 11 to 29 years.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Career Stages in Nursing",id:"U14-031"},{unit:14,topic:"u14-jobsearch",type:"id",situational:!1,difficulty:1,stem:"A systematic approach to finding the right job that aligns career goals with available opportunities.",answer:"Job search",aliases:["job searching"],rationale:"A job search is planned and systematic.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Job Search / Job Leads",id:"U14-032"},{unit:14,topic:"u14-jobsearch",type:"id",situational:!1,difficulty:2,stem:"Job lead that uses word-of-mouth referrals from colleagues, mentors, and professional organizations to find hidden job opportunities.",answer:"Networking",aliases:[],rationale:"Networking uncovers jobs that are not posted.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Job Search / Job Leads",id:"U14-033"},{unit:14,topic:"u14-jobsearch",type:"mcq",situational:!0,difficulty:2,stem:"A new RN searches Jobstreet, Indeed, and LinkedIn for staff nurse openings. Which job lead is she using?",options:["Recruitment agencies","Nursing association websites","Job boards","Networking"],answer:2,aliases:[],rationale:"Jobstreet, Indeed, and LinkedIn are the module's job board examples.",whyNot:{0:"Agencies are companies that match nurses with roles.",1:"These are sites like the PNA's.",3:"Networking is word-of-mouth referral."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Job Search / Job Leads",id:"U14-034"},{unit:14,topic:"u14-jobsearch",type:"mcq",situational:!0,difficulty:2,stem:"A nurse learns of an unposted ICU opening because her former clinical instructor recommends her to the chief nurse. Which job lead is this?",options:["Hospital websites","Recruitment agencies","Job boards","Networking"],answer:3,aliases:[],rationale:"Word-of-mouth referrals through mentors uncover hidden opportunities.",whyNot:{0:"The opening was not posted.",1:"No agency was involved.",2:"The opening was not posted."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Job Search / Job Leads",id:"U14-035"},{unit:14,topic:"u14-jobsearch",type:"mcq",situational:!0,difficulty:2,stem:"A nurse who wants to work abroad registers with a company that specializes in healthcare placement in the Philippines and overseas. Which job lead is this?",options:["Nursing association websites","Job boards","Networking","Recruitment agencies"],answer:3,aliases:[],rationale:"Healthcare recruitment agencies connect nurses to local and international roles.",whyNot:{0:"These are association sites.",1:"Job boards are websites where she searches herself.",2:"Networking is personal referral."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Job Search / Job Leads",id:"U14-036"},{unit:14,topic:"u14-jobsearch",type:"mcq",situational:!1,difficulty:2,stem:"Which job lead is given in the module with examples like the Philippine General Hospital and St. Luke's Medical Center?",options:["Hospital and healthcare institution websites","Job boards","Recruitment agencies","Nursing association websites"],answer:0,aliases:[],rationale:"The module names PGH and St. Luke's for this lead.",whyNot:{1:"The examples there are Jobstreet, Indeed, and LinkedIn.",2:"No named examples.",3:"The example there is the PNA."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Job Search / Job Leads",id:"U14-037"},{unit:14,topic:"u14-jobsearch",type:"id",situational:!1,difficulty:2,stem:"Give one nursing association website the module names as a job lead.",answer:"Philippine Nurses Association",aliases:["PNA"],rationale:"The module names the PNA and specialty nursing groups.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Job Search / Job Leads",id:"U14-038"},{unit:14,topic:"u14-portfolio",type:"id",situational:!1,difficulty:1,stem:"An essential tool for nurses to document their career journey, competencies, and accomplishments.",answer:"Professional portfolio",aliases:["portfolio"],rationale:"A portfolio is a full record of professional development.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",id:"U14-039"},{unit:14,topic:"u14-portfolio",type:"id",situational:!1,difficulty:2,stem:"Portfolio component that includes the PRC ID, Certificate of Registration, and board rating.",answer:"Licensure credentials",aliases:["licensure"],rationale:"Licensure credentials show the nurse is licensed.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",id:"U14-040"},{unit:14,topic:"u14-portfolio",type:"id",situational:!1,difficulty:2,stem:"Portfolio component that includes GSIS, SSS, PhilHealth, PAG-IBIG, and BIR TIN.",answer:"Government-mandated credentials",aliases:["government mandated credentials","government credentials"],rationale:"These are required government numbers and memberships.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",id:"U14-041"},{unit:14,topic:"u14-portfolio",type:"id",situational:!1,difficulty:2,stem:"Document showing employment history (abbreviation COE).",answer:"Certificate of Employment",aliases:["COE"],rationale:"COE = Certificate of Employment.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",id:"U14-042"},{unit:14,topic:"u14-portfolio",type:"mcq",situational:!0,difficulty:2,stem:"A nurse puts her BLS and ACLS cards and seminar certificates in her portfolio. Which component is this?",options:["Certifications achieved","Education credentials","Licensure credentials","Government-mandated credentials"],answer:0,aliases:[],rationale:"Seminars, BLS, and ACLS are certifications.",whyNot:{1:"Those are diploma and transcript.",2:"Those are PRC ID, Certificate of Registration, and board rating.",3:"Those are GSIS, SSS, PhilHealth, PAG-IBIG, BIR TIN."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",id:"U14-043"},{unit:14,topic:"u14-portfolio",type:"mcq",situational:!0,difficulty:2,stem:'Under "education credentials," what should the nurse include?',options:["SSS and PAG-IBIG numbers","COE","PRC ID and board rating","Diploma and Transcript of Records"],answer:3,aliases:[],rationale:"The module lists these as education credentials.",whyNot:{0:"These are government-mandated credentials.",1:"That is employment history.",2:"These are licensure credentials."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",id:"U14-044"},{unit:14,topic:"u14-portfolio",type:"mcq",situational:!1,difficulty:2,stem:"Why should a nurse keep her portfolio up to date, according to the module?",options:["To avoid paying taxes","To have the documents needed for career advancement, new jobs, or performance evaluations","To avoid CPD","To replace her PRC license"],answer:1,aliases:[],rationale:"The module gives these reasons.",whyNot:{0:"Not a reason.",2:"Portfolios show commitment to learning.",3:"A portfolio contains the license. It does not replace it."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Developing a Professional Portfolio",id:"U14-045"},{unit:14,topic:"u14-resume",type:"id",situational:!1,difficulty:1,stem:"Detailed document outlining one's entire career, education, achievements, and experiences (abbreviation).",answer:"CV",aliases:["curriculum vitae"],rationale:"A CV is detailed and covers the entire career.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-046"},{unit:14,topic:"u14-resume",type:"id",situational:!1,difficulty:1,stem:"Concise document summarizing skills, work experience, and qualifications tailored to a specific job.",answer:"Resume",aliases:["r\xE9sum\xE9"],rationale:"A resume is short and tailored.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-047"},{unit:14,topic:"u14-resume",type:"mcq",situational:!0,difficulty:2,stem:"A nurse applying for a faculty position at a university is asked to submit a detailed record of her entire education, research, and career achievements. Which document fits?",options:["Certificate of Employment","Curriculum vitae (CV)","Advance directive","Resume"],answer:1,aliases:[],rationale:"A CV is a detailed record of one's entire career.",whyNot:{0:"That only proves past employment.",2:"That is a medical document.",3:"A resume is a concise summary tailored to a job."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-048"},{unit:14,topic:"u14-resume",type:"mcq",situational:!1,difficulty:2,stem:"What is the recommended length of a resume according to the module?",options:["1 to 2 pages","Exactly half a page","No limit","5 to 10 pages"],answer:0,aliases:[],rationale:"The module says limit your resume to 1 to 2 pages.",whyNot:{1:"Not stated.",2:"The module sets 1 to 2 pages.",3:"Too long. Recruiters spend only seconds on a resume."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-049"},{unit:14,topic:"u14-resume",type:"id",situational:!1,difficulty:2,stem:"Minimum font size recommended for a resume (points).",answer:"12",aliases:["12-point","12 point","twelve"],rationale:"Use a professional font in 12-point size or larger.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-050"},{unit:14,topic:"u14-resume",type:"mcq",situational:!1,difficulty:2,stem:"Which information should be EXCLUDED from a resume, according to the module?",options:["Workshops and conferences attended","Marital status, age, children, ethnicity, religious affiliation","Professional email address","ACLS and PALS certifications"],answer:1,aliases:[],rationale:"The module says not to include these personal details.",whyNot:{0:"These belong in professional development.",2:"This is part of contact information.",3:"These belong in certifications and licensure."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-051"},{unit:14,topic:"u14-resume",type:"mcq",situational:!0,difficulty:2,stem:`A nurse's resume says, "Single, 24 years old, Catholic, no children." What should she do?`,options:["Move them to the top so recruiters see them","Add her ethnicity too","Remove these personal details","Add a photo of her family"],answer:2,aliases:[],rationale:"Marital status, age, children, and religion should be excluded.",whyNot:{0:"They should be excluded.",1:"Ethnicity should also be excluded.",3:"Not advised."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-052"},{unit:14,topic:"u14-resume",type:"mcq",situational:!0,difficulty:2,stem:'A nurse writes on her resume that she "single-handedly ran the entire ICU" when she was a staff nurse there for 3 months. What rule does this break?',options:["Use a 12-point font","Use white or off-white paper","Avoid exaggerated claims","Keep to 1 to 2 pages"],answer:2,aliases:[],rationale:"The module says focus on accurate and honest representation.",whyNot:{0:"Not related.",1:"Not related.",3:"Not related."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-053"},{unit:14,topic:"u14-resume",type:"mcq",situational:!1,difficulty:2,stem:"What does the module say about the design of a printed resume?",options:["Use high-quality white or off-white paper; black with a single accent color is ideal","Use bright neon paper to stand out","Add decorative borders and clip art","Use many different fonts"],answer:0,aliases:[],rationale:"The module recommends this minimal design.",whyNot:{1:"The module recommends white or off-white.",2:"Keep it simple and clean.",3:"Use a single font style."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-054"},{unit:14,topic:"u14-resume",type:"id",situational:!1,difficulty:2,stem:"Optional resume statement used instead of listing references.",answer:"References available upon request",aliases:["available upon request"],rationale:'You can write "References available upon request."',mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-055"},{unit:14,topic:"u14-resume",type:"mcq",situational:!0,difficulty:2,stem:"Who should a nurse list as a reference according to the module?",options:["A famous doctor she met once at a seminar","Only family members","Someone who knows her well, ideally for at least 3 years, who has agreed to be contacted","Anyone, without asking them first"],answer:2,aliases:[],rationale:"The module says list people who know you well (ideally 3+ years), inform them, and get permission.",whyNot:{0:"They do not know her well.",1:"The module refers to professional references.",3:"References should be informed and give permission."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-056"},{unit:14,topic:"u14-resume",type:"id",situational:!1,difficulty:2,stem:"Ideal minimum number of years a reference should have known you.",answer:"3",aliases:["three","3 years","three years"],rationale:"Ideally at least 3 years.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-057"},{unit:14,topic:"u14-resume",type:"mcq",situational:!1,difficulty:2,stem:"Which is one of the 9 key components of a resume in the module?",options:["Marital status","Board exam review center ranking","Objective or summary statement","Religious affiliation"],answer:2,aliases:[],rationale:"It is component 2.",whyNot:{0:"This should be excluded.",1:"Not listed.",3:"This should be excluded."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-058"},{unit:14,topic:"u14-resume",type:"mcq",situational:!0,difficulty:2,stem:"A nurse applying to an oncology unit rewrites her resume to highlight her chemo-handling experience and oncology seminars. Which resume quality is she applying?",options:["Using a CV instead","Tailored to the role","Exaggerated claims","Listing references"],answer:1,aliases:[],rationale:"Customizing the resume to the job's requirements is tailoring.",whyNot:{0:"She is still using a resume.",2:"She is highlighting real experience.",3:"Not related."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-059"},{unit:14,topic:"u14-resume",type:"id",situational:!1,difficulty:2,stem:'In the "skills and competencies" part of the resume, give one example of technology the module says to mention.',answer:"EHR systems",aliases:["EHR","electronic health records","electronic health record"],rationale:"The module mentions software or technology like EHR systems.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Resume Format",id:"U14-060"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"Abbreviation for Advanced Practice Registered Nurses.",answer:"APRN",aliases:["APRNs"],rationale:"APRNs include NPs, CNSs, CRNAs, and CNMs.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-061"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"APRN who diagnoses and treats illnesses, prescribes medications, and conducts procedures (abbreviation).",answer:"NP",aliases:["nurse practitioner","nurse practitioners"],rationale:"NP = nurse practitioner.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-062"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"APRN who provides anesthesia for patients undergoing surgery (abbreviation).",answer:"CRNA",aliases:["nurse anesthetist","certified registered nurse anesthetist"],rationale:"CRNA = nurse anesthetist.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-063"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"APRN who provides prenatal, labor, and postpartum care, including deliveries and family planning (abbreviation).",answer:"CNM",aliases:["nurse midwife","certified nurse midwife"],rationale:"CNM = nurse midwife.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-064"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"APRN who is an expert in a specific area, improving care, educating staff, and implementing evidence-based practice (abbreviation).",answer:"CNS",aliases:["clinical nurse specialist"],rationale:"CNS = clinical nurse specialist.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-065"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"Top-level nurse executive who makes hospital- or system-wide decisions (abbreviation).",answer:"CNO",aliases:["chief nursing officer"],rationale:"CNO = Chief Nursing Officer.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-066"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"Field where nurses care for victims of crime, collect evidence, and work with law enforcement.",answer:"Forensic nursing",aliases:["forensic"],rationale:"Forensic nursing links nursing and the law.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-067"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"Emerging BPO role where nurses document patient encounters, histories, and treatment plans during live consultations.",answer:"Livescribe nursing",aliases:["livescribe"],rationale:"Livescribe nurses document during live consultations.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-068"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:2,stem:"Coding system for diagnoses used in medical coding (abbreviation for International Classification of Diseases, 10th revision).",answer:"ICD-10",aliases:["ICD 10","ICD10","ICD"],rationale:"ICD-10 = International Classification of Diseases.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-069"},{unit:14,topic:"u14-fields",type:"id",situational:!1,difficulty:3,stem:"Coding system for procedures used in medical coding (abbreviation for Current Procedural Terminology).",answer:"CPT",aliases:["current procedural terminology"],rationale:"CPT = Current Procedural Terminology.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-070"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse in a BPO company answers health calls, triages symptoms, gives basic advice, and schedules patients with providers. Which field is this?",options:["Medical transcription","Telehealth nursing","Livescribe nursing","Medical coding"],answer:1,aliases:[],rationale:"These BPO tasks match telehealth nursing.",whyNot:{0:"Transcription converts audio into written records.",2:"Livescribe documents during live consultations.",3:"Coding assigns ICD-10 and CPT codes."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-071"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse works for an HMO helping members understand their benefits and process their claims. Which field is this?",options:["Palliative care nursing","Clinical research nursing","Forensic nursing","Health insurance and case management"],answer:3,aliases:[],rationale:"Helping patients navigate benefits and claims is this field.",whyNot:{0:"That is about comfort in serious illness.",1:"That is about research studies.",2:"That is about crime victims."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-072"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse converts doctors' dictated audio recordings into written medical records with high accuracy. Which field is this?",options:["Medical coding","Telehealth nursing","Livescribe nursing","Medical transcription"],answer:3,aliases:[],rationale:"Transcribing audio into records is medical transcription.",whyNot:{0:"Coding assigns codes for claims.",1:"That handles patient calls.",2:"Livescribe documents during live consultations, not from recordings."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-073"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse with ICD-10 and CPT expertise reviews charts so claims are processed accurately for reimbursement. Which field is this?",options:["Medical coding","Nurse scientist","Medical transcription","Case management"],answer:0,aliases:[],rationale:"ICD-10 and CPT codes for accurate claims define medical coding.",whyNot:{1:"That advances knowledge through research.",2:"That converts audio to text.",3:"That helps patients with benefits."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-074"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse in a hospice provides comfort and support to patients with life-limiting illnesses. Which field is this?",options:["Public health nursing","Forensic nursing","Telehealth nursing","Palliative care nursing"],answer:3,aliases:[],rationale:"Comfort and support in serious, life-limiting illness is palliative care.",whyNot:{0:"That is community health.",1:"That is about crime victims.",2:"That is remote BPO care."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-075"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse works in the barangay on immunization drives, disease prevention, and outbreak response. Which field is this?",options:["Clinical research nursing","Palliative care nursing","Forensic nursing","Public health nursing"],answer:3,aliases:[],rationale:"Community health promotion, disease prevention, and crisis response are public health nursing.",whyNot:{0:"That is research.",1:"That is comfort care.",2:"That is about crime victims."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-076"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:3,stem:"A pediatric oncology nurse expert improves patient care standards on her unit, teaches the staff, and puts evidence-based practice into protocols. She does not mainly prescribe or diagnose. Which APRN role fits best?",options:["Nurse practitioner (NP)","Clinical nurse specialist (CNS)","Nurse anesthetist (CRNA)","Nurse midwife (CNM)"],answer:1,aliases:[],rationale:"CNSs are experts who improve care, educate staff, and implement evidence-based practice.",whyNot:{0:"NPs diagnose, treat, and prescribe.",2:"CRNAs provide anesthesia.",3:"CNMs provide maternity care."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-077"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse leads a ward: she plans staffing, oversees daily patient care, and ensures compliance with policies. Which role is this?",options:["Nurse executive (CNO)","Nursing faculty","Nurse manager","Clinical educator"],answer:2,aliases:[],rationale:"Day-to-day unit operations, staffing, and compliance describe the nurse manager.",whyNot:{0:"CNOs decide hospital- or system-wide policies.",1:"Faculty teach students.",3:"Clinical educators teach staff."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-078"},{unit:14,topic:"u14-fields",type:"mcq",situational:!0,difficulty:2,stem:"A nurse in a hospital teaches staff nurses about a new wound-care technique and best practices. Which role is this?",options:["Nurse scientist","Clinical educator","Nursing faculty","Nurse manager"],answer:1,aliases:[],rationale:"Clinical educators teach healthcare staff in clinical settings.",whyNot:{0:"Scientists do research.",2:"Faculty teach undergraduate or graduate students.",3:"Managers run unit operations."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-079"},{unit:14,topic:"u14-fields",type:"mcq",situational:!1,difficulty:2,stem:"What is the difference between a clinical research nurse and a nurse scientist, according to the module?",options:["Nurse scientists only transcribe records","They are the same role","Clinical research nurses only give anesthesia","Clinical research nurses conduct research studies (often with pharma, universities, institutions); nurse scientists advance knowledge through research in nursing and healthcare science"],answer:3,aliases:[],rationale:"The module describes them this way.",whyNot:{0:"That is medical transcription.",1:"The module lists them separately.",2:"That is the CRNA."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Fields of Specialization in Nursing",id:"U14-080"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:1,stem:"The national, premier, and largest organization of registered nurses in the Philippines (abbreviation).",answer:"PNA",aliases:["Philippine Nurses Association"],rationale:"The PNA is the largest national nursing organization.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-081"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:2,stem:"Association for nurse leaders and administrators in healthcare settings (abbreviation).",answer:"ANSAP",aliases:["Association of Nursing Service Administrators of the Philippines"],rationale:"ANSAP focuses on nursing management and administration.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-082"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:2,stem:"Association of deans of nursing colleges that works to improve nursing education and curriculum (abbreviation).",answer:"ADPCN",aliases:["ADPCN Inc","Association of Deans of Philippine Colleges of Nursing"],rationale:"ADPCN is for nursing education leaders.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-083"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:2,stem:"Premier organization for operating room nurses in the Philippines (abbreviation).",answer:"ORNAP",aliases:["periOperative Registered Nurses Association of the Philippines"],rationale:"ORNAP is for perioperative (OR) nurses.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-084"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:2,stem:"National organization for critical care nurses (abbreviation).",answer:"CCNAPI",aliases:["Critical Care Nurses Association of the Philippines"],rationale:"CCNAPI is for ICU nurses.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-085"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:2,stem:"Specialized professional organization for oncology nursing focusing on holistic care of cancer patients (abbreviation).",answer:"PONA",aliases:["Philippine Oncology Nurses Association"],rationale:"PONA is for oncology nurses.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-086"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:2,stem:"Organization founded in 2009 to promote the socio-economic-political-professional rights of nurses.",answer:"ANG NARS",aliases:["ANG NARS Inc","Ang Nars"],rationale:"ANG NARS was founded in 2009 for nurses' rights.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-087"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:2,stem:"Nursing research group formerly called the Philippine Nursing Research Society, Inc. (PNRSI). Give its current abbreviation.",answer:"GSPNRI",aliases:["Global Society for Philippine Nurse Researchers"],rationale:"GSPNRI was formerly PNRSI.",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-088"},{unit:14,topic:"u14-assoc",type:"id",situational:!1,difficulty:3,stem:"Year ANG NARS, Inc. was founded.",answer:"2009",aliases:[],rationale:"ANG NARS was founded in 2009 (SEC No. CN 200900208).",mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-089"},{unit:14,topic:"u14-assoc",type:"mcq",situational:!0,difficulty:2,stem:"A nurse who provides one-on-one care to a patient at home wants to join an association for her type of practice. Which one?",options:["ORNAP","ADPCN","Association of Private Duty Nurse Practitioners Philippines, Inc.","ANSAP"],answer:2,aliases:[],rationale:"It is dedicated to private-duty nurses who give one-on-one care at home or in private settings.",whyNot:{0:"ORNAP is for OR nurses.",1:"ADPCN is for deans.",3:"ANSAP is for nursing administrators."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-090"},{unit:14,topic:"u14-assoc",type:"mcq",situational:!0,difficulty:2,stem:"A chief nurse wants to join an organization that improves nursing management and administration in hospitals. Which one?",options:["ADPCN","ANSAP","CCNAPI","PONA"],answer:1,aliases:[],rationale:"ANSAP is for nurse leaders and administrators.",whyNot:{0:"ADPCN is for deans of nursing colleges.",2:"CCNAPI is for critical care nurses.",3:"PONA is for oncology nurses."},mnemonic:"",note:"",sourceTag:"Unit 14 \u203A Personal and Professional Responsibilities \u203A Nursing Associations",id:"U14-091"},{unit:14,topic:"u14-assoc",type:"mcq",situational:!0,difficulty:2,stem:"A dean of a College of Nursing in Bulacan joins a group of nursing education leaders to improve curriculum standards. Which association?",o .nc-display{font-family:'Lilita One','Arial Black',Impact,sans-serif;letter-spacing:.02em}
.nc-root{font-family:'Nunito',ui-rounded,system-ui,sans-serif}
.nc-press{transition:transform .08s ease, box-shadow .08s ease}
.nc-press:active{transform:translateY(3px);box-shadow:0 2px 0 #111827 !important}
@keyframes nc-bang{0%{transform:rotate(0)}35%{transform:rotate(-40deg)}65%{transform:rotate(10deg)}100%{transform:rotate(0)}}
@keyframes nc-cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes nc-gasp{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(2px) scaleY(.88)}}
@keyframes nc-pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes nc-rise{0%{transform:translateY(24px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes nc-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes nc-confetti{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(160px) rotate(540deg);opacity:0}}
.nc-gavel{transform-box:fill-box;transform-origin:15% 85%}
.nc-react-right .nc-gavel,.nc-react-wrong .nc-gavel{animation:nc-bang .45s ease-out 2}
.nc-juror{transform-box:fill-box;transform-origin:50% 100%}
.nc-react-right .nc-juror{animation:nc-cheer .32s ease-in-out 3}
.nc-react-right .nc-juror:nth-child(2){animation-delay:.08s}
.nc-react-right .nc-juror:nth-child(3){animation-delay:.16s}
.nc-react-wrong .nc-juror{animation:nc-gasp .5s ease-in-out 2}
.nc-sign{transform-box:fill-box;transform-origin:50% 100%;animation:nc-pop .35s ease-out}
