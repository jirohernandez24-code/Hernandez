<title>NGT Feeding Ward</title>
<meta name="description" content="A playable ward simulation of Skills Enhancement #7: Nasogastric Tube (NGT) Feeding, scored with the Level 4 checklist rubric.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ward canvas fills the stage, a narrow clinical sidebar holds the checklist; modals are paper chart sheets over a dark scrub-teal chrome. */
:root{
  --chrome:#0d2627;
  --chrome-2:#133536;
  --chrome-3:#1b4547;
  --line:#2c5a5b;
  --fg:#e6f1ef;
  --muted:#93b5b1;
  --paper:#eef4f3;
  --paper-2:#dfe9e7;
  --paper-line:#c3d3d0;
  --ink:#0f1f1e;
  --ink-2:#4a6360;
  --enteral:#7a4fd6;
  --enteral-soft:#b9a0ff;
  --enteral-tint:#ece4ff;
  --ok:#2fae6c;
  --warn:#e9a93a;
  --crit:#e0464b;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--chrome);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--enteral-soft);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
kbd{font-family:var(--f-mono);font-size:11px;background:var(--chrome-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg)}

#app{display:flex;flex-direction:column;min-height:100%;max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:10px 16px;gap:10px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:50%;background:
  radial-gradient(circle at 50% 50%,var(--chrome) 0 5px,transparent 6px),
  conic-gradient(var(--enteral) 0 25%,var(--enteral-soft) 0 50%,var(--enteral) 0 75%,var(--enteral-soft) 0);
  box-shadow:0 0 0 3px var(--chrome-3)}
.brand-text{display:flex;flex-direction:column;line-height:1.05}
.brand-text strong{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand-text span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.case-chip,.clock-chip{display:flex;flex-direction:column;background:var(--chrome-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;line-height:1.15;min-width:0}
.case-chip .lbl,.clock-chip .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.case-chip .val{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.clock-chip .val{font-size:17px;font-weight:700;color:var(--warn)}
.mode-chip{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--enteral);color:#fff}
.mode-chip.demo{background:var(--crit)}
.top-actions{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--chrome-2);font-weight:700;font-family:var(--f-display);font-size:16px;display:grid;place-items:center}
.icon-btn:hover{background:var(--chrome-3)}
.icon-btn.off{color:var(--muted);text-decoration:line-through}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.viewport{position:relative;border-radius:14px;overflow:hidden;background:#0a1d1e;border:1px solid var(--line);aspect-ratio:16/10;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#world{display:block;width:100%;height:100%;cursor:pointer}
.ci-bar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:flex-start;background:rgba(13,38,39,.88);backdrop-filter:blur(4px);border:1px solid var(--enteral);border-radius:10px;padding:8px 12px;font-size:14px;pointer-events:none;max-width:560px}
.ci-tag{flex:none;font-family:var(--f-display);font-weight:700;background:var(--enteral);color:#fff;border-radius:4px;padding:0 6px;letter-spacing:.06em}
.toast-stack{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:min(380px,80%)}
.toast{background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.35);border-left:5px solid var(--ok);animation:toastIn .25s ease-out}
.toast.warn{border-left-color:var(--warn)}
.toast.crit{border-left-color:var(--crit)}
.toast.info{border-left-color:var(--enteral)}
@keyframes toastIn{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

.touch{position:absolute;inset:auto 0 0 0;height:150px;pointer-events:none}
.stick{position:absolute;left:18px;bottom:18px;width:116px;height:116px;border-radius:50%;background:rgba(230,241,239,.12);border:2px solid rgba(230,241,239,.35);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(230,241,239,.6)}
.use-btn{position:absolute;right:18px;bottom:28px;width:84px;height:84px;border-radius:50%;border:3px solid #fff;background:var(--enteral);color:#fff;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* ---------- sidebar ---------- */
.side{background:var(--chrome-2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;max-height:min(78vh,680px)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:10px 6px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tab.on{color:var(--fg);border-bottom-color:var(--enteral-soft)}
.count{display:inline-block;min-width:20px;padding:0 5px;border-radius:999px;background:var(--chrome-3);font-family:var(--f-mono);font-size:11px;color:var(--fg)}
.tabpane{overflow:auto;padding:10px 12px;flex:1;min-height:0}
.phase{margin-bottom:12px}
.phase h3{margin:0 0 4px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.citem{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;padding:4px 0;color:var(--fg);line-height:1.3}
.citem .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.citem.done .dot{background:var(--ok);border-color:var(--ok)}
.citem.err .dot{background:var(--crit);border-color:var(--crit)}
.citem.done{color:var(--muted)}
.citem.next{color:#fff}
.citem.next .dot{border-color:var(--enteral-soft);box-shadow:0 0 0 3px rgba(185,160,255,.25)}
.hidden-list{font-size:13px;color:var(--muted)}
.tray-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tray-item{display:flex;align-items:center;gap:8px;background:var(--chrome-3);border-radius:8px;padding:6px;font-size:12.5px;line-height:1.2}
.tray-item svg{flex:none}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{font-size:12.5px;border-left:3px solid var(--ok);padding:2px 0 2px 8px;line-height:1.35}
.log li.warn{border-left-color:var(--warn)}
.log li.crit{border-left-color:var(--crit)}
.log li.info{border-left-color:var(--enteral-soft)}
.log time{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
.keys{display:flex;flex-wrap:wrap;gap:8px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

/* ---------- modal (paper chart sheet) ---------- */
.modal{position:fixed;inset:0;background:rgba(5,16,17,.62);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:20;overflow:auto}
.sheet{background:var(--paper);color:var(--ink);border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.45);color-scheme:light;margin-block:auto;animation:sheetIn .22s ease-out}
.sheet.wide{width:min(1060px,100%)}
@keyframes sheetIn{from{transform:translateY(14px) scale(.985);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:2px solid var(--paper-line);background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(15,31,30,.04) 27px 28px)}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--enteral);font-size:13px}
.sheet-head h2{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance}
.close{flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--paper-line);background:#fff;font-size:22px;line-height:1;color:var(--ink)}
.sheet-body{padding:16px 18px 18px}
.sheet-body p{margin:0 0 10px;max-width:68ch}
.sheet .muted{color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid var(--paper-line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:700;font-size:14px;line-height:1.2;min-height:40px;text-align:left}
.btn:hover{border-color:var(--enteral);background:var(--enteral-tint)}
.btn.primary{background:var(--enteral);border-color:var(--enteral);color:#fff}
.btn.primary:hover{background:#6840c2}
.btn.danger{border-color:var(--crit);color:#a52126}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.picked{background:var(--enteral-tint);border-color:var(--enteral);box-shadow:inset 0 0 0 1px var(--enteral)}
.btn.right{background:#e3f6ec;border-color:var(--ok)}
.btn.wrong{background:#fde8e8;border-color:var(--crit)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:12px;min-width:0}
.card h4{margin:0 0 6px;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:700}
.chart-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chart-tab{border:1px solid var(--paper-line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.chart-tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chart-tab .seen{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.order-sheet{font-family:var(--f-mono);font-size:13.5px;background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:12px 14px;line-height:1.7;background-image:repeating-linear-gradient(0deg,transparent 0 22px,#e5eeec 22px 23px);overflow-x:auto}
.order-sheet b{color:#1d3f9c}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.tbl th,.tbl td{border:1px solid var(--paper-line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--paper-2);font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.tbl td.num{font-family:var(--f-mono);text-align:right}
.scroll-x{overflow-x:auto}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.field select,.field input{font:inherit;font-weight:400;color:var(--ink);background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
.field input.mono{font-family:var(--f-mono)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.3}
.checks input{margin-top:3px;accent-color:var(--enteral);width:16px;height:16px;flex:none}
.note{background:var(--enteral-tint);border-left:4px solid var(--enteral);padding:10px 12px;border-radius:6px;font-size:14px}
.note.warn{background:#fff4dd;border-left-color:var(--warn)}
.note.crit{background:#fde8e8;border-left-color:var(--crit)}
.note.ok{background:#e3f6ec;border-left-color:var(--ok)}

/* item picker (supply cart) */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border:1px solid var(--paper-line);border-radius:10px;background:#fff;font-size:13px;font-weight:700;line-height:1.2;text-align:center;min-height:118px;position:relative}
.item small{font-weight:400;color:var(--ink-2);font-size:11.5px}
.item.on{border-color:var(--enteral);background:var(--enteral-tint);box-shadow:inset 0 0 0 1px var(--enteral)}
.item.on::after{content:"ON TRAY";position:absolute;top:6px;right:6px;font-family:var(--f-display);font-size:10px;letter-spacing:.08em;background:var(--enteral);color:#fff;border-radius:4px;padding:0 4px}

/* bedside procedure */
.bedside{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.proc-canvas-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--paper-line);background:#cfe0dd;aspect-ratio:16/10}
#proc{display:block;width:100%;height:100%}
.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.ro{background:#fff;border:1px solid var(--paper-line);border-radius:8px;padding:5px 8px;min-width:0}
.ro span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ro b{font-family:var(--f-mono);font-size:16px}
.meter{height:8px;background:var(--paper-2);border-radius:999px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .2s}
.controls{display:flex;flex-direction:column;gap:10px;min-width:0}
.cgroup{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:10px}
.cgroup h4{margin:0 0 8px;font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--ink-2)}
.cgroup .row .btn{font-size:13px;padding:7px 10px;min-height:36px}
.btn.on-state{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.height-ctl{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.height-ctl input{flex:1;accent-color:var(--enteral)}
.decision{border:2px solid var(--enteral);background:var(--enteral-tint);border-radius:10px;padding:12px}
.decision h4{margin:0 0 8px;font-family:var(--f-display);font-size:17px;letter-spacing:.04em}
.ph-chart{display:flex;gap:4px;flex-wrap:wrap}
.ph-chip{width:44px;height:44px;border-radius:6px;border:2px solid rgba(0,0,0,.15);font-family:var(--f-mono);font-weight:700;color:#10201f;display:grid;place-items:center}
.ph-chip.picked{outline:3px solid var(--ink);outline-offset:1px}

/* hand hygiene + menus */
.menu-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.menu-list .btn{justify-content:flex-start;min-height:52px}
.menu-list .btn .tick{margin-left:auto;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--ok)}
.prog{height:12px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fc8e8,#a6e0f5)}
.speech{background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:10px 12px;position:relative;font-size:15px;margin-bottom:10px}
.speech b{color:var(--enteral)}

/* ---------- full screens (title / results) ---------- */
.screen{position:fixed;inset:0;z-index:30;overflow:auto;background:
  radial-gradient(1200px 500px at 85% -10%,rgba(122,79,214,.35),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(47,174,108,.18),transparent 60%),
  var(--chrome);padding:max(20px,env(safe-area-inset-top,0px)) 16px 24px}
.screen[hidden]{display:none!important}
.title-wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:clamp(46px,8vw,96px);line-height:.88;letter-spacing:.01em;margin:6px 0 12px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--enteral-soft)}
.hero .kicker{font-family:var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero p{color:#c9dcd9;max-width:56ch;margin:0 0 8px}
.hero-art{border-radius:16px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:#0a1d1e}
.hero-art canvas{width:100%;height:100%;display:block}
.mode-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.mode-card{text-align:left;background:var(--chrome-2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg)}
.mode-card b{font-family:var(--f-display);font-size:20px;letter-spacing:.05em;text-transform:uppercase;display:block}
.mode-card span{font-size:13px;color:var(--muted)}
.mode-card.on{border-color:var(--enteral-soft);background:#22304a}
.mode-card.on.demo{border-color:var(--crit);background:#3a1f25}
.section-h{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:15px;margin:0}
.cases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.case-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:12px;padding:14px;min-height:210px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .15s}
.case-card:hover{transform:translateY(-3px)}
.case-card .bed{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.case-card h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:1;font-weight:700}
.case-card p{margin:0;font-size:13px;color:var(--ink-2)}
.case-card .tag{align-self:flex-start;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;border-radius:4px;padding:1px 6px;background:var(--paper-2)}
.case-card .tag.t2{background:#fff0cf}
.case-card .tag.t3{background:#ffe0dc}
.case-card .tag.t4{background:var(--enteral-tint)}
.case-card .best{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);border-top:1px dashed var(--paper-line);padding-top:6px}
.case-card .wrist{position:absolute;top:12px;right:12px;width:46px;height:14px;border-radius:7px;background:#fff;border:1px solid var(--paper-line)}
.case-card .wrist.allergy{background:#e0464b;border-color:#b52f33}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.howto div{background:var(--chrome-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#c9dcd9}
.howto b{display:block;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);font-size:16px;margin-bottom:4px}
.foot{font-size:12px;color:var(--muted)}

.results{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.res-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.res-head h1{font-family:var(--f-display);font-size:clamp(38px,6vw,64px);line-height:.9;margin:4px 0 0;text-transform:uppercase}
.grade{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 18px;text-align:center;min-width:180px}
.grade .big{font-family:var(--f-display);font-weight:700;font-size:58px;line-height:1}
.grade .lab{font-family:var(--f-display);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.rubric{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px;overflow-x:auto}
.rubric table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.rubric th,.rubric td{border:1px solid var(--paper-line);padding:7px 9px;text-align:center}
.rubric th:first-child,.rubric td:first-child{text-align:left}
.rubric thead th{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:var(--paper-2)}
.rubric td.hit{background:var(--enteral);color:#fff;font-weight:700}
.rubric td.num{font-family:var(--f-mono)}
.stopped{background:#3a1f25;border:1px solid var(--crit);border-radius:12px;padding:12px 14px}
.debrief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.debrief .card{color:var(--ink)}
.debrief ul{margin:0;padding-left:18px;font-size:13.5px}
.debrief li{margin-bottom:6px}
.debrief li small{display:block;color:var(--ink-2)}

@media (max-width:980px){
  .stage{grid-template-columns:1fr}
  .side{max-height:none}
  .cases{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bedside{grid-template-columns:1fr}
  .proc-canvas-wrap{position:sticky;top:0;z-index:2;box-shadow:0 6px 16px rgba(15,31,30,.18)}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .howto,.debrief,.grid2,.menu-list,.checks{grid-template-columns:1fr}
  .cases{grid-template-columns:1fr}
  .case-card{min-height:0}
  .readouts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .case-chip .val{max-width:130px}
  .brand-text span{display:none}
  .res-head{grid-template-columns:1fr}
  .mode-pick{grid-template-columns:1fr}
  .sheet-head h2{font-size:23px}
  .viewport{aspect-ratio:4/5}
  .ci-bar{font-size:12.5px;padding:6px 10px;left:8px;right:8px;top:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- logging & marks ---------- */
function logEv(kind, text) {
  if (!G) return;
  G.log.unshift({ t: G.clock, kind, text });
  renderLog();
}
function mark(id, ok = true, note) {
  if (!G) return;
  const prev = G.items[id];
  if (prev && prev.ok === false && ok) return; // an error on an item sticks
  if (prev && prev.ok && ok) return;
  G.items[id] = { ok, note };
  renderChecklist();
  if (ok) sfx("tick");
}
/* An error. In practice mode the CI explains; in demo a critical error stops the return demonstration. */
function fault(cat, pts, msg, why, crit = false, itemId) {
  if (!G || G.over) return false;
  if (G.errors.some((e) => e.msg === msg)) { if (crit) toast(msg, "crit"); return crit; }
  G.errors.push({ cat, pts, msg, why, crit, at: G.clock });
  if (itemId) mark(itemId, false, msg);
  logEv(crit ? "crit" : "warn", msg);
  sfx(crit ? "crit" : "warn");
  toast(msg, crit ? "crit" : "warn");
  if (crit && G.mode === "demo") {
    G.stopped = { msg, why };
    setTimeout(() => finishCase(), 900);
  } else if (crit) {
    ciInterject(msg, why);
  }
  return crit;
}
function advance(min) { if (G && !G.over) { G.clock += min; updateHud(); } }
function waitClock(min) { if (G) { G.clock += min; G.waitMin += min; updateHud(); } }
const activeMin = () => G.clock - START_MIN - G.waitMin;

/* ---------- Clinical Instructor hint: next expected step ---------- */
function nextHint() {
  if (!G) return "";
  const c = G.c, it = G.items;
  const done = (id) => it[id] && it[id].ok !== undefined;
  if (!G.chartSeen.has("orders")) return "Start at the nurses' station: read the doctor's order in the patient's chart.";
  if (!G.planDone) return "In the chart, review the feeding record and allergies, then confirm your feeding plan.";
  if (G.nutri.size < 3 || !G.allergyAsked) return "Go to the patient. Assess for malnutrition or dehydration and ask about food allergies or milk intolerance.";
  if (!G.tray.has("gloves") || !G.tray.has("syringe") || !G.tray.has("ph") || !G.formulaKey) return "Prepare your equipment at the supply cart. Bring the ordered formula, too.";
  if (G.hob < 30 && !G.sideLying) return "Use the bed controls at the foot of the bed. Raise the head of bed to Fowler's position (30° or higher).";
  if (!G.identified) return "Introduce yourself and verify identity with two identifiers (name and birthday or hospital number).";
  if (!G.explained) return "Explain the procedure: what you will do, why, and that it may feel full but should not hurt.";
  if (!G.hhBefore) return "Perform hand hygiene at the sink before you put on gloves.";
  if (G.curtain < 1) return "Close the privacy curtain. Tube feedings embarrass some clients.";
  if (!G.gloves && !G.glovesOff) return "Open the bedside procedure and apply clean gloves.";
  if (G.placement == null) {
    if (c.medAt != null && G.clock < c.medAt + 60) return `Paracetamol went down the tube at ${fmtClock(c.medAt)}. Wait until ${fmtClock(c.medAt + 60)} before testing pH.`;
    if (G.plug) return "Remove the plug from the tube end.";
    if (!G.syrOn) return "Attach the syringe (with plunger) to the tube.";
    if (G.clampOn) return "Release the clamp so you can aspirate.";
    if (G.syrAsp <= 0 && G.phStage === 0) return "Pull back the plunger to aspirate a sample.";
    if (G.phStage === 0) return "Drop the aspirate onto a pH strip.";
    return "Read the strip against the color chart and decide.";
  }
  if (G.placement === "hold") {
    if (!G.notified) return "Placement is not confirmed. Choose to hold and notify the nurse in charge.";
  } else if (c.outcome !== "hold_ph" && !G.grvMeasured) return "Aspirate all the gastric contents and empty them into the measuring container until nothing more returns.";
  else if (G.grvMeasured && !G.grvDecision) return "Compare the residual with the policy (100 mL, or more than half the last feeding) and decide.";
  else if (G.grvDecision === "hold" && !G.reinstilled) return "Re-instill the measured contents per policy: syringe with plunger attached, clamp open.";
  else if (G.grvDecision === "feed") {
    if (!G.reinstilled && !G.discarded) return "Re-instill the gastric contents per agency policy.";
    if (!G.prep.poured) return "Prepare the formula: check expiry, room temperature, clean the top with alcohol, then pour.";
    if (G.fedFeed < c.amount - 1) {
      if (G.plunger) return "Clamp the tube, then remove the plunger so the syringe becomes a barrel.";
      if (!G.syrOn) return "Connect the barrel to the clamped tube.";
      if (!G.layers.length) return "Pour feeding into the barrel, then release the clamp.";
      if (G.clampOn && G.crampState !== 1) return "Release the clamp and let it flow. Raise or lower the syringe to control the rate.";
      if (G.crampState === 1) return "The client feels cramps. Clamp the tube for a moment, then resume.";
      return "Keep the barrel topped up. Do not let it run dry.";
    }
    if (G.fedWater < 50 && !G.plugged) return "Pour the water flush in before the feeding drains out of the neck of the syringe.";
  }
  if (!G.plugged) return (G.placement === "hold" || G.grvDecision === "hold") ? "Clamp the tube, detach the syringe, and insert the plug." : "Clamp before the last of the water drains, then detach and plug the tube.";
  if (!G.secured) return "Secure the tubing to the client's gown.";
  if (!G.instructed) return "Ask the client to stay upright for at least 30 minutes.";
  if (!G.disposed) return "Dispose of used equipment at the waste bins.";
  if (!G.glovesOff) return "Remove and discard your gloves.";
  if (!G.hhAfter) return "Perform hand hygiene.";
  if (!done("e_eval")) return "Evaluate the client: tolerance, bowel sounds, fullness, weight, elimination, turgor, urine.";
  return "Document at the computer: feeding, water, duration, assessments, I&O, and any report.";
}

/* ---------- audio (WebAudio, synthesized) ---------- */
const AUD = { ctx: null, on: store.get("sound", true), noise: null };
function audioCtx() {
  if (!AUD.on) return null;
  try {
    if (!AUD.ctx) AUD.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (AUD.ctx.state === "suspended") AUD.ctx.resume();
  } catch (e) { return null; }
  return AUD.ctx;
}
function tone(freq, dur, type = "sine", vol = 0.08, when = 0, slide) {
  const ctx = audioCtx(); if (!ctx) return;
  const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol = 0.05, freq = 1200, when = 0) {
  const ctx = audioCtx(); if (!ctx) return;
  if (!AUD.noise) { const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; AUD.noise = b; }
  const t = ctx.currentTime + when, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = AUD.noise; s.loop = true; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(ctx.destination); s.start(t); s.stop(t + dur + 0.05);
}
function sfx(name) {
  switch (name) {
    case "tick": tone(880, 0.09, "triangle", 0.06); tone(1320, 0.12, "triangle", 0.05, 0.07); break;
    case "pick": tone(620, 0.07, "square", 0.03); break;
    case "drop": tone(400, 0.08, "square", 0.03); break;
    case "warn": tone(300, 0.18, "sawtooth", 0.04); break;
    case "crit": tone(220, 0.25, "sawtooth", 0.06); tone(180, 0.3, "sawtooth", 0.05, 0.2); break;
    case "step": tone(140 + Math.random() * 30, 0.04, "triangle", 0.015); break;
    case "water": noiseBurst(1.6, 0.05, 900); break;
    case "pour": noiseBurst(0.6, 0.04, 600); break;
    case "squelch": tone(180, 0.25, "sine", 0.05, 0, 90); break;
    case "gurgle": for (let i = 0; i < 5; i++) tone(90 + Math.random() * 80, 0.12, "sine", 0.07, i * 0.17 + Math.random() * 0.08, 60); break;
    case "click": tone(1200, 0.03, "square", 0.025); break;
    case "curtain": noiseBurst(0.7, 0.03, 2500); break;
    case "motor": tone(70, 0.9, "sawtooth", 0.025, 0, 85); break;
    case "win": [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, "triangle", 0.06, i * 0.11)); break;
    case "beep": tone(1000, 0.06, "sine", 0.02); break;
  }
}

function initWorld(cv) {
  W.cv = cv; W.ctx = cv.getContext("2d");
  W.floor = buildFloor();
  resizeWorld();
  window.addEventListener("resize", resizeWorld);
  window.addEventListener("keydown", (e) => {

function resizeWorld() {
  const r = W.cv.getBoundingClientRect();
  W.dpr = Math.min(window.devicePixelRatio || 1, 2);
  W.vw = Math.max(1, r.width); W.vh = Math.max(1, r.height);
  W.cv.width = Math.round(W.vw * W.dpr); W.cv.height = Math.round(W.vh * W.dpr);
  const visW = W.vw < 720 ? 600 : WW;
  W.scale = Math.max(W.vw / visW, W.vh / WH);
}
function camUpdate() {
  const vwW = W.vw / W.scale, vhW = W.vh / W.scale;
  const tx = clamp(W.p.x - vwW / 2, 0, Math.max(0, WW - vwW));
  const ty = clamp(W.p.y - vhW / 2, 0, Math.max(0, WH - vhW));
  W.camX = W.title ? (WW - vwW) / 2 : lerp(W.camX, tx, 0.15);
  W.camY = W.title ? (WH - vhW) / 2 : lerp(W.camY, ty, 0.15);

/* ---------- input ---------- */
function onWorldPointer(e) {
  if (W.paused || modalOpen()) return;
  audioCtx();
  const r = W.cv.getBoundingClientRect();
  const wx = (e.clientX - r.left) / W.scale + W.camX, wy = (e.clientY - r.top) / W.scale + W.camY;
  let hit = null, best = 1e9;
  for (const s of SPOTS) {
    const d = Math.hypot(wx - s.x, wy - s.y);
    if (d < s.r + 24 && d < best) { best = d; hit = s; }
  }
  if (!hit) { // clicking an object body also counts
    const obj = [["patient", 300, 96, 120, 230], ["cart", 598, 100, 86, 74], ["sink", 786, 60, 88, 60], ["bins", 896, 100, 48, 58], ["chart", 690, 436, 100, 40], ["emr", 800, 436, 100, 40], ["ci", 530, 440, 40, 50]];
    for (const [id, x, y, w, h] of obj) if (wx >= x && wx <= x + w && wy >= y && wy <= y + h) hit = SPOTS.find((s) => s.id === id);
  }
  if (hit) {
    if (Math.hypot(W.p.x - hit.x, W.p.y - hit.y) < hit.r) { interact(hit.id); return; }
    W.p.target = { x: hit.x, y: hit.y }; W.p.pending = hit.id;
  } else {
    W.p.target = { x: clamp(wx, 20, WW - 20), y: clamp(wy, 108, WH - 20) }; W.p.pending = null;
  }
  W.p.stuck = 0;
}
function interactNearest() { if (W.near) interact(W.near.id); }

function collide(x, y, r) {
  if (x < 18 || x > WW - 18 || y < 106 || y > WH - 20) return true;

function updateWorld(dt) {
  W.t += dt;
  const p = W.p;
  let mx = 0, my = 0;
  if (!W.paused && !modalOpen()) {
    const k = W.keys;
    if (k["arrowleft"] || k["a"]) mx -= 1;
    if (k["arrowright"] || k["d"]) mx += 1;
    if (k["arrowup"] || k["w"]) my -= 1;
    if (k["arrowdown"] || k["s"]) my += 1;
    if (W.joy.on) { mx = W.joy.x; my = W.joy.y; }
    if (mx || my) { p.target = null; p.pending = null; }
    else if (p.target) {
      const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy);
      const arriveR = p.pending ? (SPOTS.find((s) => s.id === p.pending).r * 0.55) : 6;
      if (d < arriveR) {
        const id = p.pending; p.target = null; p.pending = null;
        if (id) interact(id);
      } else { mx = dx / d; my = dy / d; }
    }
  }
  const len = Math.hypot(mx, my);
  p.moving = len > 0.05;
  if (p.moving) {
    const sp = 175 * Math.min(1, len);
    const vx = (mx / len) * sp * dt, vy = (my / len) * sp * dt;
    const ox = p.x, oy = p.y;
    if (!collide(p.x + vx, p.y, 13)) p.x += vx;
    if (!collide(p.x, p.y + vy, 13)) p.y += vy;
    const moved = Math.hypot(p.x - ox, p.y - oy);
    if (Math.abs(mx) > Math.abs(my)) p.dir = mx > 0 ? "right" : "left"; else p.dir = my > 0 ? "down" : "up";
    p.walkT += dt * 11;
    p.stepAcc += moved;
    if (p.stepAcc > 34) { p.stepAcc = 0; sfx("step"); }
    W.dist += moved;
    if (G && !G.over && !W.title) { G.clock += moved / 150; } // walking costs ward time
    if (p.target && moved < 0.3) { p.stuck += dt; if (p.stuck > 0.4) { p.target = null; p.pending = null; } } else p.stuck = 0;
  }
  // nearest interactable
  let near = null, best = 1e9;
  for (const s of SPOTS) {
    const d = Math.hypot(p.x - s.x, p.y - s.y);
    if (d < s.r && d < best) { best = d; near = s; }
  }
  W.near = near;
  if (!W.paused && !modalOpen() && (W.keys["e"] || W.keys[" "] || W.keys["enter"])) {
    W.keys["e"] = W.keys[" "] = W.keys["enter"] = false;
    interactNearest();
  }
  // equipment animation easing
  if (G) {
    const target = G.sideLying ? 20 : G.hob;
    const prev = W.hobShown;
    W.hobShown += clamp(target - W.hobShown, -40 * dt, 40 * dt);
    if (Math.abs(prev - W.hobShown) > 0.01 && Math.random() < 0.05) sfx("motor");
    G.curtain += clamp(G.curtainTarget - G.curtain, -1.4 * dt, 1.4 * dt);
  }
  W.sinkRun = Math.max(0, W.sinkRun - dt);
  W.binOpen = Math.max(0, W.binOpen - dt);
  W.cartOpen = Math.max(0, W.cartOpen - dt);
  if (W.bubble && W.bubble.until < W.t) W.bubble = null;
  if (G && !G.over && !W.title && !W.paused) updateHud();
}

      if (!feedingDone || G.fedWater < 1) {
        G.airIn++;
        fault("N", 1.5, "The barrel ran dry: air entered the tube.", "Add the next portion (or the water flush) before the feeding drains from the neck of the syringe. Air causes gastric distention.", false, feedingDone ? "i_flush" : "i_flow");
      } else {
        G.airIn++;
        fault("N", 1, "All the water drained before you clamped.", "Clamp the feeding tube before all of the water is instilled so air does not enter the stomach.", false, "i_clamp");
      }
      G.feedEnd = G.feedEnd || G.clock;
      renderBedside();
    }
  } else if (G.crampState === 2) {
    G.crampPausedFor += dt;
    if (G.crampPausedFor >= 2.2) { G.crampState = 3; G.discomfort = Math.max(0, G.discomfort - .4); P.say = { text: "That's better. You can continue.", until: W.t + 3 }; logEv("ok", "Paused the feeding; cramping eased."); renderBedside(); }
  }
  if (P.open && W.t - (P.roT || 0) > .1) { P.roT = W.t; updateReadouts(); }
}

/* ---------- actions ---------- */
function startInvasive() {
  if (G.invasive) return;
  G.invasive = true;
  if (!G.identified) fault("N", 1, "Started before verifying the client's identity.", "Introduce yourself and verify identity with two identifiers before any procedure.", false, "p_identify");
  if (!G.explained) fault("N", 1, "Started without explaining the procedure.", "Explain what you will do, why, and how the client can participate. It reduces anxiety and gains cooperation.", false, "p_explain");
  if (G.curtainTarget < 1) fault("N", .5, "No privacy provided before starting.", "Tube feedings are embarrassing to some people. Close the curtain.", false, "p_privacy");
  else mark("p_privacy");
  const missing = SUPPLIES.filter((s) => s.req && !G.tray.has(s.key));
  const extra = SUPPLIES.filter((s) => !s.req && !s.optional && G.tray.has(s.key));
  if (missing.length) fault("N", .5, "Equipment incomplete at the bedside: " + missing.map((m) => m.label).join(", ") + ".", "Prepare all the necessary equipment before you start so the procedure is not interrupted.", false, "p_equip");
  else mark("p_equip");
  if (extra.length) fault("N", .25, "Brought items not needed for NGT feeding: " + extra.map((m) => m.label).join(", ") + ".", "Bring only what the procedure needs. Extra items clutter the field and waste supplies.");
}
function procAct(act, arg) {
  if (!G || G.over) return;
  const c = G.c;
  const no = (msg) => { toast(msg, "info"); sfx("drop"); };
  switch (act) {
    case "gloves": {
      if (G.gloves) { // removing
        if (G.syrOn) return no("Detach the syringe before removing your gloves.");
        G.gloves = false;
        if (G.plugged && G.invasiveDone) {
          if (!G.disposed) fault("N", .5, "Removed gloves before disposing of the equipment.", "Dispose of the equipment first, then remove and discard the gloves, then perform hand hygiene.", false);
          G.glovesOff = true; mark("i_glovesoff"); logEv("ok", "Removed and discarded gloves.");
        } else logEv("info", "Removed gloves.");
        advance(.3); sfx("pick"); break;
      }
      if (!G.tray.has("gloves")) return no("You have no clean gloves. Get them from the supply cart.");
      if (G.glovesOff) return no("The procedure is finished. Perform hand hygiene.");
      if (!G.hhBefore) fault("N", 1, "Put on gloves without hand hygiene.", "Perform hand hygiene before applying clean gloves to prevent transmitting microorganisms.", false, "p_hh");
      G.gloves = true; G.glovesEver = true; mark("p_gloves"); logEv("ok", "Applied clean gloves."); advance(.4); sfx("pick");
      break;
    }
    case "plug": {
      if (G.syrOn) return no("Detach the syringe first.");
      if (!G.gloves && G.plug) { fault("N", 1, "Handled the tube without gloves.", "Apply clean gloves before touching the tube end; gastric contents are body fluids.", false, "p_gloves"); }
      G.plug = !G.plug;
      if (G.plug) {
        if (G.invasive && (G.fedWater > 0 || G.placement === "hold" || G.grvDecision === "hold")) {
          G.plugged = true; G.invasiveDone = true;
          if (!G.clampOn) fault("N", .5, "Plugged the tube without clamping it first.", "Clamp the feeding tube, then cover the end with the plug.", false, "i_clamp");
          else if (!G.items.i_clamp) mark("i_clamp");
          if (c.outcome === "feed" && G.fedWater >= 45 && G.fedWater <= 105 && !G.items.i_flush) mark("i_flush");
          else if (c.outcome === "feed" && G.fedWater < 45) fault("N", 1, `Flushed only ${Math.round(G.fedWater)} mL of water.`, "Instill 50 to 100 mL of water to clear the tube and keep it patent.", false, "i_flush");
          if (c.outcome === "feed" && !G.items.i_flow) mark("i_flow");
          G.feedEnd = G.feedEnd || G.clock;
          logEv("ok", "Tube clamped and plugged.");
        }
      } else { startInvasive(); logEv("info", "Removed the plug from the tube."); }
      advance(.2); sfx("click"); break;
    }
    case "clamp": {
      G.clampOn = !G.clampOn; sfx("click"); advance(.1);
      if (G.clampOn) {
        if (G.crampState === 1) { G.crampState = 2; G.crampPausedFor = 0; logEv("info", "Clamped the tube to pause the feeding."); }
        if (G.layers.length && G.layers[0].t === "water" && G.fedFeed >= c.amount - 1 && G.fedWater >= 1) {
          G.clampedEnd = true; G.feedEnd = G.clock;
          // what remains in the barrel is discarded
          logEv("ok", `Clamped with ${Math.round(barrelTotal())} mL water left in the neck.`);
        }
      } else if (G.crampState === 2 && G.crampPausedFor < 2.2) {
        G.crampState = 1; G.crampAt = W.t;
        toast("Too soon. Let the client rest a moment before resuming.", "info");
      }
      break;
    }
    case "attach": {
      if (!G.tray.has("syringe")) return no("You need a 60 mL catheter-tip syringe from the supply cart.");
      if (G.syrOn) { // detach
        if (!G.plunger && G.layers.length && !G.clampOn) return no("Clamp the tube first or the barrel contents will spill.");
        if (!G.plunger && G.layers.length) { logEv("info", `Discarded ${Math.round(barrelTotal())} mL left in the barrel.`); G.layers = []; }
        G.syrOn = false; sfx("click"); advance(.2); break;
      }
      if (G.plug) return no("Remove the plug from the tube end first.");
      if (!G.gloves) fault("N", 1, "Connected the syringe without gloves.", "Apply clean gloves before handling the tube.", false, "p_gloves");
      if (!G.plunger) {
        if (!G.clampOn) fault("N", .5, "Connected the barrel to an open tube.", "Pinching or clamping the tube before connecting prevents excess air from entering the stomach and causing distention.", false, "i_connect");
        else if (G.placement === "ok" && !G.items.i_connect) mark("i_connect");
      }
      G.syrOn = true; startInvasive(); sfx("click"); advance(.2);
      break;
    }
    case "plunger": {
      if (G.plunger) {
        if (G.syrAsp > 0) return no("Empty the syringe before removing the plunger.");
        if (G.syrOn && !G.clampOn) fault("N", .5, "Removed the plunger with the tube open.", "Clamp or pinch the tube first so air does not enter the stomach.", false, "i_connect");
        G.plunger = false; logEv("info", "Removed the plunger: the syringe is now a feeding barrel.");
        if (G.syrOn && G.clampOn && G.placement === "ok" && !G.items.i_connect) mark("i_connect");
      } else {
        if (G.layers.length) return no("Let the barrel empty or clamp and detach before inserting the plunger.");
        G.plunger = true;
      }
      sfx("pick"); advance(.1); break;
    }
    case "aspirate": {
      if (!G.syrOn) return no("Attach the syringe to the tube first.");
      if (!G.plunger) return no("Insert the plunger to aspirate.");
      if (G.clampOn) return no("The tube is clamped. Release the clamp to aspirate.");
      if (G.syrAsp >= 59) return no("The syringe is full. Detach it and empty it into the measuring container.");
      if (P.anim) return;
      const take = Math.min(60 - G.syrAsp, G.stomachGrv);
      if (take <= 0) { toast("Nothing more returns: the stomach is empty of residual.", "info"); G.grvAllOut = true; checkGrv(); return; }
      P.anim = { type: "asp", t0: W.t, dur: .9, from: G.syrAsp, to: G.syrAsp + take };
      G.syrAsp += take; G.stomachGrv -= take; G.aspirations++;
      advance(.5); sfx("squelch");
      logEv("info", `Aspirated ${take} mL of gastric contents.`);
      if (G.stomachGrv <= 0) setTimeout(() => toast("Plunger resistance: no more contents return.", "info"), 900);
      break;
    }
    case "empty": {
      if (G.syrAsp <= 0) return no("The syringe is empty.");
      if (G.syrOn) return no("Clamp and detach the syringe first.");
      if (!G.tray.has("measure")) return no("You need the measuring container from the cart.");
      G.cupGastric += G.syrAsp; logEv("info", `Emptied ${G.syrAsp} mL into the measuring container (total ${G.cupGastric} mL).`);
      G.syrAsp = 0; P.pour = { from: "syr", t0: W.t }; sfx("pour"); advance(.3);
      checkGrv(); break;
    }
    case "phtest": {
      if (!G.tray.has("ph")) return no("You need pH test strips from the supply cart.");
      if (G.syrAsp <= 0 && G.cupGastric <= 0) return no("Aspirate a sample first.");
      if (G.phStage > 0) return no("You already tested this sample.");
      if (c.medAt != null && G.clock < c.medAt + 60) {
        fault("N", 1, `Tested pH at ${fmtClock(G.clock)}, less than an hour after the ${fmtClock(c.medAt)} medication.`, "Medication in the stomach can change the pH. Allow 1 hour to elapse before testing.", false, "i_medwait");
        if (G.mode === "practice") return;
      } else if (c.medAt != null) mark("i_medwait");
      G.phStage = 1; P.phT = 0; advance(1); sfx("pick"); logEv("info", "Placed aspirate on a pH strip.");
      break;
    }
    case "wait": {
      const until = c.medAt + 60; if (G.clock >= until) return;
      const m = until - G.clock; waitClock(m); logEv("info", `Waited ${Math.round(m)} min for the medication window.`); toast(`Ward time is now ${fmtClock(G.clock)}.`, "info"); break;
    }
    case "reinstill": {
      if (G.cupGastric <= 0) return no("There is nothing in the measuring container.");
      if (!G.syrOn || !G.plunger) return no("Attach the syringe with its plunger to push the contents back.");
      if (G.clampOn) return no("Release the clamp first.");
      P.anim = { type: "push", t0: W.t, dur: 1.2 };
      logEv("ok", `Re-instilled ${G.cupGastric} mL of gastric contents.`);
      G.cupGastric = 0; G.reinstilled = true; advance(1); sfx("squelch");
      if (G.grvDecision) mark("i_residual", G.grvDecisionOk);
      break;
    }
    case "discard": {
      if (G.cupGastric <= 0) return no("There is nothing to discard.");
      if (!G.tray.has("emesis")) return no("You need the emesis basin.");
      logEv("warn", `Discarded ${G.cupGastric} mL of gastric contents into the emesis basin.`);
      G.cupGastric = 0; G.discarded = true; advance(.3); sfx("pour");
      fault("N", .5, "Discarded the gastric residual.", "Agency policy: re-instill gastric contents to prevent loss of fluid and electrolytes.", false, "i_residual");
      break;
    }
    case "pourFeed": {
      if (!G.prep.poured || G.feedCup <= 0) return no(G.prep.poured ? "The ordered amount has all been poured." : "Prepare the formula first.");
      if (!G.syrOn || G.plunger) return no("Remove the plunger and connect the barrel to the tube first.");
      if (barrelTotal() >= 59) return no("The barrel is full.");
      if (!feedingAllowed()) return;
      const add = Math.min(60 - barrelTotal(), G.feedCup);
      const last = G.layers[G.layers.length - 1];
      if (last && last.t === "feed") last.ml += add; else G.layers.push({ t: "feed", ml: add });
      G.feedCup -= add; P.pour = { from: "feed", t0: W.t }; sfx("pour"); advance(.2);
      break;
    }
    case "pourWater": {
      if (!G.tray.has("water")) return no("You need room-temperature water from the cart.");
      if (G.waterCup <= 0) return no("The water cup is empty.");
      if (!G.syrOn || G.plunger) return no("Remove the plunger and connect the barrel to the tube first.");
      if (barrelTotal() >= 59) return no("The barrel is full.");
      if (G.fedFeed + feedInBarrel() < c.amount - 1 && c.outcome === "feed") return no("Finish the ordered feeding first; the flush follows it.");
      const add = Math.min(60 - barrelTotal(), G.waterCup);
      const last = G.layers[G.layers.length - 1];
      if (last && last.t === "water") last.ml += add; else G.layers.push({ t: "water", ml: add });
      G.waterCup -= add; P.pour = { from: "water", t0: W.t }; sfx("pour"); advance(.2);
      break;
    }
    case "height": G.height = clamp(+arg, 0, 1); return;
    case "secure": {
      if (!G.plugged) return no("Clamp and plug the tube first.");
      if (G.secured) return;
      G.secured = true; mark("i_secure"); logEv("ok", "Secured the tubing to the client's gown."); advance(.4); sfx("tick");
      P.say = { text: "Thank you. It doesn't pull now.", until: W.t + 3 };
      break;
    }
    case "prep": openPrep(); return;
  }
  renderBedside();
}
function feedInBarrel() { return G.layers.filter((l) => l.t === "feed").reduce((s, l) => s + l.ml, 0); }
function feedingAllowed() {
  const c = G.c;
  if (G.placement !== "ok") return !blockCrit("Started a feeding without confirming tube placement.", "Always aspirate and check pH before a feeding. A misplaced tube can deliver feeding into the lungs.", "i_placement");
  if (c.outcome !== "hold_ph" && !G.grvDecision) return !blockCrit("Started a feeding without checking the residual.", "Aspirate and measure the residual before each feeding to detect delayed gastric emptying.", "i_residual");
  if (G.grvDecision === "hold") return no2("You decided to hold this feeding.");
  if (G.hob < 30 && !G.sideLying) return !blockCrit(`Started a feeding with the head of bed at ${Math.round(G.hob)}°.`, "Fowler's position (at least 30°) uses gravity and prevents aspiration of fluid into the lungs.", "p_position");
  if (!G.items.p_position) mark("p_position");
  return true;
}
function no2(msg) { toast(msg, "info"); return false; }
/* In practice, the CI stops an unsafe action; in a return demonstration it ends the run. Returns true when blocked. */
function blockCrit(msg, why, itemId) {
  fault("N", 3, msg, why, true, itemId);
  return true;
}
function checkGrv() {
  if (G.grvMeasured || G.placement !== "ok") return;
  if (G.stomachGrv <= 0 && G.syrAsp <= 0) {
    G.grvMeasured = true; G.grvValue = G.cupGastric;
    logEv("info", `Residual measured: ${G.cupGastric} mL.`);
    renderBedside();
  }
}

/* ---------- decisions ---------- */
function decide(kind, val) {
  const c = G.c;
  if (kind === "phread") {
    G.phRead = +val;
    if (G.phRead !== c.ph) fault("N", 1, `Read the strip as pH ${G.phRead}; it showed pH ${c.ph}.`, "Compare the strip with the color chart in good light before deciding.", false, "i_placement");
    advance(.3);
  } else if (kind === "phint") {
    if (val === "air") { fault("N", .5, "Chose air auscultation to confirm placement.", "The whoosh test is not reliable. Use aspirate pH; follow agency policy (X-ray) when unsure."); renderBedside(); return; }
    if (c.ph <= 5.5) {
      if (val === "ok") { G.placement = "ok"; if (!G.items.i_placement) mark("i_placement"); logEv("ok", `pH ${c.ph}: gastric placement confirmed.`); checkGrv(); }
      else { fault("N", .5, "Held a feeding even though pH confirmed gastric placement.", "pH 1 to 5.5 is consistent with gastric placement; proceed and assess residual."); renderBedside(); return; }
    } else {
      if (val === "ok") { if (blockCrit(`Treated pH ${c.ph} as gastric placement.`, "pH 6 or higher does not confirm gastric placement (possible intestinal or respiratory placement). Do not use the tube; follow agency policy.", "i_placement")) { renderBedside(); return; } }
      else { G.placement = "hold"; G.notified = true; mark("i_placement"); mark("i_hold"); logEv("ok", `pH ${c.ph}: placement not confirmed. Feeding held; nurse in charge notified; X-ray requested.`); P.say = { text: "Nurse in charge: \"Good catch. I'll call the resident for an X-ray.\"", until: W.t + 5 }; }
    }
    advance(.5);
  } else if (kind === "grv") {
    const high = G.grvValue >= 100 || G.grvValue > c.prev.amount / 2;
    if (val === "hold") {
      G.grvDecision = "hold"; G.grvDecisionOk = high;
      if (high) { G.notified = true; mark("i_hold"); logEv("ok", `Residual ${G.grvValue} mL: feeding held, nurse in charge notified.`); P.say = { text: "Nurse in charge: \"Hold it. I'll inform the doctor and we'll recheck in an hour.\"", until: W.t + 5 }; }
      else { fault("N", 1, `Held the feeding for a residual of only ${G.grvValue} mL.`, "Below 100 mL and under half of the last feeding, the policy is to re-instill and proceed.", false, "i_residual"); G.grvDecision = null; renderBedside(); return; }
    } else {
      if (high) { if (blockCrit(`Planned to feed despite a residual of ${G.grvValue} mL.`, "A residual of 100 mL or more, or more than half the last feeding, means delayed emptying. Hold and notify to prevent vomiting and aspiration.", "i_hold")) { renderBedside(); return; } }
      G.grvDecision = "feed"; G.grvDecisionOk = val === "reinstill";
      if (val === "discard") fault("N", .5, "Discarded the gastric residual.", "Agency policy: re-instill gastric contents to prevent loss of fluid and electrolytes.", false, "i_residual");
      logEv("ok", `Residual ${G.grvValue} mL: within policy. Proceed with feeding.`);
    }
    advance(.5);
  }
  renderBedside();
}

/* ---------- formula preparation sub-panel ---------- */
function openPrep() {
  if (!G.formulaKey) { toast("You have no formula on your tray. Get the ordered formula from the cart.", "info"); return; }
  P.prepOpen = true; renderBedside();
}
function prepAct(step, val) {
  const c = G.c, item = c.cart.find((x) => x.key === G.formulaKey), kind = formulaKind(G.formulaKey);
  if (step === "label") {
    G.prep.expiry = item.expired ? "expired" : "ok";
    G.prep.labelRead = true;
    if (!item.expired && kind === c.formula) mark("i_expiry");
    advance(.3);
  } else if (step === "return") {
    G.tray.delete(G.formulaKey); G.formulaKey = null; G.prep = { expiry: null, temp: null, swab: false, poured: false };
    P.prepOpen = false; logEv("info", "Set the formula aside. Get the correct one from the supply cart.");
    if (item.expired) mark("i_expiry");
    renderTray(); toast("Go back to the supply cart for the correct formula.", "info");
  } else if (step === "temp") {
    G.prep.temp = val; advance(.5);
    if (val === "room") mark("i_temp");
    else fault("N", .5, val === "micro" ? "Microwaved the formula." : "Used formula straight from the refrigerator.", val === "micro" ? "Microwaving creates hot spots that can burn the mucosa. Use room temperature." : "Cold formula can cause cramping. Warm it to room temperature.", false, "i_temp");
  } else if (step === "swab") {
    if (!G.tray.has("alcohol")) { toast("You have no alcohol swabs. Get them from the cart.", "info"); return; }
    G.prep.swab = true; mark("i_swab"); advance(.3); sfx("tick");
  } else if (step === "pour") {
    if (G.cupGastric > 0) { toast("The measuring container still holds gastric contents. Re-instill or discard them first.", "info"); return; }
    if (!G.prep.labelRead) fault("N", 1, "Poured the feeding without checking its label and expiration date.", "Check the expiration date and the formula against the order before administering.", false, "i_expiry");
    if (item.expired) fault("N", 2, "Prepared an expired feeding.", "Expired formula may be contaminated or degraded. Replace it.", false, "i_expiry");
    if (kind === "milk" && c.lactose) { if (blockCrit("Prepared a milk-based formula for a lactose-intolerant client.", "Check the formula against allergies and intolerances; notify the primary care provider if incompatible.", "a_allergy")) return; }
    else if (kind !== c.formula) { if (blockCrit(`Prepared ${FORMULA_NAMES[kind]} instead of the ordered ${FORMULA_NAMES[c.formula]}.`, "Give exactly the type of feeding the order specifies.", "a_order")) return; }
    if (!G.prep.swab) fault("N", .5, "Opened the container without cleaning the top.", "Clean the top of the feeding container with alcohol before opening it (open system).", false, "i_swab");
    if (!G.prep.temp) fault("N", .5, "Did not check the feeding temperature.", "Warm the feeding to room temperature to prevent cramping.", false, "i_temp");
    if (!G.tray.has("measure")) { toast("You need the measuring container from the cart.", "info"); return; }
    G.prep.poured = true; G.feedCup = c.amount; P.prepOpen = false; advance(.8); sfx("pour");
    logEv("ok", `Poured ${c.amount} mL ${FORMULA_NAMES[kind]} into the measuring container.`);
  } else if (step === "close") P.prepOpen = false;
  renderBedside();
}

/* ---------- UI ---------- */
function openBedside() {
  openModal("Bedside procedure", G.c.name + " · Bed 3", `
    <div class="bedside">
      <div style="min-width:0">
        <div class="proc-canvas-wrap"><canvas id="proc" width="${PW}" height="${PH}" aria-label="Close-up of the client, nasogastric tube, syringe and equipment"></canvas></div>
        <div class="readouts" id="readouts"></div>
        <div id="decision" style="margin-top:10px"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>`, { wide: true, kind: "bedside" });
  P.cv = $("#proc"); P.ctx = P.cv.getContext("2d"); P.open = true;
  const dpr = Math.min(window.devicePixelRatio || 1, 2); P.cv.width = PW * dpr; P.cv.height = PH * dpr; P.dpr = dpr;
  renderBedside();
}
function renderBedside() {
  if (!P.open || !$("#controls")) return;
  const c = G.c, b = (act, label, opts = {}) => `<button class="btn ${opts.on ? "on-state" : ""}" type="button" data-proc="${act}" ${opts.dis ? "disabled" : ""} ${opts.arg != null ? `data-arg="${opts.arg}"` : ""}>${label}</button>`;
  let html = `<div class="cgroup"><h4>Hands &amp; tube</h4><div class="row">
    ${b("gloves", G.gloves ? "Remove gloves" : "Apply clean gloves", { on: G.gloves })}
    ${b("plug", G.plug ? "Remove plug" : "Insert plug")}
    ${b("clamp", G.clampOn ? "Release clamp" : "Clamp / pinch tube", { on: G.clampOn })}
  </div></div>
  <div class="cgroup"><h4>60 mL syringe</h4><div class="row">
    ${b("attach", G.syrOn ? "Detach syringe" : "Attach syringe", { on: G.syrOn })}
    ${b("plunger", G.plunger ? "Remove plunger" : "Insert plunger")}
    ${b("aspirate", "Aspirate (pull plunger)")}
    ${b("empty", "Empty into container")}
    ${b("phtest", "Test pH")}
    ${G.grvMeasured && G.cupGastric > 0 ? b("reinstill", "Re-instill contents") + b("discard", "Discard into basin") : ""}
  </div></div>`;
  if (c.medAt != null && G.clock < c.medAt + 60 && G.placement == null)
    html += `<div class="cgroup"><h4>Medication given at ${fmtClock(c.medAt)}</h4><div class="row">${b("wait", "Wait until " + fmtClock(c.medAt + 60))}</div></div>`;
  if (c.outcome === "feed" || G.prep.poured) {
    html += `<div class="cgroup"><h4>Feeding</h4><div class="row">
      ${b("prep", G.prep.poured ? "Formula ready ✓" : "Prepare formula", { dis: G.prep.poured })}
      ${b("pourFeed", `Pour feeding (${Math.round(G.feedCup)} mL left)`, { dis: !G.prep.poured })}
      ${b("pourWater", `Pour water (${Math.round(G.waterCup)} mL)`)}
    </div>
    <div class="height-ctl" style="margin-top:10px"><label for="hctl">Syringe height</label><input id="hctl" type="range" min="0" max="1" step="0.01" value="${G.height}" data-proc-range="height"><span class="mono" id="hval"></span></div></div>`;
  }
  html += `<div class="cgroup"><h4>Finish</h4><div class="row">${b("secure", G.secured ? "Tube secured ✓" : "Secure tubing to gown", { dis: G.secured })}</div></div>`;
  $("#controls").innerHTML = html;
  // decisions
  let d = "";

/* ---------- toasts / log / HUD ---------- */

  const box = $("#toasts"); if (!box) return;
  const el = document.createElement("div"); el.className = "toast " + kind; el.textContent = msg;
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 4200);
}
function renderLog() {
  const ol = $("#log"); if (!ol || !G) return;
  ol.innerHTML = G.log.slice(0, 60).map((l) => `<li class="${l.kind}"><time>${fmtClock(l.t)}</time>${esc(l.text)}</li>`).join("") || `<li class="info">Nothing yet. Your actions appear here.</li>`;
}
let hudTick = 0;
function updateHud() {
  if (!G) return;

  $("#hudClock").textContent = fmtClock(G.clock);

function renderChecklist() {
  const pane = $("#pane-check"); if (!pane || !G) return;
  const items = CHECK.filter(needs);

    const done = items.filter((d) => G.items[d.id]);
    pane.innerHTML = `<p class="hidden-list">Return demonstration: the checklist is hidden. Steps you complete appear below.</p>` +
      `<div class="phase"><h3>Completed <span>${done.length}/${items.length}</span></h3>` +

  }
  pane.innerHTML = PHASES.map((ph) => {

/* ---------- sink: hand hygiene ---------- */
const HH_STEPS = [["wet", "Wet hands with water"], ["soap", "Apply soap"], ["rub", "Rub all surfaces, 20 seconds"], ["rinse", "Rinse thoroughly"], ["dry", "Dry with a paper towel"], ["tap", "Turn off the faucet with the towel"]];
let HH = null;
function openSink() {
  if (G.gloves) { toast("Remove your gloves first.", "info"); return; }
  HH = { seq: [], wrong: false, rubbing: false };
  renderSink();
}
function renderSink() {
  const shuffled = [HH_STEPS[2], HH_STEPS[4], HH_STEPS[0], HH_STEPS[5], HH_STEPS[1], HH_STEPS[3]];
  const done = HH.seq.map((k) => HH_STEPS.find((s) => s[0] === k)[1]);
  const html = `<p class="muted">Choose handwashing with soap and water, step by step, or an alcohol-based hand rub.</p>
    <div class="grid2"><div class="card"><h4>Soap and water</h4><div class="stack">${shuffled.map(([k, l]) => `<button class="btn ${HH.seq.includes(k) ? "picked" : ""}" type="button" data-hh="${k}" ${HH.seq.includes(k) || HH.rubbing ? "disabled" : ""}>${l}</button>`).join("")}</div>
    <div class="prog" style="margin-top:10px"><i id="hhProg" style="width:${HH.seq.length / 6 * 100}%"></i></div></div>
    <div class="card"><h4>Your sequence</h4><ol style="margin:0;padding-left:20px;font-size:14px">${done.map((d) => `<li>${d}</li>`).join("") || '<li class="muted" style="list-style:none;margin-left:-20px">No steps yet.</li>'}</ol>
    <h4 style="margin-top:14px">Alcohol-based hand rub</h4><button class="btn" type="button" data-hh="rubalc" ${HH.rubbing ? "disabled" : ""}>Rub hands with alcohol, 20 to 30 seconds</button></div></div>`;
  if ($("#modal").hidden || !MODAL || MODAL.kind !== "sink") openModal("Hand hygiene", "Sink", html, { kind: "sink" }); else setModalBody(html);
}
function hhStep(k) {
  if (k === "rubalc") { HH.rubbing = true; renderSink(); sfx("water"); busy(1.2); setTimeout(() => { HH.rubbing = false; if (MODAL && MODAL.kind === "sink") hhDone(); }, 1100); return; }
  const expect = HH_STEPS[HH.seq.length][0];

    d_feed: (fed > 5 ? f === kind : f === "none") && near(a ?? 0, fed, 5),
    d_water: near(w ?? 0, water, 5),
    d_dur: near(d ?? 0, dur, 3),
    d_io: near(io, fed + water, 5),
    d_report: r === (c.outcome === "hold_grv" ? "grv" : c.outcome === "hold_ph" ? "ph" : "none"),
  };
  const checked = new Set($$("input[name=dcs]:checked").map((i) => i.value));
  const st = docStatements();
  const trueHits = st.filter((s) => s.truth && checked.has(s.k)).length, falseHits = st.filter((s) => !s.truth && checked.has(s.k)).length;
  docOk.d_assess = trueHits >= 2 && falseHits === 0;
  const expect = { d_feed: `${fed > 5 ? FORMULA_NAMES[kind] + " " + fed + " mL" : "None (held)"}`, d_water: water + " mL", d_dur: dur + " min", d_io: fed + water + " mL intake", d_report: c.outcome === "feed" ? "No significant deviation" : "Report to the primary care provider" };
  for (const [id, ok] of Object.entries(docOk)) {
    if (ok) mark(id); else fault("R", .5, `Documentation: ${CHECK.find((x) => x.id === id).label.toLowerCase()}${expect[id] ? " (expected " + expect[id] + ")" : ""}.`, WHY[id] + (id === "d_assess" ? " Chart only what you actually assessed." : ""), false, id);
  }
  advance(3); G.docs = { f, a, w, d, io, r };
  closeModal(); finishCase();
}

/* ---------- scoring ---------- */
function computeScore() {
  const c = G.c, cats = { A: { e: 0, t: 0 }, N: { e: 0, t: 0 }, R: { e: 0, t: 0 } };
  const items = CHECK.filter(needs);
  for (const d of items) { cats[d.cat].t += d.w; const st = G.items[d.id]; if (st && st.ok) cats[d.cat].e += d.w; }
  for (const e of G.errors) if (cats[e.cat]) cats[e.cat].e -= e.pts * 0.5;
  const res = {};
  for (const k of ["A", "N", "R"]) { const pct = clamp(cats[k].e / cats[k].t, 0, 1); res[k] = { pct, v: toScale(pct) }; }
  if (G.stopped) res.N = { pct: 0, v: 3 };
  const target = c.outcome === "feed" ? 80 : 55, used = activeMin();
  const ratio = used / target;
  res.T = { pct: ratio, v: G.stopped ? 3 : ratio <= 1 ? 5 : ratio <= 1.15 ? 4.5 : ratio <= 1.3 ? 4 : ratio <= 1.5 ? 3.5 : 3, used, target };
  const total = (res.A.v * 20 + res.N.v * 30 + res.R.v * 30 + res.T.v * 20) / 100;
  const label = total >= 4.75 ? "Exemplary" : total >= 4.25 ? "Proficient" : total >= 3.75 ? "Good" : total >= 3.25 ? "Poor" : "Very Poor";
  return { res, total, label, items };
}
function finishCase() {
  if (!G || G.over) return;
  G.over = true; W.paused = true; P.open = false;
  $("#modal").hidden = true; MODAL = null; if ($("#ciPop")) $("#ciPop").remove();
  const sc = computeScore();
  const best = store.get("best", {});
  const key = G.c.id + ":" + G.mode;
  if (!best[key] || best[key] < sc.total) { best[key] = Math.round(sc.total * 100) / 100; store.set("best", best); }
  if (!G.stopped) sfx("win"); else sfx("crit");
  showResults(sc);
}

/* ---------- screens ---------- */
let MODE = store.get("mode", "practice");
function showTitle() {
  G = null; W.title = true; W.paused = true;
  const best = store.get("best", {});
  const scr = $("#screen"); scr.hidden = false;
  scr.innerHTML = `<div class="title-wrap">
    <div class="hero">
      <div>
        <div class="kicker">Skills Enhancement #7 · Level 4 RLE</div>
        <h1>NGT <em>Feeding</em> Ward</h1>
        <p>Work a real 14:00 feeding as a Level 4 student nurse. Read the chart, gather the equipment, check placement and residual, run a gravity syringe feeding, and document it. Your Clinical Instructor rates you on the Skills Enhancement Checklist.</p>
        <div class="mode-pick" role="radiogroup" aria-label="Mode">
          <button type="button" class="mode-card ${MODE === "practice" ? "on" : ""}" data-mode="practice" role="radio" aria-checked="${MODE === "practice"}"><b>Practice</b><span>CI tips on screen. Unsafe steps are stopped and explained.</span></button>
          <button type="button" class="mode-card demo ${MODE === "demo" ? "on" : ""}" data-mode="demo" role="radio" aria-checked="${MODE === "demo"}"><b>Return demo</b><span>No hints, hidden checklist. One unsafe step ends the demo.</span></button>
        </div>
      </div>
      <div class="hero-art"><canvas id="heroCv" width="640" height="440" aria-label="Animated close-up of a gravity syringe feeding"></canvas></div>
    </div>
    <h2 class="section-h">Choose your client</h2>
    <div class="cases">${CASES.map((c) => `<button type="button" class="case-card" data-case="${c.id}">
      <span class="wrist ${/No known/.test(c.allergies) ? "" : "allergy"}" title="ID band"></span>
      <span class="bed">Bed 3 · ${c.age}/${c.sex} · ${c.hosp}</span>
      <h3>${esc(c.name)}</h3>
      <span class="tag t${c.tier}">${esc(c.tag)}</span>
      <p>${esc(c.blurb)}</p>
      <span class="best">Best: practice ${best[c.id + ":practice"] != null ? best[c.id + ":practice"].toFixed(2) : "—"} · demo ${best[c.id + ":demo"] != null ? best[c.id + ":demo"].toFixed(2) : "—"}</span>
    </button>`).join("")}</div>
    <div class="howto">
      <div><b>Move</b>WASD or arrow keys. On a phone, use the stick, or tap the floor or any object to walk there.</div>
      <div><b>Act</b>Walk up to a station and press E, Space, or USE. Patient, bed, curtain, cart, sink, bins, chart and computer all respond.</div>
      <div><b>Score</b>Patient Assessment 20%, Nursing Care Performance 30%, Records Management 30%, Timeliness 20%. Rated 5 (Exemplary) to 3 (Very Poor).</div>
    </div>
    <p class="foot">Based on the Level 4 Skills Enhancement Checklist, Nasogastric Tube (NGT) Feeding. A study simulation; always follow your agency's policy and your Clinical Instructor.</p>
  </div>`;
  scr.scrollTop = 0;
}
function startCase(id) {
  const c = CASES.find((x) => x.id === id);
  G = newRun(c, MODE); store.set("mode", MODE);
  BIN = null; P.say = null; P.anim = null; P.pour = null; P.phT = 0; P.prepOpen = false;
  W.p.x = 560; W.p.y = 530; W.p.dir = "up"; W.p.target = null; W.hobShown = G.hob; W.dist = 0; W.title = false; W.camX = 0; W.camY = 0;
  $("#screen").hidden = true;
  $("#hudPatient").textContent = c.name + " · Bed 3";
  $("#hudMode").textContent = MODE === "demo" ? "Return demo" : "Practice"; $("#hudMode").classList.toggle("demo", MODE === "demo");
  $("#btnHint").disabled = MODE === "demo";
  renderChecklist(); renderTray(); renderLog(); updateHud(); resizeWorld();
  const target = c.outcome === "feed" ? 80 : 55;
  openModal("Shift endorsement", "13:45 · Ward 7", `
    <div class="speech"><b>Charge nurse:</b> "Bed 3, ${esc(c.name)}, ${c.age}, ${esc(c.dx.toLowerCase())}. NGT feeding due at 14:00. The chart is at the nurses' station. ${MODE === "demo" ? "Your CI is here for your return demonstration." : "Your CI will coach you."}"</div>
    <div class="grid2"><div class="card"><h4>Your goal</h4><p style="margin:0">Carry out the NGT feeding from assessment to documentation. Finish by submitting nurse's notes at the computer.</p></div>
    <div class="card"><h4>Time frame</h4><p style="margin:0">About <b>${target} ward minutes</b> of active care. Walking and every action cost time. Required waiting does not count.</p></div></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-close="1">Start shift</button></div>`,
    { onClose: () => { W.paused = false; logEv("info", "Shift started. Feeding due at 14:00."); } });
}
function showResults(sc) {
  const c = G.c, r = sc.res, scr = $("#screen");
  const row = (k) => `<tr><td>${CATS[k].name} <span class="muted">(${CATS[k].weight}%)</span></td>${SCALE.map((s) => `<td class="${r[k].v === s.v ? "hit" : ""}">${r[k].v === s.v ? "●" : ""}</td>`).join("")}<td class="num">${(r[k].v * CATS[k].weight / 100).toFixed(2)}</td></tr>`;
  const okItems = sc.items.filter((d) => G.items[d.id] && G.items[d.id].ok);
  const missed = sc.items.filter((d) => !G.items[d.id]);
  scr.hidden = false;
  scr.innerHTML = `<div class="results">
    <div class="res-head"><div><div class="kicker" style="font-family:var(--f-display);letter-spacing:.16em;color:var(--muted);text-transform:uppercase">${G.mode === "demo" ? "Return demonstration" : "Practice"} · ${esc(c.name)}</div>
      <h1>${G.stopped ? "Demo stopped" : "Case complete"}</h1></div>
      <div class="grade"><div class="big">${sc.total.toFixed(2)}</div><div class="lab">${sc.label}</div><div class="mono" style="font-size:12px;color:var(--ink-2)">${Math.round(sc.total / 5 * 100)}% weighted</div></div></div>
    ${G.stopped ? `<div class="stopped"><b>Your CI stopped the demonstration:</b> ${esc(G.stopped.msg)}<br><span style="color:#f3c6c8">${esc(G.stopped.why)}</span></div>` : ""}
    <div class="rubric"><table><thead><tr><th>Criteria</th>${SCALE.map((s) => `<th>${s.label}<br><span class="mono">${s.v}</span></th>`).join("")}<th>Weighted</th></tr></thead>
      <tbody>${row("A")}${row("N")}${row("R")}${row("T")}<tr><td colspan="6" style="text-align:right"><b>Total</b></td><td class="num"><b>${sc.total.toFixed(2)}</b></td></tr></tbody></table>
      <p class="mono" style="font-size:12px;margin:8px 0 0;color:var(--ink-2)">Active time ${Math.round(r.T.used)} of ${r.T.target} min · walked ${Math.round(W.dist / 48)} floor tiles · ${G.errors.length} deduction${G.errors.length === 1 ? "" : "s"} · CI hints ${G.hintsUsed}</p></div>
    <div class="debrief">
      <div class="card"><h4>Fix next time</h4><ul>${G.errors.map((e) => `<li><b>${esc(e.msg)}</b><small>${esc(e.why)}</small></li>`).join("")}${missed.map((d) => `<li><b>Missed: ${esc(d.label)}</b><small>${esc(WHY[d.id] || "")}</small></li>`).join("") || ""}${!G.errors.length && !missed.length ? "<li>Nothing. A clean run.</li>" : ""}</ul></div>
      <div class="card"><h4>Done well</h4><ul>${okItems.map((d) => `<li>${esc(d.label)}</li>`).join("") || "<li>Keep practicing. Start with the chart.</li>"}</ul></div>
    </div>
    <div class="row"><button class="btn primary" type="button" data-res="retry">Retry this client</button>${CASES.indexOf(c) < CASES.length - 1 ? `<button class="btn" type="button" data-res="next">Next client</button>` : ""}<button class="btn" type="button" data-res="menu">All clients</button></div>
  </div>`;
  scr.scrollTop = 0;
}

/* ---------- wiring ---------- */
function wire() {
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, [data-tab]"); if (!t) return;
    audioCtx();
    const d = t.dataset;
    if (t.id === "modalClose" || d.close) return closeModal();
    if (d.tab) { $$(".tab").forEach((x) => x.classList.toggle("on", x === t)); ["check", "tray", "log"].forEach((k) => { $("#pane-" + k).hidden = k !== d.tab; }); return; }
    if (d.mode) { MODE = d.mode; store.set("mode", MODE); $$(".mode-card").forEach((x) => { x.classList.toggle("on", x.dataset.mode === MODE); x.setAttribute("aria-checked", x.dataset.mode === MODE); }); sfx("click"); return; }
    if (d.case) return startCase(d.case);
    if (d.res) { const c = G.c; if (d.res === "retry") return startCase(c.id); if (d.res === "next") return startCase(CASES[CASES.indexOf(c) + 1].id); return showTitle(); }
    if (d.chart) return openChart(d.chart);
    if (d.plan) return submitPlan();
    if (d.cart) return toggleCart(d.cart);
    if (d.hh) return hhStep(d.hh);
    if (d.bin) return binAct(d.bin, d.val);
    if (d.bedp != null) return bedAct(d.bedp);
    if (d.pt) return patientAct("pt", d.pt);
    if (d.id && t.closest("#modalBody")) return patientAct("id", d.id);
    if (d.ex) return patientAct("ex", d.ex);
    if (d.as) return patientAct("as", d.as);
    if (d.in) return patientAct("in", d.in);
    if (d.ev) return patientAct("ev", d.ev);
    if (d.proc) return procAct(d.proc, d.arg);
    if (d.dec) return decide(d.dec, d.val);
    if (d.prep) return prepAct(d.prep, d.val);
    if (d.doc) return submitDocs(d.doc);
    if (d.leave) { closeModal(); return showTitle(); }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.procRange) { procAct("height", t.value); updateReadouts(); }
    if (t.dataset.bedr) { BEDTMP.a = +t.value; BEDTMP.side = false; $("#hobV").textContent = t.value + "°"; const card = t.closest(".sheet-body").querySelector(".card"); card.innerHTML = bedSvg(BEDTMP.a, false); }
  });
  $("#btnMute").onclick = () => { AUD.on = !AUD.on; store.set("sound", AUD.on); $("#btnMute").classList.toggle("off", !AUD.on); if (AUD.on) sfx("tick"); };
  $("#btnMute").classList.toggle("off", !AUD.on);
  $("#btnHint").onclick = () => { if (!G) return; if (G.mode === "demo") { toast("No hints during a return demonstration.", "info"); return; } G.ciHidden = !G.ciHidden; if (!G.ciHidden) G.hintsUsed++; hudTick = 0; updateHud(); };
  $("#btnMenu").onclick = () => {
    if (!G || G.over) return showTitle();
    openModal("Leave this case?", "Menu", `<p>Your progress on ${esc(G.c.name)} will be lost.</p><div class="row"><button class="btn danger" type="button" data-leave="1">Leave to client list</button><button class="btn" type="button" data-close="1">Keep playing</button></div>`);
  };
  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") { if (e.key === "Escape") closeModal(); return; }
    if (e.key === "Escape") { if ($("#ciPop")) $("#ciPop").remove(); else closeModal(); }
    if (e.key.toLowerCase() === "h" && !modalOpen()) $("#btnHint").click();
    if (e.key.toLowerCase() === "m") $("#btnMute").click();
  });
  $("#modal").addEventListener("pointerdown", (e) => { if (e.target.id === "modal" && MODAL && MODAL.kind !== "bedside") closeModal(); });
  // touch controls
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  if (coarse) {
    $("#touch").hidden = false;
    const stick = $("#stick"), knob = $("#knob");
    let id = null;
    const move = (e) => { const r = stick.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const m = Math.hypot(dx, dy), max = r.width / 2 - 10; if (m > max) { dx = dx / m * max; dy = dy / m * max; } knob.style.transform = `translate(${dx}px,${dy}px)`; W.joy = { x: dx / max, y: dy / max, on: true }; };
    stick.addEventListener("pointerdown", (e) => { id = e.pointerId; stick.setPointerCapture(id); move(e); audioCtx(); });
    stick.addEventListener("pointermove", (e) => { if (e.pointerId === id) move(e); });
    const end = () => { id = null; knob.style.transform = ""; W.joy = { x: 0, y: 0, on: false }; };
    stick.addEventListener("pointerup", end); stick.addEventListener("pointercancel", end);
    $("#useBtn").addEventListener("click", () => interactNearest());
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  updateWorld(dt);
  if (G && !G.over) updateProc(dt);
  drawWorld();
  if (P.open && P.ctx && G) drawProc(P.ctx, procState(), W.t, P.dpr);
  const hero = $("#heroCv");
  if (hero && !$("#screen").hidden) { if (hero.width !== 960) { hero.width = 960; hero.height = 600; } drawProc(hero.getContext("2d"), demoState(W.t), W.t, 1.5); }
  requestAnimationFrame(frame);
}
function boot() {
  initWorld($("#world"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { W.floor = buildFloor(); });
  wire();
  showTitle();
  requestAnimationFrame(frame);
}
boot();
// Read-only handle for the automated playtest (tools/playtest.mjs).
window.__ngt = { interact, state: () => G, world: W };

})();
</script>
